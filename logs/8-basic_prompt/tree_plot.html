let treeStructData = {"edges": [[2, 16], [3, 7], [3, 10], [3, 13], [3, 5], [3, 15], [3, 12], [3, 9], [3, 14], [3, 8], [3, 6], [7, 18], [8, 17], [10, 11]], "layout": [[0.0, 0.0], [0.08333333333333333, 0.0], [0.16666666666666666, 0.0], [0.625, 0.0], [0.7083333333333334, 0.0], [0.25, 0.5], [0.3333333333333333, 0.5], [0.4166666666666667, 0.5], [0.5, 0.5], [0.5833333333333334, 0.5], [0.6666666666666666, 0.5], [0.6666666666666666, 1.0], [0.75, 0.5], [0.8333333333333334, 0.5], [0.9166666666666666, 0.5], [1.0, 0.5], [0.16666666666666666, 0.5], [0.5, 1.0], [0.4166666666666667, 1.0]], "plan": ["We will fine-tune a pretrained ResNet18 by mapping malignant lesions to 1 and\nboth benign and non-neoplastic to 0, applying standard image transforms and an\n80/20 stratified train/validation split. We train with BCEWithLogitsLoss and the\nAdam optimizer for a few epochs, then compute AUROC on the hold-out validation\nset. A reusable predict() function is also provided to compute malignancy\nprobabilities on new image lists.", "I propose fine-tuning an EfficientNet-B0 pretrained on ImageNet to classify\nmalignant (1) versus benign/non-neoplastic (0) lesions, using standard\naugmentations and normalization. We perform 5-fold stratified cross-validation,\ntraining each fold for 3 epochs with BCEWithLogitsLoss and AdamW, and report the\naverage ROC AUC. After cross-validation we retrain on the full dataset for 3\nmore epochs to obtain a final model. We expose a `predict()` function that takes\nnew image paths and returns malignancy probabilities. The evaluation metric is\nROC AUC.", "We fine-tune a DenseNet121 pretrained on ImageNet, replacing its classifier with\na single neuron for binary classification of malignant vs benign/non-neoplastic\nlesions. We apply random horizontal and vertical flips, rotations, and\nnormalization to train images, with center cropping and normalization for\nvalidation. We perform 5-fold stratified cross-validation, training each fold\nfor 3 epochs using Adam and BCEWithLogitsLoss, and compute AUROC on each\nvalidation fold. Finally, we report the mean and standard deviation of\nvalidation AUROC across folds and provide a reusable predict() function for new\nimages.", "We fine-tune a pretrained EfficientNet-B0 from the timm library by replacing its\nhead for binary classification (malignant vs. others) and training with AdamW\nand BCEWithLogitsLoss. Images are loaded with basic augmentations (random crop,\nflips) for training and standardized resizing for validation, using an 80/20\nstratified split. After 5 epochs we evaluate the model using AUROC on the hold-\nout set. A reusable `predict()` function is provided to load the trained model\nand compute malignancy probabilities for new image files.", "We fine-tune a pretrained DenseNet121 for binary classification of malignant vs.\nnon\u2010malignant lesions, replacing its head with a single-output layer. We apply\nstrong data augmentations during training (random resized crop, flips,\nrotations, color jitter) and standard resizing + center\u2010crop for validation,\nusing an 80/20 stratified split. We train for 4 epochs with SGD+momentum and a\nStepLR scheduler, optimize BCEWithLogitsLoss, and compute AUROC on the hold\u2010out\nset. A reusable `predict()` function is provided to compute malignancy\nprobabilities on new image files, and if an `input/test_images` folder exists,\npredictions are saved to `working/submission.csv`.", "We can improve generalization and boost AUROC by incorporating Mixup data\naugmentation during training, which blends pairs of images and their labels to\nregularize the model. We'll implement Mixup in the training loop with an alpha\nof 0.4, modifying `train_one_epoch` to mix inputs and targets and compute a\nweighted loss. The rest of the pipeline (data loading, model, optimizer) remains\nunchanged. This atomic change should help the model better generalize to unseen\nlesions.", "I propose to address class imbalance by using a WeightedRandomSampler in the\ntraining DataLoader, which will oversample malignant cases and ensure each batch\nis balanced. This simple change can help the model learn features of the\nminority class more effectively and boost the AUROC. The rest of the\npipeline\u2014including EfficientNet-B0, transforms, optimizer, and\nevaluation\u2014remains unchanged to isolate the impact of balanced sampling.", "We can further boost model performance by applying simple test-time augmentation\n(TTA) during evaluation: for each validation batch we\u2019ll compute predictions on\nboth the original and horizontally flipped images and average their\nprobabilities. This does not alter the training loop and can improve robustness\nby smoothing out prediction noise. We\u2019ll update the `evaluate` function (and\noptionally `predict`) to include this 2\u2010view TTA and then report the improved\nvalidation AUROC.", "We add Test-Time Augmentation at inference by using 10\u2010crop (five crops + their\nhorizontal flips) and averaging model outputs. We implement an `evaluate_tta`\nfunction that applies these multi\u2010crops for validation and compute the AUROC on\nthe averaged probabilities. The `predict` function is adapted to use the same\nTTA pipeline for new images. Finally, if a sample submission or test folder is\ndetected under `./input`, we generate a `submission.csv` in `./working`.", "I propose to replace the standard BCEWithLogitsLoss with a binary focal loss\n(gamma=2, alpha=0.25) to focus training on harder, misclassified examples and\nbetter handle class imbalance. This is an atomic change that should improve\nmodel discrimination without altering the rest of the pipeline. We keep\nEfficientNet-B0, augmentations, optimizer, and training loop unchanged, simply\nswapping in the focal loss and measuring its impact on validation AUROC.", "We will enhance the inference stage by adding simple test\u2010time augmentation\n(TTA). Specifically, for each batch during evaluation we compute predictions on\nboth the original and a horizontally flipped version of each image, then average\ntheir sigmoid outputs before computing AUROC. This atomic change requires\nminimal code edits but can improve robustness and boost validation AUC. We also\nupdate the `predict()` function to support the same TTA procedure for new data.", "Here we switch to a smaller 128\u00d7128 input size and only 3 training epochs to\navoid the timeout, and we integrate PyTorch\u2019s mixed\u2010precision `torch.cuda.amp`\nwhen a CUDA device is available to speed up training. The `train_one_epoch` loop\nnow uses `autocast` and `GradScaler` on GPU, and we include a well\u2010documented\n`predict()` function for later use. After training we evaluate TTA on the hold-\nout split and print the best AUROC.", "We add Test-Time Augmentation (TTA) by applying a FiveCrop of size 224 on each\nvalidation image after resizing to 256, computing predictions for each of the\nfive crops, and averaging them per image. This is implemented in a new\n`evaluate_tta` function that loops over the validation dataframe in batches,\napplies the crops and standard normalization, and computes the AUROC over the\naveraged probabilities. After training and saving the best model, we reload it,\nrun `evaluate_tta` on the hold\u2010out set, and print the TTA\u2010boosted validation\nAUROC. This single change enhances robustness and should raise the reported\nAUROC.", "I propose adding simple test\u2010time augmentation (TTA) by averaging predictions on\nthe original and horizontally flipped images during evaluation. This is a small\nchange to the `evaluate` function that should improve AUROC without altering\ntraining. We'll replace the standard validation step with TTA-based scoring and\nreport the new best AUROC.", "I will integrate a OneCycleLR learning rate scheduler to help the model converge\nto a better minimum by cyclically varying the LR between a low start and a\nhigher peak during training. This requires only adding the scheduler after\noptimizer creation and calling `scheduler.step()` each batch in the training\nloop. The rest of the training pipeline (data, model, loss) remains unchanged.\nThis atomic change often yields better generalization and can boost AUROC.", "I propose to enrich the training augmentations by adding torchvision\u2019s\nAutoAugment with the ImageNet policy. This single change injects a variety of\noptimized transformations (e.g., posterize, rotate, shear) to better regularize\nthe EfficientNet-B0 model and improve generalization. All other parts of the\npipeline\u2014including data loading, model, optimizer, and evaluation\u2014remain\nunchanged so we can isolate the impact of AutoAugment. Below is the updated\nscript training for 5 epochs and printing out the best validation AUROC.", "I will replace the 5-fold cross\u2010validation with a single stratified\ntrain/validation split to cut runtime, and freeze the DenseNet backbone so only\nthe classifier head is trained for two epochs. This reduces backward\u2010pass\noverhead and avoids timeouts while still giving an AUROC estimate on held-out\ndata. A reusable `predict()` function is included for inference on new images.", "We replace the expensive ten\u2010crop TTA on the validation set with a single\ncenter\u2010crop evaluation, and we use mixed\u2010precision training via torch.cuda.amp\nto speed up training. We also add early stopping with a patience of 2 epochs on\nvalidation AUROC so we don\u2019t waste time on unnecessary epochs. The predict\nfunction retains ten\u2010crop TTA for final test predictions, and we still save\nsubmission.csv for downstream scoring.", "We reduce the number of training epochs from 5 to 3 so that the script finishes\nwithin the one\u2010hour time limit.  This simple change allows the model to converge\nsufficiently without timing out, while still printing the final validation\nAUROC.  The `predict()` function remains available for reuse in inference."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row[\"label\"], dtype=torch.float32)\n        return image, label\n\n\ndef predict(model, image_paths, img_dir, device):\n    \"\"\"\n    Predict malignancy probability for new images.\n    Args:\n        model: trained PyTorch model.\n        image_paths: list of image file names (with or without .jpg).\n        img_dir: directory where images are stored.\n        device: torch.device\n    Returns:\n        numpy array of probabilities for malignancy.\n    \"\"\"\n    model.eval()\n    transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    probs = []\n    with torch.no_grad():\n        for name in image_paths:\n            fname = name if name.endswith(\".jpg\") else name + \".jpg\"\n            img_path = os.path.join(img_dir, fname)\n            img = Image.open(img_path).convert(\"RGB\")\n            img = transforms(img).unsqueeze(0).to(device)\n            logit = model(img)\n            prob = torch.sigmoid(logit).item()\n            probs.append(prob)\n    return np.array(probs)\n\n\nif __name__ == \"__main__\":\n    # Load and prepare labels\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label\"], random_state=42\n    )\n\n    # Define transforms and datasets\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, \"input/MyImages\", transform)\n    val_ds = SkinLesionDataset(val_df, \"input/MyImages\", transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=2)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    epochs = 3\n    for epoch in range(epochs):\n        model.train()\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validation\n    model.eval()\n    all_probs, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy().flatten())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\n\n\n# Dataset for training/validation\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row['image_name']}.jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(image)\n        y = 1 if row[\"label\"] == \"malignant\" else 0\n        return x, y\n\n\n# Dataset for prediction\nclass PredictDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.image_paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        path = self.image_paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        return self.transform(img)\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0.0\n    for xb, yb in loader:\n        xb, yb = xb.to(device), yb.to(device, dtype=torch.float32).unsqueeze(1)\n        optimizer.zero_grad()\n        out = model(xb)\n        loss = criterion(out, yb)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * xb.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for xb, yb in loader:\n            xb = xb.to(device)\n            out = model(xb)\n            probs = torch.sigmoid(out).cpu().numpy().flatten()\n            all_preds.extend(probs)\n            all_labels.extend(yb.numpy())\n    return np.array(all_labels), np.array(all_preds)\n\n\ndef predict(model, image_paths, device, transform, batch_size=32):\n    \"\"\"\n    Predict malignancy probabilities for a list of image file paths.\n    Args:\n      model: trained torch.nn.Module\n      image_paths: list of strings (paths to .jpg files)\n      device: torch.device\n      transform: torchvision.transforms.Compose\n      batch_size: int\n    Returns:\n      numpy array of probabilities between 0 and 1\n    \"\"\"\n    ds = PredictDataset(image_paths, transform)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False)\n    model.eval()\n    preds = []\n    with torch.no_grad():\n        for xb in loader:\n            xb = xb.to(device)\n            out = model(xb)\n            probs = torch.sigmoid(out).cpu().numpy().flatten()\n            preds.extend(probs)\n    return np.array(preds)\n\n\nif __name__ == \"__main__\":\n    # Config\n    IMG_DIR = \"./input/MyImages\"\n    CSV_PATH = \"./input/mydataset.csv\"\n    N_FOLDS = 5\n    EPOCHS = 3\n    BATCH_SIZE = 32\n    LR = 1e-4\n    DEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Data and transforms\n    df = pd.read_csv(CSV_PATH)\n    df = df[[\"image_name\", \"label\"]].dropna()\n    train_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # 5-fold cross-validation\n    skf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=42)\n    labels = (df[\"label\"] == \"malignant\").astype(int).values\n    aucs = []\n    for fold, (tr_idx, val_idx) in enumerate(skf.split(df, labels), 1):\n        dtr = df.iloc[tr_idx]\n        dval = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(dtr, IMG_DIR, train_transform)\n        val_ds = SkinLesionDataset(dval, IMG_DIR, val_transform)\n        tr_loader = DataLoader(\n            train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n        )\n        val_loader = DataLoader(\n            val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4\n        )\n        # Model\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n        model = model.to(DEVICE)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = optim.AdamW(model.parameters(), lr=LR)\n        # Train\n        for epoch in range(EPOCHS):\n            train_one_epoch(model, tr_loader, criterion, optimizer, DEVICE)\n        # Eval\n        y_true, y_pred = evaluate(model, val_loader, DEVICE)\n        auc = roc_auc_score(y_true, y_pred)\n        print(f\"Fold {fold} ROC AUC: {auc:.4f}\")\n        aucs.append(auc)\n    avg_auc = np.mean(aucs)\n    print(f\"Average ROC AUC across {N_FOLDS} folds: {avg_auc:.4f}\")\n\n    # Final retraining on full data\n    full_ds = SkinLesionDataset(df, IMG_DIR, train_transform)\n    full_loader = DataLoader(\n        full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    final_model = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=1\n    ).to(DEVICE)\n    optimizer = optim.AdamW(final_model.parameters(), lr=LR)\n    criterion = nn.BCEWithLogitsLoss()\n    for epoch in range(EPOCHS):\n        train_one_epoch(final_model, full_loader, criterion, optimizer, DEVICE)\n    # Optionally save the final m        all_targets.extend(targets.numpy().tolist())\n    return roc_auc_score(all_targets, all_probs)\n\n\ndef predict(image_paths, model_path=\"working/model.pth\", batch_size=32):\n    \"\"\"\n    Predict malignancy probabilities for a list of image paths using ten\u2010crop TTA.\n    Returns a dict mapping each image_path to probability [0,1].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    state = torch.load(model_path, map_location=device)\n    model.load_state_dict(state)\n    model.to(device).eval()\n    mean = [0.485, 0.456, 0.406]\n    std = [0.229, 0.224, 0.225]\n    normalize = transforms.Normalize(mean=mean, std=std)\n    tta_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.TenCrop(224),\n            transforms.Lambda(\n                lambda crops: torch.stack(\n                    [normalize(transforms.ToTensor()(c)) for c in crops]\n                )\n            ),\n        ]\n    )\n    results = {}\n    for p in image_paths:\n        img = Image.open(p).convert(\"RGB\")\n        crops = tta_tf(img)  # [10,C,H,W]\n        crops = crops.to(device)\n        with torch.no_grad():\n            logits = model(crops)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n        results[p] = float(probs.mean())\n    return results\n\n\ndef main():\n    # Paths\n    csv_path = \"./input/mydataset.csv\"\n    image_dir = \"./input/MyImages\"\n    os.makedirs(\"working\", exist_ok=True)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Load and prepare data\n    df = pd.read_csv(csv_path)\n    df[\"label\"] = df[\"label\"].map(lambda x: 1 if x == \"malignant\" else 0)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label\"], random_state=42\n    )\n\n    # Transforms\n    train_tfms = transforms. let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
