let treeStructData = {"edges": [[1, 6], [3, 5], [5, 8], [5, 7], [5, 9], [7, 15], [9, 10], [10, 14], [10, 11], [10, 16], [10, 12], [12, 13], [13, 18], [15, 19], [16, 17]], "layout": [[0.0, 0.0], [0.17142857142857143, 0.0], [0.34285714285714286, 0.0], [0.5142857142857143, 0.0], [0.6857142857142857, 0.0], [0.5142857142857143, 0.16666666666666663], [0.17142857142857143, 0.16666666666666663], [0.3142857142857143, 0.33333333333333337], [0.4857142857142857, 0.33333333333333337], [0.7428571428571429, 0.33333333333333337], [0.7428571428571429, 0.5], [0.4857142857142857, 0.6666666666666667], [0.6571428571428571, 0.6666666666666667], [0.6571428571428571, 0.8333333333333334], [0.8285714285714285, 0.6666666666666667], [0.3142857142857143, 0.5], [1.0, 0.6666666666666667], [1.0, 0.8333333333333334], [0.6571428571428571, 1.0], [0.3142857142857143, 0.6666666666666667]], "plan": ["We will extract 512-dimensional image embeddings using a pretrained ResNet18\nwithout fine-tuning, then train a LightGBM classifier on these features to\ndistinguish malignant from non-malignant lesions. We perform 5-fold stratified\ncross\u2010validation to evaluate model performance using the AUROC metric and report\nfold and mean scores. A reusable `predict()` function aggregates predictions\nfrom each fold\u2019s model to output averaged malignancy probabilities for new\nimages.", "I propose fine-tuning a pretrained DenseNet121 for binary classification of\nmalignant vs non\u2010malignant lesions by replacing its classifier with a single\noutput neuron. We wrap images and labels in a PyTorch Dataset with basic\naugmentations for training and normalization for validation. We perform\nstratified 5\u2010fold cross\u2010validation, training each fold for a few epochs and\ncomputing AUROC on the held\u2010out validation set, reporting fold scores and their\nmean. A reusable `predict()` function loads saved fold models and averages their\nsigmoid outputs to produce malignancy probabilities for new images.", "We extract simple color histogram features (64 bins per RGB channel) to form\n192\u2010D vectors, then train a RandomForest classifier to predict malignancy. We\nperform stratified 5\u2010fold cross\u2010validation, computing the ROC\u2010AUC on each fold\nand reporting the mean. A reusable predict() function loads new images, extracts\nhistograms, and averages probabilities from the five models. This approach is\nlightweight, interpretable, and fast to execute. We report per\u2010fold and mean AUC\nscores below.", "We use a pretrained EfficientNet_B0 to extract 1280-D image embeddings for all\nlesions, then train a logistic regression classifier on these features to\npredict malignancy. We perform 5\u2010fold stratified cross\u2010validation on the\nembeddings and report AUROC for each fold and the mean. A reusable `predict()`\nfunction extracts embeddings for new images and averages probabilities from the\nfive fold\u2010trained classifiers.", "We extract 1280-dimensional embeddings from a pretrained MobileNetV2 network\nusing timm without fine-tuning, and train a logistic regression classifier on\nthese features to distinguish malignant lesions. We perform stratified 5-fold\ncross-validation and report fold-wise AUROC scores as well as the mean. A\nreusable `predict()` function loads new images from a specified directory,\napplies the same preprocessing and feature extraction, and averages\nprobabilities from the trained classifiers.", "We capture the embedding dimension from the EfficientNet classifier before\nreplacing it with an Identity layer, and pass it into our embedding extraction\nroutine so we can preallocate the correct output array.  We modify\n`extract_embeddings` to accept this dimension, and we implement a reusable\n`predict(image_paths, classifiers)` function that loads the same base model,\nextracts embeddings, and returns averaged malignancy probabilities.  In `main()`\nwe perform 5\u2010fold stratified CV to train logistic regressions, print per\u2010fold\nand mean AUROC, and demonstrate using `predict` on the training set.", "We switch to a lighter ResNet18 backbone and freeze its pre-trained\nconvolutional layers, only training the final classifier to dramatically reduce\nruntime. We also reduce cross-validation to 3 folds and train for just 2 epochs\nper fold to ensure timely completion, while still reporting AUROC. A predict()\nfunction is provided to ensemble the saved models on new image folders.", "We will replace the LogisticRegression classifier with a LightGBM classifier on\nthe EfficientNet\u2010B0 embeddings to better capture non\u2010linear decision boundaries.\nWe configure LightGBM with a small learning rate, many trees, and early stopping\non each fold\u2019s validation set to prevent overfitting. We then perform 5\u2010fold\nstratified cross\u2010validation, averaging the best\u2010iteration probabilities across\nfolds. This atomic change should yield a higher AUROC.", "We replace the linear logistic regression with a LightGBM gradient boosting\nclassifier to capture nonlinear interactions in the EfficientNet embeddings. We\ntrain an LGBMClassifier with 1000 trees, a small learning rate, and early\nstopping on each validation fold during 5-fold stratified cross-validation. We\nthen average the probabilities from each fold\u2019s model and report per-fold and\nmean AUROC. This atomic change directly tests whether boosting on the pretrained\nembeddings improves discrimination over the linear baseline.", "I propose adding simple test-time augmentation (horizontal flip) when extracting\nembeddings. Specifically, for each image we compute embeddings using the\noriginal and horizontally flipped versions (by applying a deterministic flip\nbefore the standard preprocessing), and average these embeddings before training\nthe classifier and making predictions. This TTA approach can reduce overfitting\nand improve robustness. We will update the embedding extraction in both training\nand the predict() function accordingly, preserving the 5-fold CV evaluation and\nprinting AUROC scores.", "I propose adding vertical flip as an additional test\u2010time augmentation alongside\nhorizontal flip. We will extract embeddings from the original, horizontally\nflipped, and vertically flipped images, then average these three embeddings to\ntrain and predict with our logistic regression ensemble. This should improve\nrobustness to lesion orientation without additional model fine\u2010tuning.", "We will apply per-sample L2 normalization to the averaged TTA embeddings before\nfitting the logistic regression and also normalize in the predict function. This\nnormalization constrains embeddings to lie on the unit hypersphere, helping the\nclassifier focus on angular differences. We update both training and prediction\npaths to call sklearn.preprocessing.normalize on the embedding matrix.", "I suggest replacing the logistic regression classifier with a LightGBM model\nthat can capture non\u2010linear patterns in the embedding space. We will use\n`lgb.LGBMClassifier` with early stopping on each fold to avoid overfitting, then\naverage predictions across the 5 folds as before. This single change should\nimprove AUROC by leveraging the powerful gradient boosting learner on the same\nTTA\u2010averaged embeddings.", "We can replace the unsupported `early_stopping_rounds` argument in\n`LGBMClassifier.fit` with LightGBM callbacks to enable early stopping.\nSpecifically, we pass `callbacks=[lgb.early_stopping(50),\nlgb.log_evaluation(0)]` and remove the `early_stopping_rounds` parameter. The\nrest of the pipeline remains unchanged: we extract embeddings with horizontal\nand vertical flips, perform 5\u2010fold stratified CV, train our LightGBM models, and\nreport the fold and mean AUROC. The `predict` function is retained for inference\non new image folders.", "I propose adding two additional deterministic test-time augmentations: rotations\nby 90\u00b0 and 270\u00b0. We will extract embeddings for these rotated images alongside\nthe original, horizontal flip, and vertical flip, averaging across all five\nembeddings. This will enhance orientation invariance without changing the model\narchitecture. We update both embedding extraction in training and the predict()\nfunction accordingly, then re-evaluate using 5-fold cross-validation to measure\nany AUROC improvement.", "I will switch from the `LGBMClassifier` sklearn API to LightGBM\u2019s `train` API,\nwhich supports `early_stopping_rounds`. For each fold, I\u2019ll create `lgb.Dataset`\nobjects for training and validation, call `lgb.train` with early stopping, and\ncollect the resulting `Booster` objects. The `predict` function will be updated\nto average `booster.predict` outputs over all folds. Finally, I\u2019ll compute and\nprint the fold AUCs and the overall CV AUC.", "We can improve robustness to lesion orientation by adding a 90\u00b0 rotation as an\nextra test\u2010time augmentation. We\u2019ll define a deterministic 90\u00b0 rotation\ntransform alongside the existing horizontal and vertical flips and extract\nembeddings for these rotated images. The final embedding for each sample will be\nthe average of the original, H\u2010flip, V\u2010flip, and 90\u00b0\u2010rotated embeddings. We\nupdate both the training pipeline and `predict()` to include this new rotation,\nwhile keeping 5\u2010fold CV with logistic regression.", "We apply per\u2010sample L2 normalization to the averaged TTA embeddings so that each\nembedding lies on the unit hypersphere. We update both the training pipeline\n(before fitting each logistic regression) and the `predict()` function (before\ncalling `predict_proba`) to normalize the embeddings using\n`sklearn.preprocessing.normalize`. This encourages the classifier to focus on\nangular differences and can improve robustness.", "We can avoid the overly\u2010optimistic in\u2010sample AUROC by computing true out\u2010of\u2010fold\npredictions instead of applying the full ensemble to every training sample.\nDuring CV, for each fold we store the model\u2019s predictions on its validation\nsubset into an OOF array, then compute the overall AUROC from these OOF\npredictions. We keep the same TTA feature extraction and maintain a `predict()`\nfunction for inference on new images but only use OOF preds for unbiased\ntraining\u2010set evaluation.", "We can replace the unsupported early_stopping_rounds argument in lgb.train with\nthe callbacks API. Specifically, remove the early_stopping_rounds parameter and\nadd callbacks=[lgb.early_stopping(stopping_rounds=50), lgb.log_evaluation(100)]\nto enable early stopping. The rest of the pipeline (embedding extraction, CV,\nprediction) stays the same, and we print per-fold AUROC as well as the mean\nvalidation AUC at the end."], "code": ["import os\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom torchvision import models, transforms\nfrom torch.utils.data import Dataset, DataLoader\nimport torch\nimport torch.nn as nn\nimport lightgbm as lgb\nfrom PIL import Image\n\n# Parameters\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nN_SPLITS = 5\nBATCH_SIZE = 64\nRANDOM_STATE = 42\n\n# 1. Load metadata and labels\ndf = pd.read_csv(DATA_CSV)\n# binary label: malignant=1, else=0\ndf[\"malignant\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_names = df[\"image_name\"].tolist()\ny = df[\"malignant\"].values\n\n\n# 2. Define dataset for embedding extraction\nclass ImageDataset(Dataset):\n    def __init__(self, names, img_dir, transform=None):\n        self.names = names\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.names)\n\n    def __getitem__(self, idx):\n        name = self.names[idx]\n        path = os.path.join(self.img_dir, f\"{name}.jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        return img, idx\n\n\n# 3. Prepare feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nbase_model = models.resnet18(pretrained=True)\nfeature_extractor = nn.Sequential(*list(base_model.children())[:-1]).to(device)\nfeature_extractor.eval()\n\n# 4. Transforms and DataLoader\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\ndataset = ImageDataset(image_names, IMG_DIR, transform=transform)\nloader = DataLoader(dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# 5. Extract features\nfeatures = np.zeros((len(dataset), 512), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(device)\n        feats = feature_extractor(imgs).view(imgs.size(0), -1).cpu().numpy()\n        features[idxs.numpy(), :] = feats\n\n# 6. 5-fold CV training and evaluation\nskf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=RANDOM_STATE)\naucs = []\nmodels = []\nfor fold, (train_idx, valid_idx) in enumerate(skf.split(features, y), 1):\n    X_train, X_valid = features[train_idx], features[valid_idx]\n    y_train, y_valid = y[train_idx], y[valid_idx]\n    clf = lgb.LGBMClassifier(random_state=RANDOM_STATE)\n    clf.fit(X_train, y_train)\n    proba = clf.predict_proba(X_valid)[:, 1]\n    auc = roc_auc_score(y_valid, proba)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n    models.append(clf)\nprint(f\"Mean AUROC: {np.mean(aucs):.4f}\")\n\n\n# 7. Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for all images in a folder.\n    Returns a DataFrame with columns ['image_name', 'malignant_prob'].\n    \"\"\"\n    names = [\n        f.split(\".\")[0] for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")\n    ]\n    ds = ImageDataset(names, image_folder, transform=transform)\n    dl = DataLoader(ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    feats = np.zeros((len(ds), 512), dtype=np.float32)\n    idx_map = []\n    with torch.no_grad():\n        for imgs, idxs in dl:\n            imgs = imgs.to(device)\n            out = feature_extractor(imgs).view(imgs.size(0), -1).cpu().numpy()\n            feats[idxs.numpy(), :] = out\n            idx_map.extend(idxs.numpy())\n    # Average predictions over folds\n    probs = np.zeros(len(ds), dtype=np.float32)\n    for mdl in models:\n        probs += mdl.predict_proba(feats)[:, 1]\n    probs /= len(models)\n    return pd.DataFrame({\"image_name\": names, \"malignant_prob\": probs})\n\n\n# Example usage: preds = predict(IMG_DIR)\n# preds.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom PIL import Image\n\n# Device setup\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_dir = \"./input/MyImages\"\n\n# Prepare file paths and labels\nimage_paths = (\n    df[\"image_name\"].apply(lambda x: os.path.join(image_dir, f\"{x}.jpg\")).values\n)\nlabels = df[\"binary_label\"].values\n\n# Define transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, paths, labels, transform):\n        self.paths = paths\n        self.labels = labels\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(self.labels[idx], dtype=torch.float32)\n        return img, label\n\n\n# Cross-validation setup\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nfold_scores = []\nmodel_paths = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(image_paths, labels), 1):\n    # Split datasets\n    train_ds = SkinLesionDataset(\n        image_paths[train_idx], labels[train_idx], train_transform\n    )\n    val_ds = SkinLesionDataset(image_paths[val_idx], labels[val_idx], val_transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Initialize model\n    model = models.densenet121(pretrained=True)\n    num_ftrs = model.classifier.in_features\n    model.classifier = nn.Linear(num_ftrs, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    for epoch in range(3):\n        model.train()\n        for imgs, labs in train_loader:\n            imgs, labs = imgs.to(device), labs.to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs).view(-1)\n            loss = criterion(outputs, labs)\n            loss.backward()\n            optimizer.step()\n\n    # Validation\n    model.eval()\n    preds, truths = [], []\n    with torch.no_grad():\n        for imgs, labs in val_loader:\n            imgs = imgs.to(device)\n            out = model(imgs).view(-1)\n            probs = torch.sigmoid(out).cpu().numpy()\n            preds.extend(probs)\n            truths.extend(labs.numpy())\n    score = roc_auc_score(truths, preds)\n    fold_scores.append(score)\n\n    # Save model\n    os.makedirs(\"./working/models\", exist_ok=True)\n    model_path = f\"./working/models/densenet_fold{fold}.pth\"\n    torch.save(model.state_dict(), model_path)\n    model_paths.append(model_path)\n\n    print(f\"Fold {fold} AUROC: {score:.4f}\")\n\nprint(f\"Mean AUROC: {np.mean(fold_scores):.4f}\")\n\n\ndef predict(image_folder: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in a folder.\n    Args:\n        image_folder (str): Path to folder containing images.\n    Returns:\n        pd.DataFrame: columns ['image_name', 'malignant_probability'].\n    \"\"\"\n    paths = [\n        os.path.join(image_folder, f)\n        for f in os.listdir(image_folder)\n        if f.lower().endswith(\".jpg\")\n    ]\n    paths.sort()\n    all_probs = {p: [] for p in paths}\n\n    for mp in model_paths:\n        model = models.densenet121(pretrained=False)\n        num_ftrs = model.classifier.in_features\n        model.classifier = nn.Linear(num_ftrs, 1)\n        model.load_state_dict(torch.load(mp, map_location=device))\n        model = model.to(device).eval()\n\n        for p in paths:\n            img = Image.open(p).convert(\"RGB\")\n            inp = val_transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(inp).view(-1)).item()\n            all_probs[p].append(prob)\n\n    rows = []\n    for p, prob_list in all_probs.items():\n        avg_prob = float(np.mean(prob_list))\n        name = os.path.basename(p)\n        rows.append({\"image_name\": name, \"malignant_probability\": avg_prob})\n    return pd.DataFrame(rows)", "import os\nimport glob\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n# Paths\nIMG_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\n\n# Load metadata\ndf = pd.read_csv(CSV_PATH)\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n\n# Helper to find actual image file\ndef find_image_file(name):\n    pattern = os.path.join(IMG_DIR, f\"{name}.*\")\n    candidates = [f for f in glob.glob(pattern) if os.path.basename(f).startswith(name)]\n    if candidates:\n        return candidates[0]\n    else:\n        raise FileNotFoundError(f\"No image file for {name}\")\n\n\n# Feature extraction: 64\u2010bin per channel histogram\ndef extract_histogram_features(img_path, bins=64):\n    img = Image.open(img_path).convert(\"RGB\")\n    arr = np.array(img)\n    feats = []\n    for c in range(3):\n        hist, _ = np.histogram(arr[:, :, c], bins=bins, range=(0, 255), density=True)\n        feats.append(hist)\n    return np.concatenate(feats)\n\n\n# Precompute features\nprint(\"Extracting features...\")\nfeatures = []\nfor name in df[\"image_name\"]:\n    path = find_image_file(name)\n    feats = extract_histogram_features(path)\n    features.append(feats)\nX = np.vstack(features)\ny = df[\"target\"].values\n\n# 5\u2010fold CV training\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nmodels = []\nauc_scores = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(X, y), 1):\n    X_train, X_val = X[train_idx], X[val_idx]\n    y_train, y_val = y[train_idx], y[val_idx]\n    clf = RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1)\n    clf.fit(X_train, y_train)\n    prob = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, prob)\n    print(f\"Fold {fold} ROC-AUC: {auc:.4f}\")\n    auc_scores.append(auc)\n    models.append(clf)\n\nprint(f\"Mean ROC-AUC: {np.mean(auc_scores):.4f}\")\n\n\ndef predict(image_folder, models=models, bins=64):\n    \"\"\"\n    Predict malignancy probabilities for all images in a folder.\n    Args:\n        image_folder (str): Path to folder containing image files.\n        models (list): List of trained RandomForestClassifier models.\n        bins (int): Number of histogram bins per channel.\n    Returns:\n        pandas.DataFrame with columns ['image_name','malignant_prob'].\n    \"\"\"\n    results = []\n    files = [f for f in os.listdir(image_folder) if not f.startswith(\".\")]\n    for fname in files:\n        name, _ = os.path.splitext(fname)\n        path = os.path.join(image_folder, fname)\n        feats = extract_histogram_features(path, bins=bins).reshape(1, -1)\n        probs = [m.predict_proba(feats)[0, 1] for m in models]\n        results.append({\"image_name\": name, \"malignant_prob\": np.mean(probs)})\n    return pd.DataFrame(results)\n\n\n# Example usage of predict():\n# preds_df = predict(IMG_DIR)\n# preds_df.to_csv('./working/submission.csv', index=False)", "import os\nimport torch\nimport numpy as np\nimport pandas as pd\nfrom torchvision import transforms\nfrom torchvision.models import efficientnet_b0, EfficientNet_B0_Weights\nfrom torch.utils.data import Dataset, DataLoader\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score\n\n\n# Dataset for loading images\nclass SkinDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.image_paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.image_paths[idx]).convert(\"RGB\")\n        return self.transform(img), idx\n\n\ndef extract_embeddings(model, dataloader, device):\n    model.eval()\n    emb = np.zeros(\n        (len(dataloader.dataset), model.classifier[1].in_features), dtype=np.float32\n    )\n    with torch.no_grad():\n ignancy probability for a list of image paths.\n    Args:\n      image_paths: list of str paths to images\n      classifiers: list of trained sklearn classifiers with predict_proba\n    Returns:\n      numpy array of shape (n_images,) with average malignant probability\n    \"\"\"\n    # prepare transform and device\n    weights = EfficientNet_B0_Weights.IMAGENET1K_V1\n    transform = weights.transforms()\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load base model\n    model = efficientnet_b0(weights=weights)\n    # get feature dimension before replacing classifier\n    feature_dim = model.classifier[1].in_features\n    model.classifier = torch.nn.Identity()\n    model.to(device)\n    # extract embeddings\n    ds = SkinDataset(image_paths, transform)\n    loader = DataLoader(\n        ds, batch_size=batch_size, num_workers=num_workers, shuffle=False\n    )\n    emb = extract_embeddings(model, loader, device, feature_dim)\n    # average predictions\n    preds = np.zeros((emb.shape[0],), dtype=np.float32)\n    for clf in classifiers:\n        preds += clf.predict_proba(emb)[:, 1]\n    preds /= len(classifiers)\n    return preds\n\n\nif __name__ == \"__main__\":\n    # load metadata\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"y\"] = (df[\"label\"] == \"malignant\").astype(int)\n    img_dir = \"./input/MyImages\"\n    paths = df[\"image_name\"].apply(lambda x: os.path.join(img_dir, x + \".jpg\")).tolist()\n    ys = df[\"y\"].values\n\n    # prepare model & transforms\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    weights = EfficientNet_B0_Weights.IMAGENET1K_V1\n    transform = weights.transforms()\n    # load pretrained EfficientNet_B0 and capture feature dimension\n    model = efficientnet_b0(weights=weights)\n    feature_dim = model.classifier[1].in_features\n    model.classifier = torch.nn.Identity()\n    model.to(device)\n\n    # extract embeddings for all images\n    ds_all = SkinDataset(paths, transform)\n    loader_all = DataLoader(ds_all, batch_size=32, num_workers=4, shuffle=False)\n    embeddings = extract_embeddings(model, loader_all, device, feature_dim)\n\n    # 5-fold stratified CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    classifiers = []\n    aucs = []\n    for fold, (tr_idx, val_idx) in enumerate(skf.split(embeddings, ys), 1):\n        X_tr, X_val = embeddings[tr_idx], embeddings[val_idx]\n        y_tr, y_val = ys[tr_idx], ys[val_idx]\n        clf = LogisticRegression(max_iter=1000, class_weight=\"balanced\")\n        clf.fit(X_tr, y_tr)\n        prob = clf.predict_proba(X_val)[:, 1]\n        auc = roc_auc_score(y_val, prob)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        classifiers.append(clf)\n        aucs.append(auc)\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n\n    # Demonstrate predict() on training set (or new data)\n    preds = predict(paths, classifiers)\n    overall_auc = roc_auc_score(ys, preds)\n    print(f\"Overall AUROC by predict(): {overall_auc:.4f}\")", "import os\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom PIL import Image\n\n# Device setup (force CPU fallback if GPU drivers are problematic)\nuse_cuda = torch.cuda.is_available() and torch.cuda.device_count() > 0\ndevice = torch.device(\"cuda\" if use_cuda else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_dir = \"./input/MyImages\"\nimage_paths = (\n    df[\"image_name\"].apply(lambda x: os.path.join(image_dir, f\"{x}.jpg\")).values\n)\nlabels = df[\"binary_label\"].values\n\n# Define transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, paths, labels, transform):\n        self.paths = paths\n        self.labels = labels\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(self.labels[idx], dtype=torch.float32)\n        return img, label\n\n\n# Prepare cross-validation\nskf = StratifiedKFold(n_splits=3, shuffle=True, random_state=42)\nfold_scores = []\nmodel_paths = []\n\nos.makedirs(\"./working/models\", exist_ok=True)\n\nfor fold, (tr_idx, val_idx) in enumerate(skf.split(image_paths, labels), start=1):\n    train_ds = SkinLesionDataset(image_paths[tr_idx], labels[tr_idx], train_transform)\n    val_ds = SkinLesionDataset(image_paths[val_idx], labels[val_idx], val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n    )\n    val_loader = DataLoader(\n        val_ds, batch_size=32, shuffle=False, num_workers=4, pin_memory=True\n    )\n\n    # Model: ResNet18, freeze backbone\n    model = models.resnet18(pretrained=True)\n    for param in model.parameters():\n        param.requires_grad = False\n    num_ftrs = model.fc.in_features\n    model.fc = nn.Linear(num_ftrs, 1)\n    model = model.to(device)\n\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.fc.parameters(), lr=1e-4)\n\n    # Train only classifier head for 2 epochs\n    for epoch in range(2):\n        model.train()\n        for imgs, labs in train_loader:\n            imgs, labs = imgs.to(device), labs.to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs).view(-1)\n            loss = criterion(outputs, labs)\n            loss.backward()\n            optimizer.step()\n\n    # Validate\n    model.eval()\n    all_preds, all_trues = [], []\n    with torch.no_grad():\n        for imgs, labs in val_loader:\n            imgs = imgs.to(device)\n            out = model(imgs).view(-1)\n            probs = torch.sigmoid(out).cpu().numpy()\n            all_preds.extend(probs)\n            all_trues.extend(labs.numpy())\n    score = roc_auc_score(all_trues, all_preds)\n    fold_scores.append(score)\n\n    # Save model\n    path = f\"./working/models/resnet18_fold{fold}.pth\"\n    torch.save(model.state_dict(), path)\n    model_paths.append(path)\n    print(f\"Fold {fold} AUROC: {score:.4f}\")\n\nprint(f\"Mean AUROC: {np.mean(fold_scores):.4f}\")\n\n\ndef predict(image_folder: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in a folder.\n    Args:\n        image_folder (str): Path to folder containing images.\n    Returns:\n        pd.DataFrame: columns ['image_name', 'malignant_probability'].\n    \"\"\"\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    files.sort()\n    paths = [os.path.join(image_folder, f) for f in files]\n    all_probs = {p: [] for p in paths}\n\n    for mp in model_paths:\n        model = models.resnet18(pretrained=False)\n        num_ftrs = model.fc.in_features\n        model.fc = nn.Linear(num_ftrs, 1)\n        model.load_state_dict(torch.load(mp, map_location=device))\n        model = model.to(device).eval()\n        with torch.no_grad():\n            for p in paths:\n                img = Image.open(p).convert(\"RGB\")\n                inp = val_transform(img).unsqueeze(0).to( let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
