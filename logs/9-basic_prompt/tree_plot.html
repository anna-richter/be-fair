let treeStructData = {"edges": [[1, 9], [2, 8], [2, 5], [2, 7], [2, 12], [3, 6], [4, 10], [7, 11], [9, 17], [11, 15], [12, 14], [12, 13], [14, 19], [14, 16], [16, 18]], "layout": [[0.0, 0.0], [0.14285714285714285, 0.0], [0.5, 0.0], [0.8571428571428571, 0.0], [1.0, 0.0], [0.2857142857142857, 0.25], [0.8571428571428571, 0.25], [0.42857142857142855, 0.25], [0.5714285714285714, 0.25], [0.14285714285714285, 0.25], [1.0, 0.25], [0.42857142857142855, 0.5], [0.7142857142857143, 0.25], [0.6428571428571429, 0.5], [0.7857142857142857, 0.5], [0.42857142857142855, 0.75], [0.7142857142857143, 0.75], [0.14285714285714285, 0.5], [0.7142857142857143, 1.0], [0.8571428571428571, 0.75]], "plan": ["We fine-tune a pretrained ResNet-18 for binary classification by grouping\nmalignant vs non-malignant lesions, using an 80/20 stratified split and training\nfor 5 epochs. We preprocess images with standard resizing and normalization,\ntrain with BCEWithLogitsLoss and Adam optimizer, and compute AUROC on the hold-\nout validation set. A predict() function is provided to load a folder of new\nimages and return malignancy probabilities.", "I propose fine-tuning a pretrained ResNet18 model on the binary classification\ntask of malignant vs non\u2010malignant skin lesions. We will load and preprocess the\nimages with standard ImageNet transforms, split the dataset stratified into\ntraining and validation sets, and train for a few epochs using Adam and a binary\ncross\u2010entropy loss. We will evaluate performance on the hold\u2010out set using\nAUROC, and provide a predict() function to generate probabilities on new images.", "We fine-tune a pretrained ResNet18 on the skin lesion images, mapping malignant\nto 1 and benign/non-neoplastic to 0. We split the data into train and validation\nsets, apply standard image augmentations for training and normalization for\nboth, and train with Adam and BCEWithLogitsLoss for a few epochs. After\ntraining, we compute and print the AUROC on the hold-out validation set. We also\nprovide a reusable predict() function that takes a folder of images and returns\nmalignancy probabilities.", "We will fine-tune a pretrained EfficientNet-B0 using the timm library for binary\nclassification of malignant versus non-malignant lesions. We perform a\nstratified train/validation split, apply standard augmentations (random crops,\nflips) to the training set, and normalize all images. The model is trained with\nAdamW and BCEWithLogitsLoss for five epochs while tracking validation AUROC.\nAfter training, we compute and print the AUROC on the hold-out validation set.\nWe also provide a predict() function that loads new images from a folder and\nreturns malignancy probabilities.", "We fine-tune a pretrained DenseNet121 on the skin lesion images, treating\nmalignant as positive and benign/non-neoplastic as negative. We perform\nstratified 5-fold cross-validation with standard augmentations for training and\nnormalization for validation, training each fold for 3 epochs using Adam and\nBCEWithLogitsLoss. After each fold we compute AUROC on the hold-out set and\nreport the mean and standard deviation across folds. Each fold\u2019s model is saved,\nand we provide a predict() function that ensembles these models to output\nmalignancy probabilities for new images. Final evaluation is the average cross-\nvalidated AUROC.", "I propose integrating a OneCycle learning rate scheduler to improve convergence\nand generalization. We will set a higher maximum learning rate (e.g., 1e-3) and\nschedule it over all training iterations, stepping the scheduler after each\nbatch. This often leads to better performance than a fixed or decaying learning\nrate. The rest of the training pipeline remains unchanged.", "I will use PyTorch\u2019s mixed\u2010precision training (torch.cuda.amp) to speed up\nforward/backward passes, increase DataLoader workers, and reduce the number of\nepochs to ensure the run finishes within the time limit. A GradScaler manages\nloss scaling, and we keep the ROC AUC evaluation on the hold\u2010out set unchanged.\nThis will greatly cut training time while maintaining accuracy.", "We integrate Mixup augmentation into the training loop: for each batch we\nrandomly combine pairs of images and labels using a Beta distribution and\ncompute the loss on mixed samples. This simple change enhances model robustness\nand often yields higher AUROC. The rest of the pipeline, including ResNet18\nfine-tuning and evaluation on a hold-out set, remains unchanged.", "I propose integrating MixUp data augmentation during training to improve\nregularization and generalization. MixUp combines pairs of images and their\nlabels using a mixing coefficient sampled from a Beta distribution. This is an\natomic change in the training loop and can boost AUROC without altering the\nmodel architecture or overall pipeline.", "We switch to a lightweight MobileNetV3\u2010Small backbone and use 5\u2010fold stratified\ncross\u2010validation with mixed precision to speed up training. For each fold we\ntrain for 3 epochs, saving the best model by validation AUROC, and then report\nthe mean and standard deviation over folds. We also provide a reusable\n`predict()` function that loads all fold models and averages their sigmoid\noutputs. This approach both fixes the time\u2010out issue and yields more robust\nevaluation.", "We can greatly speed up training by freezing the DenseNet backbone and\nprecomputing image features only once, then fitting a lightweight sklearn\nlogistic regression in a 5\u2010fold stratified CV loop.  We extract features via a\nsmall PyTorch \u201cFeatureExtractor\u201d model using the pretrained DenseNet121, store\nthese as NumPy arrays, and then train/predict with logistic regression, which is\norders of magnitude faster.  For inference we extract test\u2010set features\nsimilarly and average the per\u2010fold logistic\u2010regression probabilities to produce\nour submission.csv.", "I will batch the predictions using a DataLoader instead of one-by-one inference,\nwhich reduces Python overhead and speeds up GPU utilization. I\u2019ll define a\nTestImageDataset returning both tensors and image names, then in `predict` loop\nover batches to compute probabilities. The training and validation loop remains,\nbut prediction on new images is now batched and much faster, and the final\n`submission.csv` is saved in `./working/`.", "I propose replacing the ResNet18 backbone with a more powerful EfficientNet\u2010B0\nmodel pretrained on ImageNet, which often yields better feature representations\nand higher accuracy for image classification tasks. We will swap out the model\ninstantiation to use `torchvision.models.efficientnet_b0`, adjust its final\nclassifier to output a single logit, and keep all other pipeline components\n(data loading, transforms, training loop, and evaluation) unchanged. This swap\nis an atomic change that should boost the AUROC without altering the training\nprocedure.", "I propose replacing the single train/validation split with stratified 5-fold\ncross-validation to better utilize all data and obtain a more robust AUROC\nestimate. We will loop over each fold, train an EfficientNet-B0 model for 3\nepochs, evaluate AUROC on the fold\u2019s validation set, and finally report the mean\nand standard deviation of the 5 fold AUROCs. The rest of the pipeline, including\ndata transforms and model architecture, remains unchanged.", "I propose to implement test\u2010time augmentation by averaging predictions over the\noriginal and horizontally flipped versions of each image. During validation and\nin the `predict()` function, we will compute logits for both the image and its\nflip, average the logits before applying the sigmoid, and thereby obtain more\nrobust probability estimates. This TTA approach can boost AUROC without any\nadditional training overhead. All other parts of the pipeline remain unchanged.", "We can address the timeout by reducing the image resolution to 128\u00d7128 and\nfreezing the pretrained backbone so that only the final classification layer is\ntrained. This greatly cuts down on per\u2010batch computation while preserving\ntransfer\u2010learning performance. We update the data transforms accordingly,\ndisable gradients for all backbone parameters, and only optimize the final `fc`\nlayer. The rest of the pipeline, including mixup, AUROC evaluation, and the\n`predict` function that writes `submission.csv`, remains intact.", "I propose replacing the single train/val split with stratified 5\u2010fold\ncross\u2010validation. For each fold we train an EfficientNet-B0 for 3 epochs,\ncompute and print the fold AUROC, and save the model checkpoint. Finally we\nreport the mean CV AUROC and ensemble the five fold models to predict test\nimages by averaging their TTA probabilities, writing `submission.csv`.", "We will switch to a single stratified train/validation split and lower the image\nsize to 160\u00d7160 to cut compute, freeze the MobileNetV3 backbone so only the\nclassifier head is trained, and train for just three epochs. After training we\ncompute and print the hold\u2010out AUROC, save the best model, and then use a\nreusable predict() function to score all images in the input folder and write a\nsubmission.csv file with image_name and probability. The predict() function is\nfully documented and can be called on new image folders with a list of model\ncheckpoints.", "We add a small device test to catch the old\u2010driver GPU warning and fall back to\nCPU. When running on CPU we swap in a lightweight ResNet-18 backbone instead of\nEfficientNet-B0 to keep training within time, and on GPU we keep\nEfficientNet-B0. A helper `create_model` handles both cases, and we then run\n5-fold CV, report per\u2010fold and mean AUROC, and finally ensemble TTA predictions\ninto a submission.csv.", "I propose adding Random Erasing augmentation to the training data pipeline to\nimprove robustness and reduce overfitting. By randomly masking out patches of\nthe input images during training, the model learns to rely on more global\ncontext and generalize better to unseen data. This is an atomic change\u2014simply\nappending `transforms.RandomErasing` after normalization\u2014and leaves the rest of\nthe training, validation, and prediction code unchanged."], "code": ["import os\nfrom pathlib import Path\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom PIL import Image\n\n\n# Dataset definition\nclass SkinDataset(Dataset):\n    def __init__(self, df, root_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.root_dir = Path(root_dir)\n        self.transform = transform\n        self.labels = df[\"binary\"].values.astype(np.float32)\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        img_name = self.df.loc[idx, \"image_name\"] + \".jpg\"\n        img_path = self.root_dir / img_name\n        image = Image.open(img_path).convert(\"RGB\")\n        image = self.transform(image)\n        label = torch.tensor(self.labels[idx])\n        return image, label\n\n\n# Prediction function\ndef predict(image_folder, model, transform, device):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in image_folder.\n    Returns a DataFrame with columns ['image_name','malignant_prob'].\n    \"\"\"\n    model.eval()\n    results = []\n    for img_path in sorted(Path(image_folder).glob(\"*.jpg\")):\n        img = Image.open(img_path).convert(\"RGB\")\n        img_t = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            out = model(img_t)\n            prob = torch.sigmoid(out).item()\n        results.append((img_path.name, prob))\n    return pd.DataFrame(results, columns=[\"image_name\", \"malignant_prob\"])\n\n\ndef main():\n    # Load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # Binary label: malignant=1, others=0\n    df[\"binary\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Train/validation split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"binary\"], random_state=42\n    )\n    # Transforms\n    train_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, \"./input/MyImages\", train_transform)\n    val_ds = SkinDataset(val_df, \"./input/MyImages\", val_transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model setup\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # Training loop\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for images, labels in train_loader:\n            images, labels = images.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(images)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * images.size(0)\n        print(f\"Epoch {epoch+1}/{epochs}, Loss: {running_loss/len(train_ds):.4f}\")\n    # Validation\n    model.eval()\n    all_labels = []\n    all_probs = []\n    with torch.no_grad():\n        for images, labels in val_loader:\n            images = images.to(device)\n            outputs = model(images)\n            probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Example: generate predictions on new images (if any)\n    # preds_df = predict(\"./input/MyImages\", model, val_transform, device)\n    # preds_df.to_csv(\"./working/submission.csv\", index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return img, label\n\n\ndef predict(model, image_paths, transform, device):\n    \"\"\"\n    Predict probability of malignancy for a list of image paths.\n    Args:\n        model: trained PyTorch model outputting logits.\n        image_paths: list of file paths to images.\n        transform: torchvision transforms for preprocessing.\n        device: torch.device.\n    Returns:\n        dict mapping image_path -> probability of malignancy.\n    \"\"\"\n    model.eval()\n    probs = {}\n    with torch.no_grad():\n        for path in image_paths:\n            img = Image.open(path).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            logit = model(x)\n            p = torch.sigmoid(logit).item()\n            probs[path] = p\n    return probs\n\n\ndef main():\n    # Paths\n    DATA_CSV = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    # Read and prepare labels\n    df = pd.read_csv(DATA_CSV)\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Train/validation split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"target\"], random_state=42\n    )\n    # Transforms\n    mean = [0.485, 0.456, 0.406]\n    std = [0.229, 0.224, 0.225]\n    transform = T.Compose(\n        [T.Resize((224, 224)), T.ToTensor(), T.Normalize(mean=mean, std=std)]\n    )\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, IMG_DIR, transform)\n    val_ds = SkinDataset(val_df, IMG_DIR, transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    # Loss and optimizer\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # Training loop\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n        # Validation\n        model.eval()\n        all_logits, all_labels = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).cpu().numpy().flatten()\n                all_logits.extend(logits)\n                all_labels.extend(labels.numpy())\n        auc = roc_auc_score(all_labels, all_logits)\n        print(f\"Epoch {epoch+1}/{epochs} validation AUROC: {auc:.4f}\")\n    # Final evaluation\n    print(f\"Final validation AUROC: {auc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = float(row.label_bin)\n        return image, label\n\n\n# Prediction function\ndef predict(\n    image_folder: str, model: nn.Module, device: torch.device, transform\n) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probability for all .jpg images in image_folder.\n    Returns a DataFrame with columns [' name\"] + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        return img, row[\"label_bin\"], idx\n\n\n# Build feature extractor from DenseNet121\nclass FeatureExtractor(nn.Module):\n    def __init__(self, backbone):\n        super().__init__()\n        self.features = backbone.features\n        self.relu = nn.ReLU(inplace=True)\n        self.pool = nn.AdaptiveAvgPool2d((1, 1))\n\n    def forward(self, x):\n        x = self.features(x)\n        x = self.relu(x)\n        x = self.pool(x)\n        return torch.flatten(x, 1)\n\n\n# Prepare dataset + dataloader for full feature extraction\nfull_ds = FeatureDataset(df, IMAGE_DIR, transform)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# Load pretrained backbone and wrap\nbackbone = models.densenet121(pretrained=True)\nfeat_model = FeatureExtractor(backbone).to(DEVICE).eval()\n\n# Precompute features\nn_samples = len(full_ds)\n# dummy forward to get feature dimension\nwith torch.no_grad():\n    sample_img = next(iter(full_loader))[0].to(DEVICE)\n    feat_dim = feat_model(sample_img).shape[1]\nX = np.zeros((n_samples, feat_dim), dtype=np.float32)\ny = np.zeros((n_samples,), dtype=np.int32)\n\nwith torch.no_grad():\n    for imgs, labels, idxs in tqdm(full_loader, desc=\"Extracting features\"):\n        imgs = imgs.to(DEVICE)\n        feats = feat_model(imgs).cpu().numpy()\n        X[idxs.numpy(), :] = feats\n        y[idxs.numpy()] = labels.numpy()\n\n# 5-fold CV with logistic regression\nskf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=42)\naucs = []\nlr_models = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(X, y), 1):\n    print(f\"Fold {fold}/{N_FOLDS}\")\n    clf = LogisticRegression(max_iter=1000, solver=\"lbfgs\")\n    clf.fit(X[train_idx], y[train_idx])\n    probs = clf.predict_proba(X[val_idx])[:, 1]\n    auc = roc_auc_score(y[val_idx], probs)\n    print(f\"  AUC: {auc:.4f}\")\n    aucs.append(auc)\n    lr_models.append(clf)\n\nprint(f\"CV AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\n\n\ndef predict(image_folder, feature_model, lr_models, transform, batch_size=BATCH_SIZE):\n    \"\"\"\n    Predict malignancyProb on all .jpg in image_folder.\n    Returns DataFrame with columns: image_name, malignancy_prob.\n    \"\"\"\n    files = sorted([f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")])\n\n    class TestDataset(Dataset):\n        def __init__(self, files, folder, transform):\n            self.files, self.folder, self.transform = files, folder, transform\n\n        def __len__(self):\n            return len(self.files)\n\n        def __getitem__(self, idx):\n            fn = self.files[idx]\n            img = Image.open(os.path.join(self.folder, fn)).convert(\"RGB\")\n            img = self.transform(img)\n            return img, fn, idx\n\n    test_ds = TestDataset(files, image_folder, transform)\n    test_loader = DataLoader(\n        test_ds, batch_size=batch_size, shuffle=False, num_workers=4\n    )\n    feature_model.eval()\n    results = np.zeros((len(test_ds),))\n    with torch.no_grad():\n        all_feats = np.zeros((len(test_ds), feat_dim), dtype=np.float32)\n        for imgs, fns, idxs in tqdm(test_loader, desc=\"Extract test features\"):\n            imgs = imgs.to(DEVICE)\n            feats = feature_model(imgs).cpu().numpy()\n            all_feats[idxs.numpy(), :] = feats\n    # average probabilities over folds\n    for clf in lr_models:\n        results += clf.predict_proba(all_feats)[:, 1]\n    results /= len(lr_models)\n    out = pd.DataFrame({\"image_name\": files, \"malignancy_prob\": results})\n    return out\n\n\n# If test folder exists, produce submission\nif os.path.isdir(TEST_DIR):\n    sub = predict(TEST_DIR, feat_model, lr_models, transform)\n    sub.to_csv(os.path.join(WORKING_DIR, \"submission.csv\"), index=False)\n    print(f\"Saved submission.csv to {WORKING_DIR}\")", "import os\nimport random\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\n\n\n# Mixup helper\ndef mixup_data(x, y, alpha=0.4, device=None):\n    if alpha > 0:\n        lam = np.random.beta(alpha, alpha)\n    else:\n        lam = 1.0\n    batch_size = x.size()[0]\n    index = torch.randperm(batch_size).to(device)\n    mixed_x = lam * x + (1 - lam) * x[index, :]\n    y_a, y_b = y, y[index]\n    return mixed_x, y_a, y_b, lam\n\n\n# Training/validation dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = float(row.label_bin)\n        return img, label\n\n\n# Test dataset for prediction\nclass TestImageDataset(Dataset):\n    def __init__(self, folder, transform=None):\n        self.folder = folder\n        self.fnames = sorted(\n            [f for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n        )\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.fnames)\n\n    def __getitem__(self, idx):\n        fname = self.fnames[idx]\n        img = Image.open(os.path.join(self.folder, fname)).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        else:\n            img = transforms.ToTensor()(img)\n        return img, os.path.splitext(fname)[0]\n\n\n# Batched predict function\ndef predict(\n    image_f ch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training with mixup\n    epochs = 3\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n            mixed_imgs, y_a, y_b, lam = mixup_data(\n                imgs, labels, alpha=0.4, device=DEVICE\n            )\n            optimizer.zero_grad()\n            outputs = model(mixed_imgs).squeeze(1)\n            loss = lam * criterion(outputs, y_a) + (1 - lam) * criterion(outputs, y_b)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch+1}/{epochs}, Loss: {running_loss/len(train_ds):.4f}\")\n\n    # Validation\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Save test predictions\n    preds_df = predict(IMG_DIR, model, DEVICE, val_tf, batch_size=32, num_workers=4)\n    os.makedirs(\"./working\", exist_ok=True)\n    preds_df.to_csv(\"./working/submission.csv\", index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.met   yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
