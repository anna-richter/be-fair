let treeStructData = {"edges": [[0, 5], [1, 7], [2, 6], [5, 8], [5, 9], [6, 13], [8, 10], [9, 12], [10, 11], [11, 14], [12, 15], [13, 16], [15, 17], [15, 18], [18, 19]], "layout": [[0.15789473684210525, 0.0], [0.3684210526315789, 0.0], [0.5789473684210527, 0.0], [0.7894736842105263, 0.0], [1.0, 0.0], [0.15789473684210525, 0.16666666666666663], [0.5789473684210527, 0.16666666666666663], [0.3684210526315789, 0.16666666666666663], [0.0, 0.33333333333333337], [0.3157894736842105, 0.33333333333333337], [0.0, 0.5], [0.0, 0.6666666666666667], [0.3157894736842105, 0.5], [0.5789473684210527, 0.33333333333333337], [0.0, 0.8333333333333334], [0.3157894736842105, 0.6666666666666667], [0.5789473684210527, 0.5], [0.21052631578947367, 0.8333333333333334], [0.42105263157894735, 0.8333333333333334], [0.42105263157894735, 1.0]], "plan": ["We extract deep features from a pretrained ResNet18 for all images and train a\nlogistic regression classifier on these 512\u2010dim features to distinguish\nmalignant from benign lesions. We perform 5\u2010fold stratified CV to estimate\nAUROC, then fit a final model on all data. A `predict()` function allows users\nto load new image folders and output malignancy probabilities in a DataFrame,\nand we save a sample `submission.csv`. The evaluation metric is AUROC.", "We fine\u2010tune a pretrained ResNet18 on our lesion images for binary\nclassification (malignant vs non\u2010malignant) using simple augmentations,\nreplacing the final layer and training only that head for a few epochs. We\nperform 5\u2010fold stratified cross\u2010validation to compute the mean AUROC. After CV\nwe retrain on all data to produce a final model and provide a predict() function\nto score new image folders. The evaluation metric is AUROC.", "We fine-tune a pretrained EfficientNet-B0 backbone with a new binary head to\nclassify malignant vs non-malignant lesions, using simple augmentations (random\nflips and rotations). We perform stratified 5-fold cross-validation (2 epochs\nper fold) to estimate mean AUROC. Then we retrain on the full dataset for 5\nepochs, save the model, and implement a predict() function that loads the saved\nmodel and computes malignant probabilities on a folder of new images, saving\nresults to submission.csv. We report the mean CV AUROC as our evaluation metric.", "We extract HOG features from each lesion image resized to a fixed resolution and\ntrain a Random Forest classifier to predict malignancy. We perform stratified\n5-fold cross-validation and compute the mean AUROC to assess performance.\nAfterward, we fit the final model on all available data and define a predict()\nfunction that processes new image folders, extracts HOG features, and returns\nmalignancy probabilities. Finally, we generate and save predictions for the test\nimages to `submission.csv`.", "We extract simple color histogram features by quantizing each RGB channel into 8\nbins, giving a 24-dim feature vector per image. We then train a LightGBM\nclassifier to predict malignancy, evaluating performance with stratified 5-fold\ncross-validation and reporting the mean AUROC. After that, we train on the full\ndataset and implement a `predict()` function that computes histogram features\nfor new images and returns malignancy probabilities. Finally, we generate\npredictions for the provided images and save them to `submission.csv` in the\nworking directory.", "We improve the ResNet18\u2010based pipeline by adding simple test\u2010time augmentation:\nfor each image we extract deep features from both the original and a\nhorizontally flipped version, average them to produce more robust\nrepresentations, and then use these features for logistic regression. This adds\nminimal overhead but typically boosts generalization by reducing sensitivity to\norientation. We then perform 5\u2010fold stratified cross\u2010validation with these TTA\nfeatures, train the final model on all data, and update `predict()` to apply\nidentical TTA during inference. Finally we report the mean CV AUROC and save\n`submission.csv`.", "We need to train only on bona\u2010fide benign vs malignant samples and drop \u201cnon-\nneoplastic\u201d cases so that the model learns the correct binary task. We filter\nthe CSV to those two labels, map them to 0/1, then run a 5-fold StratifiedKFold\nCV with 2 epochs per fold, printing each fold AUROC and the mean. After CV we\nretrain on the full filtered dataset for 5 epochs and save the model. The\n`predict()` function uses a custom TestDataset with the validation transforms to\noutput a DataFrame of malignant probabilities which is written to\n`./working/submission.csv`.", "I will simplify evaluation by using a single stratified hold-out split instead\nof full cross-validation, which will greatly reduce runtime. The model will be\ntrained for a few epochs on the training set, evaluated on the validation set to\nprint AUC, and a `predict()` function will generate and save a `submission.csv`\nif a test folder is present.", "I propose to extend the test\u2010time augmentation by including both horizontal and\nvertical flips (and their combination), so that for each image we extract deep\nfeatures from four variants\u2014original, horizontally flipped, vertically flipped,\nand both\u2014and average them. This richer TTA should yield more robust\nrepresentations and improve generalization with minimal extra code. All\ndownstream steps (5\u2010fold CV, final training, and predict()) remain unchanged but\nnow use these quad\u2010TTA features.", "I will improve the representation quality by replacing the ResNet18 backbone\nwith a stronger EfficientNet\u2010B0 pretrained model, while keeping the same TTA via\nhorizontal flips and logistic regression head. This should yield richer deep\nfeatures and boost AUC. The rest of the pipeline (5\u2010fold CV, final training,\npredict function, and submission) remains unchanged.", "We refactor the feature extraction to run TTA in batches, strongly reducing\nPython overhead and avoiding per-image loops during inference. The new\n`extract_features` processes images in configurable batch sizes, aggregates TTA\noutputs, and returns a feature matrix. We then perform 5-fold CV using these\nbatched features, train a final logistic regression on all data, and implement a\n`predict` function that uses the same efficient extractor to generate and save\n`submission.csv`. This eliminates redundant full-dataset reprocessing and\nensures timely completion.", "I will use a custom PyTorch Dataset that returns all four TTA variants for each\nimage at once and wrap it in a DataLoader with multiple workers and pin memory.\nThis lets us do a single forward pass per batch of size batch_size \u00d7 4 instead\nof four separate passes, cutting the number of model calls by 4 and eliminating\nthe slow Python\u2010level loops. The `extract_features` function will iterate over\nthis loader, reshape and average the features, and return a NumPy array.\nFinally, I\u2019ll run 5\u2010fold CV to print the mean AUROC, train on all data, define a\n`predict()` function using the same pipeline, and save `submission.csv`.", "I propose to improve test-time augmentation by adding vertical flips to the\ncurrent horizontal\u2010only TTA, using four variants (original, horizontal flip,\nvertical flip, and both flips) for each image and averaging their deep features.\nThis will yield more orientation\u2010robust representations and should boost\ndiscrimination performance. We will update both the `extract_features` and\n`predict()` functions to apply these four augmentations, then rerun 5\u2010fold CV\nand report the new mean AUROC before training the final model and writing\n`submission.csv`.", "We\u2019ll bypass costly end\u2010to\u2010end fine\u2010tuning by freezing a lightweight pretrained\nResNet18 as a fixed feature extractor and training a fast logistic regression on\ntop.  We extract features for all images once, run a 5\u2010fold Stratified CV of the\nlogistic model to report AUROC, then fit on the full set and use that pipeline\nfor prediction.  This avoids backprop through the CNN, drastically reducing run\ntime, and exposes a reusable predict() function for new images.", "We will avoid re-extracting the same features for submission by re\u2010using the\nones computed during training when the test folder matches the training images.\nFor new unseen images, we disable TTA and run a single\u2010pass feature extraction\nto greatly reduce inference time. We wrap this logic in a unified\n`extract_features` and update `predict()` to leverage cached features when\npossible. Finally, we print the 5\u2010fold CV AUROC, train the final classifier, and\nsave a `submission.csv` to the `./working` directory.", "We will replace the logistic regression head with a LightGBM gradient boosting\nclassifier to better capture non-linear interactions in the extracted deep\nfeatures. We will use the same EfficientNet-B0 backbone with 4-way TTA and\nperform 5-fold stratified CV to evaluate the LightGBM model, printing the mean\nAUROC. Finally, we will train the LightGBM classifier on the full dataset and\nupdate `predict()` to use this model, writing predictions to `submission.csv`.", "I replaced the manual normalization step with the built-in\n`weights.transforms()` which handles resizing, cropping, tensor conversion, and\nnormalization using the correct mean and std values. This avoids the missing\n`weights.meta['mean']` key error. The rest of the pipeline remains the same: we\nextract features with a ResNet18 backbone, perform 5-fold CV to report AUROC,\ntrain on the full dataset, and then generate a `submission.csv` using the\n`predict` function.", "We expand test-time augmentation by adding 90\u00b0 and 270\u00b0 rotations to our\nexisting 4-way flips, yielding 6 variants per image for more orientation\nrobustness. We update `extract_features` and `predict` to average features over\nthese 6 transforms and then rerun 5-fold CV using EfficientNet-B0 + 6-way TTA +\nLightGBM to measure the AUROC gain. Finally we train the final model on all data\nand save predictions to `submission.csv`.", "I will extend the test\u2010time augmentation from 4 to 8 variants by adding 90\u00b0\nrotations for each flip combination, thus generating more diverse views and\nimproving orientation robustness. I update both `extract_features` and\n`predict()` to apply these eight augmentations, then re\u2010run 5\u2010fold CV to print\nthe new AUROC, train on all data, and save `submission.csv`.", "We can speed up feature extraction by removing the costly 8-way test\u2010time\naugmentations and batching images using a PyTorch DataLoader. We\u2019ll extract\nsingle-view features in batches, perform 5-fold CV with LightGBM to compute\nAUROC, and then train on all data. The same batch feature extractor will be used\nin a predict() function that writes out `submission.csv`."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nfrom torchvision import transforms, models\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n# 1. Load metadata and labels\ndf = pd.read_csv(\"input/mydataset.csv\")\n# Map malignant=1, others=0\ndf[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_paths = (\n    df[\"image_name\"]\n    .apply(lambda n: os.path.join(\"input\", \"MyImages\", f\"{n}.jpg\"))\n    .tolist()\n)\ny = df[\"binary_label\"].values\n\n# 2. Prepare feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.resnet18(pretrained=True)\n# Remove final fc\nmodel = torch.nn.Sequential(*list(model.children())[:-1]).to(device).eval()\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# 3. Extract features for all images\nfeatures = []\nwith torch.no_grad():\n    for path in image_paths:\n        img = Image.open(path).convert(\"RGB\")\n        x = transform(img).unsqueeze(0).to(device)\n        feat = model(x).cpu().numpy().reshape(-1)\n        features.append(feat)\nfeatures = np.vstack(features)\n\n# 4. 5-fold CV for AUROC\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor train_idx, val_idx in skf.split(features, y):\n    clf = LogisticRegression(max_iter=1000, solver=\"lbfgs\")\n    clf.fit(features[train_idx], y[train_idx])\n    prob = clf.predict_proba(features[val_idx])[:, 1]\n    aucs.append(roc_auc_score(y[val_idx], prob))\nmean_auc = np.mean(aucs)\nprint(f\"Mean 5-fold AUROC: {mean_auc:.4f}\")\n\n# 5. Train final model on all data\nfinal_clf = LogisticRegression(max_iter=1000, solver=\"lbfgs\")\nfinal_clf.fit(features, y)\n\n\ndef predict(image_dir):\n    \"\"\"\n    Predict malignancy probability for images in a directory.\n    Args:\n      image_dir (str): path to folder containing .jpg images\n    Returns:\n      pandas.DataFrame with columns ['image_name','malignant_prob']\n    \"\"\"\n    img_files = [f for f in os.listdir(image_dir) if f.lower().endswith(\".jpg\")]\n    probs = []\n    with torch.no_grad():\n        for fname in img_files:\n            img = Image.open(os.path.join(image_dir, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            feat = model(x).cpu().numpy().reshape(1, -1)\n            p = final_clf.predict_proba(feat)[0, 1]\n            probs.append(p)\n    return pd.DataFrame({\"image_name\": img_files, \"malignant_prob\": probs})\n\n\n# 6. Example on input/MyImages and save submission\nsub = predict(\"input/MyImages\")\nos.makedirs(\"working\", exist_ok=True)\nsub.to_csv(\"working/submission.csv\", index=False)\nprint(\"Saved submission.csv with malignancy probabilities.\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n# Configuration\nDATA_DIR = \"./input\"\nIMG_DIR = os.path.join(DATA_DIR, \"MyImages\")\nCSV_PATH = os.path.join(DATA_DIR, \"mydataset.csv\")\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nIMG_SIZE = 224\nEPOCHS = 3\nNUM_FOLDS = 5\nMODEL_PATH = \"./working/final_model.pth\"\n\n\n# Dataset definition\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_name = row[\"image_name\"] + \".jpg\"\n        img_path = os.path.join(self.img_dir, img_name)\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row[\"malignant\"], dtype=torch.float32)\n        return img, label\n\n\n# Read and preprocess labels\ndf = pd.read_csv(CSV_PATH)\n# Binary label: malignant=1, else=0\ndf[\"malignant\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n# Image transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.Resize((IMG_SIZE, IMG_SIZE)),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((IMG_SIZE, IMG_SIZE)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=NUM_FOLDS, shuffle=True, random_state=42)\naucs = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"malignant\"]), 1):\n    train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n    train_ds = LesionDataset(train_df, IMG_DIR, transform=train_transform)\n    val_ds = LesionDataset(val_df, IMG_DIR, transform=val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model\n    model = models.resnet18(pretrained=True)\n    for param in model.parameters():\n        param.requires_grad = False\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.fc.parameters(), lr=1e-3)\n\n    # Train head\n    model.train()\n    for epoch in range(EPOCHS):\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validation\n    model.eval()\n    all_preds, all_targets = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().ravel()\n            all_preds.extend(probs)\n            all_targets.extend(labels.numpy())\n    auc = roc_auc_score(all_targets, all_preds)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data\nfull_ds = LesionDataset(df, IMG_DIR, transform=train_transform)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nfinal_model = models.resnet18(pretrained=True)\nfor param in final_model.parameters():\n    param.requires_grad = False\nfinal_model.fc = nn.Linear(final_model.fc.in_features, 1)\nfinal_model = final_model.to(DEVICE)\noptimizer = optim.Adam(final_model.fc.parameters(), lr=1e-3)\ncriterion = nn.BCEWithLogitsLoss()\nfinal_model.train()\nfor epoch in range(EPOCHS):\n    for imgs, labels in full_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        loss = criterion(final_model(imgs), labels)\n        loss.backward()\n        optimizer.step()\n# Save final model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(final_model.state_dict(), MODEL_PATH)\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for all .jpg images in image_folder.\n    Returns a DataFrame with columns ['image_name','malignant_prob'].\n    \"\"\"\n    # Load model\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model.to(DEVICE).eval()\n    tf = val_transform\n    results = []\n    for fname in os.listdir(image_folder):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            inp = tf(img).unsqueeze(0).to(DEVICE)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(inp)).item()\n            results.append(\n                {\"image_name\": os.path.splitext(fname)[0], \"malignant_prob\": prob}\n            )\n    return pd.DataFrame(results)\n\n\n# Example of saving predictions if there were a test folder\n# test_folder = os.path.join(DATA_DIR, \"TestImages\")\n# if os.path.isdir(test_folder):\n#     sub = predict(test_folder)\n#     sub.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom torchvision.models import efficientnet_b0, EfficientNet_B0_Weights\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = 1 if row.label == \"malignant\" else 0\n        return img, label\n\n\n# Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# Keep only image_name and label\ndf = df[[\"image_name\", \"label\"]].copy()\n\n# Transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\ndef make_model():\n    weights = EfficientNet_B0_Weights.IMAGENET1K_V1\n    model = efficientnet_b0(weights=weights)\n    # Replace head\n    model.classifier[1] = nn.Linear(model.classifier[1].in_features, 1)\n    return model.to(device)\n\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=5, shuffle=True, mage_path)\n    gray = rgb2gray(img) if img.ndim == 3 else img\n    gray_resized = resize(gray, resize_shape, anti_aliasing=True)\n    feats = hog(\n        gray_resized, pixels_per_cell=(16, 16), cells_per_block=(2, 2), orientations=9\n    )\n    return feats\n\n\ndef predict(input_folder, model):\n    files = [\n        f for f in os.listdir(input_folder) if f.lower().endswith((\".jpg\", \".png\"))\n    ]\n    feats = [extract_hog(os.path.join(input_folder, f)) for f in files]\n    X_new = np.vstack(feats)\n    probs = model.predict_proba(X_new)[:, 1]\n    return pd.DataFrame({\"image_name\": files, \"malignant_probability\": probs})\n\n\ndef main():\n    # Load labels\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"file_path\"] = df[\"image_name\"].apply(\n        lambda x: os.path.join(\"./input/MyImages\", f\"{x}.jpg\")\n    )\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n    # Extract HOG features\n    X = np.vstack([extract_hog(fp) for fp in df[\"file_path\"]])\n    y = df[\"target\"].values\n\n    # 5-fold CV for AUROC\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for train_idx, val_idx in skf.split(X, y):\n        X_tr, X_val = X[train_idx], X[val_idx]\n        y_tr, y_val = y[train_idx], y[val_idx]\n        clf = RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1)\n        clf.fit(X_tr, y_tr)\n        prob = clf.predict_proba(X_val)[:, 1]\n        aucs.append(roc_auc_score(y_val, prob))\n    print(f\"Mean 5-fold AUROC: {np.mean(aucs):.4f}\")\n\n    # Train final model on all data\n    final_clf = RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1)\n    final_clf.fit(X, y)\n\n    # Predict on new images and save submission\n    preds = predict(\"./input/MyImages\", final_clf)\n    os.makedirs(\"./working\", exist_ok=True)\n    preds.to_csv(\"./working/submission.csv\", index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport lightgbm as lgb\n\n\ndef extract_hist(image_path, bins=8):\n    img = Image.open(image_path).convert(\"RGB\")\n    arr = np.array(img)\n    features = []\n    for c in range(3):\n        hist, _ = np.histogram(arr[:, :, c], bins=bins, range=(0, 256), density=True)\n        features.extend(hist)\n    return np.array(features)\n\n\ndef load_data():\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    features = []\n    for img_name in df[\"image_name\"]:\n        path = os.path.join(\"./input/MyImages\", f\"{img_name}.jpg\")\n        features.append(extract_hist(path))\n    X = np.vstack(features)\n    y = df[\"label_bin\"].values\n    return df[\"image_name\"].values, X, y\n\n\nfinal_model = None\n\n\ndef predict(image_folder):\n    image_files = [\n        f for f in os.listdir(image_folder) if f.lower().endswith((\".jpg\", \".png\"))\n    ]\n    image_names = [os.path.splitext(f)[0] for f in image_files]\n    features = []\n    for f in image_files:\n        path = os.path.join(image_folder, f)\n        features.append(extract_hist(path))\n    X_new = np.vstack(features)\n    probs = final_model.predict_proba(X_new)[:, 1]\n    return pd.DataFrame({\"image_name\": image_names, \"malignant_prob\": probs})\n\n\nif __name__ == \"__main__\":\n    image_names, X, y = load_data()\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    scores = []\n    for train_idx, test_idx in skf.split(X, y):\n        model = lgb.LGBMClassifier(random_state=42)\n        model.fit(X[train_idx], y[train_idx])\n        preds = model.predict_proba(X[test_idx])[:, 1]\n        scores.append(roc_auc_score(y[test_idx], preds))\n    print(f\"Mean CV AUROC: {np.mean(scores):.4f}\")\n    final_model = lgb.LGBMClassifier(random_state=42)\n    final_model.fit(X, y)\n    submission = predict(\"./input/MyImages\")\n    submission.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nfrom torchvision import transforms, models\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n# 1. Load metadata and labels\ndf = pd.read_csv(\"input/mydataset.csv\")\ndf[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_paths = (\n    df[\"image_name\"]\n    .apply(lambda n: os.path.join(\"input\", \"MyImages\", f\"{n}.jpg\"))\n    .tolist()\n)\ny = df[\"binary_label\"].values\n\n# 2. Prepare model and transforms\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nbackbone = models.resnet18(pretrained=True)\nfeature_extractor = (\n    torch.nn.Sequential(*list(backbone.children())[:-1]).to(device).eval()\n)\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\ndef extract_features(paths):\n    \"\"\"Extract average of original+horizontal flip deep features.\"\"\"\n    feats = []\n    with torch.no_grad():\n        for p in paths:\n            img = Image.open(p).convert(\"RGB\")\n            x1 = transform(img).unsqueeze(0).to(device)\n            f1 = feature_extractor(x1).cpu().numpy().reshape(-1)\n            img_flipped = img.transpose(Image.FLIP_LEFT_RIGHT)\n            x2 = transform(img_flipped).unsqueeze(0).to(device)\n            f2 = feature_extractor(x2).cpu().numpy().reshape(-1)\n            feats.append((f1 + f2) / 2.0)\n    return np.vstack(feats)\n\n\n# 3. Extract TTA features for all images\nfeatures = extract_features(image_paths)\n\n# 4. 5-fold CV for AUROC\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = [ ]),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\ndef make_model():\n    weights = EfficientNet_B0_Weights.IMAGENET1K_V1\n    model = efficientnet_b0(weights=weights)\n    model.classifier[1] = nn.Linear(model.classifier[1].in_features, 1)\n    return model.to(device)\n\n\ndef predict(image_folder, batch_size=32):\n    \"\"\"\n    Load trained model and predict malignant probability for each image in image_folder.\n    Returns a pandas DataFrame with columns [image_name, malignant_probability].\n    \"\"\"\n    model = make_model()\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model.eval()\n    ds = TestDataset(image_folder, transform=val_transform)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False, num_workers=4)\n    names, probs = [], []\n    with torch.no_grad():\n        for imgs, img_names in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            batch_probs = torch.sigmoid(logits).cpu().numpy().tolist()\n            probs.extend(batch_probs)\n            names.extend(img_names)\n    df_out = pd.DataFrame({\"image_name\": names, \"malignant_probability\": probs})\n    return df_out\n\n\nif __name__ == \"__main__\":\n    # Load and filter dataset to only benign vs malignant\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df = df[df.label.isin([\"benign\", \"malignant\"])][\n        [\"image_name\", \"label\"]\n    ].reset_index(drop=True)\n\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(\n        skf.split(df, (df.label == \"malignant\").astype(int))\n    ):\n        df_train = df.iloc[train_idx]\n        df_val = df.iloc[val_idx]\n        ds_train = SkinLesionDataset(\n            df_train, \"./input/MyImages\", transform=train_transform\n        )\n        ds_val = SkinLesionDataset(df_val, \"./input/MyImages\", transform=val_transform)\n        loader_train = DataLoader(ds_train, batch_size=32, shuffle=True, num_workers=4)\n        loader_val = DataLoader(ds_val, batch_size=32, shuffle=False, num_workers=4)\n\n        model = make_model()\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n        model.train()\n        for epoch in range(2):\n            for x, y in loader_train:\n                x, y = x.to(device), y.float().to(device)\n                optimizer.zero_grad()\n                logits = model(x).squeeze(1)\n                loss = criterion(logits, y)\n                loss.backward()\n                optimizer.step()\n\n        model.eval()\n        preds, truths = [], []\n        with torch.no_grad():\n            for x, y in loader_val:\n                x = x.to(device)\n                logits = model(x).squeeze(1)\n                probs = torch.sigmoid(logits).cpu().numpy()\n                preds.extend(probs.tolist())\n                truths.extend(y.numpy().tolist())\n        auc = roc_auc_score(truths, preds)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        aucs.append(auc)\n\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n    # Retrain on full filtered data\n    ds_full = SkinLesionDataset(df, \"./input/MyImages\", transform=train_transform)\n    loader_full = DataLoader(ds_full, batch_size=32, shuffle=True, num_workers=4)\n    model_full = make_model()\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model_full.parameters(), lr=1e-4)\n    model_full.train()\n    for epoch in range(5):\n        for x, y in loader_full:\n            x, y = x.to(device), y.float().to(device)\n            optimizer.zero_grad()\n            logits = model_full(x).squeeze(1)\n            loss = criterion(logits, y)\n            loss.backward()\n            optimizer.step()\n\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model_full.state_dict(), \ ose(\n    [\n        transforms.Resize((IMG_SIZE, IMG_SIZE)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# Hold-out split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"malignant\"], random_state=42\n)\n\ntrain_ds = LesionDataset(train_df, IMG_DIR, transform=train_transform)\nval_ds = LesionDataset(val_df, IMG_DIR, transform=val_transform)\ntrain_loader = DataLoader(train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# Model\nmodel = models.resnet18(pretrained=True)\nfor param in model.parameters():\n    param.requires_grad = False\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(DEVICE)\n\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = optim.Adam(model.fc.parameters(), lr=1e-3)\n\n# Train\nmodel.train()\nfor epoch in range(EPOCHS):\n    total_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item()\n    print(f\"Epoch {epoch+1}/{EPOCHS}, Loss: {total_loss/len(train_loader):.4f}\")\n\n# Validate\nmodel.eval()\nall_preds, all_targets = [], []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(DEVICE)\n        logits = model(imgs)\n        probs = torch.sigmoid(logits).cpu().numpy().ravel()\n        all_preds.extend(probs)\n        all_targets.extend(labels.numpy())\nauc = roc_auc_score(all_targets, all_preds)\nprint(f\"Validation AUROC: {auc:.4f}\")\n\n# Save final model\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for all .jpg images in image_folder.\n let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
