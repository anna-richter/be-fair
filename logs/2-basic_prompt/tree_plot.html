let treeStructData = {"edges": [[0, 8], [1, 5], [2, 15], [3, 17], [4, 6], [6, 7], [8, 9], [9, 10], [9, 11], [9, 12], [12, 13], [12, 14], [14, 16], [15, 19], [17, 18]], "layout": [[0.2, 0.0], [0.4, 0.0], [0.6, 0.0], [0.8, 0.0], [1.0, 0.0], [0.4, 0.19999999999999996], [1.0, 0.19999999999999996], [1.0, 0.4], [0.2, 0.19999999999999996], [0.2, 0.4], [0.0, 0.6], [0.2, 0.6], [0.4, 0.6], [0.3, 0.8], [0.5, 0.8], [0.6, 0.19999999999999996], [0.5, 1.0], [0.8, 0.19999999999999996], [0.8, 0.4], [0.6, 0.4]], "plan": ["I propose fine-tuning a pretrained ResNet18 model for binary classification of\nmalignant vs. non-malignant (combining benign and non-neoplastic). We perform\n5-fold stratified cross-validation on the dataset, computing AUROC on each\nfold's validation set and reporting the mean and standard deviation. Images are\nloaded via a custom PyTorch Dataset with standard 224\u00d7224 resizing and ImageNet\nnormalization. A predict() function is provided to generate malignancy\nprobabilities for new image paths given a trained model.", "We use a pretrained ResNet50 to extract 2048-dim image embeddings, then train an\nXGBoost classifier on these embeddings to predict malignancy (label==\u201cmalignant\u201d\nvs others). We evaluate using stratified 5-fold cross-validation and report mean\nAUROC. Finally we retrain on the full dataset and expose a predict() function to\ncompute malignancy probabilities on new image folders.", "I propose a two-step approach: first extract deep features from images using a\npretrained ResNet18, then train a LightGBM binary classifier on these features\nto predict malignant vs non-malignant. We map \"malignant\" labels to 1 and all\nother categories to 0. We perform stratified 5-fold cross-validation using ROC\nAUC as the evaluation metric and report the mean score. Finally we retrain on\nthe full dataset and expose a `predict()` function that can take new image file\npaths and return malignancy probabilities.", "I propose fine-tuning a pretrained ResNet18 on our binary task of malignant vs.\nnon-malignant lesions using a simple 80/20 split for training and validation.\nImages are resized to 224\u00d7224 with basic augmentation (random horizontal flips)\nand normalized. We train for a few epochs with binary cross-entropy loss, then\ncompute AUROC on the validation set. A `predict()` function is provided for\ninference on new image paths.", "We load the CSV and map each image name to its file path, encoding malignant as\n1 and other labels as 0. A custom PyTorch Dataset applies standard ImageNet\ntransforms, and we use 5-fold stratified CV to fine-tune a pretrained ResNet18\nfor 3 epochs per fold, computing AUROC on each validation split. We then average\nthe fold AUROCs, retrain on the full dataset, save the final model, and provide\na `predict()` function to generate malignancy probabilities for new image\nfolders.", "We can work around the missing xgboost dependency by switching to sklearn\u2019s\nRandomForestClassifier for our tabular model on top of the ResNet50 features.\nWe\u2019ll extract features as before, then perform a 5-fold stratified CV with\nRandomForest, reporting per-fold and mean AUROC. Finally, we retrain on all data\nand generate test predictions saved to `./working/submission.csv`. The\n`predict()` function stays as before, now using RandomForest proba outputs.", "We can address the long training time by using a much lighter model and freezing\nits pretrained backbone, training only the final classifier for a few epochs on\na single held-out validation split. We also skip any zero\u2010byte (corrupt) images\nwhen building our map. This reduces the number of parameters being updated and\nthe number of epochs, so training finishes quickly yet still provides a\nrealistic AUROC on held-out data. The same script includes a reusable\n`predict()` function for new image folders.", "We propose incorporating data augmentation into the training pipeline by using\nRandomResizedCrop, horizontal flips, and color jitter to improve generalization\nand reduce overfitting when only training the classifier head for a few epochs.\nThe validation pipeline remains deterministic with Resize and CenterCrop. We\nkeep the MobileNetV2 backbone frozen and train only the final classifier as\nbefore, printing out the validation AUROC to measure the impact of augmentation.\nThe predict() function is unchanged aside from using the validation transform.", "I will extract fixed CNN features once using a pretrained ResNet18 backbone,\nthen train a lightweight logistic regression on these features with 5-fold\nstratified CV to compute AUROC quickly even on CPU. A reusable `predict()`\nfunction will extract features for new images and average predictions from each\nfold\u2019s logistic model. This avoids costly CNN backprop in each CV fold and\nensures fast inference and evaluation.", "To fix the broadcasting error, we need to pool the convolutional feature maps\ninto a 1D vector of length `backbone.num_features` before flattening, instead of\ndirectly flattening the 4D tensor. We apply the model\u2019s `global_pool` to the\noutput of `forward_features` and then flatten, both in the main feature\nextraction loop and in the `predict` function. We also ensure\n`backbone.feature_dim` is set to `backbone.num_features`. Below is the corrected\nscript.", "I propose to standardize the extracted CNN features before training the logistic\nregression classifiers, as scaling often improves convergence and predictive\nperformance. We will wrap the StandardScaler and LogisticRegression in an\nsklearn Pipeline for each fold, fitting the scaler only on the training split\nand applying it to the validation split. The predict function can remain\nunchanged since each pipeline will handle scaling internally. This atomic change\nshould yield improved AUROC without altering the overall workflow.", "We standardize the extracted CNN features before fitting the logistic regression\nby wrapping a StandardScaler and LogisticRegression into an sklearn Pipeline.\nThis ensures that scaling is done per fold correctly without leaking\ninformation. We retain the 5-fold stratified CV, print each fold\u2019s AUROC and the\nmean\u00b1std, then retrain on all data and output a submission.csv in ./working. The\npredict() function remains compatible with the pipeline since it uses\npredict_proba.", "I propose replacing the linear logistic regression classifiers with a small\nmulti\u2010layer perceptron (MLP) wrapped in an sklearn Pipeline together with\nStandardScaler to capture non\u2010linear interactions in the ResNet features. We\nwill use a single hidden layer of 128 neurons, ReLU activation, Adam optimizer,\nand early stopping to prevent overfitting. We\u2019ll perform 5\u2010fold stratified CV,\nprinting each fold\u2019s AUROC and the mean\u00b1std, then retrain on all data and\ngenerate a submission.csv. The existing `predict()` function remains compatible\nsince MLPClassifier supports `predict_proba`.", "We replace the ResNet18 backbone with a stronger ResNet50 to extract more\ndiscriminative features before training the MLP classifier. This atomic change\nleverages ResNet50\u2019s richer pretrained representations and should boost\nvalidation AUROC. All other settings, including data transforms, 5-fold CV, and\nthe MLP head, remain unchanged to isolate the backbone improvement.", "I propose replacing the ResNet18 feature extractor with an EfficientNet-B0\nbackbone from timm to leverage its richer pretrained features, while keeping the\ndownstream MLP pipeline and 5-fold CV unchanged. This stronger backbone often\nyields more discriminative embeddings and should boost the AUROC without\naltering the overall workflow.", "I removed the unsupported early_stopping_rounds parameter and instead train with\na fixed number of boosting rounds for both cross\u2010validation and final fitting.\nThe script still uses a ResNet18 backbone for 512\u2010dim feature extraction, and\ncomputes 5\u2010fold CV AUC before retraining on all data. A `predict()` function\napplies the same transforms and feature extractor to new images and returns\nmalignancy probabilities.", "We propose to leverage test-time augmentation (TTA) by extracting features for\nboth the original and a horizontally-flipped version of each image, and\naveraging their predicted probabilities to improve robustness. We will extract\ntwo feature matrices (original and flipped), train our MLP pipelines on the\noriginal features only, and evaluate/submit by averaging the fold models\u2019\npredictions on both sets. This atomic change should boost AUROC without altering\nthe core workflow.", "I will speed up training by freezing the ResNet18 backbone so only the final\nclassifier layer is trained, switch to BCEWithLogitsLoss (removing the Sigmoid)\nfor stability, and add early stopping on validation AUROC with a patience of 2\nepochs to avoid unnecessary training. This reduces compute and ensures we stop\nonce performance plateaus. The predict() function is preserved and documented,\nand we print the best validation AUROC at the end.", "I fixed the data loading and label preprocessing by first filtering out the\n\u201cnon-neoplastic\u201d cases so that only \u201cbenign\u201d (0) and \u201cmalignant\u201d (1) lesions\nremain.  I also made the image loader robust to irregular file extensions by\nglobbing for any file starting with the image ID.  The rest of the training\nloop, early stopping, and prediction logic remains the same, and we print out\nthe best validation AUROC at the end.", "We need to remove the unsupported verbose_eval argument from our LightGBM train\ncalls and instead use the verbosity parameter or a callback to suppress output.\nBy deleting verbose_eval=False and adding\ncallbacks=[lgb.log_evaluation(period=0)], we align with the installed version of\nLightGBM. The rest of the pipeline\u2014feature extraction with a pretrained\nResNet18, 5\u2010fold cross\u2010validation to compute mean ROC AUC, retraining on the\nfull dataset, and a predict() function\u2014remains unchanged."], "code": ["import os\nimport glob\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        base = row.image_name\n        # find file matching image_name.*\n        matches = glob.glob(os.path.join(self.img_dir, base + \".*\"))\n        if not matches:\n            raise FileNotFoundError(f\"No file for {base}\")\n        img_path = matches[0]\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = row.label_bin\n        return img, label\n\n\ndef predict(image_paths, model, device=\"cpu\", transform=None):\n    \"\"\"\n    Predict malignancy probabilities for a list of image file paths.\n    Args:\n        image_paths (List[str]): paths to image files.\n        model (torch.nn.Module): trained binary classification model.\n        device (str): 'cpu' or 'cuda'.\n        transform (callable): preprocessing transforms.\n    Returns:\n        np.ndarray: array of probabilities for the malignant class.\n    \"\"\"\n    model.eval()\n    probs = []\n    loader = DataLoader(image_paths, batch_size=32, shuffle=False)\n    for batch in loader:\n        imgs = []\n        for path in batch:\n            img = Image.open(path).convert(\"RGB\")\n            if transform:\n                img = transform(img)\n            imgs.append(img)\n        imgs = torch.stack(imgs).to(device)\n        with torch.no_grad():\n            out = model(imgs)\n            prob = torch.sigmoid(out).squeeze().cpu().numpy()\n            probs.extend(prob.tolist())\n    return np.array(probs)\n\n\ndef main():\n    # Settings\n    IMG_DIR = \"./input/MyImages\"\n    CSV_PATH = \"./input/mydataset.csv\"\n    N_SPLITS = 5\n    BATCH_SIZE = 32\n    EPOCHS = 3\n    DEVICE = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    # Data\n    df = pd.read_csv(CSV_PATH)\n    # binary label: malignant=1, else=0\n    df[\"label_bin\"] = (df.label == \"malignant\").astype(int)\n    skf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\n    # transforms\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    scores = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label_bin)):\n        print(f\"Fold {fold+1}/{N_SPLITS}\")\n        train_df = df.loc[train_idx]\n        val_df = df.loc[val_idx]\n        train_ds = SkinLesionDataset(train_df, IMG_DIR, transform=transform)\n        val_ds = SkinLesionDataset(val_df, IMG_DIR, transform=transform)\n        train_loader = DataLoader(\n            train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n        )\n        val_loader = DataLoader(\n            val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4\n        )\n        # model\n        model = timm.create_model(\"resnet18\", pretrained=True, num_classes=1)\n        model = model.to(DEVICE)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # training\n        for epoch in range(EPOCHS):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(DEVICE), labels.float().to(DEVICE)\n                preds = model(imgs).squeeze()\n                loss = criterion(preds, labels)\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n        # validation\n        model.eval()\n        ys, yps = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(DEVICE)\n                logits = model(imgs).squeeze().cpu().numpy()\n                prob = 1 / (1 + np.exp(-logits))\n                yps.extend(prob.tolist())\n                ys.extend(labels.numpy().tolist())\n        auc = roc_auc_score(ys, yps)\n        print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n        scores.append(auc)\n    print(f\"Mean AUROC: {np.mean(scores):.4f} \u00b1 {np.std(scores):.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom tqdm import tqdm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom xgboost import XGBClassifier\nimport torch\nimport torch.nn as nn\nfrom torchvision import models, transforms\nfrom torch.utils.data import Dataset, DataLoader\n\n\n# Dataset for extracting features\nclass ImageFolderDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        return self.transform(img), idx\n\n\n# Feature extractor: pretrained ResNet50 without final layer\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nresnet = models.resnet50(pretrained=True)\nmodules = list(resnet.children())[:-1]  # remove fc\nfeature_extractor = nn.Sequential(*modules).to(device)\nfeature_extractor.eval()\n\n# Transforms\ntfm = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\ndef extract_features(df, img_dir, batch_size=32):\n    ds = ImageFolderDataset(df, img_dir, tfm)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False, num_workers=4)\n    feats = np.zeros((len(df), 2048), dtype=np.float32)\n    with torch.no_grad():\n        for imgs, idxs in tqdm(loader, desc=\"Extracting features\"):\n            imgs = imgs.to(device)\n            out = feature_extractor(imgs).reshape(imgs.size(0), -1).cpu().numpy()\n            feats[idxs.numpy()] = out\n    return feats\n\n\ndef predict(model, feature_extractor, img_dir, batch_size=32):\n    # Predict malignancy probabilities for all .jpg in img_dir\n    img_names = [f for f in os.listdir(img_dir) if f.lower().endswith(\".jpg\")]\n    df = pd.DataFrame({\"image_name\": [os.path.splitext(f)[0] for f in img_names]})\n    feats = extract_features(df, img_dir, batch_size)\n    probs = model.predict_proba(feats)[:, 1]\n    return pd.DataFrame({\"image_name\": df[\"image_name\"], \"malignant_prob\": probs})\n\n\ndef main():\n    # Load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # Binary labels: malignant=1, others=0\n    df[\"y\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Extract features\n    X = extract_features(df, \"./input/MyImages\")\n    y = df[\"y\"].values\n\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for tr_idx, val_idx in skf.split(X, y):\n        X_tr, X_val = X[tr_idx], X[val_idx]\n        y_tr, y_val = y[tr_idx], y[val_idx]\n        clf = XGBClassifier(use_label_encoder=False, eval_metric=\"logloss\")\n        clf.fit(X_tr, y_tr)\n        preds = clf.predict_proba(X_val)[:, 1]\n        auc = roc_auc_score(y_val, preds)\n        aucs.append(auc)\n        print(f\"Fold AUROC: {auc:.4f}\")\n    print(f\"Mean AUROC: {np.mean(aucs):.4f}\")\n\n    # Retrain on full data\n    final_clf = XGBClassifier(use_label_encoder=False, eval_metric=\"logloss\")\n    final_clf.fit(X, y)\n\n    # Example usage of predict()\n    # new_preds = predict(final_clf, feature_extractor, './input/MyImages')\n    # new_preds.to_csv('./working/submission.csv', index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\nimport lightgbm as lgb\n\n# Configuration\nDATA_DIR = \"./input\"\nIMG_DIR = os.path.join(DATA_DIR, \"MyImages\")\nCSV_PATH = os.path.join(DATA_DIR, \"mydataset.csv\")\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nNUM_WORKERS = 4\nSEED = 42\n\n# Set seed\nnp.random.seed(SEED)\ntorch.manual_seed(SEED)\n\n# Load labels\ndf = pd.read_csv(CSV_PATH)\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_names = df[\"image_name\"].values\ntargets = df[\"target\"].values\n\n# Image transforms\ntransform = transforms.Compose(\n    [\n        transforms.Resize(224),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\n# Dataset for feature extraction\nclass ImageDataset(Dataset):\n    def __init__(self, names, transform):\n        self.names = names\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.names)\n\n    def __getitem__(self, idx):\n        img_path = os.path.join(IMG_DIR, self.names[idx] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        return self.transform(img), idx\n\n\n# Build feature extractor\nbase_model = models.resnet18(pretrained=True)\nmodules = list(base_model.children())[:-1]\nfeature_extractor = nn.Sequential(*modules).to(DEVICE)\nfeature_extractor.eval()\n\n# Extract features\ndataset = ImageDataset(image_names, transform)\nloader = DataLoader(\n    dataset, batch_size=BATCH_SIZE, num_workers=NUM_WORKERS, shuffle=False\n)\nfeatures = np.zeros((len(dataset), 512), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(DEVICE)\n        feats = feature_extractor(imgs)\n        feats = feats.view(feats.size(0), -1).cpu().numpy()\n        features[idxs.numpy(), :] = feats\n\n# 5-fold CV with LightGBM\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)\naucs = []\nfor train_idx, val_idx in skf.split(features, targets):\n    train_data = lgb.Dataset(features[train_idx], label=targets[train_idx])\n    val_data = lgb.Dataset(\n        features[val_idx], label=targets[val_idx], reference=train_data\n    )\n    params = {\"objective\": \"binary\", \"verbosity\": -1, \"seed\": SEED}\n    model = lgb.train(\n        params,\n        train_data,\n        num_boost_round=100,\n        valid_sets=[val_data],\n        early_stopping_rounds=10,\n        verbose_eval=False,\n    )\n    preds = model.predict(features[val_idx])\n    aucs.append(roc_auc_score(targets[val_idx], preds))\nmean_auc = np.mean(aucs)\nprint(f\"Mean ROC AUC (5-fold CV): {mean_auc:.4f}\")\n\n# Retrain on full data\nfull_data = lgb.Dataset(features, label=targets)\nfinal_model = lgb.train(params, full_data, num_boost_round=100)\n\n\ndef predict(image_paths):\n    \"\"\"\n    Predict malignancy probability for new images.\n    Args:\n      image_paths (list of str): paths to image files.\n    Returns:\n      numpy.ndarray: probabilities of malignancy.\n    \"\"\"\n    imgs = []\n    for p in image_paths:\n        img = Image.open(p).convert(\"RGB\")\n        imgs.append(transform(img))\n    batch = torch.stack(imgs).to(DEVICE)\n    with torch.no_grad():\n        feats = feature_extractor(batch).view(len(imgs), -1).cpu().numpy()\n    return final_model.predict(feats)\n\n\n# Example usage:\n# probs = predict([os.path.join(IMG_DIR, n + \".jpg\") for n in image_names[:5]])\n# print(probs)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import train_test_split\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = 1 if row.label == \"malignant\" else 0\n        return image, torch.tensor(label, dtype=torch.float32)\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(device), labels.to(device)\n        preds = model(imgs).squeeze(1)\n        loss = criterion(preds, labels)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(device)\n            preds = model(imgs).squeeze(1).cpu().numpy()\n            all_preds.extend(preds.tolist())\n            a nge(3):\n            train_model(model, train_loader, criterion, optimizer, device)\n        auc = eval_model(model, val_loader, device)\n        aucs.append(auc)\n\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n\n    # Retrain on full data\n    full_ds = SkinLesionDataset(df, img_map, transform)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=2)\n    final_model = models.resnet18(pretrained=True)\n    final_model.fc = nn.Linear(final_model.fc.in_features, 1)\n    final_model = final_model.to(device)\n    optimizer = torch.optim.Adam(final_model.parameters(), lr=1e-4)\n    for epoch in range(3):\n        train_model(final_model, full_loader, criterion, optimizer, device)\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(final_model.state_dict(), \"working/model.pth\")\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for each image in a folder.\n    Returns a DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    img_map = build_image_map(image_folder)\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n\n    results = []\n    with torch.no_grad():\n        for name, path in img_map.items():\n            img = Image.open(path).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            prob = torch.sigmoid(model(x)).item()\n            results.append({\"image_name\": name, \"probability\": prob})\n    return pd.DataFrame(results)", let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
