let treeStructData = {"edges": [[1, 9], [2, 5], [4, 8], [4, 7], [4, 6], [4, 12], [4, 14], [4, 11], [8, 13], [9, 10]], "layout": [[0.0, 0.0], [0.125, 0.0], [0.25, 0.0], [0.375, 0.0], [0.6875, 0.0], [0.25, 0.5], [0.375, 0.5], [0.5, 0.5], [0.625, 0.5], [0.125, 0.5], [0.125, 1.0], [0.75, 0.5], [0.875, 0.5], [0.625, 1.0], [1.0, 0.5]], "plan": ["We fine-tune a pretrained ResNet18 on the binary task of malignant versus\nnon\u2010malignant lesions by mapping \u201cmalignant\u201d to 1 and all other labels to 0 and\nusing a stratified 80/20 train/validation split. Input images are resized to\n224\u00d7224, normalized with ImageNet stats, and trained for 5 epochs using Adam and\nBCEWithLogitsLoss. After training, we compute the AUROC on the validation set to\nassess performance. A reusable predict() function is provided to output\nmalignant probabilities for new images, and if a `./input/test` folder is\ndetected, we save a `submission.csv` in `./working`.", "We will fine-tune a pretrained ResNet18 to perform binary classification of\n\u201cmalignant\u201d vs \u201cnon\u2010malignant\u201d (benign plus non\u2010neoplastic) skin lesions.  We\nconvert labels accordingly, apply standard train/val augmentations, and estimate\nperformance via 5\u2010fold stratified cross\u2010validation using ROC AUC.  After\nreporting mean AUC, we retrain on the full dataset and provide a predict()\nfunction to score new images; we then save predictions on all input images to\nworking/submission.csv.", "We will fine-tune a pretrained EfficientNet-B0 model using PyTorch and timm for\nbinary classification (malignant vs non-malignant). After reading the CSV and\nmapping labels, we split the data stratified into training and validation sets.\nWe apply standard data augmentations and normalization, train for a few epochs,\nand compute the AUROC on the validation set. A reusable `predict()` function is\nprovided to load new images and return malignancy probabilities.", "We use a pretrained ResNet50 fine\u2010tuned to distinguish malignant vs\nnon\u2010malignant lesions on the provided images. We map \u201cmalignant\u201d to 1 and all\nother labels to 0, apply standard ImageNet normalization and resize, and run\n5\u2010fold stratified cross\u2010validation, training for a few epochs per fold and\ncomputing AUROC on each held\u2010out split. We define a reusable predict() function\nthat loads new images from a folder and returns malignancy probabilities.\nFinally we print the mean cross\u2010validated AUROC.", "We binarize labels into malignant vs non-malignant and fine\u2010tune a pretrained\nResNet18, resizing images to 128\u00d7128. We split the data 80/20 stratified by\nlabel, train for 3 epochs on the training split, and compute ROC AUC on the\nhold\u2010out validation set. A predict() function is provided to load the saved\nmodel and return malignant probabilities for new images in a folder. Below is\nthe full implementation.", "I fixed the image\u2010loading bug by building an explicit mapping from each base\nimage_name to its true .jpg file in the directory, filtering out hidden or\nzero\u2010byte files. I then only keep rows whose image_name actually exist in that\nmap and use the map in the Dataset instead of a glob with wildcards. This\nguarantees PIL never tries to open the zero\u2010byte hidden files. The rest of the\ntraining and validation (with sigmoid + AUROC) is unchanged, and the script\nprints the final AUROC.", "I propose adding data augmentation to the training pipeline\u2014specifically random\nflips, rotations, and color jitter\u2014while keeping the validation pipeline\nunchanged. This should improve the model\u2019s robustness and generalization,\npotentially boosting the ROC AUC. Below is the updated training script with\nthese augmentations.", "We observe class imbalance in malignant vs. benign samples, which can bias the\nmodel toward the majority class and hurt discriminative performance. To address\nthis, we introduce a WeightedRandomSampler in the training DataLoader that\nsamples each class inversely proportional to its frequency. This ensures each\nbatch is class-balanced during training without altering the validation\npipeline. All other hyperparameters and settings remain the same to isolate the\neffect of class balancing.", "I propose increasing the input image resolution from 128\u00d7128 to 224\u00d7224 to\nbetter leverage the pretrained ResNet18 features, and extending training from 3\nto 5 epochs to allow fuller convergence. This single change should improve\nfeature learning and boost the validation ROC AUC.", "We reduce computational cost by replacing 5-fold CV with a single stratified\n80/20 hold-out split, freezing the pretrained ResNet18 backbone so only the\nfinal layer is trained, and cutting epochs to speed up training. After\nevaluating the AUROC on the hold-out set, we retrain the head on the full\ndataset for one epoch, then implement a streamlined `predict()` function to\ngenerate probabilities for all images in a given directory and save\n`submission.csv`.", "I fixed the bug by correctly freezing and unfreezing the model parameters:\ninstead of setting `model.fc.requires_grad`, I explicitly set\n`requires_grad=False` for all backbone parameters and `requires_grad=True` for\neach parameter in the `fc` layer before both fine-tuning on the head and the\nfinal full-data pass. The optimizer is re-initialized after unfreezing so that\nit sees the correct parameters. The rest of the training, evaluation, and\nprediction pipeline remains the same, and the script prints the hold-out AUC and\nsaves `submission.csv`.", "I propose adding horizontal flip test-time augmentation (TTA) during validation\nand test prediction to improve robustness and boost ROC AUC. Specifically, for\neach image, we compute predictions on the original and horizontally flipped\nversions, average the predicted malignant probabilities, and use these averaged\nprobabilities for evaluation and submission. This change is atomic and only\naffects the evaluation/prediction stage, leaving training unchanged. We expect\nTTA to reduce variance and improve discriminative performance.", "I propose switching from a single train/validation split to stratified 5-fold\ncross-validation and ensembling the resulting models at inference time. For each\nfold we train a ResNet18 for three epochs using the same augmentations and\nhyperparameters, compute the fold\u2019s ROC AUC on its hold-out set, and save the\nmodel. Finally we average the per\u2010fold validation AUCs to get a more robust\nestimate and ensemble the five models\u2019 predictions (averaged probabilities) on\nnew images to generate `submission.csv`. A `predict()` function is provided to\nload multiple model checkpoints and return averaged malignant probabilities for\nany image folder.", "I will freeze all convolutional layers of the pretrained ResNet18 and only\nfinetune the final fully-connected layer to drastically reduce training time,\nreduce the number of epochs to 3, and increase the batch size. I\u2019ll ensure we\nuse GPU if available, evaluate on a hold-out split, print the ROC AUC, implement\na reusable `predict()` function, and save test predictions to\n`./working/submission.csv`.", "I propose increasing the input image resolution from 128\u00d7128 to 224\u00d7224 to\nbetter match the pretrained ResNet18\u2019s original training distribution and\ncapture more lesion detail, which can improve feature extraction and boost ROC\nAUC. We keep all other hyperparameters and the training pipeline unchanged to\nisolate the effect of higher resolution. We adjust the batch size to 16 to fit\nthe larger images in memory. Below is the updated script:"], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom typing import List\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df: pd.DataFrame, img_dir: str, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = row[\"binary_label\"]\n        return image, label\n\n\ndef predict(\n    image_paths: List[str], model: nn.Module, device: torch.device, transform\n) -> np.ndarray:\n    \"\"\"\n    Predict malignant probabilities for a list of image file paths.\n    Returns an array of probabilities between 0 and 1.\n    \"\"\"\n    model.eval()\n    probs = []\n    with torch.no_grad():\n        for img_path in image_paths:\n            img = Image.open(img_path).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(device)\n            logit = model(inp)\n            prob = torch.sigmoid(logit).item()\n            probs.append(prob)\n    return np.array(probs)\n\n\nif __name__ == \"__main__\":\n    # Load and prepare data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"binary_label\"], random_state=42\n    )\n\n    # Transforms\n    normalize = transforms.Normalize(\n        mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]\n    )\n    transform_train = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            normalize,\n        ]\n    )\n    transform_val = transforms.Compose(\n        [transforms.Resize((224, 224)), transforms.ToTensor(), normalize]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, \"./input/MyImages\", transform_train)\n    val_ds = SkinDataset(val_df, \"./input/MyImages\", transform_val)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs = imgs.to(device)\n            labels = labels.float().unsqueeze(1).to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        epoch_loss = running_loss / len(train_loader.dataset)\n        print(f\"Epoch {epoch+1}/{epochs}, Loss: {epoch_loss:.4f}\")\n\n    # Validation and AUROC\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy().flatten())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Optional test prediction and submission\n    test_dir = \"./input/test\"\n    if os.path.exists(test_dir):\n        test_images = sorted(\n            [\n                os.path.join(test_dir, f)\n                for f in os.listdir(test_dir)\n                if f.lower().endswith((\".jpg\", \".jpeg\", \".png\"))\n            ]\n        )\n        test_probs = predict(test_images, model, device, transform_val)\n        submission = pd.DataFrame(\n            {\n                \"image_name\": [os.path.basename(p) for p in test_images],\n                \"malignant_probability\": test_probs,\n            }\n        )\n        submission.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\nfrom tqdm import tqdm\nimport random\n\n# Fix seeds\nseed = 42\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\ntorch.cuda.manual_seed_all(seed)\n\n# Paths\nCSV_PATH = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nSUBMISSION_PATH = \"./working/submission.csv\"\n\n# Load and prepare data\ndf = pd.read_csv(CSV_PATH)\ndf[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n# Transforms\ntrain_tfms = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tfms = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, idxs, transform):\n        self.df = df.iloc[idxs].reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, i):\n        row = self.df.loc[i]\n        img_path = os.path.join(IMG_DIR, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(img)\n        y = torch.tensor(row.binary_label, dtype=torch.float32)\n        return x, y\n\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=seed)\naucs = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"binary_label\"])):\n    # DataLoaders\n    train_ds = SkinDataset(df, train_idx, train_tfms)\n    val_ds = SkinDataset(df, val_idx, val_tfms)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    opt = torch.optim.Adam(model.parameters(), lr=1e-4)\n    criterion = nn.BCEWithLogitsLoss()\n    # Training\n    for epoch in range(3):\n        model.train()\n        for xb, yb in train_loader:\n            xb, yb = xb.to(device), yb.to(device)\n            logits = model(xb).squeeze(1)\n            loss = criterion(logits, yb)\n            opt.zero_grad()\n            loss.backward()\n            opt.step()\n    # Validation\n    model.eval()\n    all_probs, all_targets = [], []\n    with torch.no_grad():\n        for xb, yb in val_loader:\n            xb = xb.to(device)\n            logits = model(xb).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs)\n            all_targets.extend(yb.numpy())\n    auc = roc_auc_score(all_targets, all_probs)\n    print(f\"Fold {fold} AUC: {auc:.4f}\")\n    aucs.append(auc)\n\nprint(f\"Mean 5-fold AUC: {np.mean(aucs):.4f}\")\n\n# Retrain on full data\nfull_ds = SkinDataset(df, df.index, train_tfms)\nfull_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(device)\nopt = torch.optim.Adam(model.parameters(), lr=1e-4)\ncriterion = nn.BCEWithLogitsLoss()\nfor epoch in range(3):\n    model.train()\n    for xb, yb in full_loader:\n        xb, yb = xb.to(device), yb.to(device)\n        loss = criterion(model(xb).squeeze(1), yb)\n        opt.zero_grad()\n        loss.backward()\n        opt.step()\n\n\ndef predict(image_dir):\n    \"\"\"\n    Predict malignant probability for all images in image_dir.\n    Returns a DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    model.eval()\n    files = [f for f in os.listdir(image_dir) if f.lower().endswith(\".jpg\")]\n    results = []\n    loader = DataLoader(files, batch_size=32, shuffle=False)\n    for batch in loader:\n        imgs = []\n        for fname in batch:\n            img = Image.open(os.path.join(image_dir, fname)).convert(\"RGB\")\n            imgs.append(val_tfms(img))\n        xb = torch.stack(imgs).to(device)\n        with torch.no_grad():\n            probs = torch.sigmoid(model(xb).squeeze(1)).cpu().numpy()\n        for fname, p in zip(batch, probs):\n            results.append(\n                {\"image_name\": fname.replace(\".jpg\", \"\"), \"probability\": float(p)}\n            )\n    return pd.DataFrame(results)\n\n\n# Save submission\nsub = predict(IMG_DIR)\nos.makedirs(os.path.dirname(SUBMISSION_PATH), exist_ok=True)\nsub.to_csv(SUBMISSION_PATH, index=False)\nprint(f\"Saved submission to {SUBMISSION_PATH}\")", "import os\nimport glob\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nfrom PIL import Image\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset definition\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transforms):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transforms = transforms\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        name = row[\"image_name\"]\n        # find file matching name\n        files = glob.glob(os.path.join(self.img_dir, name + \"*\"))\n        if not files:\n            raise FileNotFoundError(f\"No file for {name}\")\n        img = Image.open(files[0]).convert(\"RGB\")\n        img = self.transforms(img)\n        label = torch.tensor(row[\"malignant\"], dtype=torch.float32)\n        return img, label\n\n\n# Prediction function\ndef predict(image_paths, model, device):\n    \"\"\"\n    image_paths: list of image file paths\n    model: trained PyTorch model\n    device: torch device\n    Returns: list of malignancy probabilities\n    \"\"\"\n    model.eval()\n    tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    probs = []\n    with torch.no_grad():\n        for path in image_paths:\n            img = Image.open(path).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(device)\n            p = torch.sigmoid(model(x)).item()\n            probs.append(p)\n    return probs\n\n\ndef main():\n    # Paths\n    csv_path = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    # Load and prepare data\n    df = pd.read_csv(csv_path)\n    # binary label: malignant=1, else=0\n    df[\"malignant\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"malignant\"], random_state=42\n    )\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, img_dir, train_tf)\n    val_ds = SkinDataset(val_df, img_dir, val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n        device\n    )\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    # Training\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch+1}/{epochs}, Train Loss: {running_loss/len(train_ds):.4f}\")\n    # Validation\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1).cpu().numpy()\n            probs = 1 / (1 + np.exp(-logits))\n            all_preds.extend(probs)\n            all_labels.extend(labels.numpy())\n    auc = roc_auc_score(all_labels, all_preds)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as n let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
