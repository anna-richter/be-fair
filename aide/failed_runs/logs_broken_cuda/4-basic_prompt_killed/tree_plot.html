let treeStructData = {"edges": [[0, 7], [1, 8], [2, 10], [3, 5], [4, 6], [7, 11], [8, 9], [10, 12], [12, 15], [12, 14], [12, 13]], "layout": [[0.0, 0.0], [0.25, 0.0], [0.5, 0.0], [0.75, 0.0], [1.0, 0.0], [0.75, 0.33333333333333337], [1.0, 0.33333333333333337], [0.0, 0.33333333333333337], [0.25, 0.33333333333333337], [0.25, 0.6666666666666667], [0.5, 0.33333333333333337], [0.0, 0.6666666666666667], [0.5, 0.6666666666666667], [0.25, 1.0], [0.5, 1.0], [0.75, 1.0]], "plan": ["We fine-tune a pre-trained ResNet18 model to classify malignant vs benign\nlesions by mapping malignant labels to 1 and benign/non-neoplastic to 0. We\nsplit the dataset into stratified train and validation sets (80/20), apply\nstandard image transforms, and train with BCEWithLogitsLoss and Adam optimizer\nfor 5 epochs. After training, we evaluate model performance by computing the\narea under the ROC curve on the validation set. A reusable predict() function is\nprovided to generate probability predictions for new images.", "We fine-tune a pretrained ResNet50 from the timm library for binary\nclassification (malignant vs non-malignant) using simple augmentations and a\nsigmoid output with BCEWithLogitsLoss. We perform 5-fold stratified cross-\nvalidation to estimate AUROC on held-out validation folds. After cross-\nvalidation we train the model on the full dataset and save its weights, and\nprovide a predict() function that loads the saved model to output malignancy\nprobabilities for new image folders.", "We train a binary classifier by fine-tuning only the final layer of a pretrained\nResNet-18 to distinguish malignant lesions from benign and non-neoplastic cases.\nImages are resized to 224\u00d7224 and augmented with horizontal flips, and we use\nstandard ImageNet normalization. We perform 5-fold stratified cross-validation\non the malignant vs. non-malignant labels and report the AUC-ROC for each fold\nand their mean. A reusable predict() function is provided to compute malignancy\nprobabilities on new images.", "We fine-tune a pretrained ResNet18 for binary classification, mapping\n\u201cmalignant\u201d to 1 and others to 0. We perform 5\u2010fold stratified cross\u2010validation,\ntraining for a few epochs each fold and computing AUROC on each validation set.\nWe average the fold AUROCs and print the mean. We save the last fold model and\nprovide a predict(image_folder) function that returns malignant probabilities\nfor new images.", "I propose fine-tuning a pretrained ResNet50 model to predict malignant vs. non-\nmalignant on the provided images. We map \u201cmalignant\u201d to 1 and all other labels\nto 0, use an 80/20 stratified split, and train for a few epochs with standard\naugmentations. We evaluate on the hold-out set using AUROC, and provide a\n`predict()` function to score new images.", "I replaced the expensive 5-fold CV with a single stratified 80/20\ntrain/validation split and I freeze all ResNet layers except the final fully-\nconnected layer to drastically reduce training time. I train for just 2 epochs\nand then compute and print the hold-out ROC AUC. A reusable `predict` function\nis provided and is used at the end to generate probabilities for all images in\n`input/MyImages`, saving them to `working/submission.csv`.", "I switched to a lighter ResNet-18 backbone, reduced the input size to 128\u00d7128,\nand enabled mixed\u2010precision training with `torch.cuda.amp` plus `pin_memory` on\nthe data loaders. This dramatically speeds up training while maintaining\naccuracy. After three epochs, the script computes and prints the validation\nAUROC. The `predict` function is provided for inference on new image folders.", "I will filter out corrupted or missing image files before training, and use\n5-fold stratified cross-validation for robust evaluation. To speed up training\nand avoid timeouts, I will freeze the pretrained ResNet18 backbone and train\nonly the final classification layer. A reusable `predict()` function is included\nfor inference. Finally, the script prints the overall CV AUROC.", "We can drastically reduce CPU training time by freezing the ResNet backbone and\nonly fine\u2010tuning the final classification layer. This lets us keep our 3-epoch\nschedule while only training a small head rather than the entire network on CPU.\nWe replace the fc layer, freeze all other params, and adjust the optimizer\naccordingly. The rest of the code remains the same, including `predict()` and\n5-fold CV with AUROC reporting.", "I reduced training to a single 80/20 hold-out split and switched to a smaller\nEfficientNet-B0 backbone at 128\u00d7128 resolution to speed things up. We freeze the\nbackbone and train only a one-neuron head for 3 epochs, evaluate on the\nvalidation set, and print the AUROC. Finally, we retrain on the full dataset\nwith the same settings, save the model, and provide a reusable `predict`\nfunction for new image folders.", "We can precompute frozen backbone features for all images in one pass and then\ntrain a lightweight logistic regression model in a 5-fold CV loop, which avoids\nexpensive repeated forward passes. We build a DataLoader over the entire dataset\n(no augmentation), extract global-pooled ResNet18 features once, and then use\nStratifiedKFold to train and evaluate a sklearn LogisticRegression with AUC. A\npredict() function chains the frozen feature extractor and the trained\nclassifier for new image lists.", "We simplify evaluation by using a single stratified train/validation split and\nreduce the number of epochs to speed up training and avoid timeout. We retain\nthe ResNet-18 feature extractor, freeze its weights, and only fine-tune the\nfinal layer. We also include a reusable `predict()` function for batch inference\non new image paths, and at the end we compute and print the hold-out AUROC\nscore.", "I propose to swap the ResNet-18 backbone for a stronger EfficientNet-B0 model\nwhen extracting frozen features, which should yield more discriminative\nembeddings for the downstream logistic regression classifier. We\u2019ll remove\nEfficientNet\u2019s head, global-pool its output to a 1,280-dim vector per image, and\nrun 5-fold CV with a balanced logistic regression as before to compute the mean\nAUROC. Finally, we\u2019ll retrain on all data, generate malignancy probabilities for\neach image in the input folder, and save them in a `submission.csv`.", "I suggest swapping the EfficientNet-B0 backbone for a stronger EfficientNet-B1\nand increasing the input resolution to 240\u00d7240. This single change will provide\nricher, more discriminative features for the downstream logistic regression\nclassifier. We keep the same frozen\u2010feature extraction and 5\u2010fold CV setup to\nquantify the AUC improvement. The rest of the pipeline (feature extraction, CV,\nretraining on full data, and submission) remains unchanged.", "I will add feature normalization using `StandardScaler` before fitting the\nlogistic regression. Scaling the frozen backbone features can improve the\nclassifier\u2019s convergence and performance by ensuring each feature has zero mean\nand unit variance. I will fit the scaler within each CV fold and on the full\ndata before the final training, and apply it at inference time in `predict()`.\nThis change is atomic and should boost the AUROC without changing the backbone\nor overall pipeline significantly.", "I propose to ensemble frozen features from two complementary\nbackbones\u2014EfficientNet-B0 and ResNet-50\u2014by concatenating their global\u2010pooled\noutputs before fitting the logistic regression. This should provide richer, more\ndiscriminative representations than a single backbone. We will extract features\nonce from both models, stack them horizontally, and perform 5-fold CV to report\nthe mean AUC, then retrain on all data and generate test predictions as before."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Custom dataset for loading images and labels\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.target, dtype=torch.float32)\n        return img, label\n\n\ndef predict(image_paths, model, transform, device=\"cpu\", batch_size=32):\n    \"\"\"\n    Predict probabilities for a list of image file paths.\n    Args:\n      image_paths (list of str): paths to image files.\n      model (torch.nn.Module): trained model.\n      transform (torchvision.transforms): preprocessing transforms.\n      device (str): 'cpu' or 'cuda'.\n      batch_size (int): batch size.\n    Returns:\n      np.ndarray: array of probabilities for malignant class.\n    \"\"\"\n    model.eval()\n    ds = [(path,) for path in image_paths]\n    # simple loader\n    probs = []\n    with torch.no_grad():\n        for i in range(0, len(image_paths), batch_size):\n            batch_paths = image_paths[i : i + batch_size]\n            imgs = []\n            for p in batch_paths:\n                img = Image.open(p).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            logits = model(imgs).squeeze(1)\n            batch_probs = torch.sigmoid(logits).cpu().numpy()\n            probs.extend(batch_probs.tolist())\n    return np.array(probs)\n\n\ndef main():\n    # Configuration\n    IMG_DIR = \"./input/MyImages\"\n    CSV_PATH = \"./input/mydataset.csv\"\n    BATCH_SIZE = 32\n    EPOCHS = 5\n    LR = 1e-4\n    DEVICE = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    torch.manual_seed(42)\n    np.random.seed(42)\n\n    # Load data\n    df = pd.read_csv(CSV_PATH)\n    # Map labels: malignant=1, others=0\n    df[\"target\"] = df.label.apply(lambda x: 1 if x == \"malignant\" else 0)\n    # Split train/val\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df.target, random_state=42\n    )\n\n    # Transforms\n    train_transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, transform=train_transforms)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, transform=val_transforms)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model setup\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=LR)\n\n    # Training loop\n    for epoch in range(EPOCHS):\n        model.train()\n        total_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * imgs.size(0)\n        avg_loss = total_loss / len(train_ds)\n        print(f\"Epoch {epoch+1}/{EPOCHS}, Training Loss: {avg_loss:.4f}\")\n\n    # Validation and AUROC computation\n    model.eval()\n    all_probs, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Example of saving submission if needed:\n    # test_images = [os.path.join(IMG_DIR, f) for f in os.listdir(IMG_DIR) if f.endswith(\".jpg\")]\n    # test_probs = predict(test_images, model, val_transforms, DEVICE, BATCH_SIZE)\n    # submission = pd.DataFrame({\"image_name\": [os.path.basename(p) for p in test_images], \"malignant_prob\": test_probs})\n    # submission.to_csv(\"./working/submission.csv\", index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport pandas as pd\nimport numpy as np\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\n# Prediction function\ndef predict(\n    image_folder: str,\n    model_path: str = \"working/resnet50_full.pth\",\n    batch_size: int = 16,\n):\n    \"\"\"\n    Loads a trained model and returns a DataFrame of malignancy probabilities for each image.\n    Args:\n        image_folder (str): Path to folder with .jpg images.\n        model_path (str): Path to saved model weights.\n        batch_size (int): Batch size for inference.\n    Returns:\n        DataFrame with columns ['image_name','malignant_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"resnet50\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    results = []\n    loader = DataLoader(\n        files, batch_size=batch_size, shuffle=False, collate_fn=lambda batch: batch\n    )\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            names = []\n            for fname in batch:\n                img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n                imgs.append(transform(img))\n                names.append(fname)\n            imgs = torch.stack(imgs).to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for n, p in zip(names, probs):\n                results.append({\"image_name\": n, \"malignant_prob\": float(p)})\n    return pd.DataFrame(results)\n\n\n# Main training & cross-validation\ndef main():\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # binary label: malignant=1 else=0\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    img_dir = \"input/MyImages\"\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label_bin), 1):\n        train_df, val_df = df.loc[train_idx], df.loc[val_idx]\n        train_ds = SkinLesionDataset(\n            train_df,\n            img_dir,\n            transform=transforms.Compose(\n                [\n                    transforms.Resize((224, 224)),\n                    transforms.RandomHorizontalFlip(),\n                    transforms.ToTensor(),\n                    transforms.Normalize(\n                        mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)\n                    ),\n                ]\n            ),\n        )\n        val_ds = SkinLesionDataset(\n            val_df,\n            img_dir,\n            transform=transforms.Compose(\n                [\n                    transforms.Resize((224, 224)),\n                    transforms.ToTensor(),\n                    transforms.Normalize(\n                        mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)\n                    ),\n                ]\n            ),\n        )\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=2)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n\n        model = timm.create_model(\"resnet50\", pretrained=True, num_classes=1)\n        model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # train for 3 epochs\n        for epoch in range(3):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(device), labels.to(device)\n                logits = model(imgs).squeeze(1)\n                loss = criterion(logits, labels)\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n        # validate\n        model.eval()\n        all_labels, all_probs = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1)\n                probs = torch.sigmoid(logits).cpu().numpy()\n                all_probs.extend(probs.tolist())\n                all_labels.extend(labels.numpy().tolist())\n        roc = roc_auc_score(all_labels, all_probs)\n        print(f\"Fold {fold} AUROC: {roc:.4f}\")\n        aucs.append(roc)\n    print(f\"Mean AUROC: {np.mean(aucs):.4f}\")\n\n    # train on full data\n    full_ds = SkinLesionDataset(\n        df,\n        img_dir,\n        transform=transforms.Compose(\n            [\n                transforms.Resize((224, 224)),\n                transforms.RandomHorizontalFlip(),\n                transforms.ToTensor(),\n                transforms.Normalize(\n                    mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)\n                ),\n            ]\n        ),\n    )\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=2)\n    model_full = timm.create_model(\"resnet50\", pretrained=True, num_classes=1).to(\n        device\n    )\n    opt_full = torch.optim.Adam(model_full.parameters(), lr=1e-4)\n    crit = nn.BCEWithLogitsLoss()\n    for epoch in range(3):\n        model_full.train()\n        for imgs, labels in full_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            loss = crit(model_full(imgs).squeeze(1), labels)\n            opt_full.zero_grad()\n            loss.backward()\n            opt_full.step()\n    os.makedir let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
