let treeStructData = {"edges": [[3, 6], [4, 7], [4, 8], [4, 5], [8, 10], [8, 9], [10, 11], [10, 12], [12, 13], [13, 14], [13, 15], [15, 16], [16, 18], [16, 17], [18, 19]], "layout": [[0.0, 0.0], [0.125, 0.0], [0.25, 0.0], [0.375, 0.0], [0.625, 0.0], [0.5, 0.125], [0.375, 0.125], [0.625, 0.125], [0.75, 0.125], [0.6875, 0.25], [0.8125, 0.25], [0.75, 0.375], [0.875, 0.375], [0.875, 0.5], [0.8125, 0.625], [0.9375, 0.625], [0.9375, 0.75], [0.875, 0.875], [1.0, 0.875], [1.0, 1.0]], "plan": ["We treat malignant vs all other classes as a binary classification. We fine-tune\na pretrained ResNet18 from torchvision with an added single-output head using\nBCEWithLogitsLoss, applying simple augmentations during training. We split the\ndata into stratified train/validation sets and train for a few epochs on GPU if\navailable. Finally, we evaluate performance using AUROC on the hold-out\nvalidation set and provide a predict() function that loads the saved model and\nreturns malignancy probabilities for new images.", "We fine-tune a pretrained EfficientNet-B0 model from `timm` for binary malignant\nvs non-malignant classification, using simple augmentations. We evaluate with\n5-fold stratified cross-validation computing AUROC for each fold and report the\nmean score. After CV we retrain on the full dataset and save the best model. A\n`predict()` function loads this model and returns malignancy probabilities for\nnew images. We use `BCEWithLogitsLoss` and the Adam optimizer.", "We fine-tune a pretrained MobileNetV2 on the skin lesion images, replacing its\nclassifier head with a single-output layer for binary malignant vs non-malignant\nclassification. We apply standard augmentations like random flips and rotations\nduring training and ImageNet normalization. We split the dataset into stratified\ntrain and validation sets (80/20), train for 5 epochs using BCEWithLogitsLoss\nand the Adam optimizer, and evaluate using AUROC on the hold-out set. After\ntraining, we save the model and provide a predict() function that loads the\nmodel and returns malignancy probabilities for new images.", "We extract 512-d embeddings from a frozen ResNet18 for each image and train a\nlightweight XGBoost classifier on these embeddings to predict malignancy. We\nperform 5-fold stratified cross\u2013validation on the embeddings to compute AUROC on\neach fold and report the mean AUROC. Finally, we retrain the XGBoost model on\nall data, save it, and provide a `predict(image_folder)` function that loads the\nsaved model and returns malignancy probabilities for new images.", "We fine-tune a DenseNet121 model from torchvision, replacing its classifier head\nwith a single neuron for malignant vs non-malignant classification. Images are\naugmented with random resized crops and horizontal flips, normalized to ImageNet\nstatistics. We split the data into an 80/20 stratified train/validation set,\ntrain for 5 epochs using BCEWithLogitsLoss and the Adam optimizer, and evaluate\nwith AUROC on the hold-out set. The best model is saved, and a predict()\nfunction loads this model to return malignancy probabilities for new images.", "I will add color jitter to the training augmentations to make the model more\nrobust to lighting and color variations. This simple but effective augmentation\ncan improve generalization without changing the model architecture or training\nprocedure. The rest of the training loop and validation setup remain unchanged,\nand we will report the AUROC on the hold-out set.", "I replaced the XGBoost model with a RandomForestClassifier from scikit-learn to\navoid the missing xgboost dependency. The feature extraction and data loading\nremain unchanged, and we perform 5-fold stratified CV to compute the mean AUROC,\nwhich is printed at the end. After CV, the model is retrained on all data and\nsaved for later use. A predict() function is provided to load the saved model\nand output malignancy probabilities for new images.", "I propose to integrate MixUp augmentation into the training loop to improve\ngeneralization by blending image pairs and their labels. We will sample a mixing\ncoefficient from a Beta distribution (\u03b1=0.4), combine inputs and targets\naccordingly, and compute a weighted BCE loss. This atomic change keeps the\nDenseNet121 backbone and existing transforms unchanged but enhances robustness.\nFinally, we will evaluate on the hold\u2010out set and print the best validation\nAUROC.", "We propose adding RandomErasing augmentation to the training pipeline to improve\nmodel robustness to occlusions and artifacts. RandomErasing will randomly mask\nout rectangular regions of the input images with probability 0.5 during\ntraining. We update the train_transform to include transforms.RandomErasing\nafter converting to tensor and before normalization. We then retrain the\nDenseNet121 model for 5 epochs and report the best validation AUROC.", "We introduce a OneCycleLR scheduler to dynamically adjust the learning rate\nduring training, which often improves convergence and generalization. We keep\nthe DenseNet121 backbone, RandomErasing augmentation, and BCEWithLogitsLoss\nunchanged. The scheduler is stepped after each optimizer step in the training\nloop. Finally, we evaluate on the hold\u2010out validation set and print the best\nAUROC.", "I will balance the training data by using a WeightedRandomSampler to ensure each\nbatch has a balanced representation of malignant and benign samples. I compute\nsample weights inversely proportional to class frequencies in the training set\nand replace DataLoader\u2019s shuffle with this sampler. This helps the model learn\nequally from both classes despite any imbalance. The rest of the training loop,\naugmentations, and validation remain unchanged, and I print the best validation\nAUROC at the end.", "We replace the BCEWithLogitsLoss with a binary Focal Loss (\u03b1=0.25, \u03b3=2) so the\nmodel focuses more on hard\u2010to\u2010classify examples and mitigates class imbalance.\nWe implement a FocalLoss module and use it as the training criterion, keeping\nthe DenseNet121 backbone, balanced sampler, RandomErasing augmentation, and\ntraining hyperparameters unchanged. We then retrain for 5 epochs on the same\ntrain/val split and print out the validation AUROC.", "I propose integrating CutMix augmentation into the training loop to improve the\nmodel\u2019s generalization by mixing pairs of images and their labels. For each\ntraining batch, with a set probability, we sample a mixing coefficient \u03bb from a\nBeta distribution, generate a random bounding box, combine two images in the\nbatch over that box, and compute a mixed BCE loss weighted by \u03bb and 1\u2212\u03bb. This\nchange augments the existing pipeline (including RandomErasing,\nWeightedRandomSampler, and DenseNet121) without altering the overall\narchitecture or hyperparameters.", "I propose adding test-time augmentation (TTA) during validation by averaging\nmodel predictions on original and horizontally flipped images to improve\nrobustness. This atomic change does not affect training but can boost AUROC by\nreducing overfitting on specific orientations. We will apply TTA in both the\nvalidation loop and the `predict()` function. The rest of the training pipeline,\nincluding CutMix, RandomErasing, and weighted sampling, remains unchanged.", "I propose adding RandAugment to the training pipeline to generate a richer\nvariety of photometric transformations, improving model robustness to color and\ntexture variations without affecting the existing architecture or training loop.\nWe insert `transforms.RandAugment()` after random horizontal flips in the\n`train_transform`. All other settings, including CutMix, RandomErasing, weighted\nsampling, and TTA at validation, remain unchanged so we can directly measure the\nimpact of this augmentation.", "I propose to replace the single train/val split with 5\u2010fold stratified\ncross\u2010validation and ensemble the five resulting DenseNet121 models at\ninference. For each fold we train the same pipeline with CutMix, RandomErasing,\nweighted sampling and TTA, saving the best model per fold. We then compute and\nprint the AUROC for each fold and the mean CV AUROC. The predict() function will\nload all saved fold models and average their TTA predictions to further boost\nrobustness.", "I propose replacing the DenseNet121 backbone with a more powerful\nEfficientNet-B3 model from the timm library and increasing the input resolution\nfrom 224 to 300 to capture finer lesion details. We keep the same 5-fold CV,\nCutMix, RandomErasing, weighted sampling, and TTA pipeline but simply swap the\nbackbone and adjust the transforms so the model benefits from higher input\nfidelity and better feature extraction.", "I will integrate a OneCycleLR scheduler to dynamically adjust the learning rate\nduring training, accelerating convergence early and annealing later for better\ngeneralization. The scheduler\u2019s max_lr is set to 10\u00d7 the base LR, and we step it\nafter every optimizer update across all batches. This change is minimal and\nkeeps all other augmentations, model architecture, and training hyperparameters\nunchanged. We then report the per\u2010fold and mean CV AUROC to evaluate the impact.", "I propose replacing the Adam optimizer with AdamW and adding a weight decay of\n1e-2 to provide L2 regularization, which can improve generalization without\naltering the rest of the pipeline. This atomic change keeps the EfficientNet-B3\nbackbone, CutMix, RandomErasing, weighted sampling, TTA, and 5-fold CV\nunchanged, allowing us to directly measure the impact of weight decay. We then\nprint the mean cross-validated AUROC to evaluate the improvement.", "I propose integrating an Exponential Moving Average (EMA) of model parameters\nduring training with decay=0.999. We maintain a shadow EMA model updated after\neach optimizer step and use the EMA model for validation and checkpointing. This\natomic change does not affect the backbone, augmentations, or hyperparameters\nand often yields better generalization. The predict() function continues to load\nthese EMA-based weights transparently."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Dataset class\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None, is_train=True):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.is_train = is_train\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        if self.is_train:\n            label = torch.tensor(row.label, dtype=torch.float32)\n            return image, label\n        else:\n            return image, row.image_name\n\n\n# Read and prepare data\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# Binary target: malignant=1, else=0\ndf[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"label\"], random_state=42\n)\n\n# Transforms\ntrain_transforms = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.RandomHorizontalFlip(),\n        T.RandomRotation(15),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transforms = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Datasets and loaders\ntrain_ds = SkinDataset(\n    train_df, \"./input/MyImages\", transform=train_transforms, is_train=True\n)\nval_ds = SkinDataset(\n    val_df, \"./input/MyImages\", transform=val_transforms, is_train=True\n)\ntrain_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n# Model setup\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(device)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n# Training loop\nfor epoch in range(3):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    # optional: print(f\"Epoch {epoch+1}, Loss: {running_loss/len(train_ds):.4f}\")\n\n# Validation\nmodel.eval()\nall_preds = []\nall_labels = []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(device)\n        outputs = model(imgs)\n        probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n        all_preds.extend(probs)\n        all_labels.extend(labels.numpy())\nauc = roc_auc_score(all_labels, all_preds)\nprint(f\"Validation AUROC: {auc:.4f}\")\n\n# Save the trained model\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(model.state_dict(), \"./working/model.pth\")\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for each image in the folder.\n    Args:\n        image_folder (str): path to a folder containing JPEG images.\n    Returns:\n        pd.DataFrame: columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    df_pred = pd.DataFrame({\"image_name\": [os.path.splitext(f)[0] for f in files]})\n    pred_ds = SkinDataset(\n        df_pred, image_folder, transform=val_transforms, is_train=False\n    )\n    pred_loader = DataLoader(pred_ds, batch_size=32, shuffle=False, num_workers=4)\n    model_loaded = models.resnet18(pretrained=False)\n    model_loaded.fc = nn.Linear(model_loaded.fc.in_features, 1)\n    model_loaded.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model_loaded = model_loaded.to(device).eval()\n    probs = []\n    with torch.no_grad():\n        for imgs, names in pred_loader:\n            imgs = imgs.to(device)\n            out = model_loaded(imgs)\n            p = torch.sigmoid(out).cpu().numpy().flatten()\n            probs.extend(p)\n    df_pred[\"malignancy_prob\"] = probs\n    return df_pred\n\n\n# Example usage:\n# preds_df = predict('./input/MyImages')\n# preds_df.to_csv('./working/submission.csv', index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom PIL import Image\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\n# Training function\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    return running_loss / len(loader.dataset)\n\n\n# Validation function\ndef validate(model, loader, device):\n    model.eval()\n    all_labels = []\n    all_preds = []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs)\n            probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n            all_preds.extend(probs)\n            all_labels.extend(labels.numpy().flatten())\n    return roc_auc_score(all_labels, all_preds)\n\n\ndef predict(image_folder: str):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in image_folder.\n    Returns a DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Load model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"working/best_model.pth\", map_location=device))\n    model.to(device).eval()\n    # Transforms\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = []\n    for fname in sorted(os.listdir(image_folder)):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            img_t = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(img_t)).item()\n            name = os.path.splitext(fname)[0]\n            results.append({\"image_name\": name, \"malignancy_prob\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # Settings\n    seed = 42\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # Binary label\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    img_dir = \"input/MyImages\"\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=seed)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"label_bin\"]), 1):\n        df_train = df.iloc[train_idx]\n        df_val = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(df_train, img_dir, transform=train_tf)\n        val_ds = SkinLesionDataset(df_val, img_dir, transform=val_tf)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n        # Model\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n        model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # Train\n        best_auc = 0.0\n        for epoch in range(3):\n            _ = train_one_epoch(model, train_loader, criterion, optimizer, device)\n            auc = validate(model, val_loader, device)\n            if auc > best_auc:\n                best_auc = auc\n        print(f\"Fold {fold} AUROC: {best_auc:.4f}\")\n        aucs.append(best_auc)\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n    # Retrain on full data\n    full_ds = SkinLesionDataset(df, img_dir, transform=train_tf)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n        device\n    )\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    for epoch in range(3):\n        _ = train_one_epoch(model, full_loader, criterion, optimizer, device)\n    # Save model\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(model.state_dict(), \"working/best_model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row[\"label\"], dtype=torch.float32)\n        return image, label\n\n\ndef predict(model_path: str, image_folder: str) -> pd.DataFrame:\n    \"\"\"\n    Load a trained model and predict malignancy probabilities for all images in a folder.\n    Args:\n        model_path (str): Path to the saved model .pth file.\n        image_folder (str): Directory containing .jpg images.\n    Returns:\n        pd.DataFrame: DataFrame with columns ['image_name', 'malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.mobilenet_v2(pretrained=False)\n    model.classifier = nn.Sequential(nn.Dropout(0.2), nn.Linear(model.last_channel, 1))\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    results = []\n    for fname in sorted(os.listdir(image_folder)):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            tensor = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                logit = model(tensor)\n                prob = torch.sigmoid(logit).item()\n            results.append({\"image_name\": fname, \"malignancy_probability\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # Paths\n    csv_path = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    # Load and prepare data\n    df = pd.read_csv(csv_path)\n    df[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label\"], random_state=42\n    )\n    # Transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.RandomResizedCrop(224),\ .gamma = gamma\n        self.reduction = reduction\n\n    def forward(self, inputs, targets):\n        # inputs: logits, targets: float tensor 0/1\n        bce = F.binary_cross_entropy_with_logits(inputs, targets, reduction=\"none\")\n        probs = torch.sigmoid(inputs)\n        pt = torch.where(targets == 1, probs, 1 - probs)\n        alpha_t = torch.where(targets == 1, self.alpha, 1 - self.alpha)\n        loss = alpha_t * (1 - pt).pow(self.gamma) * bce\n        if self.reduction == \"mean\":\n            return loss.mean()\n        elif self.reduction == \"sum\":\n            return loss.sum()\n        return loss\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row[\"binary_label\"], dtype=torch.float32)\n        return img, label\n\n\ntrain_transform = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(IMAGE_SIZE),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.RandomErasing(\n            p=0.5, scale=(0.02, 0.33), ratio=(0.3, 3.3), value=\"random\"\n        ),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((IMAGE_SIZE, IMAGE_SIZE)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\ndef main():\n    df = pd.read_csv(DATA_CSV)\n    df[\"binary_label\"] = df[\"label\"].map(lambda x: 1 if x == \"malignant\" else 0)\n    train_df, val_ _decay=WEIGHT_DECAY\n        )\n\n        best_auc = 0.0\n        best_path = os.path.join(MODEL_DIR, f\"effb3_fold{fold}.pth\")\n\n        for epoch in range(1, NUM_EPOCHS + 1):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n                optimizer.zero_grad()\n                if random.random() < CUTMIX_PROB:\n                    lam = np.random.beta(CUTMIX_ALPHA, CUTMIX_ALPHA)\n                    idx2 = torch.randperm(imgs.size(0)).to(DEVICE)\n                    ta, tb = labels, labels[idx2]\n                    x1, y1, x2, y2 = rand_bbox(imgs.size(), lam)\n                    imgs[:, :, y1:y2, x1:x2] = imgs[idx2, :, y1:y2, x1:x2]\n                    lam_adj = 1 - ((x2 - x1) * (y2 - y1) / (IMAGE_SIZE * IMAGE_SIZE))\n                    outputs = model(imgs)\n                    loss = (\n                        lam_adj * criterion(outputs, ta).mean()\n                        + (1 - lam_adj) * criterion(outputs, tb).mean()\n                    )\n                else:\n                    outputs = model(imgs)\n                    loss = criterion(outputs, labels).mean()\n                loss.backward()\n                optimizer.step()\n                # EMA update\n                with torch.no_grad():\n                    for ema_p, p in zip(ema_model.parameters(), model.parameters()):\n                        ema_p.data.mul_(EMA_DECAY).add_(p.data * (1 - EMA_DECAY))\n\n            # Validation with EMA model\n            ema_model.eval()\n            preds, truths = [], []\n            with torch.no_grad():\n                for imgs, labels in val_loader:\n                    imgs = imgs.to(DEVICE)\n                    o1 = ema_model(imgs)\n                    p1 = torch.sigmoid(o1)\n                    o2 = ema_model(torch.flip(imgs, [3]))\n                    p2 = torch.sigmoid(o2)\n                    p = ((p1 + p2) / 2).cpu().numpy().flatten()\n let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
