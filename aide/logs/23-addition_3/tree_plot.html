let treeStructData = {"edges": [[1, 5], [4, 7], [5, 6], [7, 11], [7, 10], [7, 9], [7, 8], [7, 12], [12, 13], [12, 14], [14, 19], [14, 18], [14, 15], [14, 17], [15, 16]], "layout": [[0.0, 0.0], [0.125, 0.0], [0.25, 0.0], [0.375, 0.0], [0.5, 0.0], [0.125, 0.19999999999999996], [0.125, 0.4], [0.5, 0.19999999999999996], [0.25, 0.4], [0.375, 0.4], [0.5, 0.4], [0.625, 0.4], [0.75, 0.4], [0.6875, 0.6], [0.8125, 0.6], [0.625, 0.8], [0.625, 1.0], [0.75, 0.8], [0.875, 0.8], [1.0, 0.8]], "plan": ["We fine-tune a pretrained ResNet50 to predict malignant (1) versus benign/non-\nneoplastic (0) lesions using an 80/20 stratified split. We mitigate potential\nskin tone bias by oversampling underrepresented tones via a\nWeightedRandomSampler. The model is trained for a few epochs with\nBCEWithLogitsLoss and evaluated on the validation set using AUROC. A predict()\nfunction loads the saved model and returns malignancy probabilities for new\nimages.", "We first extract deep features from all images using a pretrained ResNet18, then\ntrain a LightGBM classifier on these features, reweighting samples inversely to\nskin tone frequency for fairness. We perform stratified 5\u2010fold cross\u2010validation\nto compute the mean AUROC, then train a final model on the full dataset and save\nit. A `predict()` function loads the feature extractor and trained classifier to\ngenerate malignancy probabilities for new images. Finally, we print the mean\ncross\u2010validated AUROC on the hold\u2010out folds.", "We fine-tune a pretrained EfficientNet-B0 on the lesion images, mapping\n\u201cmalignant\u201d to 1 and \u201cbenign\u201d/\u201cnon-neoplastic\u201d to 0, using a reweighted\nBCEWithLogitsLoss where each sample\u2019s loss is upweighted inversely proportional\nto its skin tone frequency. We perform an 80/20 stratified split by label, train\nfor 5 epochs with AdamW, and report validation AUROC. The best model is saved to\ndisk and a predict() function loads the model to return malignancy probabilities\nfor new images.", "We will extract fixed features from a pretrained EfficientNet-B0 by removing its\nclassification head and feed these embeddings into a LightGBM classifier, using\nsample weights inversely proportional to each skin tone\u2019s frequency to encourage\nfairness. We split the data stratified by malignancy label into an 80/20\ntrain/validation set, extract features via a PyTorch DataLoader, and train\nLightGBM with these weights. We evaluate the model\u2019s overall performance via\nAUROC on the hold-out set and save both the feature extractor and classifier for\nfuture use. A predict() function is provided that takes a folder of new images,\ncomputes embeddings with the saved EfficientNet backbone, and returns malignancy\nprobabilities.", "We fine-tune a pretrained DenseNet-121 by replacing its final layer with a\nsingle logit output for malignancy and train for 3 epochs. We perform an 80/20\nstratified split on the binary label, and use a WeightedRandomSampler to\nupsample underrepresented skin tones during training to promote fairness. The\nmodel is optimized with Adam and BCEWithLogitsLoss, and evaluated on the\nvalidation set via AUROC. A `predict()` function is provided to load the saved\nmodel and output malignancy probabilities for all images in a given folder,\nwriting them to `./working/submission.csv`.", "We can fix the LightGBM API error by switching to the sklearn\u2010style\nLGBMClassifier, which supports early_stopping_rounds directly.  In each fold\nwe\u2019ll call clf.fit with eval_set, sample_weight, eval_sample_weight and\nearly_stopping_rounds, collect the best_iteration_, and compute the ROC AUC on\nthe validation fold. Finally we average the best_iterations to retrain on the\nfull dataset, save the model, and provide a predict() function that loads the\nmodel, reuses the pretrained ResNet18 features, and returns malignancy\nprobabilities.", "We will replace the unsupported `early_stopping_rounds` argument by using\nLightGBM\u2019s callback API (`early_stopping` and `log_evaluation` callbacks) so\nthat training can still stop early. Otherwise, the pipeline remains the same:\nextract ResNet-18 features on GPU, reweight samples by inverse skin-tone\nfrequency for fairness, cross-validate to pick the best iteration, retrain the\nfinal model on all data, save it, and print the mean CV AUROC. A `predict()`\nfunction is provided to load the trained model and feature extractor and return\nmalignancy probabilities for new images.", "We introduce MixUp augmentation into the training loop to blend pairs of images\nand their labels, which often improves generalization and subgroup robustness.\nFor each batch, we draw \u03bb from a Beta distribution and mix both inputs and\ntargets accordingly, while still using the WeightedRandomSampler for skin-tone\nbalancing. The rest of the pipeline remains the same, and we report the\nvalidation AUROC after training.", "We replace the BCEWithLogitsLoss with a binary focal loss (gamma=2) to focus\nlearning on hard-to-classify examples, especially borderline malignant cases.\nThis should improve model discrimination by down-weighting easy samples and\nemphasize minority class signals. We keep MixUp augmentation and the weighted\nsampler unchanged. The rest of the training and prediction pipelines remain\nidentical, and we report the new AUROC.", "I propose enhancing data augmentation by replacing the simple resize-and-center-\ncrop with stronger, more diverse transformations: RandomResizedCrop, random\nrotations, vertical flips, and color jitter. This should improve generalization\nand robustness across skin tones without altering the core mixup and weighted-\nsampler training pipeline. We keep other settings (DenseNet121, mixup, weighted\nsampler, 3 epochs) identical to isolate the effect of richer augmentations.", "I propose to switch to the AdamW optimizer with weight decay and use a\nOneCycleLR learning rate scheduler, increasing training to 5 epochs with a peak\nLR of 1e-3. This should improve convergence and generalization without altering\nthe existing mixup or skin-tone sampling pipeline. The rest of the code,\nincluding data loading, mixup, weighted sampler for fairness, and validation,\nremains unchanged. The scheduled LR will rise to 1e-3 then decrease, maximizing\nperformance across skin tones and overall AUROC.", "We will apply test-time augmentation by averaging predictions from the original\nand horizontally-flipped versions of each image during validation and test. This\nsimple TTA often yields a noticeable boost in AUROC with minimal code changes.\nWe'll update the validation loop to compute logits on both the original and\nflipped images, average their sigmoid probabilities, and then compute the AUROC.\nWe'll also modify the `predict()` function to use the same TTA when generating\nthe submission.", "I propose to integrate multi-crop test-time augmentation via torchvision\u2019s\nTenCrop, averaging predictions over 10 crops per image at validation and test\ntime. This should improve robustness and boost AUROC without changing training.\nWe update the validation loop to apply a TenCrop transform that outputs a stack\nof 10 normalized tensors per image, forward all crops through the model, average\ntheir sigmoid outputs, and compute AUROC on those. The predict() function is\nsimilarly updated to use the same TTA before saving submission.csv.", "We improve the test-time augmentation by combining TenCrop on both the original\nand its horizontally\u2010flipped image, yielding 20 deterministic crops per image.\nWe update the validation transform to generate these 20 crops and average model\npredictions across them, both during validation and in the `predict()` function.\nThis enhanced TTA should boost robustness and overall AUROC.", "I propose ensembling a second architecture, EfficientNet-B3, trained with the\nsame mixup and weighted\u2010sampler pipeline alongside DenseNet121, then averaging\ntheir TTA predictions during validation and testing. Ensembling two diverse\nbackbones often yields a modest but reliable boost in AUROC without altering\nfairness procedures. We will train both models for the same number of epochs and\ncompute the validation AUROC on the averaged probabilities. The `predict()`\nfunction will also load both models and average their malignancy probabilities\nfor new images.", "We integrate exponential moving average (EMA) of model weights during training\nfor both DenseNet121 and EfficientNet-B3, using a decay of 0.999. After each\noptimizer step we update the EMA weights, and after training we replace each\nmodel\u2019s parameters with its EMA weights before saving, evaluation, and\nprediction. This smoothed-weights ensemble yields more robust predictions and\ntypically increases AUROC without altering the rest of the pipeline.", "I have updated the EMA class to ensure all shadow parameters are moved to the\nsame device as the model before updating or applying them, avoiding the CPU\u2013GPU\nmismatch. In `update`, each shadow tensor is cast to the parameter\u2019s device\nbefore computing the new exponential moving average, and in `apply_shadow` the\nshadow is similarly moved before copying back to the model. This fixes the\nruntime device error, and the rest of the training, evaluation, and prediction\npipeline remains unchanged.", "I propose replacing the single hold\u2010out split with 5\u2010fold stratified\ncross\u2010validation, training both DenseNet121 and EfficientNetB3 in each fold and\nensembling predictions across folds and architectures. We keep mixup\naugmentation, the weighted sampler for skin\u2010tone balancing, TenCrop TTA, and\nother hyperparameters unchanged. Out\u2010of\u2010fold predictions will be used to compute\na robust CV AUROC, and test\u2010time predictions will be averaged across all 10\nmodels in a `predict()` function. This ensemble across folds reduces variance\nand typically improves overall AUROC without altering the fairness pipeline.", "I propose replacing the single hold\u2010out split with 5\u2010fold stratified\ncross\u2010validation for both DenseNet121 and EfficientNet-B3, training each fold\nwith the existing mixup and weighted sampler pipeline. We will save each fold's\nmodels, ensemble predictions across folds and architectures during validation\nusing TenCrop TTA, and report the mean CV AUROC. This ensembled CV approach\nreduces variance and should boost overall AUROC without altering fairness\nmechanisms. Finally, the predict() function will load all fold models and\naverage their TenCrop TTA predictions to generate robust test predictions in\nsubmission.csv.", "I propose enhancing test\u2010time augmentation by combining TenCrop on both the\noriginal and its horizontally flipped image, yielding 20 deterministic crops per\nimage. This will improve robustness by averaging predictions over more views\nwithout changing the training pipeline. We update the validation and prediction\ntransforms to use this 20\u2010crop TTA, while keeping mixup augmentation and\nweighted sampling unchanged. The rest of the code remains the same, and we print\nthe ensemble validation AUROC for comparison."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as transforms\nfrom torchvision.models import resnet50\n\n# Paths and device\nCSV_PATH = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nWORK_DIR = \"./working\"\nos.makedirs(WORK_DIR, exist_ok=True)\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load and preprocess metadata\ndf = pd.read_csv(CSV_PATH)\ndf[\"label_binary\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n\n# Train/validation split stratified by label\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"label_binary\"], random_state=42\n)\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = row[\"label_binary\"]\n        tone = row[\"skin_tone\"]\n        return img, label, tone\n\n\n# Transforms\ntrain_transforms = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transforms = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Datasets and loaders\ntrain_ds = SkinLesionDataset(train_df, IMG_DIR, train_transforms)\nval_ds = SkinLesionDataset(val_df, IMG_DIR, val_transforms)\n\n# Compute sample weights to balance skin tone groups\ntone_counts = train_df[\"skin_tone\"].value_counts().to_dict()\ntrain_weights = [1.0 / tone_counts[t] for t in train_df[\"skin_tone\"]]\nsampler = WeightedRandomSampler(\n    train_weights, num_samples=len(train_weights), replacement=True\n)\n\ntrain_loader = DataLoader(train_ds, batch_size=32, sampler=sampler, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n# Model setup\nmodel = resnet50(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(DEVICE)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4, weight_decay=1e-5)\n\n# Training loop\nepochs = 3\nfor epoch in range(epochs):\n    model.train()\n    for imgs, labels, tones in train_loader:\n        imgs = imgs.to(DEVICE)\n        labels = labels.float().unsqueeze(1).to(DEVICE)\n        preds = model(imgs)\n        loss = criterion(preds, labels)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n\n# Validation and AUROC computation\nmodel.eval()\nall_preds, all_labels = [], []\nwith torch.no_grad():\n    for imgs, labels, tones in val_loader:\n        imgs = imgs.to(DEVICE)\n        outputs = model(imgs)\n        probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n        all_preds.extend(probs.tolist())\n        all_labels.extend(labels.numpy().tolist())\nauroc = roc_auc_score(all_labels, all_preds)\nprint(f\"Validation AUROC: {auroc:.4f}\")\n\n# Save model\ntorch.save(model.state_dict(), os.path.join(WORK_DIR, \"model.pth\"))\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for each image in folder_path.\n    Args:\n        folder_path (str): Path to folder with images (jpg/png).\n    Returns:\n        pandas.DataFrame: Columns ['image_name','malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Load model\n    m = resnet50(pretrained=False)\n    m.fc = nn.Linear(m.fc.in_features, 1)\n    m.load_state_dict(\n        torch.load(os.path.join(WORK_DIR, \"model.pth\"), map_location=device)\n    )\n    m = m.to(device).eval()\n    results = []\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith((\".jpg\", \".jpeg\", \".png\")):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            inp = val_transforms(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(m(inp)).item()\n            name = os.path.splitext(fname)[0]\n            results.append({\"image_name\": name, \"malignancy_probability\": prob})\n    return pd.DataFrame(results)", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torchvision import models, transforms\nfrom torch.utils.data import Dataset, DataLoader\nimport lightgbm as lgb\nimport joblib\n\n# 1. Load dataset\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"filepath\"] = df[\"image_name\"].apply(\n    lambda x: os.path.join(\"./input/MyImages\", f\"{x}.jpg\")\n)\ndf = df[df[\"filepath\"].apply(os.path.exists)].reset_index(drop=True)\n# Binary target: malignant=1 else 0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Skin tone weights for fairness\nfreq = df[\"skin_tone\"].value_counts(normalize=True).to_dict()\ndf[\"sw\"] = df[\"skin_tone\"].map(lambda x: 1.0 / freq.get(x, 1.0))\n\n# 2. Feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\nclass Identity(nn.Module):\n    def forward(self, x):\n        return x\n\n\ntransform = transforms.Compose(\n    [\n        transforms.Resize(224),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\nclass ImgDataset(Dataset):\n    def __init__(self, paths, transform):\n        self.paths = paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        return self.transform(img), idx\n\n\n# Load pretrained ResNet18\nresnet = models.resnet18(pretrained=True)\nresnet.fc = Identity()\nresnet = resnet.to(device).eval()\n\n# Extract features\npaths = df[\"filepath\"].tolist()\ndataset = ImgDataset(paths, transform)\nloader = DataLoader(dataset, batch_size=32, num_workers=4, shuffle=False)\nfeatures = np.zeros((len(df), 512), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(device)\n        feats = resnet(imgs).cpu().numpy()\n        features[idxs.numpy(), :] = feats\n\nlabels = df[\"target\"].values\nweights = df[\"sw\"].values\n\n# 3. 5-fold CV with LightGBM\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor train_idx, val_idx in skf.split(features, labels):\n    train_data = lgb.Dataset(\n        features[train_idx], label=labels[train_idx], weight=weights[train_idx]\n    )\n    val_data = lgb.Dataset(\n        features[val_idx], label=labels[val_idx], reference=train_data\n    )\n    params = {\n        \"objective\": \"binary\",\n        \"metric\": \"auc\",\n        \"verbosity\": -1,\n        \"boosting_type\": \"gbdt\",\n        \"seed\": 42,\n    }\n    gbm = lgb.train(\n        params,\n        train_data,\n        valid_sets=[val_data],\n        early_stopping_rounds=20,\n        verbose_eval=False,\n    )\n    preds = gbm.predict(features[val_idx], num_iteration=gbm.best_iteration)\n    aucs.append(roc_auc_score(labels[val_idx], preds))\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# 4. Train final model on full data\nfull_data = lgb.Dataset(features, label=labels, weight=weights)\nfinal_model = lgb.train(params, full_data, num_boost_round=gbm.best_iteration)\nos.makedirs(\"./working\", exist_ok=True)\njoblib.dump(final_model, \"./working/lgbm_model.pkl\")\n\n\n# 5. Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Load the trained model and feature extractor to predict malignancy probabilities.\n    Args:\n      folder_path (str): directory containing JPG images.\n    Returns:\n      dict: mapping filename to probability [0,1].\n    \"\"\"\n    # load model\n    model = joblib.load(\"./working/lgbm_model.pkl\")\n    # reuse resnet and transform from above\n    resnet_ft = models.resnet18(pretrained=True)\n    resnet_ft.fc = Identity()\n    resnet_ft = resnet_ft.to(device).eval()\n    # gather image paths\n    files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    paths = [os.path.join(folder_path, f) for f in files]\n    ds = ImgDataset(paths, transform)\n    dl = DataLoader(ds, batch_size=32, num_workers=4, shuffle=False)\n    feats = np.zeros((len(paths), 512), dtype=np.float32)\n    with torch.no_grad():\n        for imgs, idxs in dl:\n            imgs = imgs.to(device)\n            out = resnet_ft(imgs).cpu().numpy()\n            feats[idxs.numpy(), :] = out\n    probs = model.predict(feats)\n    return {files[i]: float(probs[i]) for i in range(len(files))}\n\n\n# Example usage (uncomment to test):\n# preds = predict('./input/MyImages')\n# print(list(preds.items())[:5])", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Custom Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        skin_tone = int(row.skin_tone)\n        return img, label, skin_tone\n\n\n# Prediction function\ndef predict(model_path: str, folder: str):\n    \"\"\"\n    Load a trained model and return malignancy probabilities for images in folder.\n    Args:\n        model_path: path to saved model\n        folder: folder with .jpg images\n    Returns:\n        dict: {filename: probability}\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1).to(\n        device\n    )\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.eval()\n    transform = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in sorted(os.listdir(folder)):\n            if not fname.lower().endswith(\".jpg\"):\n                continue\n            img = Image.open(os.path.join(folder, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            prob = torch.sigmoid(model(x))[0, 0].item()\n            results[fname] = prob\n    return results\n\n\ndef main():\n    # Load and preprocess metadata\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # map labels\n    df[\"label\"] = df[\"label\"].map({\"malignant\": 1, \"benign\": 0, \"non-neoplastic\": 0})\n    df = df.dropna(subset=[\"label\"])\n    # train/val split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label\"], random_state=42\n    )\n    # compute skin tone weights\n    tone_counts = train_df[\"skin_tone\"].value_counts().to_dict()\n    n = len(train_df)\n    num_tones = len(tone_counts)\n    tone_weights = {tone: n / (num_tones * cnt) for tone, cnt in tone_counts.items()}\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # transforms\n    transform = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T ath.splitext(f)[0],\n                    \"malignancy_probability\": np.mean(ps),\n                }\n            )\n    os.makedirs(\"./working\", exist_ok=True)\n    df_sub = pd.DataFrame(results)\n    df_sub.to_csv(\"./working/submission.csv\", index=False)\n    return df_sub\n\n\nif __name__ == \"__main__\":\n    IMG_DIR = \"./input/MyImages\"\n    CSV_PATH = \"./input/mydataset.csv\"\n    TEST_DIR = \"./input/test_images\"\n    MODEL1_PATH = \"./working/densenet121_ema.pth\"\n    MODEL2_PATH = \"./working/efficientnetb3_ema.pth\"\n    BATCH_SIZE, LR, EPOCHS, ALPHA = 32, 1e-4, 3, 0.4\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    df = pd.read_csv(CSV_PATH)\n    df = df[df[\"label\"].isin([\"malignant\", \"benign\", \"non-neoplastic\"])].copy()\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label\"], random_state=42\n    )\n\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    mean, std = [0.485, 0.456, 0.406], [0.229, 0.224, 0.225]\n    to_tensor_norm = transforms.Compose(\n        [transforms.ToTensor(), transforms.Normalize(mean, std)]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.TenCrop(224),\n            transforms.Lambda(\n                lambda crops: torch.stack([to_tensor_norm(c) for c in crops])\n            ),\n        ]\n    )\n\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, train_tf)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, val_tf)\n\n    tones, counts = np.unique(train_df[\"skin_tone\"], return_counts=True)\n    freq = dict(zip(tones, counts))\n    weights = [1.0 / freq[t] for t in train_df[\"skin_tone\"].values]\n    sampler = WeightedRan let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
