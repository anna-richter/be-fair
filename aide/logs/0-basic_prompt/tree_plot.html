let treeStructData = {"edges": [[3, 5], [5, 7], [5, 6], [5, 8], [8, 10], [8, 11], [8, 9], [8, 13], [8, 12], [13, 14], [14, 15], [14, 16], [14, 17], [17, 19], [17, 18]], "layout": [[0.0, 0.0], [0.13333333333333333, 0.0], [0.26666666666666666, 0.0], [0.4, 0.0], [0.5333333333333333, 0.0], [0.4, 0.16666666666666663], [0.26666666666666666, 0.33333333333333337], [0.4, 0.33333333333333337], [0.5333333333333333, 0.33333333333333337], [0.26666666666666666, 0.5], [0.4, 0.5], [0.5333333333333333, 0.5], [0.6666666666666666, 0.5], [0.8, 0.5], [0.8, 0.6666666666666667], [0.6666666666666666, 0.8333333333333334], [0.8, 0.8333333333333334], [0.9333333333333333, 0.8333333333333334], [0.8666666666666667, 1.0], [1.0, 1.0]], "plan": ["We will fine-tune a pretrained ResNet18 on the annotated images to predict\nmalignant vs non\u2010malignant (treating benign and non\u2010neoplastic as negative). We\nsplit the data 80/20 stratified by label, apply basic transforms (resize to 224,\nnormalize), and train for a few epochs using cross\u2010entropy loss on the binary\nclasses. We evaluate on the hold\u2010out set using AUROC and print the result. A\n`predict(folder_path)` function loads new images, applies the same transforms,\nand returns malignancy probabilities, and we demonstrate it by saving\npredictions for `./input/MyImages` to `working/submission.csv`.", "We fine\u2010tune a pretrained EfficientNet\u2010B0 for binary malignancy classification,\nusing stratified 5\u2010fold CV to estimate AUROC. Images are resized to 224\u00d7224 with\nstandard normalization, and we train each fold for 2 epochs with Adam and\nBCEWithLogitsLoss. After reporting mean CV AUROC, we retrain on the full dataset\nfor 3 epochs, save the model, and provide a `predict(folder_path)` function that\nloads the model, scores all images in a folder, and writes `submission.csv` with\nmalignancy probabilities.", "We use a pretrained ResNet50 to extract fixed 2048-dim embeddings for each skin\nlesion image, then train a LightGBM classifier on these embeddings for binary\nmalignancy prediction. We perform an 80/20 stratified train/validation split,\nextract features for both sets, and fit LightGBM with default settings. We\nevaluate on the hold\u2010out validation set using AUROC and print the result. A\npredict(folder_path) function loads new images, extracts embeddings via\nResNet50, and outputs malignancy probabilities to working/submission.csv.", "We fine-tune a pretrained DenseNet121 by replacing its classifier with a single-\noutput layer for binary malignancy prediction. We split the dataset 80/20\nstratified by malignancy label, apply random crops and flips for training and\ncenter\u2010crop resizing for validation, and train for 3 epochs using Adam and\nBCEWithLogitsLoss. After training, we compute the AUROC on the hold\u2010out set and\nprint it. We also define a predict(folder_path) function that loads new images,\napplies the validation transforms, computes malignancy probabilities, and writes\nthem to working/submission.csv.", "We fine\u2010tune a pretrained MobileNetV3 model for binary malignancy classification\non the skin lesion images, treating malignant as positive and all others as\nnegative. We split the data 80/20 stratified by label, apply random flips and\nresizing during training and center\u2010crop resizing for validation, and train for\nfive epochs using BCEWithLogitsLoss and Adam. After training, we compute and\nprint the AUROC on the hold\u2010out set, save the model, and define a\n`predict(folder_path)` function that loads the saved model, scores all images in\na folder, and writes `working/submission.csv` with malignancy probabilities for\neach image.", "I propose adding simple test-time augmentation (TTA) by averaging model\npredictions on the original and horizontally flipped images. This should yield\nmore robust probability estimates and improve the AUROC. We will modify both the\nvalidation loop and the `predict()` function to apply a horizontal flip and\naverage the sigmoid outputs. The rest of the training pipeline remains\nunchanged.", "I will add Random Erasing augmentation to the training transforms to make the\nmodel more robust to occlusions and improve generalization. By applying\n`transforms.RandomErasing(p=0.5)` after normalization, the network learns to\nhandle missing or occluded regions, which can boost performance on skin lesions.\nWe will retrain the DenseNet121 model with this additional augmentation and\nevaluate its AUROC with the same test-time flip augmentation as before.", "I propose adding MixUp data augmentation during training by linearly combining\npairs of images and their labels with mixing coefficient sampled from a Beta\ndistribution (\u03b1=0.4). This should improve model generalization by encouraging\nlinear behavior between classes. We will implement MixUp in the training loop,\nkeep the rest of the pipeline\u2014including horizontal\u2010flip test\u2010time\naugmentation\u2014unchanged, and report the validation AUROC each epoch. The\npredict() function remains unchanged.", "We implement a custom FocalLoss (alpha=0.25, gamma=2) to emphasize\nhard\u2010to\u2010classify examples by down\u2010weighting easy negatives, replacing the\nstandard BCEWithLogitsLoss. All other settings (DenseNet121 backbone, data aug,\nTTA) remain unchanged. We train for 3 epochs, compute validation AUROC each\nepoch, and finally save TTA\u2010based predictions on the test folder to\nworking/submission.csv. This focuses learning on challenging lesions and should\nboost discrimination performance.", "I propose adding multi-rotation test-time augmentation by averaging predictions\nover the original image, its horizontal flip, and rotations by 90\u00b0, 180\u00b0, and\n270\u00b0. This should improve robustness and boost AUROC without changing the\ntraining procedure. We will modify both the validation loop and the `predict()`\nfunction to apply these five augmentations. The rest of the pipeline, including\nthe DenseNet121 backbone and focal loss, will remain unchanged.", "We will integrate a OneCycleLR scheduler to dynamically adjust the learning rate\nduring training, ramping up to a higher peak and then annealing, which often\nyields better convergence and generalization. We will train for 5 epochs, set\nmax_lr=1e-3 in OneCycleLR, and step the scheduler after each batch. All other\ncomponents\u2014DenseNet121 backbone, focal loss, and horizontal-flip TTA\u2014remain\nunchanged. This single change should boost validation AUROC without altering\ndata or architecture.", "I propose adding ColorJitter augmentation to the training transforms to simulate\nrealistic variations in lesion color and improve model robustness. We will\ninsert `transforms.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2,\nhue=0.1)` into the training pipeline and keep the rest of the DenseNet121 +\nfocal\u2010loss + horizontal\u2010flip TTA setup unchanged. This simple color augmentation\noften yields measurable gains in skin lesion classification tasks.", "I propose integrating CutMix augmentation into the training loop: for each\nbatch, with probability p=0.5 we sample \u03bb\u223cBeta(1,1), cut a random patch, and mix\nimages and labels accordingly. This encourages the model to generalize by\nlearning from mixed samples and should boost AUROC. The rest of the\npipeline\u2014including DenseNet121, focal loss, optimizer, and horizontal\u2010flip TTA\nat validation and prediction\u2014remains unchanged.", "I propose replacing the DenseNet121 backbone with a pretrained EfficientNet-B0\nto leverage its more efficient architecture and stronger inductive biases, which\noften yield higher accuracy on image tasks. We will adapt the classifier head to\noutput a single logit, keep the focal loss and horizontal\u2010flip TTA unchanged,\nand train for five epochs to allow the new backbone to converge. This single\nchange should boost the AUROC without altering data pipelines or loss functions.", "I will implement multi-crop test\u2010time augmentation by replacing the\nhorizontal\u2010flip TTA with TenCrop TTA (5 corners + center and their horizontal\nflips), averaging predictions over these 10 crops for both validation and the\nfinal predict function. This should yield more robust probabilities and improve\nthe AUROC without changing the backbone or training settings. The rest of the\ntraining pipeline remains the same.", "I propose adding a cosine annealing learning rate scheduler to gradually reduce\nthe learning rate from its initial value down to a small minimum over the course\nof training. This smooth decay often improves convergence and generalization\ncompared to a fixed learning rate. We will wrap the existing EfficientNet-B0 +\nfocal loss setup with `CosineAnnealingLR`, stepping it after each epoch, and\nkeep all other components\u2014including TenCrop TTA\u2014unchanged.", "I propose integrating a cosine annealing learning rate scheduler to dynamically\ndecrease the learning rate from its initial value down to a small minimum over\nthe course of training, which often improves convergence and generalization. We\nwill add `CosineAnnealingLR` with `T_max=EPOCHS` and `eta_min=1e-6`, stepping it\nafter each epoch, while keeping the existing EfficientNet\u2010B0 backbone, focal\nloss, and TenCrop TTA unchanged. This simple change should boost the validation\nAUROC without altering data pipelines or model architecture.", "I propose replacing the Adam optimizer with AdamW (Adam with decoupled weight\ndecay) to regularize the EfficientNet\u2010B0 model and improve generalization. We\nwill set a small weight decay (e.g., 1e-4) while keeping all other\ncomponents\u2014focal loss, data augmentations, TenCrop TTA, and training\nhyperparameters\u2014unchanged. This single change often yields a measurable boost in\nvalidation AUROC without altering the training pipeline. We will retrain for 5\nepochs and report the new AUROC on the hold\u2010out set.", "I propose integrating an Exponential Moving Average (EMA) of model weights\nduring training to smooth parameter updates and improve generalization. We will\nmaintain an `ema_model` alongside the main model, updating its parameters after\neach optimizer step with a decay factor (e.g., 0.999), and then use the EMA\nmodel for both validation and final predictions. This single change is\nlightweight, atomic, and often yields a measurable boost in AUROC without\naltering data pipelines or architecture.", "We integrate a OneCycleLR scheduler to cyclically adjust the learning rate per\nbatch, ramping up to a peak and annealing back, which often improves convergence\nand generalization. We set max_lr to 1e-3, specify the number of epochs and\nsteps per epoch, and step the scheduler after every optimizer update. This\nchange is orthogonal to the data pipeline, model architecture, and loss\nfunction, and should boost the validation AUROC."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom PIL import Image\n\n# Configuration\nDATA_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nBATCH_SIZE = 32\nNUM_EPOCHS = 3\nLEARNING_RATE = 1e-4\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load and prepare labels\ndf = pd.read_csv(CSV_PATH)\n# Map labels: malignant=1, else 0\ndf[\"target\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n# Train/validation split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"target\"], random_state=42\n)\n\n\n# Dataset class\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform, labeled=True):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.labeled = labeled\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        image = self.transform(image)\n        if self.labeled:\n            label = row[\"target\"]\n            return image, label\n        else:\n            return image, row[\"image_name\"]\n\n\n# Transforms\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# DataLoaders\ntrain_ds = SkinDataset(train_df, DATA_DIR, transform, labeled=True)\nval_ds = SkinDataset(val_df, DATA_DIR, transform, labeled=True)\ntrain_loader = DataLoader(train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# Model\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 2)\nmodel = model.to(DEVICE)\ncriterion = nn.CrossEntropyLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=LEARNING_RATE)\n\n# Training loop\nfor epoch in range(NUM_EPOCHS):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    epoch_loss = running_loss / len(train_loader.dataset)\n    print(f\"Epoch {epoch+1}/{NUM_EPOCHS}, Loss: {epoch_loss:.4f}\")\n\n# Evaluation\nmodel.eval()\nall_targets = []\nall_probs = []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(DEVICE)\n        outputs = model(imgs)\n        probs = torch.softmax(outputs, dim=1)[:, 1].cpu().numpy()\n        all_probs.extend(probs)\n        all_targets.extend(labels.numpy())\nauroc = roc_auc_score(all_targets, all_probs)\nprint(f\"Validation AUROC: {auroc:.4f}\")\n\n\n# Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for all images in folder_path.\n    Returns a DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    df_pred = pd.DataFrame({\"image_name\": [os.path.splitext(f)[0] for f in files]})\n    ds = SkinDataset(df_pred, folder_path, transform, labeled=False)\n    loader = DataLoader(ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    model.eval()\n    preds = []\n    with torch.no_grad():\n        for imgs, names in loader:\n            imgs = imgs.to(DEVICE)\n            outputs = model(imgs)\n            probs = torch.softmax(outputs, dim=1)[:, 1].cpu().numpy()\n            for name, p in zip(names, probs):\n                preds.append({\"image_name\": name, \"malignancy_prob\": p})\n    return pd.DataFrame(preds)\n\n\n# Generate and save submission\nsubmission = predict(DATA_DIR)\nos.makedirs(\"./working\", exist_ok=True)\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(\"Saved predictions to ./working/submission.csv\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset for training and validation\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        image = self.transform(image)\n        label = torch.tensor(row.malignant, dtype=torch.float32)\n        return image, label\n\n\n# Prediction function\ndef predict(folder_path, model_path=\"./working/model.pth\", batch_size=32):\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # model architecture\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    files = sorted([f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")])\n    results = []\n    loader = DataLoader(\n        files, batch_size=batch_size, shuffle=False, collate_fn=lambda x: x\n    )\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            for fname in batch:\n                img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for fname, p in zip(batch, probs):\n                name = os.path.splitext(fname)[0]\n                results.append({\"image_name\": name, \"malignancy\": float(p)})\n    df_out = pd.DataFrame(results)\n    df_out.to_csv(\"./working/submission.csv\", index=False)\n    return df_out\n\n\n# Main training and evaluation\ndef main():\n    # Read data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"malignant\"] = (df[\"label\"] == \"malignant\").astype(int)\n    img_dir = \"./input/MyImages\"\n    # Transforms\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"malignant\"])):\n        train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n        train_ds = LesionDataset(train_df, img_dir, transform)\n        val_ds = LesionDataset(val_df, img_dir, transform)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n            device\n        )\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = optim.Adam(model.parameters(), lr=1e-4)\n        # Train 2 epochs per fold\n        for epoch in range(2):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(device), labels.to(device)\n                optimizer.zero_grad()\n                logits = model(imgs).squeeze(1)\n                loss = criterion(logits, labels)\n                loss.backward()\n                optimizer.step()\n        # Evaluate\n        model.eval()\n        all_labels, all_scores = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1)\n                probs = torch.sigmoid(logits).cpu().numpy()\n                all_scores.extend(probs.tolist())\n                all_labels.extend(labels.numpy().tolist())\n        auc = roc_auc_score(all_labels, all_scores)\n        print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n        aucs.append(auc)\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV AUROC: {mean_auc:.4f}\")\n    # Retrain on full dataset\n    full_ds = LesionDataset(df, img_dir, transform)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\n    model_full = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=1\n    ).to(device)\n    optimizer = optim.Adam(model_full.parameters(), lr=1e-4)\n    for epoch in range(3):\n        model_full.train()\n        for imgs, labels in full_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model_full(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n    # Save final model\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model_full.state_dict(), \"./working/model.pth\")\n    # Generate submission.csv\n    predict(\"./input/MyImages\", model_path=\"./working/model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\nimport lightgbm as lgb\n\n# Configuration\nDATA_CSV = \"input/mydataset.csv\"\nIMG_DIR = \"input/MyImages\"\nSUBMISSION_PATH = \"working/submission.csv\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 64\nRANDOM_STATE = 42\n\n\n# Image dataset for feature extraction\nclass ImageDataset(Dataset):\n    def __init__(self, paths, transform):\n        self.paths = paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        return self.transform(img)\n\n\n# Feature extractor: pretrained ResNet50 without final fc\ndef get_feature_extractor():\n    model = models.resnet50(pretrained=True)\n    model.fc = nn.Identity()\n    model = model.to(DEVICE).eval()\n    return model\n\n\n# Extract features for a list of image paths\ndef extract_features(model, paths, transform, batch_size=BATCH_SIZE):\n    dataset = ImageDataset(paths, transform)\n    loader = DataLoader(\n        dataset, batch_size=batch_size, shuffle=False, num_workers=4, pin_memory=True\n    )\n    feats = []\n    with torch.no_grad():\n        for imgs in loader:\n            imgs = imgs.to(DEVICE)\n            out = model(imgs)\n            feats.append(out.cpu().numpy())\n    return np.vstack(feats)\n\n\n# Prediction function: load images from folder, extract features, predict probabilities, save CSV\ndef predict(lgb_model, feat_model, transform, folder_path, output_csv=SUBMISSION_PATH):\n    os.makedirs(os.path.dirname(output_csv), exist_ok=True)\n    files = sorted(\n        [f for f in os.listdir(folder_path) if f.lower().endswith((\".jpg\", \".png\"))]\n    )\n    paths = [os.path.join(folder_path, f) for f in files]\n    feats = extract_features(feat_model, paths, transform)\n    probs = lgb_model.predict_proba(feats)[:, 1]\n    df_out = pd.DataFrame({\"image_name\": files, \"malignancy_proba\": probs})\n    df_out.to_csv(output_csv, index=False)\n    print(f\"Saved predictions to {output_csv}\")\n\n\ndef main():\n    # Load metadata\n    df = pd.read_csv(DATA_CSV)\n    # Binary label: malignant vs others\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Full image paths\n    df[\"img_path\"] = df[\"image_name\"].astype(str) + \".jpg\"\n    df[\"img_path\"] = df[\"img_path\"].apply(lambda x: os.path.join(IMG_DIR, x))\n\n    # Train/validation split\n    train_df, val_df = train_test_split(\n        df, test_size=0. iterion = FocalLoss(alpha=0.25, gamma=2.0)\n    optimizer = AdamW(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)\n    scheduler = OneCycleLR(\n        optimizer,\n        max_lr=LR,\n        epochs=EPOCHS,\n        steps_per_epoch=len(train_loader),\n        pct_start=0.3,\n        anneal_strategy=\"cos\",\n        div_factor=10.0,\n        final_div_factor=100.0,\n    )\n\n    # Training loop with scheduler\n    for epoch in range(1, EPOCHS + 1):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            scheduler.step()\n            running_loss += loss.item() * imgs.size(0)\n        epoch_loss = running_loss / len(train_loader.dataset)\n        print(f\"Epoch {epoch}/{EPOCHS} - Train Loss: {epoch_loss:.4f}\")\n\n    # Validation with TenCrop TTA\n    model.eval()\n    resize = transforms.Resize(256)\n    to_tensor = transforms.ToTensor()\n    normalize = transforms.Normalize(mean, std)\n    tencrop = transforms.TenCrop(224)\n    all_preds = []\n    all_labels = []\n    with torch.no_grad():\n        for _, row in val_df.iterrows():\n            img = Image.open(os.path.join(IMG_DIR, f\"{row.image_name}.jpg\")).convert(\n                \"RGB\"\n            )\n            crops = tencrop(resize(img))\n            batch = torch.stack([normalize(to_tensor(c)) for c in crops]).to(DEVICE)\n            logits = model(batch)\n            prob = torch.sigmoid(logits).mean().item()\n            all_preds.append(prob)\n            all_labels.append(row.label)\n    auc = roc_auc_score(all_labels, all_preds)\n    print(f\"Validation AUROC (OneCycleLR, TenCrop TTA): {auc:.4f}\")\n\n    # Final test-time-augmented prediction\n    predict(IMG_DIR, model, DEVICE, mean, std)\n\n   x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;

    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;

  };

      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
