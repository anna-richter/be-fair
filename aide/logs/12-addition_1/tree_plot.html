let treeStructData = {"edges": [[2, 5], [5, 6], [6, 9], [6, 7], [6, 8], [9, 10], [10, 11], [11, 15], [11, 12], [11, 14], [11, 16], [11, 13], [14, 18], [16, 17], [16, 19]], "layout": [[0.0, 0.0], [0.18181818181818182, 0.0], [0.36363636363636365, 0.0], [0.5454545454545454, 0.0], [0.7272727272727273, 0.0], [0.36363636363636365, 0.1428571428571429], [0.36363636363636365, 0.2857142857142857], [0.18181818181818182, 0.4285714285714286], [0.36363636363636365, 0.4285714285714286], [0.5454545454545454, 0.4285714285714286], [0.5454545454545454, 0.5714285714285714], [0.5454545454545454, 0.7142857142857143], [0.18181818181818182, 0.8571428571428572], [0.36363636363636365, 0.8571428571428572], [0.5454545454545454, 0.8571428571428572], [0.7272727272727273, 0.8571428571428572], [0.9090909090909091, 0.8571428571428572], [0.8181818181818182, 1.0], [0.5454545454545454, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 to predict malignancy (1=malignant,\n0=otherwise) using binary cross\u2010entropy loss.  Images are loaded from\n`input/MyImages` with standard augmentations on the training set and normalized\nas in ImageNet, and we split the 16577 samples stratified into an 80:20\ntrain/validation hold\u2010out.  We train for five epochs with Adam, evaluate the\nAUROC on the validation set, print the AUROC, and save the model to\n`./working/model.pth`.  A `predict(folder_path)` function loads the saved model\nand returns a dictionary of malignancy probabilities for all images in a given\nfolder.", "We fine\u2010tune a pretrained EfficientNet\u2010B0 backbone from the timm library to\npredict lesion malignancy, training with AdamW and BCEWithLogitsLoss.  We\nperform 5\u2010fold stratified cross\u2010validation on the 16,577 samples, computing the\nmean AUROC across folds to assess performance.  After CV we retrain the model on\nthe full dataset for a few more epochs and save the checkpoint to\n`./working/model.pth`.  A `predict(folder_path)` function loads the saved model\nand returns malignancy probabilities for new images.", "We fine-tune a pretrained DenseNet121 on our binary malignant vs non\u2010malignant\ntask using an 80/20 stratified split.  Images are resized to 224\u00d7224 and\nnormalized with ImageNet stats; we apply random flips and rotations on the\ntraining set.  We train for 8 epochs with AdamW and a cosine\u2010annealing scheduler\noptimizing BCEWithLogitsLoss.  After training we evaluate the AUROC on the\nhold\u2010out validation set, print it, save the model to `./working/model.pth`, and\nprovide a reusable `predict(folder_path)` function that returns malignancy\nprobabilities for new images.", "We fine\u2010tune a pretrained MobileNetV2 on the binary malignant vs non\u2010malignant\ntask by replacing its classifier head with a single\u2010unit output. Images are\nresized to 224\u00d7224 with random crops, flips, and ImageNet normalization, and we\nsplit the 16,577 samples into an 80/20 stratified train/validation set. We train\nfor five epochs with AdamW optimizing BCEWithLogitsLoss, evaluate the validation\nAUROC using sklearn\u2019s roc_auc_score, and save the best model to\n'./working/model.pth'. A reusable predict(folder_path) function loads the saved\nmodel and returns malignancy probabilities for new images.", "We fine-tune a pretrained ResNet34 with a binary head to predict malignancy\nusing an 80/20 stratified split on the 16,577 samples. Images are resized and\naugmented with random crops and flips for training, then normalized with\nImageNet statistics. We train for 5 epochs with AdamW and BCEWithLogitsLoss,\nevaluate the validation AUROC, print the result, and save the model to\n`./working/model.pth`. A reusable `predict(folder_path)` function loads the\nsaved weights and returns a dictionary of malignancy probabilities for images in\na given folder.", "I will add MixUp augmentation during training to regularize the model by\nblending pairs of samples and their labels. This only requires a small mixup\nhelper function and adjusting the training loop to compute the mixed inputs and\nmixed losses, while keeping all other hyperparameters and the DenseNet121\nbackbone the same. This atomic change should improve generalization and raise\nthe validation AUROC.", "I propose adding test\u2010time augmentation (TTA) by averaging predictions over the\noriginal, horizontally flipped, and vertically flipped versions of each image\nduring validation. This simple change should improve robustness without altering\nthe training procedure. We keep the DenseNet121 with MixUp training as before\nand only modify the validation loop to use TTA. The validation AUROC is then\ncomputed on these averaged predictions and printed.", "I propose adding ColorJitter augmentation (random brightness, contrast,\nsaturation, and hue changes) to the training transforms to improve robustness to\nlighting and skin\u2010tone variations. This simple change is orthogonal to our\nexisting DenseNet121+MixUp+TTA pipeline and should yield better generalization\nwithout altering other hyperparameters. We will keep all other settings the same\nand evaluate the impact on validation AUROC.", "I propose adding RandomErasing augmentation to the training pipeline after\nnormalization, which forces the model to handle occlusions and improves\nrobustness. This complements the existing MixUp and geometric augmentations\nwithout changing hyperparameters or model architecture. We keep test\u2010time\naugmentation and all other settings the same, and retrain the DenseNet121 for\neight epochs before evaluating on the hold\u2010out set. This atomic change should\nyield a small boost in validation AUROC.", "I propose integrating CutMix data augmentation during training to further\nimprove model robustness. We define a `cutmix_data` function to randomly replace\npatches between images and mix labels accordingly, replacing the existing MixUp\naugmentation. All other hyperparameters, model architecture, and test\u2010time\naugmentation remain unchanged. This atomic change should enhance generalization\nand boost AUROC.", "I will replace the deprecated `np.int` calls with the built-in `int` type to fix\nthe CutMix bounding\u2010box size calculations. This straightforward change preserves\nthe original behavior while avoiding the NumPy alias error. The rest of the\ntraining and evaluation pipeline remains unchanged: we load data, apply CutMix\nduring training, perform TTA at validation, compute and print AUROC, and save\nthe trained model. The `predict()` function is also included for future\ninference.", "I propose adding an Exponential Moving Average (EMA) of the model weights during\ntraining with a decay factor (e.g., 0.999) and using the EMA weights for\nvalidation and final saving. EMA stabilizes the learned parameters and often\nyields better generalization compared to the raw weights. This change is\northogonal to existing augmentations (CutMix, TTA) and hyperparameters, so it\ncan be evaluated as an atomic improvement. After training we evaluate the EMA\nmodel on the hold\u2010out set and save its weights for inference.", "I propose adding RandAugment to the training transforms to increase augmentation\ndiversity and improve robustness to lighting and artifacts. We insert\n`transforms.RandAugment()` before the existing geometric augmentations, keeping\nDenseNet121, CutMix, EMA, and TTA unchanged. This atomic change should yield a\nsmall boost in validation AUROC. All other hyperparameters and pipeline\ncomponents remain the same to isolate the effect of RandAugment.", "I will replace the standard BCEWithLogitsLoss with a Focal Loss (gamma=2,\nalpha=0.25) to focus the model on hard\u2010to\u2010classify lesions and mitigate class\nimbalance. All other components (DenseNet121 backbone, CutMix, EMA,\nCosineAnnealingLR, and test\u2010time augmentation) remain unchanged. This atomic\nchange should improve the AUROC by emphasizing difficult examples during\ntraining.", "I propose replacing the EMA weight averaging with PyTorch\u2019s built\u2010in Stochastic\nWeight Averaging (SWA). We wrap our model in an `AveragedModel`, begin updating\nSWA weights after epoch 5, then update batch norm statistics using the training\nloader before validation. Finally we evaluate the SWA\u2010averaged model with the\nexisting CutMix and TTA pipeline and save those weights. This change is\northogonal and should improve generalization.", "We replace the standard BCEWithLogitsLoss with a binary focal loss (gamma=2,\nalpha=0.25) to focus training on hard\u2010to\u2010classify lesions.  We implement a\nlightweight FocalLoss module and plug it into the existing training loop (with\nCutMix, EMA, CosineAnnealingLR, and TTA unchanged), then retrain for eight\nepochs and print the new AUROC.", "To address the class imbalance and ensure the model sees sufficient malignant\nexamples during training, we introduce a WeightedRandomSampler that oversamples\nthe minority class based on inverse class frequency. This simple change balances\neach batch without altering any other component of the pipeline. We keep the\nDenseNet121 backbone, CutMix, EMA, CosineAnnealingLR, and TTA unchanged. We\nretrain on the same hold\u2010out split and report the new validation AUROC.", "I propose extending test\u2010time augmentation by including 90\u00b0, 180\u00b0, and 270\u00b0\nrotations in addition to horizontal and vertical flips when averaging\npredictions. This change is orthogonal to the existing pipeline (CutMix, EMA,\nWeightedSampler) and only affects the validation and inference loops, making it\na clear atomic improvement. Averaging over these six augmented views will\nimprove robustness to lesion orientation and yield a small AUROC boost.", "We introduce a WeightedRandomSampler that balances samples across skin tones so\nthat each skin tone contributes equally during training. We compute inverse-\nfrequency weights per sample and use these in the training DataLoader, replacing\nthe `shuffle=True` approach. We also fix the SWA model save/load by saving\n`swa_model.module.state_dict()` and loading it directly into the base model in\n`predict()` without wrapping it in `AveragedModel`, ensuring proper weight\nrestoration. Finally, we print the validation AUROC and provide a fully\ndocumented `predict()` function that applies TTA on new images.", "We extend test\u2010time augmentation (TTA) by averaging predictions over six\naugmented views: original, horizontal flip, vertical flip, and 90\u00b0, 180\u00b0, 270\u00b0\nrotations. This change is applied both during validation and in the `predict()`\nfunction, leaving the training pipeline (DenseNet121, CutMix, EMA,\nWeightedSampler, scheduler) unchanged. Averaging over these orientation\naugmentations should improve robustness to lesion orientation and boost AUROC."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(self.image_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = 1 if row.label == \"malignant\" else 0\n        return img, torch.tensor(label, dtype=torch.float32)\n\n\n# Prepare data\ndf = pd.read_csv(\"input/mydataset.csv\")\ndf_train, df_val = train_test_split(\n    df,\n    test_size=0.2,\n    stratify=df.label.map(lambda x: 1 if x == \"malignant\" else 0),\n    random_state=42,\n)\n\ntrain_transform = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ColorJitter(0.2, 0.2, 0.2, 0.1),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\ntrain_ds = SkinLesionDataset(df_train, \"input/MyImages\", train_transform)\nval_ds = SkinLesionDataset(df_val, \"input/MyImages\", val_transform)\n\ntrain_loader = DataLoader(\n    train_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n)\nval_loader = DataLoader(\n    val_ds, batch_size=32, shuffle=False, num_workers=4, pin_memory=True\n)\n\n# Model, loss, optimizer\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(device)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n# Training loop\nepochs = 5\nfor epoch in range(epochs):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    epoch_loss = running_loss / len(train_loader.dataset)\n    print(f\"Epoch {epoch+1}/{epochs}, Loss: {epoch_loss:.4f}\")\n\n# Validation\nmodel.eval()\nall_labels = []\nall_preds = []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(device)\n        logits = model(imgs)\n        probs = torch.sigmoid(logits).cpu().numpy().flatten()\n        all_preds.extend(probs)\n        all_labels.extend(labels.numpy())\nauroc = roc_auc_score(all_labels, all_preds)\nprint(f\"Validation AUROC: {auroc:.4f}\")\n\n# Save the model\nos.makedirs(\"working\", exist_ok=True)\ntorch.save(model.state_dict(), \"working/model.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n        folder_path (str): Path to folder containing .jpg images.\n    Returns:\n        dict: {image_name: probability_of_malignant}\n    \"\"\"\n    # reload model\n    mdl = models.resnet18(pretrained=False)\n    mdl.fc = nn.Linear(mdl.fc.in_features, 1)\n    mdl.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    mdl = mdl.to(device).eval()\n    # transform\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    preds = {}\n    files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    loader = DataLoader(files, batch_size=32)\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            for fname in batch:\n                img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            outs = torch.sigmoid(mdl(imgs)).cpu().numpy().flatten()\n            for fname, p in zip(batch, outs):\n                preds[fname] = float(p)\n    return preds", "import os\nimport random\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom tqdm import tqdm\n\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\n\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\n# fix random seeds\ndef seed_everything(seed=42):\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n\n\nseed_everything()\n\n\n# dataset\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = 1 if row.label == \"malignant\" else 0\n        return img, torch.tensor(label, dtype=torch.float32)\n\n\n# transforms\ntrain_tfms = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.RandomHorizontalFlip(),\n        T.RandomRotation(15),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\nval_tfms = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# load data\ndf = pd.read_csv(\"./input/mydataset.csv\")\nimg_dir = \"./input/MyImages\"\ny = df.label.apply(lambda x: 1 if x == \"malignant\" else 0).values\n\n# training settings\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nn_splits = 5\nepochs_cv = 5\nbatch_size = 32\nskf = StratifiedKFold(n_splits=n_splits, shuffle=True, random_state=42)\n\naucs = []\nfor fold, (tr_idx, val_idx) in enumerate(skf.split(df, y), 1):\n    train_df, val_df = df.iloc[tr_idx], df.iloc[val_idx]\n    train_ds = SkinDataset(train_df, img_dir, train_tfms)\n    val_ds = SkinDataset(val_df, img_dir, val_tfms)\n    train_loader = DataLoader(\n        train_ds, batch_size=batch_size, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=batch_size, shuffle=False, num_workers=4)\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    model.to(device)\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4, weight_decay=1e-5)\n    criterion = nn.BCEWithLogitsLoss()\n    # train\n    for epoch in range(epochs_cv):\n        model.train()\n        for x, yb in train_loader:\n            x, yb = x.to(device), yb.to(device)\n            pred = model(x).view(-1)\n            loss = criterion(pred, yb)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # validate\n    model.eval()\n    preds, trues = [], []\n    with torch.no_grad():\n        for x, yb in val_loader:\n            x = x.to(device)\n            out = model(x).view(-1).cpu().numpy()\n            preds.extend(torch.sigmoid(torch.tensor(out)).numpy())\n            trues.extend(yb.numpy())\n    auc = roc_auc_score(trues, preds)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\nprint(f\"Mean CV AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\n\n# retrain on full data\nfull_ds = SkinDataset(df, img_dir, train_tfms)\nfull_loader = DataLoader(full_ds, batch_size=batch_size, shuffle=True, num_workers=4)\nmodel_full = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n    device\n)\nopt_full = torch.optim.AdamW(model_full.parameters(), lr=1e-4, weight_decay=1e-5)\nfor epoch in range(5):\n    model_full.train()\n    for x, yb in full_loader:\n        x, yb = x.to(device), yb.to(device)\n        loss = nn.BCEWithLogitsLoss()(model_full(x).view(-1), yb)\n        opt_full.zero_grad()\n        loss.backward()\n        opt_full.step()\n# save model\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(model_full.state_dict(), \"./working/model.pth\")\n\n\n# prediction function\ndef predict(folder_path):\n    \"\"\"\n    Load the saved model and predict malignancy probability (0-1) for each image in folder_path.\n    Returns a dict {image_filename: probability}.\n    \"\"\"\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model.to(device).eval()\n    tfm = val_tfms\n    results = {}\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith((\".jpg\", \".png\")):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = tfm(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(x)).item()\n            results[fname] = prob\n    return results\n\n\n# Example usage:\n# print(predict('./input/MyImages'))", "import os\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row[\"binary_label\"], dtype=torch.float32)\n        return img, label\n\n\ndef main():\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Load data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"binary_lab le() else \"cpu\")\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    for fname in sorted(os.listdir(folder_path)):\n        if not fname.lower().endswith((\".jpg\", \".jpeg\", \".png\")):\n            continue\n        path = os.path.join(folder_path, fname)\n        img = Image.open(path).convert(\"RGB\")\n        inp = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            out1 = torch.sigmoid(model(inp).squeeze(1))\n            out2 = torch.sigmoid(model(torch.flip(inp, dims=[3])).squeeze(1))\n            out3 = torch.sigmoid(model(torch.flip(inp, dims=[2])).squeeze(1))\n            prob = ((out1 + out2 + out3) / 3.0).item()\n        results[fname] = prob\n    return results\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport copy\nimport random\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row[\"binary_label\"], dtype=torch.float32)\n        return img, label\n\n\ndef cutmix_data(x, y, alpha=1.0, device=\"cpu\"):\n    if alpha > 0:\n        lam = np.random.beta(alpha, alpha)\n    else:\n        lam = 1.0\n    batch_size, _, H, W = x.size()\n    index = torch.randperm(batch_size).to(device)\n    y_a, y_b = y, y[index]\n    cut_rat = np.sqrt(1.0 - lam)\n    cut_w = int(W * cut_rat)\n    cut_h = int(H * cut_rat)\n    cx = np.random.randint(W)\n    cy = np.random.randint(H)\n    bbx1 = np.clip(cx - cut_w // 2, 0, W)\n    bby1 = np.clip(cy - cut_h // 2, 0, H)\n    bbx2 = np.clip(cx + cut_w // 2, 0, W)\n    bby2 = np.clip(cy + cut_h // 2, 0, H)\n    x_cut = x.clone()\n    x_cut[:, :, bby1:bby2, bbx1:bbx2] = x[index, :, bby1:bby2, bbx1:bbx2]\n    lam_adjusted = 1.0 - ((bbx2 - bbx1) * (bby2 - bby1) / (W * H))\n    return x_cut, y_a, y_b, lam_adjusted\n\n\ndef main():\n    seed = 42\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"binary_label\"], random_state=seed\n    )\n\n    train_transforms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transforms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    train_ds = SkinLesionDataset(train_df, \"input/MyImages\", train_transforms)\n    val_ds = SkinLesionDataset(val_df, \"input/MyImages\", val_transforms)\n\n    labels = train_df[\"binary_label\"].values\n    class_counts = np.bincount(labels)\n    class_weights = 1.0 / class_counts\n    sample_weights = class_weights[labels]\n    sampler = WeightedRandomSampler(\n        weights=sample_weights, num_samples=len(sample_weights), replacement=True\n    )\n\n    train_loader = DataLoader(\n        train_ds, batch_size=32, sampler=sampler, num_workers=4, pin_memory=True\n    )\n    val_loader = DataLoader(\n        val_ds, batch_size=32, shuffle=False, num_workers=4, pin_memory=True\n    )\n\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(device)\n    ema_model = copy.deepcopy(model)\n    for p in ema_model.parameters():\n        p.requires_grad_(False)\n    ema_decay = 0.999\n\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4, weight_decay=1e-5)\n    scheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=8)\n    epochs = 8\n\n    for epoch in range(epochs):\n        model.train()\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            mixed_imgs, y_a, y_b, lam = cutmix_data(\n                imgs, labels, alpha=1.0, device=device\n            )\n            optimizer.zero_grad()\n            outputs = model(mixed_imgs).squeeze(1)\n            loss = lam * criterion(outputs, y_a) + (1 - lam) * criterion(outputs, y_b)\n            loss.backward()\n            optimizer.step()\n            with torch.no_grad():\n                msd = model.state_dict()\n                for k, v in ema_model.state_dict().items():\n                    v.copy_(ema_decay * v + (1.0 - ema_decay) * msd[k])\n        scheduler.step()\n\n    # Validation with Extended TTA\n    ema_model.eval()\n    all_labels, all_preds = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            # prepare six variants\n            variants = [\n                imgs,\n                torch.flip(imgs, dims=[3]),\n                torch.flip(imgs, dims=[2]),\n                torch.rot90(imgs, k=1, dims=(2, 3)),\n                torch.rot90(imgs, k=2, dims=(2, 3)),\n                torch.rot90(imgs, k=3, dims=(2, 3)),\n            ]\n            preds = 0\n            for var in variants:\n                preds += torch.sigmoid(ema_model(var).squeeze(1))\n            preds /= len(variants)\n            all_preds.extend(preds.cpu().numpy())\n            all_labels.extend(labels.numpy())\n\n    auc = roc_auc_score(all_labels, all_preds)\n    print(f\"Validation AUROC with Extended TTA: {auc:.4f}\")\n\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(ema_model.state_dict(), \"working/model.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    Load the trained EMA model and return a dict mapping image filenames to malignancy probability.\n    Applies the same Extended TTA (flips + rotations) as during validation.\n    Args:\n        folder_path (str): Path to a folder containing image files.\n    Returns:\n        dict: {filename: probability}\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    results = {}\n    for fname in sorted(os.listdir(folder_path)):\n        if not fname.lower().endswith((\".jpg\", \".jpeg\", \".png\")):\n            continue\n        path = os.path.join(folder_path, fname)\n        img = Image.open(path).convert(\"RGB\")\n        inp = transform(img).unsqueeze(0).to(device)\n        variants = [\n            inp,\n            torch.flip(inp, dims=[3]),\n            torch.flip(inp, dims=[2]),\n            torch.rot90(inp, k=1, dims=(2, 3)),\n            torch.rot90(inp, k=2, dims=(2, 3)),\n            torch.rot90(inp, k=3, dims=(2, 3)),\n        ]\n        pred = 0\n        with torch.no_grad():\n            for var in variants:\n                pred += torch.sigmoid(model(var).squeeze(1))\n        prob = (pred / len(variants)).item()\n        results[fname] = prob\n    return results\n\n\nif __name__ == \"__main__\":\n    main()"], "term_out": ["Epoch 1/5, Loss: 0.3359\nEpoch 2/5, Loss: 0.2913\nEpoch 3/5, Loss: 0.2668\nEpoch 4/5, Loss: 0.2585\nEpoch 5/5, Loss: 0.2483\nValidation AUROC: 0.8873\nExecution time: 3 minutes seconds (time limit is an hour).", "[04:51:56] INFO     [04:51:56] - timm.models._builder - INFO -   _builder.py:217\n                    Loading pretrained weights from Hugging Face                \n                    hub (timm/efficientnet_b0.ra_in1k)                          \n           INFO     [04:51:56] - timm.models._hub - INFO -           _hub.py:233\n                    [timm/efficientnet_b0.ra_in1k] Safe alternative             \n                    available for 'pytorch_model.bin' (as                       \n                    'model.safetensors'). Loading weights using                 \n                    safetensors.                                                \n           INFO     [04:51:56] - timm.models._builder - INFO -   _builder.py:282\n                    Missing keys (classifier.weight,                            \n                    classifier.bias) discovered while loading                   \n                    pretrained weights. This is exp let lastClick = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
