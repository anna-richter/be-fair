let treeStructData = {"edges": [[1, 5], [5, 6], [6, 7], [7, 9], [7, 8], [7, 10], [10, 12], [10, 14], [10, 13], [10, 11], [14, 15], [15, 19], [15, 18], [15, 16], [15, 17]], "layout": [[0.0, 0.0], [0.2, 0.0], [0.4, 0.0], [0.6, 0.0], [0.8, 0.0], [0.2, 0.1428571428571429], [0.2, 0.2857142857142857], [0.2, 0.4285714285714286], [0.0, 0.5714285714285714], [0.2, 0.5714285714285714], [0.4, 0.5714285714285714], [0.1, 0.7142857142857143], [0.3, 0.7142857142857143], [0.5, 0.7142857142857143], [0.7, 0.7142857142857143], [0.7, 0.8571428571428572], [0.4, 1.0], [0.6, 1.0], [0.8, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 to distinguish malignant vs non-malignant\nlesions by mapping benign and non-neoplastic to class 0 and malignant to class\n1. We split the data into an 80/20 stratified train/validation split, apply\nbasic augmentations (random crop and flip) for training, and normalize inputs\nusing ImageNet statistics. We train for 10 epochs with BCEWithLogitsLoss and\nAdam, then evaluate the hold\u2010out set by computing AUROC. The trained model is\nsaved, and a predict(folder_path) function loads it to return malignancy\nprobabilities for new images.", "We fine-tune a pretrained DenseNet121 to predict malignancy by mapping\n\u201cmalignant\u201d to 1 and others to 0. We split the data into an 80/20 stratified\ntrain/validation set, apply random resized crops and horizontal flips during\ntraining, and normalize inputs with ImageNet statistics. We train for eight\nepochs using BCEWithLogitsLoss and the Adam optimizer, selecting the best model\nby validation AUROC. After training we print the final AUROC and provide a\npredict(folder_path) function to load the saved model and return malignancy\nprobabilities for new images.", "We fine-tune a pretrained EfficientNet-B0 to classify lesions as malignant (1)\nversus benign/non-neoplastic (0). We perform an 80/20 stratified split, apply\nrandom resized crops and flips with ImageNet normalization for training, and\nsimple resize/center-crop normalization for validation. The model is trained for\nfive epochs using BCEWithLogitsLoss and Adam, and we evaluate with AUROC on the\nhold\u2010out set. We save the best model and provide a predict(folder_path) function\nthat loads the model to return malignancy probabilities for new images.", "We fine\u2010tune a pretrained MobileNetV2 to classify lesions as malignant (1)\nversus benign/non\u2010neoplastic (0) using an 80/20 stratified train/validation\nsplit. We apply random resized crops and horizontal flips during training and\nsimple resize/center\u2010crop for validation, normalizing with ImageNet stats. The\nmodel is trained for 7 epochs using BCEWithLogitsLoss and Adam, and validation\nAUROC is computed each epoch, saving the best model. A predict(folder_path)\nfunction is provided to load the saved model and return malignancy probabilities\nfor new images.", "We will fine\u2010tune a ResNeXt50 32\u00d74d pretrained on ImageNet to classify lesions\nas malignant or benign using an 80/20 stratified split of the provided data. We\napply random resized crops and horizontal flips during training, with\ncenter\u2010crop for validation, and normalize images using ImageNet statistics. The\nmodel is trained for 8 epochs with BCEWithLogitsLoss and Adam, tracking\nvalidation AUROC and saving the best model. A predict(folder_path) function\nloads the saved model and returns malignancy probabilities for new images. We\nprint out the best validation AUROC at the end.", "I propose adding test-time augmentation (TTA) using TenCrop on validation and\ninference to average predictions over multiple crops for each image. This\ninvolves using a TenCrop transformer in the validation pipeline, reshaping the\nbatch to run all crops through the model, then averaging the sigmoid\nprobabilities across crops to compute a more robust AUROC. The same TTA logic is\napplied in the `predict()` function to improve inference robustness. This atomic\nchange can boost discriminative performance without altering model architecture\nor training regimen.", "I propose integrating Mixup augmentation during training by sampling lambda from\na Beta(\u03b1, \u03b1) distribution (\u03b1=0.4) to linearly interpolate both images and labels\nwithin each batch. This simple yet effective regularization should improve model\ngeneralization and boost AUROC without altering the architecture or adding\ninference overhead. We retain the existing TenCrop TTA for validation and\ninference.", "I will correct the mixup loss by removing the extra unsqueeze on the labels and\nensuring both model outputs and targets are 1D tensors before passing them to\nBCEWithLogitsLoss. The mixup_data function will now take 1D label tensors and\nthe training loop will squeeze the model outputs to match this shape. The rest\nof the training, validation with TTA, and model saving logic remains the same,\nand the script will print out the best validation AUROC.", "I propose integrating a OneCycleLR learning rate scheduler with AdamW optimizer\n(including weight decay) to improve optimization dynamics and generalization. We\nset max_lr=1e-3, weight_decay=1e-4, and configure OneCycleLR for\ntotal_steps=epochs*len(train_loader), stepping per batch. This atomic change\nshould boost convergence and validation AUROC without modifying data pipelines\nor model architecture.", "I propose replacing the standard BCEWithLogitsLoss with a Focal Loss (gamma=2,\nalpha=0.25) to focus learning on hard and minority-class examples. This change\nis atomic and integrates seamlessly with the existing mixup and TTA pipelines,\naiming to improve AUROC by better handling class imbalance without altering the\nmodel architecture or training regimen. The rest of the code, including data\nloading, augmentation, training loop, and TTA-based evaluation, remains\nunchanged. We will implement FocalLoss and use it in the mixup loss computation,\nthen train and report the best validation AUROC.", "I propose replacing the DenseNet121 backbone with a pretrained EfficientNet-B0\nmodel, which often yields better parameter efficiency and accuracy on image\ntasks. We will swap in EfficientNet-B0 and adjust its classifier head to output\na single logit, while keeping mixup, TTA, and the rest of the training pipeline\nunchanged. This atomic change leverages EfficientNet\u2019s superior feature\nrepresentations without altering data augmentations or training regimen. The\nscript below implements this swap and prints the validation AUROC.", "I propose adding a ColorJitter augmentation to the training pipeline to improve\nrobustness to color and lighting variations, which can help the model generalize\nbetter across different skin tones. This change is atomic and involves inserting\na `transforms.ColorJitter` step between the random flip and tensor conversion.\nAll other components\u2014including EfficientNet-B0, mixup, TTA, and optimizer\nsettings\u2014remain unchanged. We'll retrain for 8 epochs and report the new\nvalidation AUROC.", "I propose adding a strong regularization step via RandomErasing to the training\naugmentation pipeline, which randomly occludes part of the image after\nnormalization to improve robustness and generalization. This is an atomic change\nthat complements the existing ColorJitter and mixup strategy without touching\nthe model architecture or training loop. All other components\u2014including\nEfficientNet-B0, mixup, TTA, optimizer settings\u2014remain unchanged so we can\ndirectly measure the impact of RandomErasing on validation AUROC.", "I propose replacing the Adam optimizer with AdamW (including weight decay) and\nadding a OneCycleLR learning rate scheduler to dynamically adjust the learning\nrate during training. We will set weight_decay=1e-4, base_lr=1e-5, max_lr=1e-3,\nand configure OneCycleLR over the full training schedule, stepping per batch.\nThis change should improve convergence, avoid overfitting, and boost validation\nAUROC without altering the existing mixup, TTA, or model architecture.", "I propose increasing model capacity by swapping the backbone from\nEfficientNet-B0 to EfficientNet-B1 and raising the input resolution to 240\u00d7240.\nThis atomic change leverages a more powerful pretrained model and larger crops\nto capture finer lesion details without altering the rest of the mixup, TTA, and\ntraining pipeline. We update the train and validation transforms (including TTA\nin predict) accordingly and retrain for eight epochs to evaluate the impact on\nvalidation AUROC.", "I propose swapping the EfficientNet-B1 backbone for EfficientNet-B2 and\nincreasing the input resolution to 260\u00d7260 to leverage its greater capacity and\nfiner feature extraction. We update the training transforms to\nRandomResizedCrop(260) and the validation/TTA transforms to TenCrop(260) from\nResize(280), while keeping mixup augmentation, TTA averaging, optimizer\nsettings, and training regime unchanged. This atomic change should improve the\nmodel\u2019s discriminative power and boost validation AUROC.", "I propose integrating the AdamW optimizer with weight decay and a OneCycleLR\nlearning rate scheduler into the existing EfficientNet-B2 pipeline. We will\nreplace Adam with AdamW (weight_decay=1e-4) and configure OneCycleLR with\nmax_lr=1e-3 over epochs*iterations, stepping each batch. This change should\nimprove convergence and generalization without modifying data augmentations,\nmixup, TTA, or model architecture. We retain the 80/20 train/validation split\nand report the best validation AUROC.", "I propose replacing the EfficientNet\u2010B2 backbone with EfficientNet\u2010B3 and\nincreasing the input and crop sizes to 300\u00d7300 to capture finer lesion details,\nwhile keeping the rest of the mixup, TTA, and training pipeline unchanged. We\nupdate the training transforms to RandomResizedCrop(300), the validation/TTA\ntransforms to TenCrop(300) after Resize(320), and switch the model instantiation\nto EfficientNet\u2010B3. We then retrain for 8 epochs, compute and print the\nvalidation AUROC, and update the `predict()` function to match the new model and\ncrop size.", "We will replace the single hold\u2010out split with stratified 5\u2010fold\ncross\u2010validation, training an EfficientNet-B2 model on each fold and saving the\nbest checkpoint per fold based on validation AUROC. After all folds, we report\neach fold AUROC and their mean. We also update the `predict()` function to load\nall 5 fold models and ensemble their TTA\u2010average predictions by averaging across\nmodels.", "I propose replacing the single hold\u2010out split with stratified 5\u2010fold\ncross\u2010validation of the EfficientNet\u2010B2 model, training each fold with mixup and\nTTA and saving the best checkpoint per fold based on validation AUROC. After all\nfolds complete, we compute and print each fold\u2019s AUROC and their mean as the\nfinal validation metric. We also implement a `predict(folder_path)` function\nthat loads all fold models and returns an ensemble malignancy probability for\neach new image by averaging TTA predictions across models."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\n\n\n# Custom dataset\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = 1 if row.label == \"malignant\" else 0\n        return image, torch.tensor(label, dtype=torch.float32)\n\n\n# Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# Map labels: malignant=1, others=0\ndf = df[df.label.isin([\"malignant\", \"benign\", \"non-neoplastic\"])]\n# Stratified split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, random_state=42, stratify=df.label == \"malignant\"\n)\n\n# Transforms\ntrain_tf = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# Datasets and loaders\ntrain_ds = LesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\nval_ds = LesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\ntrain_loader = DataLoader(train_ds, batch_size=16, shuffle=True, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n\n# Model setup\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(device)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n# Training loop\nepochs = 10\nfor epoch in range(epochs):\n    model.train()\n    running_loss = 0.0\n    for images, labels in train_loader:\n        images, labels = images.to(device), labels.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(images)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * images.size(0)\n    epoch_loss = running_loss / len(train_loader.dataset)\n    print(f\"Epoch {epoch+1}/{epochs}, Loss: {epoch_loss:.4f}\")\n\n# Validation\nmodel.eval()\nall_probs = []\nall_labels = []\nwith torch.no_grad():\n    for images, labels in val_loader:\n        images = images.to(device)\n        logits = model(images)\n        probs = torch.sigmoid(logits).cpu().numpy().flatten()\n        all_probs.extend(probs)\n        all_labels.extend(labels.numpy().flatten())\nauc = roc_auc_score(all_labels, all_probs)\nprint(f\"Validation AUROC: {auc:.4f}\")\n\n# Save model\nos.makedirs(\"./working\", exist_ok=True)\nmodel_path = \"./working/model.pth\"\ntorch.save(model.state_dict(), model_path)\n\n\ndef predict(folder_path: str, model_path: str = \"./working/model.pth\") -> dict:\n    \"\"\"\n    Load the trained model and return malignancy probabilities for all .jpg images\n    in folder_path. Returns a dict mapping filename to probability between 0 and 1.\n    \"\"\"\n    # Load model\n    m = models.resnet18(pretrained=False)\n    m.fc = nn.Linear(m.fc.in_features, 1)\n    m.load_state_dict(torch.load(model_path, map_location=\"cpu\"))\n    m.eval()\n    m.to(device)\n    # Transform\n    tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith(\".jpg\"):\n            path = os.path.join(folder_path, fname)\n            img = Image.open(path).convert(\"RGB\")\n            inp = tf(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(m(inp)).item()\n            results[fname] = prob\n    return results", "import os\nimport torch\nimport pandas as pd\nfrom PIL import Image\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.label_map = {\"malignant\": 1, \"benign\": 0, \"non-neoplastic\": 0}\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = float(self.label_map[row.label])\n        return img, label\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in folder_path.\n    Returns a DataFrame with columns ['image_name','malignancy_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load model\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(\"working/best_model.pth\", map_location=device))\n    model.to(device).eval()\n    # transform\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    records = []\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith(\".jpg\"):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(device)\n            logit = model(inp)\n            prob = torch.sigmoid(logit).item()\n            records.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(records)\n\n\ndef main():\n    # Paths\n    df = pd.read_csv(\"input/mydataset.csv\")\n    img_dir = os.path.join(\"input\", \"MyImages\")\n    # train/val split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df.label, random_state=42\n    )\n    # transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # datasets & loaders\n    train_ds = SkinDataset(train_df, img_dir, transform=train_tf)\n    val_ds = SkinDataset(val_df, img_dir, transform=val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    best_auc = 0.0\n\n    # training loop\n    for epoch in range(8):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        # validation\n        model.eval()\n        all_logits = []\n        all_labels = []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).cpu().squeeze(1).tolist()\n                all_logits.extend(logits)\n                all_labels.extend(labels.tolist())\n        auc = roc_auc_score(all_labels, torch.sigmoid(torch.tensor(all_logits)).numpy())\n        print(f\"Epoch {epoch+1}/8 - Val AUROC: {auc:.4f}\")\n        if auc > best_auc:\n            best_auc = auc\n            os.makedirs(\"working\", exist_ok=True)\n            torch.save(model.state_dict(), \"working/best_model.pth\")\n    print(f\"Best Validation AUROC: {best_auc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.labels = df[\"label\"].values\n        self.fnames = df[\"image_name\"].values\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        fname = self.fnames[idx] + \".jpg\"\n        path = os.path.join(self.img_dir, fname)\n        img = Image.open(path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = self.labels[idx]\n        return img, torch.tensor(label, dtype=torch.float32)\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0.0\n    for images, labels in loader:\n        images, labels = images.to(device), labels.to(device)\n        optimizer.zero_grad()\n        outputs = model(images).squeeze(1)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * images.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for images, labels in loader:\n            images = images.to(device)\n            outputs = model(images).squeeze(1)\n            probs = torch.sigmoid(outputs).cpu().numpy()\n            ys.append(labels.numpy())\n            ps.append(probs)\n    y_true = np.concatenate(ys)\n    y_score = np.concatenate(ps)\n    return roc_auc_score(y_true, y_score)\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all images in folder_path.\n    Returns a dict mapping filename to probability.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"model.pth\", map_location=device))\n    model.to(device).eval()\n    tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith((\".jpg\", \".png\")):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            inp = tf(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(inp)).item()\n            results[fname] = prob\n    return et121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(\"working/best_model.pth\", map_location=device))\n    model.to(device).eval()\n    # TTA transform\n    mean = [0.485, 0.456, 0.406]\n    std = [0.229, 0.224, 0.225]\n    ts = transforms.ToTensor()\n    norm = transforms.Normalize(mean, std)\n    tta_transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.TenCrop(224),\n            transforms.Lambda(lambda crops: torch.stack([norm(ts(c)) for c in crops])),\n        ]\n    )\n    records = []\n    with torch.no_grad():\n        for fname in sorted(os.listdir(folder_path)):\n            if not fname.lower().endswith(\".jpg\"):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            crops = tta_transform(img).to(device)  # shape (10, C, H, W)\n            logits = model(crops).squeeze(1)  # (10,)\n            prob = torch.sigmoid(logits).mean().item()\n            records.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(records)\n\n\ndef main():\n    # Paths and data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    img_dir = os.path.join(\"input\", \"MyImages\")\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df.label, random_state=42\n    )\n    # Transforms\n    mean = [0.485, 0.456, 0.406]\n    std = [0.229, 0.224, 0.225]\n    train_tf = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize(mean, std),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.TenCrop(224),\n            transforms.Lambda(\n                lambda crops: torch.stack(\n                    [\n                        transforms. let lastClick = 0;

let nodes = [];
let edges = [];

setup = () => {
  canvas = createCanvas(...updateTargetDims());

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
