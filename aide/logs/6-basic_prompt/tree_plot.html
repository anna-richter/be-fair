let treeStructData = {"edges": [[0, 5], [1, 7], [4, 6], [6, 8], [8, 9], [8, 10], [10, 11], [11, 12], [11, 15], [11, 13], [11, 18], [11, 16], [11, 17], [11, 14], [17, 19]], "layout": [[0.0, 0.0], [0.13333333333333333, 0.0], [0.26666666666666666, 0.0], [0.4, 0.0], [0.5333333333333333, 0.0], [0.0, 0.16666666666666663], [0.5333333333333333, 0.16666666666666663], [0.13333333333333333, 0.16666666666666663], [0.5333333333333333, 0.33333333333333337], [0.4666666666666667, 0.5], [0.6, 0.5], [0.6, 0.6666666666666667], [0.2, 0.8333333333333334], [0.3333333333333333, 0.8333333333333334], [0.4666666666666667, 0.8333333333333334], [0.6, 0.8333333333333334], [0.7333333333333333, 0.8333333333333334], [0.8666666666666667, 0.8333333333333334], [1.0, 0.8333333333333334], [0.8666666666666667, 1.0]], "plan": ["We fine-tune a pretrained ResNet-18 on our lesion images by mapping \"malignant\"\nto 1 and all other labels to 0. We load images via a custom Dataset class, split\n80/20 into train/validation, and apply standard torchvision transforms. We train\nwith BCEWithLogitsLoss for a few epochs and compute AUROC on the hold-out\nvalidation set using sklearn. A reusable predict() function is provided that\ntakes a list of image paths and returns malignant probabilities.", "We fine-tune a pretrained ResNet18 to discriminate malignant vs benign/non-\nneoplastic lesions, splitting the data into a stratified 80/20 train/validation\nset. We apply basic augmentations (random flips, resizing, normalization) during\ntraining and only resizing/normalization during validation. We train for 3\nepochs using Adam and BCEWithLogitsLoss, then compute AUROC on the hold-out set.\nA reusable predict() function accepts a trained model and list of image paths\nand returns probability scores for malignancy.", "We extract features from images using a pretrained ResNet18 model (with the\nfinal fully connected layer removed) and use these 512\u2010dim embeddings to train a\nLightGBM binary classifier (malignant vs benign, dropping non\u2010neoplastic\nsamples). We apply standard resizing, centering, and ImageNet normalization,\nthen run a 5\u2010fold cross\u2010validation to compute the mean AUROC. Finally, we\nretrain the LightGBM on the full data and provide a predict() function that\ntakes a list of image file paths and returns malignancy probabilities.", "We fine-tune a pretrained ResNet18 end-to-end for binary classification of skin\nlesions, mapping malignant to 1 and benign to 0, and dropping non\u2010neoplastic\nsamples. Images are resized to 224\u00d7224, augmented with random flips and\nrotations, and normalized using ImageNet statistics. We split the data into\nstratified 80/20 train/validation sets, train for 5 epochs with\nBCEWithLogitsLoss and Adam, and evaluate AUROC on the validation set. A\n`predict()` function is provided to return malignancy probabilities for new\nimage paths.", "We will fine-tune a pretrained EfficientNet-B0 model from the timm library to\ndistinguish malignant vs. benign lesions, filtering out non-neoplastic samples\nand mapping malignant to 1 and benign to 0. Images will be resized to 224\u00d7224\nand augmented with random flips and rotations, then normalized with ImageNet\nstatistics. We split the filtered data into a stratified 80/20 train/validation\nset, train for 5 epochs using BCEWithLogitsLoss and the Adam optimizer, and\nevaluate AUROC on the validation set. A `predict()` function is provided to load\nnew image paths and return malignancy probabilities.", "We freeze the pretrained ResNet backbone so that only the final linear layer is\ntrained, which greatly reduces computation when running without a modern GPU. We\nalso detect if CUDA is unavailable and lower the number of epochs and batch size\naccordingly, and set DataLoader num_workers=0 to avoid multiprocessing hangs. A\ndocumented `predict()` function is provided for reusability, and at the end we\nprint the validation AUROC score. This approach should complete within the time\nlimit even on CPU-only environments.", "We will integrate MixUp augmentation into the training loop with \u03b1=0.2 to\nimprove generalization by mixing image pairs and their labels before computing\nthe loss. For each batch, we sample \u03bb from a Beta distribution, shuffle the\nbatch, and create mixed inputs and paired targets. We then compute the\nBCEWithLogitsLoss as a weighted sum of losses on the two label sets according to\n\u03bb. This simple yet powerful augmentation encourages smoother decision boundaries\nand should boost AUROC. Below is the updated self\u2010contained training and\nevaluation script:", "We can greatly speed up and stabilize training by freezing the ResNet18 feature\nextractor and only fine\u2010tuning the final classification layer, which reduces\ncompute and avoids potential DataLoader deadlocks by lowering `num_workers`. We\nreinitialize `model.fc`, freeze all other layers, and only optimize the head\u2019s\nparameters. This lets us train in just a few seconds per epoch, print the\nvalidation AUROC, and still provide a reusable `predict()` function.", "I fixed the shape mismatch by removing the extra `unsqueeze(1)` on the mixed\nlabels\u2014now `y_a` and `y_b` (each of shape [batch,1]) directly match the model\nlogits for loss computation. Everything else remains the same, and we still\noutput the final validation AUROC. The `predict()` function is included for easy\nreuse on new image folders.", "We propose to improve optimization and regularization by switching to the AdamW\noptimizer with weight decay and adding a cosine annealing learning\u2010rate\nscheduler. This scheduler will gradually decrease the learning rate to help the\nmodel converge smoothly and potentially escape local minima, yielding better\ngeneralization. We keep the existing MixUp augmentation and EfficientNet\u2010B0\nbackbone but now train with AdamW (weight decay=1e\u20102) and step the scheduler\neach epoch. The rest of the training and evaluation pipeline remains unchanged.", "We can enhance the robustness of our predictions by applying simple test\u2010time\naugmentation (TTA): for each validation image, we compute predictions on both\nthe original and a horizontally flipped version, then average their\nprobabilities. This requires minimal changes to the code and typically yields a\nsmall but consistent boost in AUROC. We will implement TTA in our `predict()`\nfunction and use it to evaluate the validation set as well as any test set for\ngenerating `submission.csv`.", "We extend our test\u2010time augmentation to include vertical and combined\nhorizontal+vertical flips in addition to the original image, averaging\npredictions over these four versions. We construct four deterministic TTA\ntransforms and modify the predict() function to loop over them, computing the\nmean probability. This simple multi\u2010view averaging should improve robustness and\nAUROC without extra training. The rest of the training pipeline remains\nunchanged.", "I propose to further enhance robustness by extending our test\u2010time augmentation\nto include fixed rotations at 90\u00b0, 180\u00b0, and 270\u00b0 in addition to the existing\nflips. During inference, we will average predictions over these seven views\n(original, H, V, HV, R90, R180, R270). This simple extension should yield a\nsmall boost in validation AUROC without retraining.", "We will enhance the training data augmentation by injecting random color\njitter\u2014varying brightness, contrast, saturation, and hue\u2014to better simulate\nreal\u2010world lighting variations and improve generalization. Specifically, we add\nT.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2, hue=0.1) into the\nexisting train_transform pipeline. Everything else remains unchanged, including\nthe EfficientNet\u2010B0 backbone, MixUp, and multi\u2010view test\u2010time augmentation. We\nwill train for 5 epochs, evaluate validation AUROC, and produce a submission.csv\nfor any test images.", "We can improve model generalization by adding RandomErasing to the training\naugmentation pipeline, which randomly occludes patches during training and\nencourages the network to focus on broader contextual cues. Specifically, we add\ntorchvision.transforms.RandomErasing after normalization in the train_transform.\nThis small change has been shown to reduce overfitting and often yields a\nmeasurable boost in validation AUROC.", "I propose switching from EfficientNet\u2010B0 to the larger EfficientNet\u2010B1 backbone\nand increasing the input resolution to 240\u00d7240. This boosts model capacity and\nspatial detail without changing the rest of the pipeline (MixUp, TTA, etc.), and\nshould improve validation AUROC. Below is the updated training and inference\nscript.", "We switch the backbone to EfficientNet\u2010B1 and increase the input resolution to\n240\u00d7240, giving the model more capacity and spatial detail. We adjust all\ntrain/validation/TTA transforms accordingly and reduce the batch size to 16 to\naccommodate the larger inputs. Everything else (MixUp, multi\u2010view TTA,\nBCEWithLogitsLoss, Adam optimizer, 5 epochs) stays the same, then we print the\nvalidation AUROC and write `submission.csv` if test images are present.", "We will switch to a stratified 5-fold cross-validation and train an\nEfficientNet-B0 model on each fold, using MixUp and the same multi-view TTA at\ninference. For each fold we will collect out-of-fold predictions to compute an\noverall CV AUROC and ensemble the 5 models\u2019 test predictions by averaging. This\nensembling via CV should improve robustness and yield a higher AUROC. All other\nsettings (transforms, optimizer, loss) remain unchanged.", "We replace the BCE loss with a FocalLoss (\u03b3=2, \u03b1=0.25) to focus training on\nhard\u2010to\u2010classify and minority\u2010class examples, which can boost AUROC. The\nFocalLoss is implemented to handle mixed\u2010labels from MixUp, and we leave all\nother training settings, augmentations, and multi\u2010view TTA unchanged. This\natomic change often yields better generalization on imbalanced binary tasks like\nmalignant vs benign detection.", "We can avoid re-downloading the pretrained weights inside each fold by loading\nefficientnet_b0 just once and then deep\u2010copying it for each fold, replacing its\nclassifier head before training. This saves substantial time compared to\nrepeated timm.create_model calls. We also reduce DataLoader workers to 2 to\nlower overhead, and keep the rest of the 5\u2010fold training and TTA inference the\nsame. Finally, we print out the CV AUROC and save test predictions if a TEST_DIR\nexists."], "code": ["import os\nimport glob\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import train_test_split\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, image_paths, labels, transform=None):\n        self.image_paths = image_paths\n        self.labels = labels\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.image_paths[idx]).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(self.labels[idx], dtype=torch.float32)\n        return img, label\n\n\ndef predict(model, image_paths, transform, device):\n    \"\"\"\n    Predict malignant probability for each image in image_paths.\n    Returns a numpy array of probabilities.\n    \"\"\"\n    model.eval()\n    probs = []\n    with torch.no_grad():\n        for p in image_paths:\n            img = Image.open(p).convert(\"RGB\")\n            img = transform(img).unsqueeze(0).to(device)\n            out = model(img)\n            prob = torch.sigmoid(out).item()\n            probs.append(prob)\n    return np.array(probs)\n\n\ndef main():\n    # Read metadata and map labels\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label_binary\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n    # Gather all image file paths\n    file_paths = glob.glob(\"./input/MyImages/*.jpg*\")\n    image_paths, labels = [], []\n    for _, row in df.iterrows():\n        name = row[\"image_name\"]\n        matches = [p for p in file_paths if f\"{name}.jpg\" in os.path.basename(p)]\n        if matches:\n            image_paths.append(matches[0])\n            labels.append(row[\"label_binary\"])\n    # Split train/val\n    train_paths, val_paths, train_labels, val_labels = train_test_split(\n        image_paths, labels, test_size=0.2, random_state=42, stratify=labels\n    )\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    # Datasets and loaders\n    train_ds = SkinLesionDataset(train_paths, train_labels, transform=train_tf)\n    val_ds = SkinLesionDataset(val_paths, val_labels, transform=val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    # Training loop\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        for imgs, lbls in train_loader:\n            imgs, lbls = imgs.to(device), lbls.to(device).unsqueeze(1)\n            preds = model(imgs)\n            loss = criterion(preds, lbls)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # Validation\n    all_probs, all_labels = [], []\n    model.eval()\n    with torch.no_grad():\n        for imgs, lbls in val_loader:\n            imgs = imgs.to(device)\n            preds = model(imgs)\n            probs = torch.sigmoid(preds).cpu().numpy().flatten()\n            all_probs.extend(probs)\n            all_labels.extend(lbls.numpy())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.target, dtype=torch.float32)\n        return img, label\n\n\ndef predict(model, image_paths, device=\"cpu\"):\n    \"\"\"\n    Predict malignancy probabilities for a list of image file paths.\n    Args:\n        model (torch.nn.Module): trained binary classification model with sigmoid output.\n        image_paths (List[str]): list of file paths to JPEG images.\n        device (str): 'cpu' or 'cuda'.\n    Returns:\n        numpy.ndarray: probabilities of malignancy for each image.\n    \"\"\"\n    model.to(device).eval()\n    tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    probs = []\n    with torch.no_grad():\n        for path in image_paths:\n            img = Image.open(path).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(device)\n            logits = model(x)\n            p = torch.sigmoid(logits).item()\n            probs.append(p)\n    return np.array(probs)\n\n\ndef main():\n    # Load metadata\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # Map to binary: malignant=1, else=0\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"target\"], random_state=42\n    )\n    img_dir = \"./input/MyImages\"\n    # Transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Datasets & loaders\n    train_ds = SkinLesionDataset(train_df, img_dir, train_tf)\n    val_ds = SkinLesionDataset(val_df, img_dir, val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.to(device)\n\n    # Loss & optimizer\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Train\n    for epoch in range(3):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.unsqueeze(1).to(device)\n            optimizer.zero_grad()\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch+1} train loss: {running_loss/len(train_ds):.4f}\")\n\n    # Validate\n    model.eval()\n    all_logits, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).cpu().squeeze()\n            all_logits.extend(logits.numpy().tolist())\n            all_labels.extend(labels.numpy().tolist())\n    probs = torch.sigmoid(torch.tensor(all_logits)).numpy()\n    auc = roc_auc_score(all_labels, probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import KFold\nfrom sklearn.metrics import roc_auc_score\nfrom lightgbm import LGBMClassifier\nimport torch\nimport torch.nn as nn\nfrom torchvision import models, transforms\nfrom torch.utils.data import Dataset, DataLoader\n\n# 1. Load and preprocess metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# Keep only benign and malignant\ndf = df[df[\"label\"].isin([\"benign\", \"malignant\"])].reset_index(drop=True)\n# Map labels: malignant=1, benign=0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n# 2. Build image path mapping\nimg_dir = \"./input/MyImages\"\nmapping = {}\nfor f in os.listdir(img_dir):\n    if \".jpg\" in f.lower():\n        base = f.split(\".jpg\")[0]\n        mapping[base] = os.path.join(img_dir, f)\n# Filter rows with existing files\ndf[\"path\"] = df[\"image_name\"].map(mapping)\ndf = df.dropna(subset=[\"path\"]).reset_index(drop=True)\n\n\n# 3. Define dataset & model for feature extraction\nclass ImageDataset(Dataset):\n    def __init__(self, paths, transform):\n        self.paths = paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        return self.transform(img), idx\n\n\ntransform = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nbackbone = models.resnet18(pretrained=True)\nbackbone.fc = nn.Identity()\nbackbone = backbone.to(device).eval()\n\n# 4. Extract features\nall_paths = df[\"path\"].tolist()\ndataset = ImageDataset(all_paths, transform)\nloader = DataLoader(dataset, batch_size=64, shuffle=False, num_workers=4)\nfeatures = np.zeros((len(dataset), 512), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(device)\n        feats = backbone(imgs).cpu().numpy()\n        features[idxs.numpy(), :] = feats\nlabels = df[\"target\"].values\n\n# 5. 5-fold CV with LightGBM\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor train_idx, val_idx in kf.split(features):\n    clf = LGBMClassifier(n_estimators=100, random_state=42)\n    clf.fit(features[train_idx], labels[train_idx])\n    probs = clf.predict_proba(features[val_idx])[:, 1]\n    aucs.append(roc_auc_score(labels[val_idx], probs))\nprint(f\"Mean 5-fold AUROC: {np.mean(aucs):.4f}\")\n\n# 6. Retrain final model on all data\nfinal_clf = LGBMClassifier(n_estimators=100, random_state=42)\nfinal_clf.fit(features, labels)\n\n\ndef predict(image_paths):\n    \"\"\"\n    Predict malignancy probability for new images.\n    Args:\n        image_paths (list of str): file paths to images.\n    Returns:\n        np.ndarray: probabilities of malignant class for each image.\n    \"\"\"\n    ds = ImageDataset(image_paths, transform)\n    dl = DataLoader(ds, batch_size=64, shuffle=False, num_workers=4)\n    feats = []\n    with torch.no_grad():\n        for imgs, _ in dl:\n            imgs = imgs.to(device)\n            out = backbone(imgs).cpu().numpy()\n            feats.append(out)\n    feats = np.vstack(feats)\n    return final_clf.predict_proba(feats)[:, 1]", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        img_name = self.df.loc[idx, \"image_name\"] + \".jpg\"\n        img_path = os.path.join(self.image_dir, img_name)\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = self.df.loc[idx, \"label_bin\"]\n        return image, torch.tensor(label, dtype=torch.float32)\n\n\ndef predict(model, image_paths, image_dir, batch_size=32):\n    \"\"\"\n    Predict malignancy probabilities for a list of image fi let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
