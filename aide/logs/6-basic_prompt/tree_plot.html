let treeStructData = {"edges": [[2, 5], [5, 8], [5, 6], [6, 7], [8, 11], [8, 9], [8, 10], [8, 12], [12, 18], [12, 17], [12, 14], [12, 15], [12, 16], [12, 13], [18, 19]], "layout": [[0.0, 0.0], [0.13793103448275862, 0.0], [0.27586206896551724, 0.0], [0.41379310344827586, 0.0], [0.5517241379310345, 0.0], [0.27586206896551724, 0.19999999999999996], [0.10344827586206896, 0.4], [0.10344827586206896, 0.6], [0.4482758620689655, 0.4], [0.2413793103448276, 0.6], [0.3793103448275862, 0.6], [0.5172413793103449, 0.6], [0.6551724137931034, 0.6], [0.3103448275862069, 0.8], [0.4482758620689655, 0.8], [0.5862068965517241, 0.8], [0.7241379310344828, 0.8], [0.8620689655172413, 0.8], [1.0, 0.8], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 on the binary task of 'malignant' versus all\nother labels, using simple augmentations and a hold-out validation split. We\nload image paths and labels from the CSV into a custom PyTorch Dataset, train\nfor a few epochs on GPU if available, and evaluate using AUROC on the validation\nset. Finally, we provide a predict() function that takes a folder of new images\nand returns malignancy probabilities. The script prints the validation AUROC at\nthe end.", "We will fine-tune a pretrained EfficientNet-B0 from the timm library on our\nbinary malignant vs benign+non-neoplastic task using 5-fold stratified cross-\nvalidation. Simple on-the-fly augmentations (random crop, flip, rotation) will\nbe applied during training, with standardized resizing at validation. We will\ntrain each fold for 3 epochs with BCEWithLogitsLoss and compute AUROC on out-of-\nfold predictions, printing the mean CV AUROC. Finally, a predict() function will\nload any folder of images, apply the same preprocessing, and output malignancy\nprobabilities.", "We fine-tune a pretrained DenseNet121 on the binary task of distinguishing\nmalignant versus non-malignant lesions, using an 80/20 stratified\ntrain/validation split. Training includes random resized crops, horizontal\nflips, and rotations, while validation uses center-cropped resizing, and we\noptimize with Adam and BCEWithLogitsLoss over 5 epochs. After training, we\ncompute and print the AUROC on the validation set. The model is saved to disk,\nand a reusable predict() function loads the model, processes a folder of new\nimages, and outputs malignancy probabilities, saving them to\n`working/submission.csv`.", "We fine-tune a pretrained MobileNetV2 on malignant vs non-malignant lesions\nusing an 80/20 stratified split. Training employs random resized crops,\nhorizontal flips, and color jitter, while validation uses center-cropped\nresizing. The classifier head is replaced to output a single logit and trained\nwith AdamW and a cosine annealing LR scheduler for 4 epochs. We evaluate the\nfinal model on the validation set using AUROC and print the result. A reusable\n`predict()` function is provided to load the trained model and return malignancy\nprobabilities for new images in a given folder.", "I propose fine-tuning a pretrained ConvNeXt-Tiny model from the timm library on\nthe binary task of malignant versus non-malignant lesions using an 80/20\nstratified hold-out split. Images are loaded from disk with simple augmentations\n(random resized crop, horizontal flip, color jitter) during training and\nresized+center-cropped for validation. The model head is adapted to a single\nlogit and trained with BCEWithLogitsLoss and AdamW over 4 epochs. We compute and\nprint the validation AUROC and provide a `predict()` function that loads a saved\nmodel to output malignancy probabilities for new images.", "I propose to integrate simple test-time augmentation (TTA) by averaging\npredictions from the original and horizontally flipped images during validation\nand final inference. This will make predictions more robust to spatial\nvariations and can boost AUROC without changing the model architecture. The\npredict() function will also use the same TTA approach for test-time\npredictions. Below is the updated implementation:", "I propose integrating mixup data augmentation during training with an alpha of\n0.4 to regularize the model and improve AUROC. Mixup linearly combines random\npairs of images and labels, encouraging smoother decision boundaries. The rest\nof the pipeline (including TTA at validation and inference) remains unchanged,\nensuring compatibility with our existing predict() function.", "I removed the extra `unsqueeze` on mixup labels so that the target shape\n`(batch, 1)` matches the output shape, avoiding the `(batch, 1, 1)` mismatch.\nThe loss is now computed directly with `labels_a` and `labels_b`. Everything\nelse remains same, and we print the validation AUROC at the end and save\n`submission.csv` in `working/`.", "I will replace the Adam optimizer with AdamW including a small weight decay and\nadd a CosineAnnealingLR scheduler over the 5 epochs to gradually decrease the\nlearning rate, improving both convergence and generalization. This lightweight\nchange doesn't affect the data pipeline or model architecture and often yields a\nhigher AUROC with minimal extra code. The weight decay of 1e-4 helps regularize\nthe training. The rest of the pipeline, including augmentations and TTA for\nvalidation, remains unchanged. The script prints the final validation AUROC and\nsaves the trained model and a `predict()` function for inference.", "I propose integrating MixUp augmentation into the training loop with an alpha of\n0.4. During each batch, we mix pairs of images and labels using a sampled\nlambda, then compute the loss as a weighted sum of the BCE losses for both\ntargets. This atomic change can improve generalization without altering the\nmodel architecture or validation strategy. All other components (augmentations,\nscheduler, TTA during validation) remain the same to isolate the effect of\nMixUp.", "I propose replacing the standard BCEWithLogitsLoss with a binary focal loss\n(alpha=0.25, gamma=2) to better focus the model on hard\u2010to\u2010classify malignant\nexamples and mitigate class imbalance. This change is isolated and does not\naffect the data pipeline, model architecture, optimizer, scheduler, or TTA\nevaluation, allowing us to directly assess the impact of focal loss on\nvalidation AUROC.", "I propose integrating Random Erasing augmentation into the training pipeline to\nimprove model robustness to occlusions and noise. We\u2019ll add\n`transforms.RandomErasing(p=0.5, scale=(0.02,0.33), ratio=(0.3,3.3))` after\nnormalization in the training transforms. Everything else, including the model,\noptimizer, scheduler, and TTA, remains unchanged so we can directly measure the\nimpact of Random Erasing on validation AUROC.", "I propose replacing the simple horizontal\u2010flip TTA with 10\u2010crop TTA (5 fixed\ncrops plus their horizontal flips) to average predictions over 10 views, making\ninference more robust. We only adjust the validation and `predict()` pipelines:\n`val_transform` uses `transforms.TenCrop` and stacks normalized crops, while\nduring validation and inference we forward all 10 crops per image and average\nthe sigmoid outputs. All other training settings including Random Erasing,\nCosineAnnealingLR, and DenseNet121 remain unchanged.", "I propose extending our test\u2010time augmentation (TTA) from 10\u2010crop to 20\u2010crop by\nincluding vertical flips of each crop, which can improve robustness to vertical\norientation variations. We will update both the validation and prediction\npipelines to generate 20 views per image (10 crops + their vertical flips) and\naverage their predictions. This change is isolated to the TTA logic and should\nyield a higher AUROC with minimal code modifications.", "I will compute the class imbalance in the training set and set\n`pos_weight=neg_count/pos_count` in `BCEWithLogitsLoss` so the model focuses\nmore on the minority malignant class. All other parts of the pipeline\n(augmentations, 10\u2010crop TTA, optimizer, scheduler, etc.) remain unchanged for an\nisolated evaluation of weighted loss. This change should help improve AUROC by\nmitigating class imbalance. The `predict()` function and CSV output remain the\nsame.", "I propose adding ColorJitter augmentation to the training pipeline to increase\nrobustness to color and lighting variations, which can improve generalization\nwithout changing model architecture or training regime. Specifically, we insert\ntransforms.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2, hue=0.1)\ninto the train_transform before normalization and RandomErasing. All other\ncomponents\u2014including DenseNet121, AdamW+CosineAnnealingLR, RandomErasing, and\n10\u2010crop TTA\u2014remain unchanged. We retrain for 5 epochs and report the validation\nAUROC.", "I propose replacing the static CosineAnnealingLR scheduler with a dynamic\nOneCycleLR schedule that ramps the learning rate up to a higher max (e.g. 1e-3)\nthen back down over the course of training. This single change often yields\nbetter convergence and generalization with minimal code modifications. We\ncompute the total training steps and step the scheduler after every batch rather\nthan each epoch, leaving all other components (model, augmentations, TTA, etc.)\nunchanged.", "I propose replacing the DenseNet121 backbone with an EfficientNet\u2010B0 model from\nthe timm library, which often yields better accuracy with similar inference\ncost. We will swap in `timm.create_model('efficientnet_b0', ...)` for the model\ndefinition and adjust no other parts of the training or TTA pipeline. The same\naugmentations, optimizer, scheduler, and 10\u2010crop test\u2010time augmentation will be\nretained. This atomic change can boost feature representation and improve\nvalidation AUROC without additional complexity.", "I propose integrating a WeightedRandomSampler in the training DataLoader to\noversample the minority malignant class, ensuring each batch is class-balanced\nand mitigating label imbalance without altering architecture or loss. We compute\nper-sample weights inversely proportional to class frequency and use these in a\nWeightedRandomSampler for training. All other components\u2014DenseNet121 backbone,\naugmentations, optimizer, scheduler, and 10\u2010crop TTA\u2014remain unchanged. This\nsingle change should improve the model\u2019s ability to distinguish rare malignant\ncases and boost AUROC.", "I propose replacing the DenseNet121 backbone with a larger EfficientNet-B3 model\nfrom the timm library and increasing the input crop size to 300\u00d7300. This change\nleverages richer feature representations and higher spatial resolution without\naltering the rest of the training pipeline (sampler, augmentations, scheduler,\nTTA). We retain WeightedRandomSampler, ColorJitter, RandomErasing,\nCosineAnnealingLR, and 10\u2010crop TTA, and simply swap in EfficientNet-B3 with\n`num_classes=1` and adjust the transforms accordingly. This atomic switch should\nboost validation AUROC with minimal code changes."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\nimport torch.nn as nn\nimport torch.optim as optim\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\n# Custom Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row[\"label\"], dtype=torch.float32)\n        return image, label\n\n\n# Load and preprocess CSV\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n# Train/validation split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"label\"], random_state=42\n)\n\n# Transforms\ntrain_transforms = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transforms = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Datasets and loaders\ntrain_dataset = SkinLesionDataset(train_df, \"./input/MyImages\", train_transforms)\nval_dataset = SkinLesionDataset(val_df, \"./input/MyImages\", val_transforms)\ntrain_loader = DataLoader(train_dataset, batch_size=32, shuffle=True, num_workers=2)\nval_loader = DataLoader(val_dataset, batch_size=32, shuffle=False, num_workers=2)\n\n# Model setup\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(device)\n\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n# Training loop\nnum_epochs = 3\nfor epoch in range(num_epochs):\n    model.train()\n    running_loss = 0.0\n    for images, labels in train_loader:\n        images, labels = images.to(device), labels.to(device)\n        optimizer.zero_grad()\n        outputs = model(images).squeeze(1)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * images.size(0)\n    epoch_loss = running_loss / len(train_loader.dataset)\n    print(f\"Epoch {epoch+1}/{num_epochs}, Loss: {epoch_loss:.4f}\")\n\n# Validation and AUROC\nmodel.eval()\nall_labels, all_probs = [], []\nwith torch.no_grad():\n    for images, labels in val_loader:\n        images = images.to(device)\n        outputs = model(images).squeeze(1)\n        probs = torch.sigmoid(outputs)\n        all_labels.extend(labels.numpy())\n        all_probs.extend(probs.cpu().numpy())\nroc_auc = roc_auc_score(all_labels, all_probs)\nprint(f\"Validation AUROC: {roc_auc:.4f}\")\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for all images in a folder.\n    Args:\n        image_folder (str): Path to folder containing image files.\n    Returns:\n        pandas.DataFrame: columns ['image_name', 'probability'].\n    \"\"\"\n    model.eval()\n    results = []\n    for fname in sorted(os.listdir(image_folder)):\n        if not fname.lower().endswith((\".jpg\", \"jpeg\", \"png\")):\n            continue\n        path = os.path.join(image_folder, fname)\n        img = Image.open(path).convert(\"RGB\")\n        inp = val_transforms(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            out = model(inp).squeeze(1)\n            prob = torch.sigmoid(out).item()\n        results.append({\"image_name\": os.path.splitext(fname)[0], \"probability\": prob})\n    return pd.DataFrame(results)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        return img, label\n\n\n# Transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\n# Predict function\ndef predict(folder: str):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n      folder (str): path to folder containing .jpg images.\n    Returns:\n      pd.DataFrame with columns ['image_name', 'malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"working/final_model.pth\", map_location=device))\n    model.to(device).eval()\n    files = [f for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n    ds = []\n    for f in files:\n        img = Image.open(os.path.join(folder, f)).convert(\"RGB\")\n        ds.append(val_transform(img))\n    batch = torch.stack(ds).to(device)\n    with torch.no_grad():\n        preds = torch.sigmoid(model(batch)).cpu().numpy().flatten()\n    return pd.DataFrame({\"image_name\": files, \"malignancy_probability\": preds})\n\n\ndef train_and_evaluate():\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # Binary label: malignant=1, else=0\n    df[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    image_dir = \"input/MyImages\"\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    oof_preds, oof_labels = [], []\n\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label), 1):\n        train_df = df.iloc[train_idx]\n        val_df = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(train_df, image_dir, transform=train_transform)\n        val_ds = SkinLesionDataset(val_df, image_dir, transform=val_transform)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n        model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4)\n\n        for epoch in range(3):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n                preds = model(imgs)\n                loss = criterion(preds, labels)\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n\n        # Validation\n        model.eval()\n        preds_fold, labels_fold = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs)\n                probs = torch.sigmoid(logits).cpu().numpy().flatten()\n                preds_fold.extend(probs)\n                labels_fold.extend(labels.numpy().flatten())\n        oof_preds.extend(preds_fold)\n        oof_labels.extend(labels_fold)\n        fold_auc = roc_auc_score(labels_fold, preds_fold)\n        print(f\"Fold {fold} AUROC: {fold_auc:.4f}\")\n\n    mean_auc = roc_auc_score(oof_labels, oof_preds)\n    print(f\"CV Mean AUROC: {mean_auc:.4f}\")\n\n    # Train on full data and save final model\n    full_ds = SkinLesionDataset(df, image_dir, transform=train_transform)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\n    final_model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    final_model.to(device)\n    optimizer = torch.optim.AdamW(final_model.parameters(), lr=1e-4)\n    criterion = nn.BCEWithLogitsLoss()\n    final_model.train()\n    for epoch in range(3):\n        for imgs, labels in full_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            preds = final_model(imgs)\n            loss = criterion(preds, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(final_model.state_dict(), \"working/final_model.pth\")\n\n\nif __name__ == \"__main__\":\n    train_and_evaluate()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedShuffleSplit\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom tqdm import tqdm\n\n\n# Dataset class for training/validation\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
