let treeStructData = {"edges": [[0, 7], [0, 8], [1, 5], [2, 6], [8, 9], [9, 13], [9, 14], [9, 10], [9, 17], [9, 16], [9, 11], [9, 15], [9, 12], [14, 18], [16, 19]], "layout": [[0.4000000000000001, 0.0], [0.6, 0.0], [0.7333333333333333, 0.0], [0.8666666666666667, 0.0], [1.0, 0.0], [0.6, 0.25], [0.7333333333333333, 0.25], [0.33333333333333337, 0.25], [0.46666666666666673, 0.25], [0.46666666666666673, 0.5], [0.0, 0.75], [0.13333333333333333, 0.75], [0.2666666666666667, 0.75], [0.4000000000000001, 0.75], [0.5333333333333333, 0.75], [0.6666666666666666, 0.75], [0.8, 0.75], [0.9333333333333333, 0.75], [0.5333333333333333, 1.0], [0.8, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 on the lesion images, mapping benign and non-\nneoplastic to class 0 and malignant to class 1. To promote fairness across skin\ntones, we sample each batch uniformly across skin_tone groups via a weighted\nsampler. We perform 5-fold stratified cross-validation on the binary labels,\nrecording overall AUROC and AUROC for light (skin_tone\u22643) and dark (skin_tone\u22655)\ngroups to compute the fairness gap. Finally, we average results across folds,\nsave the final model, and provide a predict() function that loads the trained\nmodel and returns malignancy probabilities for new images.", "We fine-tune a pretrained EfficientNet-B0 on 224\u00d7224 lesion images, using a\nweighted sampler to balance skin_tone groups for fairness. We perform 5\u2010fold\nstratified cross\u2010validation on the binary malignancy label, computing overall\nAUROC and AUROC for light (\u22643) and dark (\u22655) skin tones to measure the fairness\ngap. After CV we train on the full dataset, save the final model, and provide a\npredict(folder_path) function that returns malignancy probabilities for new\nimages.", "We extract fixed feature embeddings from a pretrained EfficientNet-B0 for all\nimages, then train a LightGBM classifier on these embeddings to predict\nmalignancy. To mitigate skin tone bias, we weight each sample inversely to its\nskin tone frequency during LightGBM training. We evaluate performance via\nstratified 5-fold cross-validation measuring AUROC. Finally, we retrain on the\nfull dataset and save the LightGBM model, providing a predict() function that\nloads the model and backbone to output malignancy probabilities for new image\nfolders.", "We fine-tune a pretrained ResNet50 from timm, concatenating a learned skin tone\nembedding to the image features before the classification head to mitigate bias.\nWe train with a weighted sampler to address class imbalance and apply standard\naugmentations, evaluating performance via stratified 5-fold cross-validation and\nreporting mean AUROC. The best model is saved to `working/model.pth`, and a\n`predict()` function is provided for inference on new image folders.", "We fine-tune a pretrained EfficientNet-B0, freezing its backbone and training\nonly the final classification layer to distinguish malignant from benign\nlesions. We perform an 80/20 stratified train/validation split on the binary\nlabels, using a weighted sampler during training to address class imbalance. We\ntrain for a few epochs with standard augmentations and compute AUROC on the\nhold-out validation set. Finally, we save the model and provide a `predict()`\nfunction that loads the model and returns malignancy probabilities for new\nimages.", "I updated the model to output a single logit per image (num_classes=1) so that\nBCEWithLogitsLoss receives matching shapes. I adjusted training and inference to\nflatten logits and apply sigmoid for probabilities. The script performs 5-fold\nCV, prints fold and mean AUROC and fairness gap, retrains on all data, saves the\nmodel, implements `predict()`, and writes `submission.csv` in `./working`.", "I replaced the unsupported `early_stopping_rounds` argument with LightGBM\u2019s\ncallback API, using `lgb.early_stopping` and `lgb.log_evaluation`, which\npreserves early stopping behavior without causing a TypeError. The cross-\nvalidation loop now passes callbacks to `fit`, and we still compute and print\nthe mean AUROC. The rest of the training and the `predict()` function remain\nintact, and the final model is retrained on all data and saved to\n`./working/classifier.pkl`.", "I propose enhancing the training data pipeline with stronger augmentations\u2014using\nRandomResizedCrop, flips, and ColorJitter\u2014to improve model generalization,\nespecially on underrepresented skin tones, while keeping the core training loop\nand fairness-aware sampling unchanged.", "I propose integrating MixUp augmentation during training, mixing pairs of images\nand their labels to improve generalization and robustness without altering the\nfairness-aware sampling. Specifically, we sample a mixing coefficient from a\nBeta distribution (\u03b1=0.2) and combine image and label pairs within each batch\nbefore computing the BCE loss. The rest of the pipeline, including the weighted\nsampler by skin tone and 5-fold cross-validation, remains unchanged. This atomic\nchange often yields better AUROC by providing smoother decision boundaries.\nBelow is the updated training script with MixUp implemented.", "We introduce a simple test\u2010time augmentation (horizontal flip) during\nvalidation: for each batch, we compute model outputs on both the original and\nflipped images, average their probabilities, and use these for AUROC\ncalculation. This atomic change often boosts performance without altering\ntraining or fairness sampling. The rest of the pipeline, including MixUp\ntraining and weighted sampling, remains unchanged.", "I propose integrating a OneCycleLR learning rate scheduler to dynamically vary\nthe learning rate during training, which often improves convergence and\ngeneralization. We set a maximum LR of 1e-3 over the 5 epochs and step the\nscheduler each batch, leaving MixUp, weighted sampling, TTA, and fairness\nsampling unchanged. This atomic change should boost CV AUROC by providing a\nsmoother training schedule.", "I propose enhancing test-time augmentation by including vertical flips in\naddition to the existing horizontal flips, averaging predictions over four\nvariants (original, horizontal, vertical, and both flips). This atomic change\nboosts robustness by exposing the model to more symmetries without altering the\ntraining or fairness-aware sampling. We update both the cross\u2010validation\nvalidation loop and the `predict()` function to use this four\u2010fold TTA, and\nreport the mean CV AUROC and fairness gap.", "I propose enhancing test\u2010time augmentation by including vertical flips alongside\nthe existing horizontal flips, averaging predictions over four variants\n(original, horizontal, vertical, and both flips). This atomic change applies to\nboth the cross\u2010validation validation loop and the `predict()` function, boosting\nrobustness without altering training or fairness-aware sampling. By evaluating\nand printing mean CV AUROC and fairness gap with the enhanced TTA, we can\nmeasure the direct impact of this improvement.", "I propose enhancing test-time augmentation by including vertical flips alongside\nthe existing horizontal flips, averaging predictions over four variants\n(original, horizontal, vertical, both) in both the cross\u2010validation validation\nloop and the `predict()` function. This atomic change should boost robustness by\nexposing the model to more symmetries without altering training or\nfairness\u2010aware sampling. The rest of the pipeline\u2014including MixUp, weighted\nsampling, and 5\u2010fold CV\u2014remains unchanged.", "We enhance the training-time augmentation pipeline by adding stronger and more\nvaried transformations\u2014RandomResizedCrop, random horizontal and vertical flips,\nColorJitter, and RandomErasing\u2014to improve model robustness and generalization.\nThe rest of the pipeline (MixUp, weighted sampling by skin tone, 5-fold CV, and\nhorizontal-flip TTA) remains unchanged. This atomic change should boost the CV\nAUROC without affecting fairness across skin tones.", "I propose enhancing the training data augmentation pipeline with stronger,\ndiverse transforms\u2014using RandomResizedCrop, random horizontal and vertical\nflips, ColorJitter and RandomErasing\u2014to improve model robustness and\ngeneralization, especially on underrepresented skin tones. We keep the weighted\nsampler, MixUp, and horizontal-flip test\u2010time augmentation unchanged, and only\nreplace the training transforms. This atomic change often yields measurable\nAUROC gains without touching model architecture or training loop.", "I propose augmenting test\u2010time inference with additional 90\u00b0 rotations alongside\nthe existing horizontal and vertical flips, averaging predictions over seven\nvariants (original, H flip, V flip, HV flip, and 90\u00b0, 180\u00b0, 270\u00b0 rotations) to\nimprove robustness without touching the training loop. This atomic change should\nboost CV AUROC by exposing the model to more geometric transformations at\ninference. We update both the cross\u2010validation validation loop and the\n`predict()` function accordingly.", "I propose enhancing the training data augmentation pipeline by replacing the\nsimple Resize+CenterCrop with a stronger, diverse set of transforms:\nRandomResizedCrop, random horizontal and vertical flips, ColorJitter, and\nRandomErasing. The validation transform remains unchanged to ensure consistent\nevaluation. This atomic change should boost CV AUROC and maintain fairness\nacross skin tones without altering the model architecture or training logic. We\nkeep the MixUp, weighted sampler by skin tone, and horizontal\u2010flip TTA intact.", "We fix the fairness gap computation by separately computing AUROCs for the light\nand dark subgroups and then taking their absolute difference, instead of the\nmalformed inline ternary.  We explicitly handle missing groups by setting their\nAUROC to NaN and only computing the gap if both are present.  We retain the\n5-fold CV training and print both the overall AUROC and the fairness gap.  A\nreusable predict() function is provided, and if a test folder is detected, we\nsave a `submission.csv` in `./working`.", "We will explicitly compute the fairness gap as the absolute difference between\nthe AUROCs for light (tones 1\u20133) and dark (tones 5\u20136) skin groups, filtering out\nunknown or middle tones.  This fixes the previous bug where only the light\u2010skin\nAUROC was used.  The rest of the training and inference pipeline remains the\nsame, and we will print overall CV AUROC and the corrected fairness gap, then\nsave test predictions to submission.csv."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nfrom torchvision import transforms, models\n\n\n# Dataset definition\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = row[\"binary_label\"]\n        skin_tone = row[\"skin_tone\"]\n        return image, label, skin_tone\n\n\n# Predict function\ndef predict(model_path, image_folder, batch_size=32):\n    \"\"\"\n    Load trained model and predict malignancy probability for each image in image_folder.\n    Returns dict {image_name: probability}.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    filenames = sorted(os.listdir(image_folder))\n    out = {}\n    loader = DataLoader(filenames, batch_size=batch_size, shuffle=False)\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            for fn in batch:\n                img = Image.open(os.path.join(image_folder, fn)).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            probs = torch.sigmoid(model(imgs)).cpu().numpy().flatten()\n            for fn, p in zip(batch, probs):\n                out[fn] = float(p)\n    return out\n\n\n# Main training and evaluation\ndef main():\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # binary label\n    df[\"binary_label\"] = df[\"label\"].map(\n        {\"malignant\": 1, \"benign\": 0, \"non-neoplastic\": 0}\n    )\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    overall_aucs, gaps = [], []\n    for train_idx, val_idx in skf.split(df, df[\"binary_label\"]):\n        df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n        # weighted sampler by skin_tone\n        tones = df_train[\"skin_tone\"].values\n        unique, counts = np.unique(tones, return_counts=True)\n        tone_counts = dict(zip(unique, counts))\n        weights = [1.0 / tone_counts[t] for t in tones]\n        sampler = WeightedRandomSampler(\n            weights, num_samples=len(weights), replacement=True\n        )\n        train_ds = LesionDataset(df_train, \"./input/MyImages\", transform)\n        val_ds = LesionDataset(df_val, \"./input/MyImages\", transform)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, sampler=sampler, num_workers=2\n        )\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n\n        # model\n        model = models.resnet18(pretrained=True)\n        model.fc = nn.Linear(model.fc.in_features, 1)\n        model = model.to(device)\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        criterion = nn.BCEWithLogitsLoss()\n\n        # train epochs\n        for epoch in range(3):\n            model.train()\n            for imgs, labels, _ in train_loader:\n                imgs, labels = imgs.to(device), labels.float().to(device)\n                preds = model(imgs).squeeze(1)\n                loss = criterion(preds, labels)\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n\n        # validation\n        model.eval()\n        ys, ps, tones_val = [], [], []\n        with torch.no_grad():\n            for imgs, labels, tones in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1).cpu().numpy()\n                probs = 1 / (1 + np.exp(-logits))\n                ys.extend(labels.numpy())\n                ps.extend(probs)\n                tones_val.extend(tones.numpy())\n        auc = roc_auc_score(ys, ps)\n        # group AUROC\n        df_v = pd.DataFrame({\"y\": ys, \"p\": ps, \"tone\": tones_val})\n        light = df_v[df_v.tone <= 3]\n        dark = df_v[df_v.tone >= 5]\n        auc_light = roc_auc_score(light.y, light.p) if len(light) > 0 else np.nan\n        auc_dark = roc_auc_score(dark.y, dark.p) if len(dark) > 0 else np.nan\n        gap = abs(auc_light - auc_dark)\n        overall_aucs.append(auc)\n        gaps.append(gap)\n\n    print(f\"Mean CV AUROC: {np.nanmean(overall_aucs):.4f}\")\n    print(f\"Mean fairness gap (light vs dark): {np.nanmean(gaps):.4f}\")\n    # save final model\n    torch.save(model.state_dict(), \"model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = 1 if row.label == \"malignant\" else 0\n        skin_tone = row.skin_tone\n        return img, label, skin_tone, row.image_name\n\n\ndef get_sampler(df):\n    # group by skin_tone\n    tones = df.skin_tone.values\n    uniq, counts = np.unique(tones, return_counts=True)\n    inv_counts = {u: 1.0 / c for u, c in zip(uniq, counts)}\n    weights = np.array([inv_counts[t] for t in tones], dtype=np.float32)\n    return WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n\n\n# transforms\ntrain_tf = T.Compose(\n    [\n        T.Resize((256, 256)),\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ColorJitter(0.2, 0.2, 0.2, 0.1),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# filter out rows without known label\ndf = df[df.label.isin([\"benign\", \"malignant\"])].reset_index(drop=True)\n\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs, gaps = [], []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label)):\n    train_df = df.iloc[train_idx]\n    val_df = df.iloc[val_idx]\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\n    sampler = get_sampler(train_df)\n    train_loader = DataLoader(train_ds, batch_size=32, sampler=sampler, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=4)\n\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=2).to(\n        device\n    )\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # train\n    for epoch in range(5):\n        model.train()\n        for imgs, labels, _, _ in train_loader:\n            imgs, labels = imgs.to(device), labels.float().to(device)\n            logits = model(imgs).squeeze()\n            loss = criterion(logits, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # validate\n    model.eval()\n    all_labels, all_probs, all_tones = [], [], []\n    with torch.no_grad():\n        for imgs, labels, tones, _ in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze().cpu().numpy()\n            probs = 1 / (1 + np.exp(-logits))\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy())\n            all_tones.extend(tones.numpy())\n    overall_auc = roc_auc_score(all_labels, all_probs)\n    # fairness groups\n    lt_mask = np.array(all_tones) <= 3\n    dk_mask = np.array(all_tones) >= 5\n    auc_lt = (\n        roc_auc_score(np.array(all_labels)[lt_mask], np.array(all_probs)[lt_mask])\n        if lt_mask.sum() > 0\n        else np.nan\n    )\n    auc_dk = (\n        roc_auc_score(np.array(all_labels)[dk_mask], np.array(all_probs)[dk_mask])\n        if dk_mask.sum() > 0\n        else np.nan\n    )\n    gap = abs(auc_lt - auc_dk)\n    aucs.append(overall_auc)\n    gaps.append(gap)\n    print(f\"Fold {fold}: AUROC={overall_auc:.4f}, gap={gap:.4f}\")\n\nprint(f\"Mean AUROC: {np.nanmean(aucs):.4f}, Mean fairness gap: {np.nanmean(gaps):.4f}\")\n\n# Retrain on full data\nfull_ds = SkinLesionDataset(df, \"./input/MyImages\", transform=train_tf)\nsampler = get_sampler(df)\nfull_loader = DataLoader(full_ds, batch_size=32, sampler=sampler, num_workers=4)\nmodel = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=2).to(device)\nopt = torch.optim.Adam(model.parameters(), lr=1e-4)\ncrit = nn.BCEWithLogitsLoss()\nfor epoch in range(5):\n    model.train()\n    for imgs, labels, _, _ in full_loader:\n        imgs, labels = imgs.to(device), labels.float().to(device)\n        loss = crit(model(imgs).squeeze(), labels)\n        opt.zero_grad()\n        loss.backward()\n        opt.step()\n# save\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(model.state_dict(), \"./working/model.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    folder_path: path to folder containing .jpg images\n    returns: DataFrame with columns ['image_name','malignancy_prob']\n    \"\"\"\n    tf = val_tf\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    m = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=2).to(device)\n    m.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    m.eval()\n    results = []\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith(\".jpg\"):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(device)\n            logit = m(x).item()\n            prob = 1 / (1 + np.exp(-logit))\n            results.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(results)\n\n\n# Example usage:\n# preds = predict('./input/MyImages')\n# preds.to_csv('./working/submission.csv', index=False)", "import os\nimport pickle\nimport pandas as pd\nimport numpy as np\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\nimport lightgbm as lgb\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\nclass EmbeddingDataset(Dataset):\n    def __init__(self, image_names, image_dir, transform):\n        self.image_names = image_names\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_names)\n\n    def __getitem__(self, idx):\n        name = self.image_names[idx]\n        path = os.path.join(self.image_dir, name + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        return img, idx\n\n\nclass PredictionDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        path = self.paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        return img, os.path.basename(path)\n\n\ndef extract_embeddings(df, image_dir, device):\n    model = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n    ).to(device)\n    model.eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = EmbeddingDataset(df[\"image_name\"].values, image_dir, transform)\n    loader = DataLoader(ds, batch_size=64, num_workers=4, pin_memory=True)\n    embeddings = np.zeros((len(df), model.num_features), dtype=np.float32)\n    with torch.no_grad():\n        for imgs, idxs in loader:\n            feats = model(imgs.to(device)).cpu().numpy()\n            embeddings[idxs.numpy(), :] = feats\n    return embeddings\n\n\ndef predict(folder_path: str) -> pd.DataFrame:\n    \"\"\"\n    Load trained model and EfficientNet backbone to compute malignancy probabilities.\n    Args:\n      folder_path: path to folder with .jpg images\n    Returns:\n      DataFrame with columns ['image_name','malignancy_probability']\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load classifier\n    clf = pickle.load(open(\"./working/classifier.pkl\", \"rb\"))\n    # load backbone\n    backbone = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n    ).to(device)\n    backbone.eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    img_paths = [\n        os.path.join(folder_path, f)\n        for f in os.listdir(folder_path)\n        if f.lower().endswith(\".jpg\")\n    ]\n    ds = PredictionDataset(img_paths, transform)\n    loader = DataLoader(ds, batch_size=64, num_workers=4, pin_memory=True)\n    results = []\n    with torch.no_grad():\n        for imgs, names in loader:\n            feats = backbone(imgs.to(device)).cpu().numpy()\n            probs = clf.predict_proba(feats)[:, 1]\n            for n, p in zip(names, probs):\n                results.append((n, p))\n    return pd.DataFrame(results, columns=[\"image_name\", \"malignancy_probability\"])\n\n\nif __name__ == \"__main__\":\n    # load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # extract embeddings\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    X = extract_embeddings(df, \"./input/MyImages\", device)\n    y = df[\"label_bin\"].values\n    # sample weights inversely to skin tone frequency\n    freq = df[\"skin_tone\"].value_counts().to_dict()\n    w = df[\"skin_tone\"].map(lambda x: 1.0 / freq[x]).values\n    w *= len(w) / w.sum()\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for train_idx, val_idx in skf.split(X, y):\n        X_tr, y_tr, w_tr = X[train_idx], y[train_idx], w[train_idx]\n        X_val, y_val = X[val_idx], y[val_idx]\n        clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n        clf.fit(\n            X_tr,\n            y_tr,\n            sample_weight=w_tr,\n            eval_set=[(X_val, y_val)],\n            eval_metric=\"auc\",\n            early_stopping_rounds=50,\n            verbose=False,\n        )\n        preds = clf.predict_proba(X_val)[:, 1]\n        aucs.append(roc_auc_score(y_val, preds))\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n    # retrain on full data\n    final_clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n    final_clf.fit(X, y, sample_weight=w)\n    os.makedirs(\"./working\", exist_ok=True)\n    pickle.dump(final_clf, open(\"./working/classifier.pkl\", \"wb\"))", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, transform):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        path = os.path.join(\"input\", \"MyImages\", f\"{row['image_name']}.jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        st = int(row[\"skin_tone\"]) + 1  # shift -1->0\n        label = float(row[\"label_idx\"])\n        return img, st, label\n\n\n# Model\nclass LesionModel(nn.Module):\n    def __init__(self, num_skin=8, emb_dim=16):\n        super().__init__()\n        self.backbone = timm.create_model(\n            \"resnet50\", pretrained=True, num_classes=0, global_pool=\"avg\"\n        )\n        feat_dim = self.backbone.num_features\n        self.skin_emb = nn.Embedding(num_skin, emb_dim)\n        self.head = nn.Sequential(\n            nn.Linear(feat_dim + emb_dim, 256),\n            nn.ReLU(),\n            nn.Dropout(0.3),\n            nn.Linear(256, 1),\n        )\n\n    def forward(self, x, st):\n        f = self.backbone(x)\n        se = self.skin_emb(st)\n        out = self.head(torch.cat([f, se], dim=1))\n        return out.squeeze(1)\n\n\n# Transforms\ntrain_tf = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.RandomRotation(15),\n        T.ColorJitter(0.2, 0.2, 0.2, 0.1),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Load data\ndf = pd.read_csv(\"input/mydataset.csv\")\n# binary label\ndf[\"label_idx\"] = df[\"label\"].map(lambda x: 1 if x == \"malignant\" else 0)\n# fill missing skin_tone as -1\ndf[\"skin_tone\"] = df[\"skin_tone\"].fillna(-1).astype(int)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\n\nfor fold, (tr_idx, vl_idx) in enumerate(skf.split(df, df[\"label_idx\"])):\n    df_tr, df_vl = df.iloc[tr_idx], df.iloc[vl_idx]\n    # sampler for imbalance\n    counts = df_tr[\"label_idx\"].value_counts().sort_index().values\n    w = 1.0 / counts\n    samp_w = w[df_tr[\"label_idx\"].values]\n    sampler = WeightedRandomSampler(samp_w, len(samp_w), replacement=True)\n\n    ds_tr = SkinLesionDataset(df_tr, train_tf)\n    ds_vl = SkinLesionDataset(df_vl, val_tf)\n    dl_tr = DataLoader(\n        ds_tr, batch_size=32, sampler=sampler, num_workers=4, pin_memory=True\n    )\n    dl_vl = DataLoader(\n        ds_vl, batch_size=64, shuffle=False, num_workers=4, pin_memory=True\n    )\n\n    model = LesionModel().to(device)\n    opt = torch.optim.Adam(model.parameters(), lr=1e-4)\n    loss_fn = nn.BCEWithLogitsLoss()\n\n    best_auc = 0\n    for epoch in range(3):\n        model.train()\n        for imgs, sts, lbs in dl_tr:\n            imgs, sts, lbs = imgs.to(device), sts.to(device), lbs.to(device)\n            opt.zero_grad()\n            out = model(imgs, sts)\n            loss = loss_fn(out, lbs)\n            loss.backward()\n            opt.step()\n        # validation\n        model.eval()\n        preds, trues = [], []\n        with torch.no_grad():\n            for imgs, sts, lbs in dl_vl:\n                imgs, sts = imgs.to(device), sts.to(device)\n                out = model(imgs, sts)\n                probs = torch.sigmoid(out).cpu().numpy()\n                preds.extend(probs)\n                trues.extend(lbs.numpy())\n        auc = roc_auc_score(trues, preds)\n        if auc > best_auc:\n            best_auc = auc\n    print(f\"Fold {fold+1} AUROC: {best_auc:.4f}\")\n    aucs.append(best_auc)\n\n# save final model\nos.makedirs(\"working\", exist_ok=True)\ntorch.save(model.state_dict(), \"working/model.pth\")\nprint(f\"Mean AUROC: {np.mean(aucs):.4f}\")\n\n\n# predict function\ndef predict(image_folder: str):\n    \"\"\"\n    Predict malignancy probability for all images in a folder.\n    Args:\n      image_folder: path to folder containing .jpg images\n    Returns:\n      pandas DataFrame with columns ['image_name','probability']\n    \"\"\"\n    m = LesionModel().to(device)\n    m.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    m.eval()\n    results = []\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    for fname in files:\n        img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n        x = val_tf(img).unsqueeze(0).to(device)\n        # assume unknown skin_tone as -1->0\n        st = torch.tensor([0], dtype=torch.long).to(device)\n        with torch.no_grad():\n            prob = torch.sigmoid(m(x, st)).item()\n        results.append({\"image_name\": fname, \"probability\": prob})\n    return pd.DataFrame(results)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedShuffleSplit\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n# Configuration\nDATA_DIR = \"./input\"\nIMG_DIR = os.path.join(DATA_DIR, \"MyImages\")\nCSV_PATH = os.path.join(DATA_DIR, \"mydataset.csv\")\nMODEL_PATH = \"./working/model.pth\"\nBATCH_SIZE = 32\nNUM_EPOCHS = 5\nLR = 1e-3\nIM es\n)\nsampler = WeightedRandomSampler(\n    sample_weights, num_samples=len(sample_weights), replacement=True\n)\n\ntrain_loader = DataLoader(\n    train_ds, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4\n)\nval_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# Model setup\nmodel = models.efficientnet_b0(pretrained=True)\n# Freeze backbone\nfor param in model.features.parameters():\n    param.requires_grad = False\n# Replace classifier\nin_features = model.classifier[1].in_features\nmodel.classifier = nn.Sequential(\n    nn.Dropout(p=0.2, inplace=True), nn.Linear(in_features, 1)\n)\nmodel = model.to(DEVICE)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = optim.Adam(model.classifier.parameters(), lr=LR)\n\n# Training loop\nfor epoch in range(1, NUM_EPOCHS + 1):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    epoch_loss = running_loss / len(train_ds)\n    print(f\"Epoch {epoch}/{NUM_EPOCHS}, Training Loss: {epoch_loss:.4f}\")\n\n# Validation\nmodel.eval()\nall_labels = []\nall_preds = []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(DEVICE)\n        outputs = model(imgs)\n        probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n        all_preds.extend(probs)\n        all_labels.extend(labels.numpy().flatten())\nauroc = roc_auc_score(all_labels, all_preds)\nprint(f\"Validation AUROC: {auroc:.4f}\")\n\n# Save model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\n# Predict function\ndef predict(image_folder):\n    \"\"\"\n    Load the trained model and predict malignancy probabilities for images in a folder.\n        return img, label, skin_tone, row.image_name\n\n\ndef get_sampler(df):\n    tones = df.skin_tone.values\n    uniq, counts = np.unique(tones, return_counts=True)\n    inv_counts = {u: 1.0 / c for u, c in zip(uniq, counts)}\n    weights = np.array([inv_counts[t] for t in tones], dtype=np.float32)\n    return WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n\n\n# transforms\ntrain_tf = T.Compose(\n    [\n        T.Resize((256, 256)),\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ColorJitter(0.2, 0.2, 0.2, 0.1),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf = df[df.label.isin([\"benign\", \"malignant\"])].reset_index(drop=True)\n\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs, gaps = [], []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label)):\n    train_df = df.iloc[train_idx]\n    val_df = df.iloc[val_idx]\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\n    train_loader = DataLoader(\n        train_ds, batch_size=32, sampler=get_sampler(train_df), num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=4)\n\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n        device\n    )\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # training\n    for epoch in range(5):\n        model.train()\n        for imgs, labels, _, _ in train_loader:\n            imgs = imgs.to(device)\n            labels = labels.to(device)\n            logits = model(imgs).view(-1)\n            loss = criterion(logits, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    # validation\n    model.eval()\n    all_labels, all_probs, all_tones = [], [], []\n    with torch.no_grad():\n        for imgs, labels, tones, _ in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).view(-1).cpu().numpy()\n            probs = 1 / (1 + np.exp(-logits))\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n            all_tones.extend(tones.numpy().tolist())\n\n    overall_auc = roc_auc_score(all_labels, all_probs)\n    all_tones_arr = np.array(all_tones)\n    # define masks, exclude unknown (-1)\n    lt_mask = (all_tones_arr <= 3) & (all_tones_arr > 0)\n    dk_mask = all_tones_arr >= 5\n    auc_lt = (\n        roc_auc_score(np.array(all_labels)[lt_mask], np.array(all_probs)[lt_mask])\n        if lt_mask.sum() > 0\n        else np.nan\n    )\n    auc_dk = (\n        roc_auc_score(np.array(all_labels)[dk_mask], np.array(all_probs)[dk_mask])\n        if dk_mask.sum() > 0\n        else np.nan\n    )\n    gap = abs(auc_lt - auc_dk)\n    aucs.append(overall_auc)\n    gaps.append(gap)\n    print(f\"Fold {fold}: AUROC={overall_auc:.4f}, gap={gap:.4f}\")\n\nprint(f\"Mean AUROC: {np.nanmean(aucs):.4f}, Mean fairness gap: {np.nanmean(gaps):.4f}\")\n\n# Retrain on full data\nfull_ds = SkinLesionDataset(df, \"./input/MyImages\", transform=train_tf)\nfull_loader = DataLoader(full_ds, batch_size=32, sampler=get_sampler(df), num_workers=4)\nmodel = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(device)\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\ncriterion = nn.BCEWithLogitsLoss()\nfor epoch in range(5):\n    model.train()\n    for imgs, labels, _, _ in full_loader:\n        imgs = imgs.to(device)\n        labels = labels.to(device)\n        logits = model(imgs).view(-1)\n        loss = criterion(logits, labels)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n\n# save model\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(model.state_dict(), \"./working/model.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for all .jpg images in folder_path.\n    Returns a DataFrame with columns ['image_name','malignancy_prob'].\n    \"\"\"\n    tf = val_tf\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    m = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1).to(device)\n    m.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    m.eval()\n    results = []\n    with torch.no_grad():\n        for fname in sorted(os.listdir(folder_path)):\n            if not fname.lower().endswith(\".jpg\"):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(device)\n            logit = m(x).view(-1).item()\n            prob = 1 / (1 + np.exp(-logit))\n            results.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(results)\n\n\n# generate submission.csv\nsubmission = predict(\"./input/MyImages\")\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(\"Saved predictions to ./working/submission.csv\")", "import os\nimport pickle\nimport pandas as pd\nimport numpy as np\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\nimport lightgbm as lgb\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\nclass EmbeddingDataset(Dataset):\n    def __init__(self, image_names, image_dir, transform):\n        self.image_names = image_names\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_names)\n\n    def __getitem__(self, idx):\n        name = self.image_names[idx]\n        path = os.path.join(self.image_dir, name + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        return img, idx\n\n\nclass PredictionDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        path = self.paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        img = self.transform(img)\n        return img, os.path.basename(path)\n\n\ndef extract_embeddings(df, image_dir, device):\n    model = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n    ).to(device)\n    model.eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = EmbeddingDataset(df[\"image_name\"].values, image_dir, transform)\n    loader = DataLoader(ds, batch_size=64, num_workers=4, pin_memory=True)\n    embeddings = np.zeros((len(df), model.num_features), dtype=np.float32)\n    with torch.no_grad():\n        for imgs, idxs in loader:\n            feats = model(imgs.to(device)).cpu().numpy()\n            embeddings[idxs.numpy(), :] = feats\n    return embeddings\n\n\ndef predict(folder_path: str) -> pd.DataFrame:\n    \"\"\"\n    Load trained classifier and backbone to compute malignancy probabilities.\n    Args:\n      folder_path: path to folder with .jpg images\n    Returns:\n      DataFrame with columns ['image_name','malignancy_probability']\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load classifier\n    clf = pickle.load(open(\"./working/classifier.pkl\", \"rb\"))\n    # load backbone\n    backbone = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n    ).to(device)\n    backbone.eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    img_paths = [\n        os.path.join(folder_path, f)\n        for f in os.listdir(folder_path)\n        if f.lower().endswith(\".jpg\")\n    ]\n    ds = PredictionDataset(img_paths, transform)\n    loader = DataLoader(ds, batch_size=64, num_workers=4, pin_memory=True)\n    results = []\n    with torch.no_grad():\n        for imgs, names in loader:\n            feats = backbone(imgs.to(device)).cpu().numpy()\n            probs = clf.predict_proba(feats)[:, 1]\n            for n, p in zip(names, probs):\n                results.append((n, p))\n    return pd.DataFrame(results, columns=[\"image_name\", \"malignancy_probability\"])\n\n\nif __name__ == \"__main__\":\n    # load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # extract embeddings\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    X = extract_embeddings(df, \"./input/MyImages\", device)\n    y = df[\"label_bin\"].values\n    # sample weights inversely to skin tone frequency\n    freq = df[\"skin_tone\"].value_counts().to_dict()\n    w = df[\"skin_tone\"].map(lambda x: 1.0 / freq[x]).values\n    w *= len(w) / w.sum()\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for train_idx, val_idx in skf.split(X, y):\n        X_tr, y_tr, w_tr = X[train_idx], y[train_idx], w[train_idx]\n        X_val, y_val = X[val_idx], y[val_idx]\n        clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n        clf.fit(\n            X_tr,\n            y_tr,\n            sample_weight=w_tr,\n            eval_set=[(X_val, y_val)],\n            eval_metric=\"auc\",\n            callbacks=[lgb.early_stopping(stopping_rounds=50), lgb.log_evaluation(0)],\n        )\n        preds = clf.predict_proba(X_val)[:, 1]\n        aucs.append(roc_auc_score(y_val, preds))\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n    # retrain on full data\n    final_clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n    final_clf.fit(X, y, sample_weight=w)\n    os.makedirs(\"./working\", exist_ok=True)\n    pickle.dump(final_clf, open(\"./working/classifier.pkl\", \"wb\"))", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nfrom torchvision import transforms, models\n\n\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = row[\"binary_label\"]\n        skin_tone = row[\"skin_tone\"]\n        return image, label, skin_tone\n\n\ndef predict(model_path, image_folder, batch_size=32):\n    \"\"\"\n    Load trained model and predict malignancy probability for each image in image_folder.\n    Returns dict {image_name: probability}.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    filenames = sorted(os.listdir(image_folder))\n    out = {}\n    loader = DataLoader(filenames, batch_size=batch_size, shuffle=False)\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            for fn in batch:\n                img = Image.open(os.path.join(image_folder, fn)).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            probs = torch.sigmoid(model(imgs)).cpu().numpy().flatten()\n            for fn, p in zip(batch, probs):\n                out[fn] = float(p)\n    return out\n\n\ndef main():\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"binary_label\"] = df[\"label\"].map(\n        {\"malignant\": 1, \"benign\": 0, \"non-neoplastic\": 0}\n    )\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n\n    train_transform = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomVerticalFlip(),\n            transforms.ColorJitter(\n                brightness=0.2, contrast=0.2, saturation=0.2, hue=0.1\n            ),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    overall_aucs, gaps = [], []\n    for train_idx, val_idx in skf.split(df, df[\"binary_label\"]):\n        df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n        tones = df_train[\"skin_tone\"].values\n        unique, counts = np.unique(tones, return_counts=True)\n        tone_counts = dict(zip(unique, counts))\n        weights = [1.0 / tone_counts[t] for t in tones]\n        sampler = WeightedRandomSampler(\n            weights, num_samples=len(weights), replacement=True\n        )\n\n        train_ds = LesionDataset(\n            df_train, \"./input/MyImages\", transform=train_transform\n        )\n        val_ds = LesionDataset(df_val, \"./input/MyImages\", transform=val_transform)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, sampler=sampler, num_workers=4\n        )\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n        model = models.resnet18(pretrained=True)\n        model.fc = nn.Linear(model.fc.in_features, 1)\n        model = model.to(device)\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        criterion = nn.BCEWithLogitsLoss()\n\n        for epoch in range(3):\n            model.train()\n            for imgs, labels, _ in train_loader:\n                imgs, labels = imgs.to(device), labels.float().to(device)\n                preds = model(imgs).squeeze(1)\n                loss = criterion(preds, labels)\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n\n        model.eval()\n        ys, ps, tones_val = [], [], []\n        with torch.no_grad():\n            for imgs, labels, tones in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1).cpu().numpy()\n setup = () => {

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
