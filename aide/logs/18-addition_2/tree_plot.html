of new images. We report mean AUROC and mean skin-tone AUROC gap\nacross folds.", "We fine\u2010tune a pretrained DenseNet121 on the malignant vs benign subset using\nsimple augmentations and class\u2010balanced sampling. We perform 5\u2010fold stratified\ncross\u2010validation to estimate the mean AUROC. After cross\u2010validation we retrain\non the full dataset for a few epochs and save the final model weights. A\npredict(image_folder) function is provided to load the saved model and return\nmalignancy probabilities for new images.", "We filter the dataset to only malignant vs benign labels and apply a 5\u2010fold\nstratified split. We fine-tune a pretrained MobileNetV2 for 5 epochs per fold\nwith simple flips and normalize to ImageNet stats, computing AUROC on each\nvalidation fold. After reporting mean and standard deviation of AUROC, we\nretrain on the full dataset for 3 epochs and save the model to `./model.pth`. A\n`predict(image_folder)` function loads this saved model and returns malignancy\nprobabilities for each image in a DataFrame.", "We introduce stratified splitting on both the malignancy label and skin tone to\nensure each fold is balanced across skin tone groups, which should reduce the\nAUROC gap between light and dark skin without harming overall performance. We\ncreate a combined stratification key from the binary label and the skin_tone\nattribute, then perform 5\u2010fold cross\u2010validation on this key. During validation,\nwe compute and report overall AUROC, AUROC for light and dark skin tones, and\ntheir gap. Finally, we retrain on the full dataset, save the model, and provide\na predict() function for new images.", "We map numeric skin_tone values into \u2018light\u2019 and \u2018dark\u2019 categories (treating 1\u20133\nas light, 5\u20136 as dark, and others as medium), update our stratification and\nevaluation logic to use these categories, and calculate per-group AUROCs\ncorrectly. We then train using 5\u2010fold stratified splits on the combined\nlabel+tone categories, print fold and mean metrics, retrain on the full set,\nsave the model, and provide a predict() function to score new images.", "I propose to balance skin-tone representation during training by using a\nWeightedRandomSampler that oversamples underrepresented tones. For each fold,\ncompute sample weights as the inverse frequency of each tone category in the\ntraining split, and pass a WeightedRandomSampler to the DataLoader instead of\nshuffle. This will encourage the model to learn equally from light, medium, and\ndark skin tones and reduce AUROC gap without altering the overall architecture\nor training pipeline.", "We will integrate Mixup augmentation (\u03b1=0.2) into the training loop to improve\nmodel robustness and generalization. For each training batch, we will mix inputs\nand labels using Mixup, then compute a weighted combination of losses for the\nmixed labels. All other training settings (model, optimizer, epochs) remain\nunchanged to isolate the effect of Mixup. We perform 5\u2010fold stratified\ncross\u2010validation, report overall and per\u2010tone AUROCs and their gap, then retrain\non the full dataset with Mixup and save the final model. Mixup is applied\nconsistently during both CV and final training.", "I propose to integrate Mixup augmentation during training with \u03b1=0.4, which\nblends pairs of images and labels to improve generalization and robustness. We\nwill implement `mixup_data` and `mixup_criterion`, apply them in the training\nloops across each fold, and retrain the final model with Mixup before saving.\nThis atomic change should boost AUROC without affecting inference speed or\nfairness. The rest of the pipeline, including 5\u2010fold stratified CV and fairness\nmetrics, remains unchanged.", "I will fix the label tensor creation by wrapping the scalar label in a 1\u2010element\ntensor (unsqueezing at dim=0) so that each sample returns a 1D tensor of shape\n[1] instead of attempting to unsqueeze at an invalid dimension. This resolves\nthe IndexError in the DataLoader worker. The rest of the pipeline remains\nunchanged; we then run 5\u2010fold cross\u2010validation, print per\u2010fold and mean AUROC,\nretrain on full data, save the model, and produce a submission.csv via the\n`predict()` function.", "I propose to incorporate a WeightedRandomSampler in the training DataLoader that\nbalances skin\u2010tone categories by sampling each example with probability inverse\nto its tone frequency, ensuring underrepresented tones contribute equally. This\nchange is applied per\u2010fold during cross\u2010validation and when retraining on the\nfull dataset, which should reduce fairness gaps while maintaining or improving\noverall AUROC. No other parts of the pipeline are altered. The rest of the\ntraining, evaluation, and prediction logic remains unchanged.", "I propose adding RandomErasing augmentation to the training pipeline to improve\nmodel robustness and reduce overfitting without altering the core architecture\nor training logic. By randomly erasing patches in the input images during\ntraining, the model can learn to focus on more global cues and generalize\nbetter. This change is atomic, easy to implement, and should boost the AUROC\nwhile preserving fairness across skin tones.", "I propose adding simple test\u2010time augmentation (TTA) by averaging predictions on\nthe original and horizontally flipped images. During validation and when\ngenerating test predictions, we run inference on both the original batch and its\nhorizontal flip, then average the probabilities. This change is atomic and\nrequires minimal code but can improve robustness and AUROC without affecting\ntraining or fairness.", "I propose to enhance test\u2010time augmentation by not only using horizontal flips\nbut also vertical and combined flips, averaging predictions over the original,\nhorizontally flipped, vertically flipped, and both\u2010flipped images. This atomic\nchange requires minimal code updates in the validation loop and the `predict()`\nfunction but should boost robustness and AUROC. The rest of the training\npipeline, including 5\u2010fold stratified CV and fairness evaluation, remains\nunchanged.", "I propose adding a ColorJitter augmentation (random brightness, contrast,\nsaturation, and hue changes) to the training pipeline to improve robustness to\ncolor variations across skin tones, which should boost overall AUROC and reduce\nfairness gaps. This is an atomic change that preserves the existing model\narchitecture, training loops, and TTA. We will keep the 5-fold stratified CV and\nfinal retraining unchanged, simply injecting ColorJitter into `train_tf`.", "I propose to enrich the test\u2010time augmentation pipeline by averaging predictions\nover the original, horizontally flipped, vertically flipped, and both\u2010axes\nflipped images. This requires minimal code changes to the validation loop and\nthe `predict()` function and should improve robustness and boost AUROC without\naltering the training procedure or compromising fairness. We'll implement this\nfour\u2010way TTA and rerun the 5\u2010fold CV to evaluate the impact on overall and\nper\u2010tone AUROC. No other parts of the pipeline are modified.", "I propose to improve optimization and generalization by replacing Adam with\nAdamW optimizer including a small weight decay for regularization, and adding a\nCosineAnnealingLR scheduler that anneals the learning rate over the epochs. This\nchange is atomic yet can boost convergence, reduce overfitting, and improve\nAUROC without affecting inference efficiency. We apply AdamW(weight_decay=1e-4)\nand step the scheduler after each training epoch in both cross\u2010validation and\nfull\u2010data training phases. The rest of the pipeline, including TTA and fairness\nevaluation, remains unchanged.", "I propose to replace the standard BCEWithLogitsLoss with a binary Focal Loss\n(\u03b1=0.25, \u03b3=2) to focus the model on harder examples and mitigate class\nimbalance, which should boost AUROC and maintain fairness. We define a FocalLoss\nclass and use it in place of BCEWithLogitsLoss in both the cross\u2010validation and\nfull\u2010data training loops, keeping all other settings (optimizer, scheduler, TTA,\netc.) unchanged.", "I will enhance inference robustness by applying four\u2010way test\u2010time augmentation\n(original, horizontal flip, vertical flip, and combined flips) and averaging the\nmodel\u2019s predictions. This atomic change requires minimal code updates in both\nthe validation loop and the `predict()` function, and should improve overall\nAUROC without altering training or fairness logic. The rest of the\npipeline\u2014including 5\u2010fold stratified CV, AdamW optimizer with CosineAnnealingLR,\nand final model training\u2014remains unchanged."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n# Constants\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nN_FOLDS = 5\nBATCH_SIZE = 32\nEPOCHS = 3\nLR = 1e-4\nIMG_SIZE = 224\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\n# Dataset\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\n# Prepare data\ndf = pd.read_csv(DATA_CSV)\n# Filter malignant (1) and benign (0), drop non-neoplastic\ndf = df[df.label.isin([\"malignant\", \"benign\"])].copy()\ndf[\"label_bin\"] = (df.label == \"malignant\").astype(int)\ny = df[\"label_bin\"].values\n\n# Transforms\ntrain_tf = transforms.Compose(\n    [\n        transforms.Resize((IMG_SIZE, IMG_SIZE)),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = transforms.Compose(\n    [\n        transforms.Resize((IMG_SIZE, IMG_SIZE)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=42)\naucs = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, y)):\n    train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n    train_ds = LesionDataset(train_df, IMG_DIR, transform=train_tf)\n    val_ds = LesionDataset(val_df, IMG_DIR, transform=val_tf)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=LR)\n\n    # Train\n    model.train()\n    for epoch in range(EPOCHS):\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validate\n    model.eval()\n    preds, trues = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            out = model(imgs)\n            probs = torch.sigmoid(out).cpu().numpy().flatten()\n            preds.extend(probs)\n            trues.extend(labels.numpy().flatten())\n    auc = roc_auc_score(trues, preds)\n    print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\n# Save final model\ntorch.save(model.state_dict(), MODEL_PATH)\nprint(f\"Mean AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for all .jpg images in `image_folder`.\n    Returns a DataFrame with columns: image_name, malignancy_probability.\n    \"\"\"\n    # Load model\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model.to(DEVICE).eval()\n\n    tf = transforms.Compose(\n        [\n            transforms.Resize((IMG_SIZE, IMG_SIZE)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    results = []\n    img_files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    loader = DataLoader(\n        img_files, batch_size=BATCH_SIZE, shuffle=False, collate_fn=lambda x: x\n    )\n    with torch.no_grad():\n        for batch in loader:\n            imgs = []\n            names = []\n            for fname in batch:\n                img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n                imgs.append(tf(img))\n                names.append(os.path.splitext(fname)[0])\n            imgs = torch.stack(imgs).to(DEVICE)\n            out = model(imgs)\n            probs = torch.sigmoid(out).cpu().numpy().flatten()\n            for name, p in zip(names, probs):\n                results.append({\"image_name\": name, \"malignancy_probability\": float(p)})\n    return pd.DataFrame(results)\n\n\n# Example usage:\n# df_preds = predict(\"./input/MyImages\")\n# print(df_preds.head())", "import os\nimport random\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom tqdm import tqdm\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n# Set random seeds for reproducibility\nseed = 42\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\ntorch.cuda.manual_seed_all(seed)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\n# Custom Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = row.label_enc\n        return img, label\n\n\n# Read and prepare data\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf = df[df[\"label\"].isin([\"malignant\", \"benign\"])].copy()\ndf[\"label_enc\"] = df[\"label\"].map({\"benign\": 0, \"malignant\": 1})\nimg_dir = \"./input/MyImages\"\n\n# Transforms\ntrain_transforms = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transforms = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=seed)\naucs = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label_enc), 1):\n    print(f\"Fold {fold}\")\n    df_train = df.iloc[train_idx]\n    df_val = df.iloc[val_idx]\n    train_ds = SkinLesionDataset(df_train, img_dir, transform=train_transforms)\n    val_ds = SkinLesionDataset(df_val, img_dir, transform=val_transforms)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    model = models.resnet34(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 2)\n    model = model.to(device)\n    criterion = nn.CrossEntropyLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Train for 3 epochs\n    for epoch in range(3):\n        model.train()\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Evaluate\n    model.eval()\n    all_preds = []\n    all_targets = []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs)\n            probs = torch.softmax(outputs, dim=1)[:, 1].cpu().numpy()\n            all_preds.extend(probs)\n            all_targets.extend(labels.numpy())\n    auc = roc_auc_score(all_targets, all_preds)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data\nfull_ds = SkinLesionDataset(df, img_dir, transform=train_transforms)\nfull_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\nmodel_final = models.resnet34(pretrained=True)\nmodel_final.fc = nn.Linear(model_final.fc.in_features, 2)\nmodel_final = model_final.to(device)\ncriterion = nn.CrossEntropyLoss()\noptimizer = torch.optim.Adam(model_final.parameters(), lr=1e-4)\n\nfor epoch in range(5):\n    model_final.train()\n    for imgs, labels in tqdm(full_loader, desc=f\"Full train epoch {epoch+1}\"):\n        imgs, labels = imgs.to(device), labels.to(device)\n        optimizer.zero_grad()\n        outputs = model_final(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(model_final.state_dict(), \"./working/model.pth\")\n\n\ndef predict(image_folder: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probabilities for all images in a folder.\n    Args:\n        image_folder (str): Path to folder containing .jpg images.\n    Returns:\n        pd.DataFrame: columns ['image_name', 'malignancy_prob']\n    \"\"\"\n    model = models.resnet34(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 2)\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n\n    image_files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    preds = []\n    transform = val_transforms\n    with torch.no_grad():\n        for fname in image_files:\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            img_t = transform(img).unsqueeze(0).to(device)\n            out = model(img_t)\n            prob = torch.softmax(out, dim=1)[0, 1].item()\n            preds.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(preds)\n\n\n# Example usage:\n# df_preds = predict(\"./input/MyImages\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\nDATA_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nMODEL_SAVE_PATH = \"./working/efficientnetb0_skin_lesion.pth\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nIMG_SIZE = 224\nBATCH_SIZE = 32\nEPOCHS_CV = 3\nEPOCHS_FULL = 3\nN_FOLDS = 5\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None, with_labels=True):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.with_labels = with_labels\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        if self.with_labels:\n            label = torch.tensor(row.label_bin, dtype=torch.long)\n            skin_tone = row.skin_tone\n            return img, label, skin_tone\n        else:\n            return img, row.image_name\n\n\n# Transforms\nmean = [0.485, 0.456, 0.406]\nstd = [0.229, 0.224, 0.225]\ntrain_tf = T.Compose(\n    [\n        T.RandomResizedCrop(IMG_SIZE),\n        T.RandomHorizontalFlip(),\n        T.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2, hue=0.1),\n        T.ToTensor(),\n        T.Normalize(mean, std),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize(IMG_SIZE + 32),\n        T.CenterCrop(IMG_SIZE),\n        T.ToTensor(),\n        T.Normalize(mean, std),\n    ]\n)\n\n# Load and prepare data\ndf = pd.read_csv(CSV_PATH)\ndf = df[df.label.isin([\"benign\", \"malignant\"])].copy()\ndf[\"label_bin\"] = df.label.map({\"benign\": 0, \"malignant\": 1})\n# skin_tone int as is; missing=-1\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=42)\naucs = []\ngaps = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label_bin), 1):\n    df_train = df.iloc[train_idx]\n    df_val = df.iloc[val_idx]\n\n    # Class weights\n    counts = df_train[\"label_bin\"].value_counts().sort_index().values\n    class_weights = torch.tensor(\n        [counts.sum() / c for c in counts], dtype=torch.float\n    ).to(DEVICE)\n    criterion = nn.CrossEntropyLoss(weight=class_weights)\n\n    # Dataloaders\n    ds_train = SkinLesionDataset(df_train, DATA_DIR, transform=train_tf)\n    ds_val = SkinLesionDataset(df_val, DATA_DIR, transform=val_tf)\n    loader_train = DataLoader(\n        ds_train, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    loader_val = DataLoader(ds_val, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=2).to(\n        DEVICE\n    )\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Train\n    model.train()\n    for epoch in range(EPOCHS_CV):\n        for imgs, labels, _ in loader_train:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n            preds = model(imgs)\n            loss = criterion(preds, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    # Eval\n    model.eval()\n    y_true, y_prob, skin_tones = [], [], []\n    with torch.no_grad():\n        for imgs, labels, sts in loader_val:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs)\n            probs = torch.softmax(logits, dim=1)[:, 1].cpu().numpy()\n            y_prob.extend(probs)\n            y_true.extend(labels.numpy())\n            skin_tones.extend(sts.numpy())\n    y_true = np.array(y_true)\n    y_prob = np.array(y_prob)\n    skin_tones = np.array(skin_tones)\n\n    # Overall AUROC\n    auc = roc_auc_score(y_true, y_pro rain_loader:\n            x, y = x.to(device), y.to(device).unsqueeze(1)\n            pred = model(x)\n            loss = criterion(pred, y)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    # validation\n    model.eval()\n    all_probs, all_labels = [], []\n    with torch.no_grad():\n        for x, y in val_loader:\n            x = x.to(device)\n            logits = model(x)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_probs.extend(probs)\n            all_labels.extend(y.numpy().flatten())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\nprint(f\"Mean AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\n\n# Retrain on full data\nfull_ds = LesionDataset(df, img_dir, transform=train_tf)\nfull_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\nfinal_model = models.densenet121(pretrained=True)\nfinal_model.classifier = nn.Linear(final_model.classifier.in_features, 1)\nfinal_model = final_model.to(device)\nopt = torch.optim.Adam(final_model.parameters(), lr=1e-4)\ncrit = nn.BCEWithLogitsLoss()\nfor epoch in range(3):\n    final_model.train()\n    for x, y in full_loader:\n        x, y = x.to(device), y.to(device).unsqueeze(1)\n        l = crit(final_model(x), y)\n        opt.zero_grad()\n        l.backward()\n        opt.step()\nos.makedirs(\"./working\", exist_ok=True)\ntorch.save(final_model.state_dict(), \"./working/model_densenet121.pth\")\nprint(\"Final model saved to ./working/model_densenet121.pth\")\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in image_folder.\n    Returns a DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, .to(device), labels.to(device)\n        optimizer.zero_grad()\n        outputs = model(imgs).view(-1)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    return running_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    preds = []\n    targets = []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs).view(-1)\n            probs = torch.sigmoid(outputs).cpu().numpy()\n            preds.extend(probs)\n            targets.extend(labels.numpy())\n    return np.array(targets), np.array(preds)\n\n\ndef predict(image_folder: str, model_path: str = \"./model.pth\", batch_size: int = 32):\n    \"\"\"\n    Predict malignancy probabilities for all images in image_folder.\n    Returns a pandas DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load model\n    model = models.mobilenet_v2(pretrained=False)\n    model.classifier[1] = nn.Linear(model.last_channel, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # transform\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    # gather image files\n    imgs = [f for f in os.listdir(image_folder) if f.lower().endswith((\".jpg\", \".png\"))]\n    names = []\n    data = []\n    for fname in imgs:\n        img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n        data.append(transform(img))\n        names.append(os.path.splitext(fname)[0])\n    dataset = torch.utils.data.TensorDataset(torch.stack(data))\n    loader = Da let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
