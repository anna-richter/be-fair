let treeStructData = {"edges": [[1, 6], [3, 5], [4, 9], [4, 8], [4, 7], [9, 12], [9, 10], [9, 11], [12, 17], [12, 18], [12, 14], [12, 15], [12, 16], [12, 19], [12, 13]], "layout": [[0.0, 0.0], [0.1, 0.0], [0.2, 0.0], [0.3, 0.0], [0.5, 0.0], [0.3, 0.33333333333333337], [0.1, 0.33333333333333337], [0.4, 0.33333333333333337], [0.5, 0.33333333333333337], [0.6, 0.33333333333333337], [0.5, 0.6666666666666667], [0.6, 0.6666666666666667], [0.7, 0.6666666666666667], [0.4, 1.0], [0.5, 1.0], [0.6, 1.0], [0.7, 1.0], [0.8, 1.0], [0.9, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a ResNet18 pretrained on ImageNet to distinguish malignant vs\nbenign lesions, filtering out non-neoplastic cases and mapping labels\naccordingly. We perform 5-fold stratified cross-validation to compute ROC AUC on\nheld-out folds, then retrain on the full dataset and save the final model. A\npredict(folder_path) function loads the saved model, applies the same\npreprocessing to each image in the folder, and returns malignancy probabilities.\nWe print the mean CV ROC AUC at the end.", "We extract deep image features by passing all images through a frozen ResNet18\npretrained on ImageNet, then train a LightGBM classifier on these features to\ndistinguish malignant from benign lesions. We use 5-fold stratified cross-\nvalidation to evaluate performance via the ROC AUC metric and print fold scores\nand their mean. Finally, we retrain on the full dataset and save the LightGBM\nmodel, and provide a predict(folder_path) function that extracts features from\nnew images and returns malignancy probabilities.", "We fine-tune an EfficientNet-B0 pretrained on ImageNet via the timm library to\nclassify malignant vs benign lesions, filtering out non-neoplastic cases and\nmapping labels accordingly. Images are resized to 224\u00d7224 and normalized; we\ntrain with binary cross-entropy loss using the Adam optimizer. We perform 5-fold\nstratified cross-validation to evaluate the model\u2019s performance using ROC AUC\nand print the mean CV ROC AUC. Finally, we retrain the model on the full\ndataset, save the trained model, and provide a predict(folder_path) function\nthat loads the model and returns malignancy probabilities for new images.", "I propose using a fixed feature extractor based on a pretrained ResNet50 to\nencode each lesion image into a 2048-dimensional embedding, then training a\nLightGBM classifier on these embeddings to predict malignancy. We filter out\nnon-neoplastic samples, map malignant to 1 and benign to 0, and evaluate\nperformance using 5-fold stratified cross-validation computing ROC AUC. After\nreporting the mean CV ROC AUC, we retrain the LightGBM model on the full dataset\nand save it. A predict(folder_path) function loads the pretrained ResNet50 and\nthe trained LightGBM model to compute malignancy probabilities for new images.", "We fine-tune a MobileNetV2 pretrained on ImageNet to classify malignant vs\nbenign lesions by filtering out non-neoplastic cases. Images are resized to\n224\u00d7224, normalized, and we use binary cross-entropy loss with the Adam\noptimizer. We perform 5-fold stratified cross-validation to estimate ROC AUC and\nprint the mean CV ROC AUC. Finally, we retrain on the full dataset, save the\ntrained model, and provide a predict(folder_path) function returning malignancy\nprobabilities.", "We can fix the unexpected early_stopping_rounds error by moving it into\nLightGBM\u2019s callback API. We replace the early_stopping_rounds argument with\ncallbacks=[lgb.early_stopping(50), lgb.log_evaluation(0)] in our fit calls. The\nrest of the pipeline (ResNet50 feature extraction, 5\u2010fold CV, final train and\nsave, plus a re\u2010usable predict function) remains the same, and we print out the\nCV ROC AUC scores and their mean.", "We can fix the error by removing the unsupported `early_stopping_rounds`\nargument from the `fit` call and instead using LightGBM\u2019s callback API for early\nstopping. Specifically, we\u2019ll import `early_stopping` and `log_evaluation` from\n`lightgbm.callback` and pass them in a `callbacks` list to `fit`. This allows us\nto monitor AUC on the validation fold and stop training when it stops improving.\nWe\u2019ll keep the 5-fold CV setup to print per\u2010fold and mean AUC, retrain on all\ndata, save the model, and provide a `predict()` function for new image folders.", "I propose to augment the training data with simple geometric and color\ntransformations to improve generalization: add random horizontal/vertical flips,\nsmall rotations, and color jitter to the training transform while keeping the\nvalidation transform unchanged. This atomic change should boost CV ROC AUC\nwithout altering the overall pipeline or model architecture. The rest of the\ncode (5\u2010fold CV, MobileNetV2 fine\u2010tuning, retraining on full data, and `predict`\nfunction) remains the same.", "I propose adding rich data augmentations to the training pipeline\u2014using\nRandomResizedCrop, flips, rotations, and color jitter\u2014to improve model\ngeneralization while keeping the validation transforms unchanged. We\u2019ll define\nseparate train and validation transforms, plug them into our existing 5\u2010fold CV\nloop, and then retrain on the full dataset before saving the model. This single,\natomic change should boost our CV ROC AUC without altering model architecture or\nother hyperparameters.", "I propose adding a simple test\u2010time augmentation (TTA) by averaging predictions\non the original and horizontally flipped images during both cross\u2010validation and\ninference. This requires minimal code changes but often yields a notable boost\nin AUROC by reducing prediction variance. We will keep all training settings the\nsame and just modify the validation loop and the predict() function to apply\nthis two\u2010view ensemble.", "I propose to enhance model generalization by adding robust data augmentations to\nthe training pipeline. Specifically, we'll use RandomResizedCrop, horizontal and\nvertical flips, random rotations, and color jitter in the training transform,\nwhile keeping the validation transform unchanged. This should improve the\nmodel's robustness to variations in lesion images. The rest of the pipeline,\nincluding test\u2010time horizontal\u2010flip TTA, 5\u2010fold CV, and retraining on full data,\nremains the same.", "I propose to enrich the training pipeline with strong data augmentations: use\nRandomResizedCrop, random horizontal and vertical flips, small rotations, and\ncolor jitter for the training set, while keeping the validation transform\nunchanged and retaining horizontal\u2010flip TTA. This will improve model robustness\nand generalization without altering the core architecture or training regime. We\napply these augmentations in both the 5\u2010fold CV training loops and the final\nfull\u2010data retraining, and then save the model as before. The predict() function\nremains the same, using the validation transform and TTA for inference.", "I propose to switch the optimizer from Adam to AdamW with weight decay and add a\nOneCycleLR learning\u2010rate scheduler, increasing training from 3 to 5 epochs. The\ndynamic lr schedule often improves convergence and generalization with minimal\ncode changes. We\u2019ll integrate the scheduler step after each batch in both the\n5\u2010fold CV loops and the final full\u2010data retraining, keeping all other settings\nunchanged.", "I propose to enhance model generalization by adding strong data augmentations to\nthe training pipeline: use RandomResizedCrop to 224\u00d7224, RandomHorizontalFlip,\nRandomVerticalFlip, RandomRotation, ColorJitter, and RandomErasing during\ntraining. Keep the validation transform as a simple Resize to 224\u00d7224 with\nnormalization and maintain horizontal\u2010flip TTA for evaluation. This exposes the\nmodel to diverse lesion variations without altering the architecture, optimizer,\nor training regime. The 5\u2010fold CV loop calculates ROC AUC as before, and we\nretrain on full data with the same augmentations before saving the model.", "I propose adding strong data augmentations to the training pipeline\u2014using\nRandomResizedCrop, random horizontal and vertical flips, random rotations, color\njitter, and random erasing\u2014while keeping the validation transform unchanged.\nThis exposes the model to more varied lesion appearances without altering\narchitecture or schedule. We will apply these augmentations during both the\n5-fold CV training loops and the final full-data retraining and leave TTA at\ninference as before. The rest of the pipeline remains the same, and we will\nprint the mean CV ROC AUC to evaluate the effect.", "I propose to enrich the model\u2019s training pipeline with strong data augmentations\nto improve generalization. Specifically, we will use RandomResizedCrop,\nRandomHorizontalFlip, RandomRotation, ColorJitter, and RandomErasing in the\ntraining transforms, while keeping the validation transform unchanged. All other\naspects of the pipeline\u2014including the MobileNetV2 architecture, OneCycleLR\nschedule, TTA at inference, and the 5-fold cross\u2010validation\u2014remain the same.\nThis atomic change should boost the CV ROC AUC by exposing the model to more\nvaried lesion appearances.", "I propose integrating MixUp augmentation into the training loops by randomly\nmixing pairs of images and their labels with a Beta distribution (alpha=0.4) to\nimprove generalization. We apply MixUp to every batch during both\ncross\u2010validation and final full\u2010data training, keeping MobileNetV2, AdamW\noptimizer with OneCycleLR, and horizontal\u2010flip TTA unchanged. We then\nre\u2010evaluate via 5\u2010fold CV ROC AUC to measure the impact of MixUp.", "I propose to enrich the training pipeline with stronger data augmentations by\nreplacing the simple resize transform with RandomResizedCrop(224),\nRandomHorizontalFlip, RandomVerticalFlip, RandomRotation, ColorJitter, and\nRandomErasing during training. The validation and inference transforms remain as\nsimple resize+normalize. We define separate train and validation transforms,\napply the train transform in both cross\u2010validation and final full\u2010data training,\nand leave the predict() function\u2019s transform unchanged. This atomic change\nshould improve model robustness and boost CV ROC AUC without altering the model\narchitecture, optimizer, or learning\u2010rate schedule.", "I propose to enrich our inference pipeline with 10\u2010crop test\u2010time augmentation\n(TTA) by resizing images to 256\u00d7256 and applying torchvision.transforms.TenCrop\nto generate 10 distinct 224\u00d7224 crops per image. We convert and normalize each\ncrop, average the model\u2019s sigmoid outputs over the 10 views, and use this in our\ncross\u2010validation evaluation and final predict() function. Training\nhyperparameters and the train\u2010time transform remain unchanged, so we can isolate\nthe impact of 10\u2010crop TTA on our CV ROC AUC. This minimal change increases\nprediction robustness with negligible training overhead.", "I propose integrating MixUp augmentation during training by mixing random pairs\nof images and their labels with a Beta(\u03b1=0.4) distribution. This will be applied\nin both the 5-fold cross\u2010validation loops and the final full\u2010data retraining,\nwhile keeping the model architecture, optimizer, learning\u2010rate schedule, and\ninference transforms unchanged. We expect MixUp to improve generalization and\nboost the CV ROC AUC by regularizing the model."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return img, label\n\n\ndef predict(folder_path, model_path=\"./working/model.pth\", batch_size=32, device=None):\n    \"\"\"\n    Predict malignancy probability for all images in folder_path.\n    Returns a DataFrame with columns ['image_name','malignancy_probability'].\n    \"\"\"\n    if device is None:\n        device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # prepare model\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # transform\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    records = []\n    files = [\n        f\n        for f in os.listdir(folder_path)\n        if f.lower().endswith((\".jpg\", \".png\", \".jpeg\"))\n    ]\n    loader = []\n    for fname in files:\n        img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n        img = transform(img)\n        loader.append((fname, img))\n    # batch inference\n    with torch.no_grad():\n        for i in range(0, len(loader), batch_size):\n            batch = loader[i : i + batch_size]\n            fnames = [x[0] for x in batch]\n            imgs = torch.stack([x[1] for x in batch]).to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for fn, p in zip(fnames, probs):\n                records.append({\"image_name\": fn, \"malignancy_probability\": float(p)})\n    return pd.DataFrame(records)\n\n\ndef main():\n    # paths and device\n    data_csv = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load and filter\n    df = pd.read_csv(data_csv)\n    df = df[df[\"label\"].isin([\"malignant\", \"benign\"])].copy()\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    df = df[[\"image_name\", \"target\"]]\n    # transforms\n    train_transform = T.Compose(\n        [\n            T.Resize(256),\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # cross-validation\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"])):\n        train_df = df.iloc[train_idx]\n        val_df = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(train_df, img_dir, train_transform)\n        val_ds = SkinLesionDataset(val_df, img_dir, val_transform)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n        # model, loss, optimizer\n        model = models.resnet18(pretrained=True)\n        model.fc = nn.Linear(model.fc.in_features, 1)\n        model = model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # train\n        for epoch in range(3):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(device), labels.to(device)\n                optimizer.zero_grad()\n                logits = model(imgs).squeeze(1)\n                loss = criterion(logits, labels)\n                loss.backward()\n                optimizer.step()\n        # validate\n        model.eval()\n        all_labels, all_preds = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1)\n                probs = torch.sigmoid(logits).cpu().numpy()\n                all_preds.extend(probs.tolist())\n                all_labels.extend(labels.numpy().tolist())\n        auc = roc_auc_score(all_labels, all_preds)\n        print(f\"Fold {fold+1} ROC AUC: {auc:.4f}\")\n        aucs.append(auc)\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV ROC AUC: {mean_auc:.4f}\")\n    # train on full data\n    full_ds = SkinLesionDataset(df, img_dir, train_transform)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    for epoch in range(3):\n        model.train()\n        for imgs, labels in full_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n    # save model\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model.state_dict(), \"./working/model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\nimport lightgbm as lgb\nimport joblib\n\n\n# Dataset for feature extraction\nclass ImageDataset(Dataset):\n    def __init__(self, img_paths, transform):\n        self.img_paths = img_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.img_paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.img_paths[idx]).convert(\"RGB\")\n        return self.transform(img)\n\n\ndef extract_features(model, dataloader, device):\n    model.eval()\n    feats = []\n    with torch.no_grad():\n        for batch in dataloader:\n            batch = batch.to(device)\n            out = model(batch)\n            feats.append(out.cpu().numpy())\n    return np.vstack(feats)\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all images in folder_path.\n    Returns a dict {filename: probability}.\n    \"\"\"\n    # load model\n    clf = joblib.load(os.path.join(\"working\", \"lgb_model.joblib\"))\n    # prepare feature extractor\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    resnet = models.resnet18(pretrained=True)\n    resnet.fc = torch.nn.Identity()\n    resnet = resnet.to(device)\n    tr = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # gather image paths\n    img_files = [\n        f for f in os.listdir(folder_path) if f.lower().endswith((\".jpg\", \".png\"))\n    ]\n    img_paths = [os.path.join(folder_path, f) for f in img_files]\n    ds = ImageDataset(img_paths, tr)\n    dl = DataLoader(ds, batch_size=32, num_workers=4, pin_memory=True)\n    feats = extract_features(resnet, dl, device)\n    probs = clf.predict_proba(feats)[:, 1]\n    return dict(zip(img_files, probs))\n\n\ndef main():\n    # load and prepare data\n    df = pd.read_csv(os.path.join(\"input\", \"mydataset.csv\"))\n    df = df[df[\"label\"].isin([\"malignant\", \"benign\"])].reset_index(drop=True)\n    label_map = {\"benign\": 0, \"malignant\": 1}\n    y = df[\"label\"].map(label_map).values\n    img_dir = os.path.join(\"input\", \"MyImages\")\n    img_paths = [os.path.join(img_dir, f\"{n}.jpg\") for n in df[\"image_name\"]]\n    # model setup\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    resnet = models.resnet18(pretrained=True)\n    resnet.fc = torch.nn.Identity()\n    resnet = resnet.to(device)\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = ImageDataset(img_paths, transform)\n    dl = DataLoader(ds, batch_size=32, num_workers=4, pin_memory=True)\n    print(\"Extracting features...\")\n    X = extract_features(resnet, dl, device)\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (tr_idx, va_idx) in enumerate(skf.split(X, y), 1):\n        X_tr, y_tr = X[tr_idx], y[tr_idx]\n        X_va, y_va = X[va_idx], y[va_idx]\n        clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n        clf.fit(\n            X_tr,\n            y_tr,\n            eval_set=[(X_va, y_va)],\n            eval_metric=\"auc\",\n            early_stopping_rounds=50,\n            verbose=False,\n        )\n        p = clf.predict_proba(X_va)[:, 1]\n        auc = roc_auc_score(y_va, p)\n        print(f\"Fold {fold} AUC: {auc:.4f}\")\n        aucs.append(auc)\n    print(f\"Mean CV AUC: {np.mean(aucs):.4f}\")\n    # retrain on full data and save model\n    final_clf = lgb.LGBMClassifier(n_estimators=1000, learning_rate=0.05)\n    final_clf.fit(X, y)\n    os.makedirs(\"working\", exist_ok=True)\n    joblib.dump(final_clf, os.path.join(\"working\", \"lgb_model.joblib\"))\n    print(\"Model saved to working/lgb_model.joblib\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport timm\n\n\n# Dataset definition\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        image = self.transform(image)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return image, label\n\n\n# Prediction function\ndef predict(folder_path, model_path=\"./working/model.pth\", batch_size=32):\n    \"\"\"\n    Load the saved model and return a DataFrame with columns ['image_name','probability']\n    for all .jpg images in folder_path.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # Transform\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Gather imag let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
