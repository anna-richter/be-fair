let treeStructData = {"edges": [[4, 11], [4, 9], [4, 10], [4, 6], [4, 15], [4, 13], [4, 14], [4, 16], [4, 7], [4, 12], [4, 5], [4, 8], [4, 17], [17, 18], [17, 19]], "layout": [[0.16, 0.0], [0.24, 0.0], [0.32, 0.0], [0.4, 0.0], [0.48, 0.0], [0.0, 0.5], [0.08, 0.5], [0.16, 0.5], [0.24, 0.5], [0.32, 0.5], [0.4, 0.5], [0.48, 0.5], [0.56, 0.5], [0.64, 0.5], [0.72, 0.5], [0.8, 0.5], [0.88, 0.5], [0.96, 0.5], [0.92, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 for binary malignant vs non-malignant\nclassification, using simple augmentations. We perform 5-fold stratified cross-\nvalidation, computing overall AUROC and AUC gap between dark (skin_tone\u22643) and\nlight (skin_tone\u22655) subgroups in each fold. The final model is saved, and a\n`predict()` function loads it to infer malignancy probabilities on new images.", "We will fine-tune a pretrained EfficientNet-B0, freezing all but its final\nclassification head for fast convergence, and train across stratified 5-folds to\npredict malignant vs. non-malignant labels. During evaluation, we compute\noverall AUROC as well as AUROCs for dark (skin_tone\u22643) and light (skin_tone\u22655)\nsubgroups and report their mean gap to ensure fairness. Each fold\u2019s model is\nsaved, and a `predict()` function loads all five models to average their\nmalignancy probabilities for new images.", "We fine-tune a pretrained DenseNet121 end-to-end with skin\u2010tone balanced\nsampling to mitigate fairness gaps, applying common augmentations and training\nfor 3 epochs per fold. We perform 5-fold stratified cross-validation, weighting\neach sample inversely by its skin\u2010tone group frequency, and compute overall\nAUROC as well as the mean AUC gap between dark and light skin subgroups. After\ncross\u2010validation we retrain on the full dataset with the same balanced sampler\nand save the final model. The evaluation metric reported is the mean overall\nAUROC across folds and the mean subgroup AUC gap.", "I will fine-tune a pretrained MobileNetV2 end\u2010to\u2010end using a weighted sampler to\naddress class imbalance, training for three epochs per fold with standard\naugmentations. We perform stratified 5\u2010fold cross\u2010validation to compute the mean\noverall AUROC and the AUROC gap between light (skin_tone\u22655) and dark\n(skin_tone\u22643) subgroups. After cross\u2010validation we retrain on the full dataset\nand save the final model, and provide a `predict()` function to infer malignancy\nprobabilities on new images. The evaluation metric is the mean cross\u2010validated\nAUROC.", "I propose fine-tuning a pretrained ResNeXt50_32x4d backbone for binary malignant\nvs non-malignant classification by replacing its final layer. We'll perform\n5-fold stratified cross-validation to estimate the model\u2019s generalization\nperformance and compute the AUROC and subgroup AUROC gap between dark\n(skin_tone\u22643) and light (skin_tone\u22655) skin tones to monitor fairness. After\ncross-validation, we'll retrain on the full dataset and save the final model. A\n`predict()` function will load the saved model and output malignancy\nprobabilities for new images.", "I propose to address class imbalance by using a weighted binary cross-entropy\nloss with a per\u2010fold positive class weight (pos_weight = number of negatives /\nnumber of positives). This will focus learning on the malignant class and is\nlikely to improve overall AUROC. We compute pos_weight from the training labels\nin each CV split and also for the final full\u2010data retraining. The rest of the\npipeline (ResNeXt50, transforms, CV, fairness metrics, predict()) remains\nunchanged.", "I propose to incorporate simple test-time augmentation (TTA) by averaging model\npredictions over the original and horizontally flipped versions of each\nvalidation image, which can reduce prediction variance and improve AUROC without\nchanging the training procedure. During each fold\u2019s validation, we will apply\nboth the standard resize+normalize transform and a horizontal\u2010flip variant,\naverage their sigmoid outputs, and then compute overall and subgroup AUROCs on\nthese averaged probabilities. The same TTA logic will also be integrated into\nthe `predict()` function for inference on new images.", "I propose to integrate MixUp augmentation during training by sampling a mixing\ncoefficient from a Beta(\u03b1,\u03b1) distribution (with \u03b1=0.4) for each batch, linearly\ncombining both inputs and labels. This regularizes the model, improves\ngeneralization and can reduce overfitting on specific skin\u2010tone groups.\nEverything else remains the same\u2014fine\u2010tuning ResNeXt50_32x4d with 5\u2010fold\nstratified CV, computing overall AUROC and subgroup gaps, retraining on full\ndata, and saving the final model. Below is the updated implementation.", "I propose adding ColorJitter augmentation to the training transform to increase\nrobustness to skin\u2010tone variations without changing the model architecture or\ntraining regimen. By randomly adjusting brightness, contrast, saturation, and\nhue during training, we can help the model generalize better across different\nskin tones, potentially improving overall AUROC and fairness. We integrate\nColorJitter into the train_transform pipeline, rerun 5-fold cross-validation to\nmeasure its impact, then retrain on the full dataset and save the updated model.\nThe predict() function remains unchanged for seamless inference.", "I propose to add RandomErasing augmentation with a probability of 0.5 to the\ntraining pipeline, which can regularize the model by randomly occluding parts of\nthe images and improve generalization without altering the architecture or\ntraining regimen. We integrate `T.RandomErasing` after normalization in\n`train_transform`, then rerun 5-fold stratified cross-validation to compute mean\noverall AUROC and subgroup AUC gaps. Finally, we retrain on the full dataset\nwith the same augmentations, save the model, and provide a `predict()` function\nfor new-image inference.", "I propose integrating CutMix augmentation into the training loop to further\nregularize the model and improve generalization. With a 50% probability per\nbatch, we\u2019ll mix two images and their labels using CutMix (Beta(1.0,1.0)), while\nleaving the rest of the pipeline\u2014ResNeXt50_32x4d backbone, 5-fold stratified\ncross\u2010validation, AUROC and subgroup gap computation\u2014unchanged. After\ncross\u2010validation we\u2019ll retrain on the full dataset with CutMix, save the final\nmodel, and update the `predict()` function accordingly for inference.", "I propose replacing the standard BCEWithLogitsLoss with a Focal Loss (gamma=2,\nalpha=0.25) to focus training on hard examples and improve discrimination, which\noften raises AUROC without sacrificing fairness. We'll implement a FocalLoss\nclass, use it in both cross\u2010validation and full\u2010data retraining, and then print\nthe mean AUROC and subgroup gap. The rest of the pipeline (ResNeXt50_32x4d\nbackbone, transforms, CV splits, metrics, predict function) remains unchanged.", "I propose integrating a OneCycleLR learning\u2010rate scheduler during training to\ndynamically adjust the learning rate for faster convergence and better\ngeneralization. For each fold (and the final full\u2010data retraining), we\u2019ll wrap\nthe optimizer in a OneCycleLR scheduler with a max_lr ten times the base LR,\nstepping it after each optimizer step. All other aspects of the pipeline\n(ResNeXt50_32x4d, transforms, CV splits, metrics, predict function) remain\nunchanged, ensuring the impact of the scheduler is isolated and measurable.", "I propose to add a dropout layer before the final linear classifier to\nregularize the model and reduce overfitting, which should improve generalization\nand potentially boost AUROC. Specifically, we will replace the ResNeXt50_32x4d\n`fc` with a sequential block containing `Dropout(p=0.5)` followed by the\n`Linear` layer. We will then rerun the 5-fold stratified cross-validation to\nreport the mean overall AUROC and mean subgroup AUC gap. Finally, we will\nretrain the dropout\u2010enhanced model on the full dataset, save it, and provide the\n`predict()` function as before.", "I will replace the standard Adam optimizer with AdamW including L2 weight decay\nto regularize model weights and improve generalization without altering any\nother part of the pipeline. This atomic change should reduce overfitting and\nboost the AUROC. I will rerun the 5-fold cross-validation with AdamW\n(weight_decay=1e-4), retrain on the full dataset, and save the final model. The\nevaluation metrics (mean AUROC and subgroup gap) will be printed.", "I propose to track and save the best-performing model for each CV fold based on\nvalidation AUROC at each epoch, rather than using the final epoch\u2019s weights. By\nevaluating after each epoch and retaining the weights that yield the highest\nAUROC on the fold\u2019s validation set, we can ensure we\u2019re using the most effective\nmodel for each split. The rest of the pipeline\u2014including stratified 5\u2010fold CV,\nfairness AUC gap computation, full\u2010data retraining, and the `predict()`\nfunction\u2014remains unchanged.", "I propose to replace the fixed Resize+Rotation transform with a\nRandomResizedCrop augmentation in the training pipeline, paired with a\nResize+CenterCrop for validation, to improve scale invariance and\ngeneralization. This atomic change should boost AUROC by exposing the model to\nvaried object scales and compositions without modifying the architecture or\ntraining schedule. The rest of the pipeline (ResNeXt50 backbone, 5\u2010fold\nstratified CV, metrics, retraining and predict function) remains unchanged.", "I propose to replace the Adam optimizer with AdamW (weight_decay=1e-4) and\ninclude a CosineAnnealingLR scheduler (T_max equal to the number of epochs) to\nimprove generalization by gradually reducing the learning rate. This atomic\nchange should boost AUROC without altering the core training pipeline. We will\napply this change both in the 5\u2010fold cross\u2010validation and the final full\u2010data\nretraining, then print the mean overall AUROC and subgroup AUC gap.", "I propose to integrate test\u2010time augmentation by averaging model predictions on\nboth the original and horizontally flipped images during validation and\ninference. This simple TTA can reduce prediction variance and improve AUROC\nwithout altering the training procedure. We will update the validation loop to\ncompute each image\u2019s probability as the mean of the model\u2019s outputs on the image\nand its horizontal flip, and apply the same logic inside the `predict()`\nfunction. All other parts of the pipeline\u2014ResNeXt50_32x4d,\nAdamW+CosineAnnealingLR, 5\u2010fold CV, metrics, and final retraining\u2014remain\nunchanged.", "I propose to enhance inference robustness by extending test\u2010time augmentation to\na 4\u2010way flip ensemble: original, horizontal flip, vertical flip, and both flips.\nDuring validation, we average model predictions over these four variants for\neach image, which reduces variance and should boost AUROC. We apply the same TTA\nlogic inside the `predict()` function for new\u2010image inference. All other parts\nof the pipeline (ResNeXt50_32x4d, AdamW+CosineAnnealingLR, 5\u2010fold CV, metrics,\nand final retraining) remain unchanged."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = float(row.malignant)\n        skin = int(row.skin_tone)\n        return img, label, skin\n\n\n# Predict function\ndef predict(\n    model_path,\n    img_folder,\n    batch_size=32,\n    device=\"cuda\" if torch.cuda.is_available() else \"cpu\",\n):\n    \"\"\"\n    Load a trained model and return malignancy probabilities for all images in img_folder.\n    Returns a DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    device = torch.device(device)\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    fnames = sorted([f for f in os.listdir(img_folder) if f.lower().endswith(\".jpg\")])\n    ds = [\n        (fname, transform(Image.open(os.path.join(img_folder, fname)).convert(\"RGB\")))\n        for fname in fnames\n    ]\n    loader = DataLoader(\n        ds, batch_size=batch_size, shuffle=False, collate_fn=lambda x: list(zip(*x))\n    )\n    results = []\n    with torch.no_grad():\n        for names, imgs in loader:\n            imgs = torch.stack(imgs).to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for n, p in zip(names, probs):\n                results.append({\"image_name\": n, \"probability\": float(p)})\n    return pd.DataFrame(results)\n\n\n# Load data\ndf = pd.read_csv(\"input/mydataset.csv\")\ndf[\"malignant\"] = (df[\"label\"] == \"malignant\").astype(int)\nimg_dir = \"input/MyImages\"\n\n# Transforms\ntrain_tf = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs, gaps = [], []\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"malignant\"])):\n    train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n    train_ds = SkinLesionDataset(train_df, img_dir, transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, img_dir, transform=val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Train\n    for epoch in range(2):\n        model.train()\n        for imgs, labels, _ in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validate\n    model.eval()\n    all_preds, all_labels, all_skin = [], [], []\n    with torch.no_grad():\n        for imgs, labels, skins in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_preds.extend(probs.tolist())\n            all_labels.extend(labels.tolist())\n            all_skin.extend(skins.tolist())\n\n    auc = roc_auc_score(all_labels, all_preds)\n    # subgroup AUCs\n    dfv = pd.DataFrame({\"pred\": all_preds, \"label\": all_labels, \"skin\": all_skin})\n    dark = dfv[dfv.skin <= 3]\n    light = dfv[dfv.skin >= 5]\n    auc_dark = (\n        roc_auc_score(dark.label, dark.pred) if len(dark.label.unique()) > 1 else np.nan\n    )\n    auc_light = (\n        roc_auc_score(light.label, light.pred)\n        if len(light.label.unique()) > 1\n        else np.nan\n    )\n    gap = (\n        abs(auc_dark - auc_light)\n        if not np.isnan(auc_dark) and not np.isnan(auc_light)\n        else np.nan\n    )\n\n    aucs.append(auc)\n    gaps.append(gap)\n\n    # Save last fold model\n    if fold == 4:\n        os.makedirs(\"working\", exist_ok=True)\n        torch.save(model.state_dict(), \"working/model.pth\")\n\n# Print results\nprint(f\"Mean AUROC: {np.nanmean(aucs):.4f} \u00b1 {np.nanstd(aucs):.4f}\")\nprint(f\"Mean subgroup AUC gap: {np.nanmean(gaps):.4f}\")", "import os\nimport glob\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset for training and validation\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transforms):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transforms = transforms\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transforms(img)\n        label = float(row.target)\n        skin_tone = int(row.skin_tone)\n        return img, label, skin_tone\n\n\n# Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Load the 5 trained EfficientNet-B0 models and return malignancy probabilities\n    for every .jpg in folder_path. Returns a DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # define validation transforms\n    val_transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # load models\n    model_paths = sorted(glob.glob(\"./working/model_fold_*.pth\"))\n    models = []\n    for mp in model_paths:\n        m = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n        m.load_state_dict(torch.load(mp, map_location=device))\n        m.to(device).eval()\n        models.append(m)\n    # predict\n    records = []\n    for img_file in sorted(glob.glob(os.path.join(folder_path, \"*.jpg\"))):\n        img = Image.open(img_file).convert(\"RGB\")\n        inp = val_transforms(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            preds = [torch.sigmoid(m(inp)).item() for m in models]\n        prob = float(np.mean(preds))\n        records.append({\"image_name\": os.path.basename(img_file), \"probability\": prob})\n    return pd.DataFrame(records)\n\n\ndef main():\n    # load and preprocess metadata\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df = df[df.skin_tone != -1].copy()\n    df[\"target\"] = (df.label == \"malignant\").astype(int)\n    img_dir = \"./input/MyImages\"\n    # transforms\n    train_transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.RandomRotation(15),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transforms = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs, dark_aucs, light_aucs = [], [], []\n\n    for fold, (tr_idx, val_idx) in enumerate(skf.split(df, df.target)):\n        train_df, val_df = df.iloc[tr_idx], df.iloc[val_idx]\n        train_ds = SkinDataset(train_df, img_dir, train_transforms)\n        val_ds = SkinDataset(val_df, img_dir, val_transforms)\n        tr_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=2)\n\n        # model\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n        # freeze backbone\n        for n, p in model.named_parameters():\n            if \"classifier\" not in n:\n                p.requires_grad = False\n        model.to(device)\n        optim = torch.optim.Adam(\n            filter(lambda p: p.requires_grad, model.parameters()), lr=1e-3\n        )\n        loss_fn = nn.BCEWithLogitsLoss()\n\n        # train for 3 epochs\n        for epoch in range(3):\n            model.train()\n            for imgs, lbls, _ in tr_loader:\n                imgs = imgs.to(device)\n                lbls = lbls.to(device).unsqueeze(1)\n                logits = model(imgs)\n                loss = loss_fn(logits, lbls)\n                optim.zero_grad()\n                loss.backward()\n                optim.step()\n\n        # evaluate\n        model.eval()\n        preds, targets, tones = [], [], []\n        with torch.no_grad():\n            for imgs, lbls, skin in val_loader:\n                imgs = imgs.to(device)\n                out = model(imgs)\n                prob = torch.sigmoid(out).cpu().numpy().flatten()\n                preds.extend(prob)\n                targets.extend(lbls.numpy().flatten())\n                tones.extend(skin.numpy().flatten())\n\n        overall = roc_auc_score(targets, preds)\n        # subgroup\n        dark_idx = [i for i, t in enumerate(tones) if t <= 3]\n        light_idx = [i for i, t in enumerate(tones) if t >= 5]\n\n        def sub_auc(idxs):\n            labs = [targets[i] for i in idxs]\n            ps = [preds[i] for i in idxs]\n            return roc_auc_score(labs, ps) if len(set(labs)) > 1 else np.nan\n\n        da = sub_auc(dark_idx)\n        la = sub_auc(light_idx)\n\n        aucs.append(overall)\n        dark_aucs.append(da)\n        light_aucs.append(la)\n        # save fold model\n        torch.save(model.state_dict(), f\"./working/model_fold_{fold}.pth\")\n\n    # report\n    mean_auc = np.mean(aucs)\n    std_auc = np.std(aucs)\n    mean_gap = np.nanmean(np.abs(np.array(dark_aucs) - np.array(light_aucs)))\n    print(f\"Mean AUROC: {mean_auc:.4f} \u00b1 {std_auc:.4f}\")\n    print(f\"Mean subgroup AUC gap: {mean_gap:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n# Configuration\nIMG_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nMODEL_PATH = \"./working/final_model.pth\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nNUM_EPOCHS = 3\nN_SPLITS = 5\nLR = 1e-4\n\n# Prepare DataFrame\ndf = pd.read_csv(CSV_PATH)\ndf[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n\n# Define skin-tone group\ndef tone_group(x):\n    if x <= 3:\n        return \"dark\"\n    if x >= 5:\n        return \"light\"\n    return \"mid\"\n\n\ndf[\"group\"] = df[\"skin_tone\"].apply(tone_group)\n\n\n# Dataset\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        x = self.transform(img)\n        y = torch.tensor(row.label_bin, dtype=torch.float32)\n        return x, y\n\n\n# Transforms\ntrain_tf = T.Compose(\n    [\n        T.Resize(256),\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.RandomVerticalFlip(),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\naucs, gaps = [], []\n\nfor fold, (tr_idx, va_idx) in enumerate(skf.split(df, df[\"label_bin\"])):\n    tr_df = df.iloc[tr_idx]\n    va_df = df.iloc[va_idx]\n    # Compute weights inverse to group freq\n    grp_counts = tr_df[\"group\"].value_counts().to_dict()\n    weights = tr_df[\"group\"].map(lambda g: 1.0 / grp_counts[g]).values\n    sampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n    # DataLoaders\n    train_ds = SkinDataset(tr_df, IMG_DIR, train_tf)\n    val_ds = SkinDataset(va_df, IMG_DIR, val_tf)\n    tr_ld = DataLoader(train_ds, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4)\n    va_ld = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    # Model\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=LR, weight_decay=1e-5)\n    # Train\n    model.train()\n    for epoch in range(NUM_EPOCHS):\n        for xb, yb in tr_ld:\n            xb, yb = xb.to(DEVICE), yb.to(DEVICE)\n            optimizer.zero_grad()\n            logits = model(xb).squeeze(1)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n    # Validate\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for xb, yb in va_ld:\n            xb = xb.to(DEVICE)\n            logits = model(xb).squeeze(1).cpu().numpy()\n            prob = 1 / (1 + np.exp(-logits))\n            ys.extend(yb.numpy())\n            ps.extend(prob)\n    overall_auc = roc_auc_score(ys, ps)\n    # Subgroup AUCs\n    va_df = va_df.reset_index(drop=True)\n    va_df[\"prob\"] = ps\n    dark = va_df[va_df[\"group\"] == \"dark\"]\n    light = va_df[va_df[\"group\"] == \"light\"]\n    auc_dark = (\n        roc_auc_score(dark[\"label_bin\"], dark[\"prob\"]) if len(dark) > 0 else np.nan\n    )\n    auc_light = (\n        roc_auc_score(light[\"label_bin\"], light[\"prob\"]) if len(light) > 0 else np.nan\n    )\n    gap = abs(auc_light - auc_dark)\n    aucs.append(overall_auc)\n    gaps.append(gap)\n    print(f\"Fold {fold+1} AUROC: {overall_auc:.4f}, gap: {gap:.4f}\")\n\nprint(f\"Mean AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\nprint(f\"Mean subgroup gap: {np.nanmean(gaps):.4f}\")\n\n# Retrain on full data\nfull_weights = df[\"group\"].map(lambda g: 1.0 / df[\"group\"].value_counts()[g]).values\nfull_sampler = WeightedRandomSampler(\n    full_weights, num_samples=len(full_weights), replacement=True\n)\nfull_ds = SkinDataset(df, IMG_DIR, train_tf)\nfull_ld = DataLoader(\n    full_ds, batch_size=BATCH_SIZE, sampler=full_sampler, num_workers=4\n)\n\nfinal_model = models.densenet121(pretrained=True)\nfinal_model.classifier = nn.Linear(final_model.classifier.in_features, 1)\nfinal_model = final_model.to(DEVICE)\nopt = optim.Adam(final_model.parameters(), lr=LR, weight_decay=1e-5)\ncrit = nn.BCEWithLogitsLoss()\nfinal_model.train()\nfor epoch in range(NUM_EPOCHS):\n    for xb, yb in full_ld:\n        xb, yb = xb.to(DEVICE), yb.to(DEVICE)\n        opt.zero_grad()\n        loss = crit(final_model(xb).squeeze(1), yb)\n        loss.backward()\n        opt.step()\ntorch.save(final_model.state_dict(), MODEL_PATH)\n\n\ndef predict(folder: str):\n    \"\"\"\n    Predict malignancy probability for each image in the given folder.\n    Args:\n        folder (str): path to folder containing .jpg images named like 'image_#.jpg'\n    Returns:\n        pandas.DataFrame with columns ['image_name','malignant_probability']\n    \"\"\"\n    tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    m = models.densenet121(pretrained=False)\n    m.classifier = nn.Linear(m.classifier.in_features, 1)\n    m.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    m = m.to(DEVICE).eval()\n    results = []\n    for fname in sorted(os.listdir(folder)):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(folder, fname)).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(DEVICE)\n            with torch.no_grad():\n                logit = m(x).item()\n            prob = 1 / (1 + np.exp(-logit))\n            results.append(\n                {\"image_name\": fname.replace(\".jpg\", \"\"), \"malignant_probability\": prob}\n            )\n    return pd.DataFrame(results)\n\n\n# Example: if there were test images, save submission\n# test_df = predict(\"./input/test_images\")\n# test_df.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nNUM_FOLDS = 5\nBATCH_SIZE = 32\nEPOCHS = 3\nLR = 1e-4\nMODEL_PATH = \"./working/mobilenetv2_full.pth\"\n\n\n# Dataset definition\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.labels = df[\"target\"].values\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return img, label\n\n\n# Read and preprocess CSV\ndf = pd.read_csv(DATA_CSV)\ndf[\"target\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n# Define skin tone groups for fairness evaluation\ndf[\"skin_tone_clean\"] = df[\"skin_tone\"].replace(-1, np.nan)\n\n# Transforms\ntrain_transform = T.Compose(\n    [\n        T.Resize((256, 256)),\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.RandomVerticalFlip(),\n        T.RandomRotation(20),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\n# Model constructor\ndef get_model():\n    model = models.mobilenet_v2(pretrained=True)\n    model.classifier = nn.Sequential(nn.Dropout(0.2), nn.Linear(model.last_channel, 1))\n    return model.to(DEVICE)\n\n\n# Training function\ndef train_one_epoch(model, loader, optimizer, criterion):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    return running_loss / len(loader.dataset)\n\n\n# Evaluation function\ndef evaluate(model, loader):\n    model.eval()\n    preds, trues, tones = [], [], []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(DEVICE)\n            out = model(imgs).cpu().numpy().flatten()\n            preds.extend(out)\n            trues.extend(labels.numpy().flatten())\n    preds = torch.sigmoid(torch.tensor(preds)).numpy()\n    trues = np.array(trues)\n    auc = roc_auc_score(trues, preds)\n    # subgroup metrics\n    tone_vals = df.iloc[loader.dataset.df.index][\"skin_tone_clean\"].values\n    mask_dark = tone_vals <= 3\n    mask_light = tone_vals >= 5\n    auc_dark = (\n        roc_auc_score(trues[mask_dark], preds[mask_dark])\n        if mask_dark.sum() > 0\n        else np.nan\n    )\n    auc_light = (\n        roc_auc_score(trues[mask_light], preds[mask_light])\n        if mask_light.sum() > 0\n        else np.nan\n    )\n    return auc, auc_dark, auc_light\n\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=NUM_FOLDS, shuffle=True, random_state=42)\naucs, gaps = [], []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"]), 1):\n    df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n    # Weighted sampler for class imbalance\n    class_counts = df_train[\"target\"].value_counts().to_dict()\n    weights = df_train[\"target\"].map(lambda x: 1.0 / class_counts[x]).values\n    sampler = WeightedRandomSampler(weights, len(weights), replacement=True)\n    train_ds = SkinDataset(df_train, IMG_DIR, train_transform)\n    val_ds = SkinDataset(df_val, IMG_DIR, val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    model = get_model()\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n    criterion = nn.BCEWithLogitsLoss()\n    for epoch in range(EPOCHS):\n        train_one_epoch(model, train_loader, optimizer, criterion)\n    auc, auc_dark, auc_light = evaluate(model, val_loader)\n    gap = (\n        abs(auc_light - auc_dark)\n        if not np.isnan(auc_light) and not np.isnan(auc_dark)\n        else np.nan\n    )\n    print(\n        f\"Fold {fold}: AUROC={auc:.4f}, dark={auc_dark:.4f}, light={auc_light:.4f}, gap={gap:.4f}\"\n    )\n    aucs.append(auc)\n    if not np.isnan(gap):\n        gaps.append(gap)\n\nprint(f\"Mean CV AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\nprint(f\"Mean subgroup AUROC gap: {np.mean(gaps):.4f}\")\n\n# Retrain on full dataset and save final model\nfull_ds = SkinDataset(df, IMG_DIR, train_transform)\n# full training sampler as class-balanced\nclass_counts_full = df[\"target\"].value_counts().to_dict()\nweights_full = df[\"target\"].map(lambda x: 1.0 / class_counts_full[x]).values\nsampler_full = WeightedRandomSampler(weights_full, len(weights_full), replacement=True)\nfull_loader = DataLoader(\n    full_ds, batch_size=BATCH_SIZE, sampler=sampler_full, num_workers=4\n)\nmodel_full = get_model()\nopt_full = torch.optim.Adam(model_full.parameters(), lr=LR)\ncrit_full = nn.BCEWithLogitsLoss()\nfor epoch in range(EPOCHS):\n    train_one_epoch(model_full, full_loader, opt_full, crit_full)\ntorch.save(model_full.state_dict(), MODEL_PATH)\n\n\n# Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in folder_path.\n    Returns a DataFrame with columns ['image_name','malignancy_prob'].\n    \"\"\"\n    model = get_model()\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model.eval()\n    results = []\n    transform = val_transform\n    for fname in os.listdir(folder_path):\n        if not fname.lower().endswith(\".jpg\"):\n            continue\n        img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n        inp = transform(img).unsqueeze(0).to(DEVICE)\n        with torch.no_grad():\n            out = model(inp).cpu().item()\n            prob = torch.sigmoid(torch.tensor(out)).item()\n        results.append(\n            {\"image_name\": os.path.splitext(fname)[0], \"malignancy_prob\": prob}\n        )\n    return pd.DataFrame(results)\n\n\n# Example usage:\n# preds_df = predict(\"./input/MyImages\")\n# preds_df.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n# Paths and constants\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nN_SPLITS = 5\nBATCH_SIZE = 64\nEPOCHS = 3\nLR = 1e-4\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_p s.size()\n    lam = np.random.beta(alpha, alpha)\n    rand_index = torch.randperm(B)\n    bbx1, bby1, bbx2, bby2 = rand_bbox(W, H, lam)\n    images[:, :, bby1:bby2, bbx1:bbx2] = images[rand_index, :, bby1:bby2, bbx1:bbx2]\n    # adjust lambda to exactly match pixel ratio\n    lam_adj = 1 - ((bbx2 - bbx1) * (bby2 - bby1) / (W * H))\n    labels_a = labels\n    labels_b = labels[rand_index]\n    return images, labels_a, labels_b, lam_adj\n\n\n# Load data\ndf = pd.read_csv(DATA_CSV)\ndf = df[df.label.isin([\"malignant\", \"benign\", \"non-neoplastic\"])].copy()\ny = (df.label == \"malignant\").astype(int).values\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\naucs, gaps = [], []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, y), 1):\n    df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n    ds_train = SkinLesionDataset(df_train, train_transform)\n    ds_val = SkinLesionDataset(df_val, val_transform)\n    loader_train = DataLoader(ds_train, BATCH_SIZE, shuffle=True, num_workers=4)\n    loader_val = DataLoader(ds_val, BATCH_SIZE, shuffle=False, num_workers=4)\n    # Model\n    model = models.resnext50_32x4d(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss(reduction=\"mean\")\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n    # Train\n    model.train()\n    for epoch in range(EPOCHS):\n        for imgs, labels, _ in loader_train:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n            if random.random() < CUTMIX_PROB:\n                imgs, la, lb, lam = cutmix(imgs, labels, CUTMIX_ALPHA)\n                logits = model(imgs).squeeze(1)\n                loss = lam * criterion(logits, la) + (1 - lam) * criterion(logits, lb)\n            else:\n                logits = model(imgs).squeeze(1)\n                loss = criterion(logits, labels)\n            optimizer.zero_grad()\n let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
