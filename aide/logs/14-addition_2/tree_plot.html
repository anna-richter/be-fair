vs benign classification. We apply random horizontal flips and\nsmall rotations, and perform stratified 5-fold cross-validation on the\nmalignancy labels to estimate mean AUROC. After cross-validation, we retrain the\nmodel on the full dataset for deployment and save the best weights. We provide a\npredict() function that loads the saved model to generate malignancy\nprobabilities for any folder of new images and writes a submission.csv if a\n./input/test directory exists.", "We fine-tune a pretrained Vision Transformer (ViT-Ti/16) on the binary\nmalignancy labels (malignant vs benign/non\u2010neoplastic), applying standard image\naugmentations and a weighted sampler to balance skin\u2010tone representation. We\nsplit the  dataset into an 80/20 stratified train/validation split by label,\ntrain for 5 epochs with BCEWithLogitsLoss, and compute AUROC on the hold\u2010out\nset. We save the best model weights and implement a predict() function that\nloads the model to compute malignancy probabilities for any new image folder; if\n`./input/test` exists, it writes `submission.csv` in `./working`. The final\nprinted output is the best validation AUROC.", "We fine-tune a pretrained MobileNetV3-Large on the binary malignancy task\n(malignant vs benign/non-neoplastic), applying random crops, flips and color\njitter, and use a weighted sampler to balance skin-tone groups for fairness. We\nrun 5-fold stratified cross-validation on the malignancy labels to compute the\nmean AUROC, then retrain on the full dataset and save the final model. A\npredict() function loads the saved model to output malignancy probabilities for\nany image folder, saving submission.csv if a `./input/test` folder exists. We\nprint the mean CV AUROC at the end.", "I propose to incorporate skin\u2010tone fairness by using a WeightedRandomSampler in\nthe training DataLoader, where each sample\u2019s weight is set inverse to its\nskin\u2010tone group frequency. This will force the model to see balanced skin\u2010tone\nrepresentation each epoch without changing the overall dataset size. We\u2019ll\ncompute these weights per fold and also when retraining on the full dataset.\nThis atomic change should reduce AUROC gaps across skin tones while retaining\noverall performance.", "I propose adding a WeightedRandomSampler to balance skin\u2010tone groups during\ntraining by assigning each sample an inverse\u2010frequency weight based on its skin\ntone. This will force each batch to have equal representation of light and dark\nskin tones, reducing fairness gaps without altering overall dataset size. We\ncompute these weights per fold (and for the full retrain) and replace\n`shuffle=True` with the sampler in the DataLoader. The rest of the pipeline\nremains the same, and we report the mean CV AUROC to evaluate impact.", "I propose incorporating a skin\u2010tone balanced sampler in the training DataLoader\nby computing per\u2010sample weights inversely proportional to the frequency of each\nskin\u2010tone group and using a `WeightedRandomSampler`. This will ensure each batch\nhas equal representation of all skin tones, improving fairness and potentially\nboosting overall generalization. We'll apply this change in both the\ncross\u2010validation folds and the final full\u2010data retraining.", "We will integrate MixUp augmentation into the training loop by generating mixed\ninputs and labels for each batch using a Beta-distributed mixing coefficient\n(alpha=0.4). This encourages the model to learn smoother decision boundaries and\ncan improve both overall AUROC and reduce bias across skin tones. We modify\n`train_one_epoch` to perform MixUp, keep the 5-fold cross\u2010validation and final\nretraining setup unchanged, and report the mean CV AUROC. The `predict()`\nfunction remains as before for generating test\u2010time predictions.", "We\u2019ll integrate simple test\u2010time augmentation (TTA) by averaging predictions on\nthe original and horizontally flipped images in both validation and test\u2010time\ninference. This only requires modifying the evaluate() and predict() functions\nto compute model outputs for an image and its flipped version, average their\nsigmoid probabilities, and then compute ROC AUC or build the submission. This\natomic change should enhance robustness and overall AUROC without altering\ntraining.", "I will compute per\u2010sample weights inversely proportional to each skin\u2010tone\ngroup\u2019s frequency in the training split and replace the usual shuffle with a\n`WeightedRandomSampler` in the DataLoader. This will ensure each batch sees\nbalanced skin\u2010tone representation, promoting fairness and potentially improving\ngeneralization. The rest of the training, TTA, and evaluation pipeline remains\nunchanged.", "We will integrate MixUp augmentation into the training loop by mixing images and\nlabels within each batch using a Beta distribution (alpha=0.4). This encourages\nsmoother decision boundaries and can improve both overall AUROC and fairness\nacross skin tones. We modify `train_one_epoch` to perform MixUp, keep the 5-fold\ncross\u2010validation and final full\u2010data retraining pipeline unchanged. The rest of\nthe inference code, including TTA, remains the same. We will print the mean CV\nAUROC with MixUp.", "We will integrate MixUp augmentation into the training loop by mixing images and\nlabels within each batch using a Beta distribution (alpha=0.4). During each\ntrain iteration, we sample a mixing coefficient, shuffle the batch, and linearly\ncombine both inputs and labels. This regularization encourages smoother decision\nboundaries and can boost both overall AUROC and reduce overfitting. We leave the\nrest of the 5-fold CV, TTA evaluation, and final retraining pipeline unchanged.", "I will add a `WeightedRandomSampler` to the training `DataLoader` so that each\nbatch contains a balanced representation of skin\u2010tone groups, by assigning each\nsample an inverse\u2010frequency weight based on its `skin_tone` label. This ensures\nthe model sees equal light and dark skin examples each epoch, reducing fairness\ngaps without changing overall dataset size or training dynamics. The rest of the\n5\u2010fold cross\u2010validation, TTA evaluation, and final retraining pipeline remains\nunchanged. We\u2019ll print the fold AUROCs and mean CV AUROC to measure impact.", "I will balance skin\u2010tone representation by using a `WeightedRandomSampler` in\nthe training DataLoader, assigning each sample an inverse\u2010frequency weight based\non its `skin_tone` label. This ensures each batch sees equal numbers of light\nand dark skin images, improving fairness without altering total training data. I\napply this in both the 5\u2010fold CV loops and the final full\u2010data retraining,\nkeeping the rest of the pipeline (model, augmentations, TTA) unchanged.", "I propose integrating MixUp augmentation into the training loop by mixing images\nand labels within each batch using a Beta distribution (alpha=0.4). During each\ntrain iteration, we sample a mixing coefficient \u03bb, shuffle the batch, and create\nmixed inputs and target pairs to compute a weighted loss. This regularization\nencourages smoother decision boundaries, which can boost both overall AUROC and\nrobustness without altering the rest of the 5-fold CV, TTA evaluation, or final\nretraining pipeline.", "I propose integrating MixUp augmentation (\u03b1=0.4) into the training loop to\nencourage smoother decision boundaries and reduce overfitting. We modify\n`train_one_epoch` to mix inputs and labels per batch and compute a weighted loss\naccordingly, while keeping the existing 5-fold CV, TTA evaluation, and full-data\nretraining unchanged. This atomic change should boost overall AUROC without\naltering the inference pipeline.", "I will compute per\u2010sample weights as the inverse frequency of each `skin_tone`\ngroup in the training split and use a `WeightedRandomSampler` for the training\nDataLoader in both cross\u2010validation and final retraining. This enforces balanced\nskin\u2010tone representation each epoch, promoting fairness without altering model\nor augmentations. The rest of the pipeline\u2014including TTA evaluation and\n`predict()`\u2014remains unchanged. I will then print the mean CV AUROC to measure\noverall performance.", "I propose integrating MixUp augmentation (\u03b1=0.4) into the training loop by\nmixing images and labels within each batch in `train_one_epoch`. This simple\nregularization encourages smoother decision boundaries and can boost overall\nAUROC without altering the inference pipeline. We\u2019ll modify `train_one_epoch` to\nsample a mixing coefficient \u03bb, shuffle the batch, create mixed inputs and\ntargets, and compute a weighted loss. The rest of the 5-fold CV, TTA evaluation,\nand final retraining remain unchanged.", "I will balance skin\u2010tone representation during training by computing per\u2010sample\nweights inversely proportional to each `skin_tone` group\u2019s frequency and using a\n`WeightedRandomSampler` in the `DataLoader`. This ensures each batch sees equal\nnumbers of light and dark skin images, promoting fairness without altering the\nrest of the pipeline. I apply this change in both the 5\u2010fold cross\u2010validation\nloops and the final full\u2010data retraining, then report the fold AUROCs and mean\nCV AUROC."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMAGE_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nNUM_FOLDS = 5\nBATCH_SIZE = 32\nNUM_EPOCHS = 3\nLR = 1e-4\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load data\ndf = pd.read_csv(DATA_CSV)\n# Map labels: malignant=1, others=0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n\n# Dataset\nclass SkinDataset(Dataset):\n    def __init__(self, df, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(IMAGE_DIR, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        return img, row.target, row.skin_tone, row.image_name\n\n\n# Transforms\ntrain_tf = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=NUM_FOLDS, shuffle=True, random_state=42)\nall_preds = []\nall_targets = []\nall_tones = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.target)):\n    train_df = df.iloc[train_idx]\n    val_df = df.iloc[val_idx]\n    # Weighted sampling to balance skin_tone in training\n    tone_counts = train_df.skin_tone.value_counts().to_dict()\n    weights = train_df.skin_tone.map(lambda x: 1.0 / tone_counts.get(x, 1)).values\n    sampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n    train_ds = SkinDataset(train_df, transform=train_tf)\n    val_ds = SkinDataset(val_df, transform=val_tf)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    # Model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n    # Train\n    model.train()\n    for epoch in range(NUM_EPOCHS):\n        for imgs, targets, *_ in train_loader:\n            imgs = imgs.to(DEVICE)\n            targets = targets.float().unsqueeze(1).to(DEVICE)\n            preds = model(imgs)\n            loss = criterion(preds, targets)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # Validate\n    model.eval()\n    preds_list, targets_list, tones_list = [], [], []\n    with torch.no_grad():\n        for imgs, targets, tones, _ in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).cpu().squeeze(1).numpy()\n            probs = 1 / (1 + np.exp(-logits))\n            preds_list.extend(probs)\n            targets_list.extend(targets.numpy())\n            tones_list.extend(tones.numpy())\n    all_preds.extend(preds_list)\n    all_targets.extend(targets_list)\n    all_tones.extend(tones_list)\n    # Save last fold model\n    if fold == NUM_FOLDS - 1:\n        torch.save(model.state_dict(), MODEL_PATH)\n\n# Compute metrics\nall_preds = np.array(all_preds)\nall_targets = np.array(all_targets)\nall_tones = np.array(all_tones)\noverall_auc = roc_auc_score(all_targets, all_preds)\ntone_aucs = {}\nfor tone in np.unique(all_tones):\n    mask = all_tones == tone\n    if mask.sum() > 0:\n        tone_aucs[int(tone)] = roc_auc_score(all_targets[mask], all_preds[mask])\nauc_gap = max(tone_aucs.values()) - min(tone_aucs.values())\nprint(f\"Overall AUROC: {overall_auc:.4f}\")\nprint(f\"Skin-tone AUC gap: {auc_gap:.4f}\")\nprint(\"Per-tone AUCs:\", tone_aucs)\n\n\n# Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in folder_path.\n    Returns a DataFrame with columns [image_name, malignancy_prob].\n    \"\"\"\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model = model.to(DEVICE).eval()\n    tf = val_tf\n    results = []\n    for fname in sorted(os.listdir(folder_path)):\n        if not fname.lower().endswith(\".jpg\"):\n            continue\n        img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n        inp = tf(img).unsqueeze(0).to(DEVICE)\n        with torch.no_grad():\n            prob = torch.sigmoid(model(inp))[0, 0].item()\n        results.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(results)\n\n\n# If test folder exists, generate submission.csv\ntest_folder = \"./input/test\"\nif os.path.isdir(test_folder):\n    sub = predict(test_folder)\n    sub.to_csv(\"./working/submission.csv\", index=False)\n    print(\"Saved submission.csv\")", "import os\nimport pandas as pd\nimport numpy as np\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\nfrom sklearn.model_selection import StratifiedShuffleSplit\nfrom sklearn.metrics import roc_auc_score\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        # map labels\n        self.labels = (self.df[\"label\"] == \"malignant\").astype(int).values\n        # compute sample weights for fairness\n        tone_counts = self.df[\"skin_tone\"].value_counts().to_dict()\n        self.weights = (\n            self.df[\"skin_tone\"]\n            .map(lambda t: 1.0 / tone_counts.get(t, 1))\n            .values.astype(np.float32)\n        )\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        img_name = self.df.loc[idx, \"image_name\"]\n        path = os.path.join(self.img_dir, img_name + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(self.labels[idx], dtype=torch.float32)\n        weight = torch.tensor(self.weights[idx], dtype=torch.float32)\n        return img, label, weight\n\n\n# Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# drop rows without valid label\ndf = df[df[\"label\"].isin([\"benign\", \"malignant\", \"non-neoplastic\"])]\n# remap non-neoplastic->benign\ndf[\"label\"] = df[\"label\"].replace({\"non-neoplastic\": \"benign\"})\n\n# train/val split\nsplitter = StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42)\ny = (df[\"label\"] == \"malignant\").astype(int)\ntrain_idx, val_idx = next(splitter.split(df, y))\ndf_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n\n# transforms\nmean = [0.485, 0.456, 0.406]\nstd = [0.229, 0.224, 0.225]\ntrain_tf = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize(mean, std),\n    ]\n)\nval_tf = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean, std),\n    ]\n)\n\n# datasets and loaders\ntrain_ds = SkinLesionDataset(df_train, \"./input/MyImages\", transform=train_tf)\nval_ds = SkinLesionDataset(df_val, \"./input/MyImages\", transform=val_tf)\ntrain_loader = DataLoader(\n    train_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n)\nval_loader = DataLoader(\n    val_ds, batch_size=32, shuffle=False, num_workers=4, pin_memory=True\n)\n\n# model, loss, optimizer\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(device)\ncriterion = nn.BCEWithLogitsLoss(reduction=\"none\")\noptimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n# training loop\nbest_auc = 0.0\nfor epoch in range(5):\n    model.train()\n    for imgs, labels, weights in train_loader:\n        imgs, labels, weights = imgs.to(device), labels.to(device), weights.to(device)\n        logits = model(imgs).squeeze(1)\n        loss = criterion(logits, labels)\n        loss = (loss * weights).mean()\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n    # validation\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels, _ in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_preds.extend(probs)\n            all_labels.extend(labels.numpy())\n    val_auc = roc_auc_score(all_labels, all_preds)\n    print(f\"Epoch {epoch+1} Validation AUROC: {val_auc:.4f}\")\n    if val_auc > best_auc:\n        best_auc = val_auc\n        os.makedirs(\"working\", exist_ok=True)\n        torch.save(model.state_dict(), \"working/model.pth\")\n\nprint(f\"Best Validation AUROC: {best_auc:.4f}\")\n\n\n# prediction function\ndef predict(img_folder, model_path=\"working/model.pth\"):\n    \"\"\"\n    Given a folder of images, returns a DataFrame with columns:\n      image_name (str): file name\n      probability (float): malignancy probability\n    \"\"\"\n    # load model\n    device_ = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    m = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    m.load_state_dict(torch.load(model_path, map_location=device_))\n    m.to(device_).eval()\n    # transform\n    tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean, std),\n        ]\n    )\n    results = []\n    for fn in sorted(os.listdir(img_folder)):\n        if fn.lower().endswith((\".png\", \".jpg\", \".jpeg\")):\n            path = os.path.join(img_folder, fn)\n            img = Image.open(path).convert(\"RGB\")\n            inp = tf(img).unsqueeze(0).to(device_)\n            with torch.no_grad():\n                prob = torch.sigmoid(m(inp).squeeze(1)).item()\n            results.append({\"image_name\": fn, \"probability\": prob})\n    return pd.DataFrame(results)\n\n\n# generate submission if test folder exists\ntest_folder = \"./input/test\"\nif os.path.isdir(test_folder):\n    sub = predict(test_folder)\n    sub.to_csv(\"working/submission.csv\", index=False)", "import os\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\nfrom PIL import Image\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\nclass TestFolderDataset(Dataset):\n    def __init__(self, folder, transform):\n        self.files = [f for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n        self.folder = folder\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.files)\n\n    def __getitem__(self, idx):\n        fname = self.files[idx]\n        img = Image.open(os.path.join(self.folder, fname)).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        return img, fname\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0.0\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(device), labels.to(device)\n        optimizer.zero_grad()\n        logits = model(imgs).squeeze(1)\n        loss = criterion(logits, labels)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            ys.extend(labels.numpy())\n            ps.extend(probs)\n    return roc_auc_score(ys, ps)\n\n\ndef predict(image_folder: str):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in image_folder.\n    Returns a DataFrame with columns ['image_name','malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # build model\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model.to(device).eval()\n    # transforms\n    tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = TestFolderDataset(image_folder, tf)\n    loader = DataLoader(ds, batch_size=32, num_workers=4, pin_memory=True)\n    results = []\n    with torch.no_grad():\n        for imgs, fnames in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for f, p in zip(fnames, probs):\n                results.append((f, float(p)))\n    return pd.DataFrame(results, columns=[\"image_name\", \"malignancy_probability\"])\n\n\nif __name__ == \"__main__\":\n    # settings\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # binary label: malignant=1, else=0\n    df[\"label_bin\"] = (df.label == \"malignant\").astype(int)\n    img_dir = \"./input/MyImages\"\n    # transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # cross-validation\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (tr_idx, va_idx) in enumerate(skf.split(df, df.label_bin), 1):\n        train_df = df.iloc[tr_idx]\n        val_df = df.iloc[va_idx]\n        train_ds = SkinLesionDataset(train_df, img_dir, train_tf)\n        val_ds = SkinLesionDataset(val_df, img_dir, val_tf)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n        )\n        val_loader = DataLoader(\n            val_ds, batch_size=64, shuffle=False, num_workers=4, pin_memory=True\n        )\n        # model\n        model = models.densenet121(pretrained=True)\n        model.classifier = nn.Linear(model.classifier.in_features, 1)\n        model = model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = optim.Adam(model.parameters(), lr=1e-4)\n        # train\n        for epoch in range(3):\n            train_one_epoch(model, train_loader, criterion, optimizer, device)\n        # eval\n        auc = evaluate(model, val_loader, device)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        aucs.append(auc)\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV AUROC: {mean_auc:.4f}\")\n    # retrain on full data\n    full_ds = SkinLesionDataset(df, img_dir, train_tf)\n    full_loader = DataLoader(\n        full_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n    )\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    for epoch in range(3):\n        train_one_epoch(model, full_loader, criterion, optimizer, device)\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model.state_dict(), \"./working/model.pth\")\n    # generate submission if test folder exists\n    test_folder = \"./input/test\"\n    if os.path.isdir(test_folder):\n        sub = predict(test_folder)\n        sub.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport timm\n\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nTEST_DIR = \"./input/test\"\nWORK_DIR = \"./working\"\nMODEL_PATH = os.path.join(WORK_DIR, \"best_vit_ti.pth\")\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nEPOCHS = 5\nLR = 3e-5\nIMG_SIZE = 224\n\n# Map labels to binary\nLABEL_MAP = {\"malignant\": 1, \"benign\": 0, \"non-neoplastic\": 0}\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = float(row.binary_label)\n        skin_tone = row.skin_tone\n        return img, label, skin_tone, row.image_name\n\n\ndef make_dataloaders(df):\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df.binary_label, random_state=42\n    )\n    # compute skin-tone weights for sampler\n    tone_counts = train_df.skin_tone.value_counts().to_dict()\n    weights = train_df.skin_tone.apply(lambda t: 1.0 / tone_counts.get(t, 1)).values\n    sampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n\n    train_transform = T.Compose(\n        [\n            T.RandomResizedCrop(IMG_SIZE),\n            T.RandomHorizontalFlip(),\n            T.RandomRotation(15),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(IMG_SIZE),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, transform=train_transform)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, transform=val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    return train_loader, val_loader, val_df\n\n\ndef build_model():\n    model = timm.create_model(\"vit_tiny_patch16_224\", pretrained=True, num_classes=1)\n    return model.to(DEVICE)\n\n\ndef train_and_evaluate():\n    df = pd.read_csv(DATA_CSV)\n    df[\"binary_label\"] = df.label.map(LABEL_MAP)\n    train_loader, val_loader, val_df = make_dataloaders(df)\n    model = build_model()\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.AdamW(model.parameters(), lr=LR)\n    best_auc = 0.0\n    os.makedirs(WORK_DIR, exist_ok=True)\n\n    for epoch in range(1, EPOCHS + 1):\n        model.train()\n        for imgs, labels, _, _ in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n        # validation\n        model.eval()\n        all_logits = []\n        all_labels = []\n        with torch.no_grad():\n            for imgs, labels, _, _ in val_loader:\n                imgs = imgs.to(DEVICE)\n                logits = model(imgs).squeeze(1).cpu().numpy()\n                all_logits.extend(logits.tolist())\n                all_labels.extend(labels.numpy().tolist())\n        probs = 1 / (1 + np.exp(-np.array(all_logits)))\n        auc = roc_auc_score(all_labels, probs)\n        print(f\"Epoch {epoch}: Val AUROC = {auc:.4f}\")\n        if auc > best_auc:\n            best_auc = auc\n            torch.save(model.state_dict(), MODEL_PATH)\n    print(f\"Best Validation AUROC: {best_auc:.4f}\")\n    return best_auc\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in image_folder.\n    Returns: DataFrame with columns ['image_name','probability'].\n    \"\"\"\n    df = pd.DataFrame(\n        {\n            \"image_name\": [\n                f[:-4] for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")\n            ]\n        }\n    )\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(IMG_SIZE),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    model = build_model()\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model.eval()\n    probs = []\n    with torch.no_grad():\n        for img_name in df.image_name:\n            img = Image.open(os.path.join(image_folder, img_name + \".jpg\")).convert(\n                \"RGB\"\n            )\n            img_t = transform(img).unsqueeze(0).to(DEVICE)\n            logit = model(img_t).item()\n            probs.append(1 / (1 + np.exp(-logit)))\n    df[\"probability\"] = probs\n    return df\n\n\nif __name__ == \"__main__\":\n    best_auc = train_and_evaluate()\n    # If test data exists, make submission\n    if os.path.isdir(TEST_DIR):\n        submission = predict(TEST_DIR)\n        submission.to_csv(os.path.join(WORK_DIR, \"submission.csv\"), index=False)\n    # Print final metric\n    print(f\"{best_auc:.4f}\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nfrom torchvision import models\nfrom tqdm import tqdm\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, transform):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img = Image.open(row.image_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        skin = row.skin_tone\n        return img, label, skin\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0.0\n    for imgs, labels, _ in loader:\n        imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        logits = model(imgs)\n        loss = criterion(logits, labels)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef eval_model(model, loader, device):\n    model.eval()\n    all_labels = []\n    all_probs = []\n    with torch.no_grad():\n        for imgs, labels, _ in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.ravel().tolist())\n            all_labels.extend(labels.numpy().tolist())\n    return roc_auc_score(all_labels, all_probs)\n\n\ndef predict(image_folder: str, model_path: str):\n    # Load model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.mobilenet_v3_large(pretrained=False)\n    model.classifier[3] = nn.Linear(model.classifier[3].in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # Transform\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Read images\n    files = sorted(\n        [f for f in os.listdir(image_folder) if f.lower().endswith((\".jpg\", \".png\"))]\n    )\n    results = []\n    with torch.no_grad():\n        for fname in files:\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            x = transform( class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
