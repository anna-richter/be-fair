let treeStructData = {"edges": [[2, 8], [4, 5], [5, 7], [5, 6], [7, 10], [7, 14], [7, 9], [7, 15], [7, 12], [7, 13], [7, 11], [15, 16], [15, 17], [15, 19], [15, 18]], "layout": [[0.0, 0.0], [0.1111111111111111, 0.0], [0.2222222222222222, 0.0], [0.3333333333333333, 0.0], [0.4444444444444444, 0.0], [0.4444444444444444, 0.25], [0.3888888888888889, 0.5], [0.5, 0.5], [0.2222222222222222, 0.25], [0.16666666666666666, 0.75], [0.2777777777777778, 0.75], [0.3888888888888889, 0.75], [0.5, 0.75], [0.6111111111111112, 0.75], [0.7222222222222222, 0.75], [0.8333333333333334, 0.75], [0.6666666666666666, 1.0], [0.7777777777777778, 1.0], [0.8888888888888888, 1.0], [1.0, 1.0]], "plan": ["I propose fine-tuning a pretrained ResNet18 on the binary malignancy task by\nmapping \u201cmalignant\u201d to 1 and all others to 0. We\u2019ll perform stratified 5-fold\ncross-validation to estimate AUROC, then save the last fold\u2019s model and provide\na `predict()` function that returns malignancy probabilities for new images.\nData is loaded from `input/mydataset.csv` and images under `input/MyImages`, and\noutputs a `submission.csv` for all images. AUROC is our evaluation metric.", "We extract 2048-dim embeddings from each lesion image using a pretrained\nResNet50, then train a LightGBM classifier on these features to predict\nmalignancy. Stratified 5-fold cross-validation is used to compute AUROC, which\nwe print as the evaluation metric. After CV we retrain on all data and save the\nfinal model, and provide a predict(folder: str) function that returns malignancy\nprobabilities for new images. Finally we run predict on the provided image\nfolder and save the results to working/submission.csv.", "We extract 1280-dimensional embeddings from each lesion image using a pretrained\nEfficientNet-B0 without fine-tuning and train an XGBoost classifier on these\nfeatures to predict malignancy. We use stratified 5-fold cross-validation to\ncompute per-fold and mean AUROC. After CV, we retrain on all data, save the\nfinal model, and implement a `predict(folder)` function that processes new\nimages and returns malignancy probabilities. Finally, we generate a\n`working/submission.csv` with predictions for all images in `input/MyImages`.", "We fine-tune an end-to-end EfficientNet-B0 pretrained on ImageNet to classify\nskin lesions as malignant vs non-malignant by mapping malignant to 1 and other\nlabels to 0. We perform stratified 5\u2010fold cross\u2010validation, using a weighted\nbinary cross\u2010entropy loss to address class imbalance and compute the AUROC on\neach fold. After training, we save the final fold\u2019s model to working/model.pth\nand define a `predict(folder: str)` function that loads this model to compute\nmalignancy probabilities for new images. Finally, we aggregate predictions on\nthe provided input/MyImages folder and write them to working/submission.csv.", "Here\u2019s a simple approach: we\u2019ll fine\u2010tune a pretrained DenseNet\u2010121 on the\nbinary malignancy task, mapping \u201cmalignant\u201d to 1 and other labels to 0. We\nperform stratified 5-fold CV to compute AUROC, print the mean and standard\ndeviation, then retrain on the full dataset and save the model. We implement a\npredict(folder: str) function that loads the saved model and returns malignancy\nprobabilities for all images in a folder, and we generate working/submission.csv\nfor input/MyImages.", "We will incorporate simple test-time augmentation (horizontal flip) by averaging\npredictions from the original and flipped images during validation and final\nprediction. This will improve robustness without changing training. We update\nthe validation loop to compute AUC with TTA and modify the `predict()` function\nto average logits from both versions. The rest of the pipeline remains\nunchanged.", "I will integrate mixup augmentation during training with alpha=0.4 in both the\ncross\u2010validation and full retraining loops. This will combine images and labels\nin each batch to regularize the model and improve generalization, while keeping\nthe existing TTA and prediction pipeline unchanged.", "I propose to extend test\u2010time augmentation by including vertical flips in\naddition to the existing horizontal flips, generating four predictions\n(original, horizontal flip, vertical flip, and both flips) and averaging their\nprobabilities. We will update the cross-validation validation loop to compute\nAUC using this 4\u2010view TTA ensemble, then retrain on the full dataset and apply\nthe same TTA in the `predict()` function. This atomic change should improve\nrobustness and slightly boost the AUROC by capturing more invariances. The rest\nof the pipeline remains unchanged.", "We replace the XGBoost classifier with a RandomForest from scikit\u2010learn so we\ndon\u2019t depend on xgboost, and we add sample weights inversely proportional to\nskin_tone frequencies to promote fairness. We extract embeddings with\nEfficientNet\u2010B0 as before, run 5\u2010fold Stratified CV, print per\u2010fold and mean\nAUROC, then retrain on the full dataset with those weights, save the final\nmodel, define a predict() function, and produce submission.csv.", "I propose to weight each training sample inversely proportional to its skin\u2010tone\ngroup frequency, so that underrepresented skin tones contribute more to the loss\nand the model learns more fairly across tones. We compute a `sample_weight` for\neach image as `1/freq(skin_tone)` normalized to mean 1, store it in the dataset,\nand use `BCEWithLogitsLoss(reduction='none')` to apply these weights per sample\nin both cross\u2010validation and full\u2010data training. All other components\n(DenseNet\u2010121 backbone, 4\u2010view TTA, transforms, CV) remain unchanged to isolate\nthe effect of fairness weighting. Below is the updated training and prediction\nscript that prints CV AUROC and saves `submission.csv`.", "I propose to enhance the test\u2010time augmentation (TTA) by incorporating 90\u00b0\nrotations in addition to the existing horizontal and vertical flips.\nSpecifically, we will generate 16 augmented views for each image (4 flip\ncombinations \u00d7 4 rotations) and average the model logits across all views during\nvalidation and prediction. This richer TTA should improve robustness to\norientation variations and marginally boost AUROC without changing the training\nloop. We update the `tta_predictions` function accordingly and rerun 5\u2010fold CV\nand full\u2010data retraining with this 16\u2010view TTA.", "I propose to strengthen the training augmentation by replacing the initial\nresize with a `RandomResizedCrop(224, scale=(0.8,1.0))` and adding small random\nrotations up to 15 degrees. This will improve invariance to scale and\norientation and boost generalization without altering the architecture or TTA.\nThe rest of the pipeline, including 4\u2010view TTA, DenseNet\u2010121 backbone, and\ncross\u2010validation, remains unchanged.", "We will improve the training pipeline by replacing the fixed Resize with a\nRandomResizedCrop to 224\u00d7224 (scale 0.8\u20131.0) and adding RandomRotation(\u00b115\u00b0) to\nenhance invariance to scale and orientation, while keeping flips and 4\u2010view TTA\nunchanged. The rest of the cross\u2010validation, DenseNet121 fine\u2010tuning,\nretraining, and prediction function remain the same. This single augmentation\nchange aims to boost generalization and AUROC. Below is the updated\nimplementation.", "I propose to integrate sample weighting based on skin tone frequencies by using\na WeightedRandomSampler in the training DataLoader. We compute sample weights\ninversely proportional to the frequency of the `skin_tone` group for each image\nto ensure underrepresented skin tones are sampled more. This fairness-aware\nsampling should improve the model's robustness across different skin tones\nwithout altering the architecture or TTA. We'll apply this sampler in both\ncross-validation and full-data retraining loops while keeping other settings\nunchanged.", "I propose to further improve generalization and robustness to varying skin tones\nand lighting by adding random color jitter (brightness, contrast, saturation,\nhue) into the training augmentation pipeline, while retaining the existing\nRandomResizedCrop, RandomRotation, flips, and 4\u2010view TTA. This simple\naugmentation should help the model learn color\u2010invariant features and avoid\noverfitting to specific lighting conditions. All other components of the\npipeline, including 5\u2010fold cross\u2010validation, DenseNet\u2010121 fine\u2010tuning, and the\n`predict()` function with 4\u2010view TTA, remain unchanged. Below is the updated\nimplementation that prints the CV AUROC and saves the final submission.", "I propose to incorporate a cosine annealing learning\u2010rate scheduler during\ntraining and cross\u2010validation, which gradually reduces the learning rate from\nits initial value down to a small minimum over the epochs. This change often\nimproves convergence and generalization without altering the model architecture\nor data pipeline. We'll add `CosineAnnealingLR` after optimizer creation and\nstep it once per epoch. All other components, including 4\u2010view TTA, remain\nunchanged.", "I propose to incorporate fairness-aware sampling by using a\nWeightedRandomSampler in the training DataLoader, where each sample\u2019s weight is\nset inversely proportional to its skin_tone group frequency. This ensures that\nunderrepresented skin tones are sampled more often during training without\naltering the model architecture, transforms, scheduler, or TTA. We compute these\nsample weights separately in each CV fold and for the full-data retraining, then\napply the sampler in lieu of shuffle. The rest of the pipeline, including 4-view\nTTA, DenseNet-121 fine-tuning, and evaluation, remains unchanged.", "I propose replacing the standard BCEWithLogitsLoss with a Focal Loss (\u03b3=2,\n\u03b1=0.25) to focus the model on hard-to-classify malignant examples and mitigate\nclass imbalance. This change is atomic and should improve AUROC by reducing the\nimpact of easy negatives and emphasizing difficult positives during training. We\nwill use the same DenseNet-121 backbone, 4-view TTA, CosineAnnealingLR\nscheduler, and overall training/prediction pipeline, swapping only the loss\nfunction. Below is the updated implementation.", "I propose to ensemble the five fold-trained DenseNet-121 models at inference\ntime by saving each fold\u2019s weights during cross-validation and averaging their\nTTA\u2010enhanced predictions. During CV each fold\u2019s model is saved to\n`working/model_fold_{fold}.pth`. The `predict()` function loads all five fold\nmodels, applies 4\u2010view TTA per model, converts logits to probabilities, and\naverages across models to yield final malignancy scores. This ensembling should\nboost robustness and AUROC without changing the training loop.", "I propose adding RandomErasing augmentation into the training pipeline to\nregularize the model and improve robustness to occlusions and artifacts.\nSpecifically, we will append `transforms.RandomErasing(p=0.5)` after\nnormalization in the training transform. All other components\u2014including the\nDenseNet-121 backbone, CosineAnnealingLR scheduler, 4-view TTA, and 5-fold\nCV\u2014remain unchanged to isolate the effect of this augmentation."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nSUBMISSION_CSV = \"./working/submission.csv\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\n# 1. Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transforms):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transforms = transforms\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transforms(img)\n        label = torch.tensor(row.label_bin, dtype=torch.long)\n        return img, label\n\n\n# 2. Read and preprocess labels\ndf = pd.read_csv(DATA_CSV)\n# Map malignant=1, others=0\ndf[\"label_bin\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n\n# 3. Transforms\ntfms = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# 4. 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label_bin)):\n    print(f\"Fold {fold+1}\")\n    train_df = df.iloc[train_idx]\n    val_df = df.iloc[val_idx]\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, tfms)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, tfms)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    model = timm.create_model(\"resnet18\", pretrained=True, num_classes=2).to(DEVICE)\n    criterion = nn.CrossEntropyLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # Train for 3 epochs\n    for epoch in range(3):\n        model.train()\n        for imgs, lbls in train_loader:\n            imgs, lbls = imgs.to(DEVICE), lbls.to(DEVICE)\n            logits = model(imgs)\n            loss = criterion(logits, lbls)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # Evaluate\n    model.eval()\n    all_probs = []\n    all_lbls = []\n    with torch.no_grad():\n        for imgs, lbls in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs)\n            probs = torch.softmax(logits, dim=1)[:, 1].cpu().numpy()\n            all_probs.extend(probs)\n            all_lbls.extend(lbls.numpy())\n    auc = roc_auc_score(all_lbls, all_probs)\n    print(f\" Fold {fold+1} AUROC: {auc:.4f}\")\n    aucs.append(auc)\n\nmean_auc = np.mean(aucs)\nprint(f\"Mean AUROC over 5 folds: {mean_auc:.4f}\")\n\n# 5. Save last fold model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\n# 6. Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for each image in a folder.\n    Args:\n      folder_path (str): Path to folder containing .jpg images.\n    Returns:\n      dict: {image_name (no extension): probability_of_malignant}\n    \"\"\"\n    model = timm.create_model(\"resnet18\", pretrained=False, num_classes=2)\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    model.to(DEVICE).eval()\n    results = {}\n    transform = tfms\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(DEVICE)\n            with torch.no_grad():\n                prob = torch.softmax(model(inp), dim=1)[0, 1].item()\n            results[os.path.splitext(fname)[0]] = prob\n    return results\n\n\n# 7. Create submission.csv for all input images\npreds = predict(IMG_DIR)\nsub_df = pd.DataFrame(\n    {\"image_name\": list(preds.keys()), \"malignancy_probability\": list(preds.values())}\n)\nsub_df.to_csv(SUBMISSION_CSV, index=False)\nprint(f\"Saved submission to {SUBMISSION_CSV}\")", "import os\nimport pandas as pd\nimport numpy as np\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport lightgbm as lgb\nimport joblib\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/final_model.pkl\"\nSUBMISSION_CSV = \"./working/submission.csv\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\n\n# Load labels\ndf = pd.read_csv(DATA_CSV)\ndf[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\ndf[\"path\"] = df[\"image_name\"].apply(lambda x: os.path.join(IMG_DIR, f\"{x}.jpg\"))\n\n# Image dataset and loader\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n\nclass ImageDataset(Dataset):\n    def __init__(self, paths):\n        self.paths = paths\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        return transform(img)\n\n\n# Load pretrained ResNet50 and strip classifier\nresnet = models.resnet50(pretrained=True)\nbackbone = nn.Sequential(*list(resnet.children())[:-1]).to(DEVICE).eval()\n\n\ndef get_embeddings(paths):\n    ds = ImageDataset(paths)\n    loader = DataLoader(ds, batch_size=BATCH_SIZE, num_workers=4, pin_memory=True)\n    mats = []\n    with torch.no_grad():\n        for batch in loader:\n            batch = batch.to(DEVICE)\n            emb = backbone(batch).view(batch.size(0), -1).cpu().numpy()\n            mats.append(emb)\n    return np.vstack(mats)\n\n\n# Precompute embeddings for all data\nall_paths = df[\"path\"].tolist()\nembs = get_embeddings(all_paths)\nlabels = df[\"label_bin\"].values\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor train_idx, val_idx in skf.split(embs, labels):\n    X_train, X_val = embs[train_idx], embs[val_idx]\n    y_train, y_val = labels[train_idx], labels[val_idx]\n    clf = lgb.LGBMClassifier(n_estimators=100, random_state=42)\n    clf.fit(X_train, y_train)\n    preds = clf.predict_proba(X_val)[:, 1]\n    aucs.append(roc_auc_score(y_val, preds))\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data and save model\nfinal_clf = lgb.LGBMClassifier(n_estimators=100, random_state=42)\nfinal_clf.fit(embs, labels)\njoblib.dump(final_clf, MODEL_PATH)\n\n\n# Prediction function\ndef predict(folder_path: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in folder_path.\n    Returns a DataFrame with columns: image_name, malignancy_probability.\n    \"\"\"\n    model = joblib.load(MODEL_PATH)\n    files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    paths = [os.path.join(folder_path, f) for f in files]\n    emb = get_embeddings(paths)\n    probs = model.predict_proba(emb)[:, 1]\n    return pd.DataFrame({\"image_name\": files, \"malignancy_probability\": probs})\n\n\n# Run prediction on provided images and save submission\nsubmission = predict(IMG_DIR)\nsubmission.to_csv(SUBMISSION_CSV, index=False)\nprint(f\"Saved predictions to {SUBMISSION_CSV}\")", "import os\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport xgboost as xgb\nimport joblib\n\n\n# Dataset for loading images\nclass ImageDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.image_paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        from PIL import Image\n\n        img = Image.open(self.image_paths[idx]).convert(\"RGB\")\n        return self.transform(img), idx\n\n\n# Load labels and image paths\ndf = pd.read_csv(\"input/mydataset.csv\")\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_names = df[\"image_name\"].values\nimage_paths = [os.path.join(\"input/MyImages\", name + \".jpg\") for name in image_names]\ntargets = df[\"target\"].values\n\n# Image transforms\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# Prepare DataLoader for feature extraction\ndataset = ImageDataset(image_paths, transform)\nloader = DataLoader(dataset, batch_size=32, num_workers=4, shuffle=False)\n\n# Load EfficientNet-B0 feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nfe_model = timm.create_model(\n    \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n).to(device)\nfe_model.eval()\n\n# Extract embeddings\nn = len(dataset)\nfeat_dim = fe_model.num_features\nfeatures = np.zeros((n, feat_dim), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(device)\n        out = fe_model(imgs).cpu().numpy()\n        for emb, i in zip(out, idxs.numpy()):\n            features[i] = emb\n\n# 5-fold CV with XGBoost\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(features, targets), start=1):\n    X_tr, X_val = features[train_idx], features[val_idx]\n    y_tr, y_val = targets[train_idx], targets[val_idx]\n    clf = xgb.XGBClassifier(\n        use_label_encoder=False, eval_metric=\"logloss\", random_state=42\n    )\n    clf.fit(X_tr, y_tr)\n    preds = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, preds)\n 229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Load and prepare data\ndf = pd.read_csv(DATA_CSV)\ndf[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\ny = df[\"label_bin\"].values\n\n\n# Utility to perform multi\u2010view flips\ndef tta_predictions(model, imgs):\n    # imgs: tensor [B,C,H,W]\n    views = [None, (3,), (2,), (2, 3)]  # identity, hflip, vflip, hvflip\n    logits_sum = torch.zeros(imgs.size(0), 1, device=imgs.device)\n    for d in views:\n        if d is None:\n            out = model(imgs)\n        else:\n            out = model(torch.flip(imgs, dims=d))\n        logits_sum += out\n    return logits_sum / len(views)\n\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\naucs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, y), 1):\n    print(f\"Fold {fold}\")\n    train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n    train_ds = SkinDataset(train_df, IMG_DIR, train_transform)\n    val_ds = SkinDataset(val_df, IMG_DIR, val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n\n    # Training\n    model.train()\n    for epoch in range(N_EPOCHS):\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            preds = model(imgs)\n            loss = criterion(preds, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    # Validation with 4\u2010view TTA\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = tta_predictions(model, imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy().flatten())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"  Fold {fold} AUROC (4\u2010view TTA): {auc:.4f}\")\n    aucs.append(auc)\n\nmean_auc, std_auc = np.mean(aucs), np.std(aucs)\nprint(f\"\\nCV AUROC with 4\u2010view TTA: {mean_auc:.4f} \u00b1 {std_auc:.4f}\")\n\n# Retrain on full data\nfull_ds = SkinDataset(df, IMG_DIR, train_transform)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nmodel = models.densenet121(pretrained=True)\nmodel.classifier = nn.Linear(model.classifier.in_features, 1)\nmodel = model.to(DEVICE)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=LR)\nmodel.train()\nfor epoch in range(N_EPOCHS):\n    for imgs, labels in tqdm(full_loader, desc=f\"Full train epoch {epoch+1}\"):\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        preds = model(imgs)\n        loss = criterion(preds, labels)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\n# Prediction function\ndef predict(folder: str, model_path: str = MODEL_PATH, device=DEVICE):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder using 4\u2010view TTA.\n    Returns a DataFrame with columns [\"image_name\", \"malignancy_probability\"].\n    \"\"\"\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    mode ges\", name + \".jpg\") for name in image_names]\ntargets = df[\"target\"].values\n\n# Compute sample weights inversely proportional to skin_tone frequency for fairness\ntone_counts = df[\"skin_tone\"].value_counts().to_dict()\nweights_all = df[\"skin_tone\"].map(lambda t: 1.0 / tone_counts.get(t, 1)).values\n\n# Image transforms\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# Prepare DataLoader for feature extraction\ndataset = ImageDataset(image_paths, transform)\nloader = DataLoader(dataset, batch_size=32, num_workers=4, shuffle=False)\n\n# Load EfficientNet-B0 feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nfe_model = timm.create_model(\n    \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n).to(device)\nfe_model.eval()\n\n# Extract embeddings\nn = len(dataset)\nfeat_dim = fe_model.num_features\nfeatures = np.zeros((n, feat_dim), dtype=np.float32)\nwith torch.no_grad():\n    for imgs, idxs in loader:\n        imgs = imgs.to(device)\n        out = fe_model(imgs).cpu().numpy()\n        for emb, i in zip(out, idxs.numpy()):\n            features[i] = emb\n\n# 5-fold CV with RandomForest\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nprint(\"Starting 5-fold CV with RandomForestClassifier...\")\nfor fold, (train_idx, val_idx) in enumerate(skf.split(features, targets), start=1):\n    X_tr, X_val = features[train_idx], features[val_idx]\n    y_tr, y_val = targets[train_idx], targets[val_idx]\n    w_tr = weights_all[train_idx]\n    clf = RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1)\n    clf.fit(X_tr, y_tr, sample_weight=w_tr)\n    preds = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, preds)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\nmean_auc = let nodes = [];
let edges = [];

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
