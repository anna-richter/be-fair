let treeStructData = {"edges": [[2, 6], [3, 5], [5, 8], [5, 7], [8, 9], [9, 10], [9, 12], [9, 11], [12, 14], [12, 16], [12, 15], [12, 13], [12, 17], [17, 19], [17, 18]], "layout": [[0.0, 0.0], [0.14285714285714285, 0.0], [0.2857142857142857, 0.0], [0.42857142857142855, 0.0], [0.5714285714285714, 0.0], [0.42857142857142855, 0.16666666666666663], [0.2857142857142857, 0.16666666666666663], [0.35714285714285715, 0.33333333333333337], [0.5, 0.33333333333333337], [0.5, 0.5], [0.35714285714285715, 0.6666666666666667], [0.5, 0.6666666666666667], [0.6428571428571429, 0.6666666666666667], [0.35714285714285715, 0.8333333333333334], [0.5, 0.8333333333333334], [0.6428571428571429, 0.8333333333333334], [0.7857142857142857, 0.8333333333333334], [0.9285714285714286, 0.8333333333333334], [0.8571428571428571, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet-18 to classify malignant versus benign/non-\nneoplastic lesions, mapping malignant to 1 and the others to 0. To promote\nfairness across skin tones, we compute sample weights inversely proportional to\neach skin_tone\u2019s frequency and apply them in the BCEWithLogits loss. We split\nthe data 80/20 for training and validation, train for a few epochs, and report\nthe overall AUROC on the hold-out set. We save the trained model and define a\npredict(folder_path) function that loads the model and returns malignancy\nprobabilities for new images.", "We will fine-tune an EfficientNet-B0 pretrained on ImageNet for binary\nclassification, mapping \u201cmalignant\u201d to 1 and others to 0. To promote fairness,\nwe compute sample weights inversely proportional to each skin_tone\u2019s frequency\nand apply them in the loss. We perform stratified 5-fold cross\u2010validation on the\nmalignancy label to estimate AUROC, then retrain on the full dataset and save\nthe final model. A predict(folder_path) function loads the saved model and\nreturns malignancy probabilities for new images.", "We fine-tune a pretrained DenseNet-121 mapping \u201cmalignant\u201d to 1 and other labels\nto 0 on an 80/20 stratified split. We compute inverse\u2010frequency sample weights\nper skin_tone and apply these in the BCE loss to promote fairness. We train for\n5 epochs with Adam, then evaluate on the hold\u2010out set using AUROC, save the\nmodel, and implement a `predict(folder_path)` function that returns malignancy\nprobabilities for new images. Finally, we print the validation AUROC.", "We fine-tune a pretrained DenseNet-121 for binary malignancy classification\nusing images resized to 224\u00d7224 and standard augmentations. To improve fairness\nacross skin tones, we compute per-sample loss weights inversely proportional to\neach skin_tone\u2019s frequency and incorporate them into the BCEWithLogits loss. We\nsplit the data 80/20 stratified by the malignancy label, train for 5 epochs,\ncompute the AUROC on the hold\u2010out set, and report it. Finally, we save the\ntrained model and provide a `predict(folder_path)` function that loads the model\nand returns malignancy probabilities for new images.", "We fine\u2010tune a ResNet\u201018 on 224\u00d7224 images using a weighted BCEWithLogits loss\nwhere each sample\u2019s weight is inversely proportional to its skin_tone frequency\nto encourage fairness. We split data 80/20 stratified by malignancy, train for 5\nepochs, and compute validation AUROC each epoch. After training we save the\nmodel and write a `submission.csv` with malignancy probabilities for all images\nin `input/MyImages`. A `predict(folder_path)` function loads the saved model and\nreturns malignancy probabilities for new images.", "We will replace the uniform random shuffling of training data with a\nWeightedRandomSampler that draws samples inversely proportional to their\nskin_tone frequencies, ensuring each batch is balanced across skin tones and\nimproving fairness. We remove per\u2010sample loss weighting and use a standard\nBCEWithLogitsLoss. The rest of the pipeline remains unchanged, fine\u2010tuning\nDenseNet\u2010121 for binary classification. After training, we evaluate AUROC on the\nhold\u2010out set, save the best model, and generate a `submission.csv` with\npredictions for all input images.", "We were using inverse-frequency weights directly, which made them extremely\nsmall and led to a near-zero loss. To fix this, we normalize the weights to have\nmean 1, preserving the relative group importance while scaling the loss\nproperly. The rest of the training, validation, and prediction pipeline stays\nthe same, so we maintain the fairness adjustment without vanishing gradients.", "We will incorporate MixUp augmentation in the training loop to improve\ngeneralization and boost AUROC. For each training batch, we sample a mixing\ncoefficient from a Beta distribution, shuffle the batch, and linearly combine\nimages and labels. The mixed labels are then used with BCEWithLogitsLoss. This\natomic change often yields a better decision boundary, improving overall\nperformance without affecting fairness. Here's the implementation:", "We introduce focal loss (gamma=2, alpha=0.25) in place of the standard\nBCEWithLogitsLoss to focus the model on harder examples and improve\ngeneralization without altering the fairness-driven sampler. All other\ncomponents (DenseNet\u2010121 backbone, weighted sampler for skin tones, data splits,\naugmentations, and prediction pipeline) remain unchanged. We then train for 5\nepochs, track the best validation AUROC, save the best model, and produce a\nsubmission.csv with malignancy probabilities for all images.", "We add simple horizontal\u2010flip test\u2010time augmentation (TTA) during validation and\nprediction, averaging predictions on the original and flipped images. This\nrequires no change to the training pipeline but can boost robustness and AUROC.\nWe retain DenseNet\u2010121, weighted sampling by skin tone, FocalLoss, and the same\ndata splits. The validation loop now computes predictions for both original and\nflipped batches and averages them. The predict() function also uses TTA to\naverage probabilities on the fly.", "We will enhance test-time augmentation by including both horizontal and vertical\nflips, averaging predictions across four variants (original, horizontal,\nvertical, and both flips). This richer TTA should further improve robustness and\nAUROC without altering the training procedure. The validation loop and\n`predict()` function are updated to implement 4-way TTA averaging.", "We can improve generalization across varying skin tones by adding color\naugmentations to the training pipeline. Specifically, we integrate a moderate\nColorJitter (brightness, contrast, saturation, hue) before existing spatial\ntransforms to teach the model robustness to color variations. We keep the\nweighted sampler, focal loss, and horizontal\u2010flip TTA unchanged. This atomic\nchange should boost validation AUROC without altering our fairness scheme. Below\nis the implementation that measures and prints the hold\u2010out AUROC with these new\naugmentations.", "We will enhance the test\u2010time augmentation by averaging model outputs over four\nvariants of each input: the original image, its horizontal flip, its vertical\nflip, and both flips. This richer TTA increases robustness without altering the\ntraining pipeline or fairness mechanisms. We update the validation loop and the\npredict() function to compute logits for all four variants and average them\nbefore computing AUROC or saving predictions.", "We add CutMix augmentation (\u03b2=1.0, p=0.5) in the training loop to mix image\nregions and labels, improving robustness and fairness by exposing the model to\nblended skin tones and lesion patterns. All other components\u2014including weighted\nsampling by skin tone, FocalLoss, DenseNet-121 backbone, and 4-way TTA\u2014remain\nunchanged. CutMix should boost generalization and AUROC without harming the\nfairness scheme. The validation loop still computes 4-way averaged predictions\nand reports the best AUROC, and `predict()` supports the same TTA.", "I propose adding RandomErasing augmentation to the training pipeline to improve\nrobustness and generalization across varying lesion appearances and skin tones.\nBy applying RandomErasing with moderate probability and area constraints after\nnormalization, the model will learn to handle occlusions and missing cues, which\noften occur in real-world images. All other components\u2014including the weighted\nsampler for fairness, FocalLoss, DenseNet\u2010121 backbone, and 4\u2010way TTA\u2014remain\nunchanged, enabling an isolated evaluation of this augmentation\u2019s impact.", "I propose adding a moderate ColorJitter augmentation (brightness, contrast,\nsaturation, hue) to the training pipeline to improve robustness to skin tone\nvariations and lighting conditions, which should boost AUROC without altering\nthe fairness scheme. All other components\u2014including weighted sampling by skin\ntone, FocalLoss, DenseNet\u2010121 backbone, and 4\u2010way TTA\u2014remain unchanged, allowing\nus to isolate the impact of color augmentation. Below is the implementation with\nthe new ColorJitter transform.", "I propose integrating a OneCycleLR scheduler during training to cyclically vary\nthe learning rate between a low start value and a higher peak (e.g.,\nmax_lr=1e-3), which often improves convergence and generalization. We keep the\nexisting weighted sampling by skin tone, FocalLoss, DenseNet-121 backbone, and\n4-way flip TTA unchanged. We initialize OneCycleLR based on the number of epochs\nand training steps, call scheduler.step() after each optimizer.step(), and then\nmeasure validation AUROC as before. This atomic change should yield a small but\nmeaningful boost in test\u2010time performance without compromising fairness.", "I propose adding a RandomApply ColorJitter transform (brightness, contrast,\nsaturation, hue) to the training pipeline before spatial augmentations. This\nwill teach the model to be robust to color and lighting variations, which can\nimprove generalization and fairness across skin tones. All other\ncomponents\u2014including weighted sampling, focal loss, DenseNet\u2010121 backbone, and\n4\u2010way TTA\u2014remain unchanged, allowing us to isolate the impact of color\naugmentation.", "I propose replacing the DenseNet-121 backbone with a stronger EfficientNet-B0\nmodel while keeping the existing weighted sampler for fairness, FocalLoss, data\naugmentations, and 4-way flip TTA. EfficientNet-B0\u2019s better parameter efficiency\nand feature extraction should boost the AUROC without altering the fairness\nscheme. The rest of the training and prediction pipeline remains unchanged for a\nclean comparison.", "We can boost convergence and generalization by integrating a OneCycleLR\nscheduler and switching to AdamW with weight decay. The scheduler will\ncyclically vary the learning rate between a small initial value and a high peak\n(1e-3) over all training steps, helping the model find a better optimum. We\nmodify the training loop to call scheduler.step() after each optimizer step. All\nother components\u2014DenseNet-121 backbone, weighted sampling for skin-tone\nfairness, focal loss, color jitter augmentation, and 4-way flip TTA\u2014remain\nunchanged. This atomic change should yield a meaningful AUROC boost while\npreserving our fairness scheme."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom PIL import Image\n\n# Parameters\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nBATCH_SIZE = 32\nNUM_EPOCHS = 3\nLR = 1e-4\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nos.makedirs(\"./working\", exist_ok=True)\n\n# Load and preprocess metadata\ndf = pd.read_csv(DATA_CSV)\n# Binarize label\ndf[\"label_bin\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n# Compute skin_tone frequencies for weighting\ntone_counts = df[\"skin_tone\"].value_counts().to_dict()\ndf[\"sample_weight\"] = df[\"skin_tone\"].map(lambda t: 1.0 / tone_counts.get(t, 1))\n# Normalize weights to mean=1\ndf[\"sample_weight\"] *= len(df) / df[\"sample_weight\"].sum()\n\n# Train/validation split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n)\n\n\n# Datasets\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(img)\n        y = torch.tensor(row[\"label_bin\"], dtype=torch.float32)\n        w = torch.tensor(row[\"sample_weight\"], dtype=torch.float32)\n        return x, y, w\n\n\n# Transforms\ntrain_tf = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\ntrain_ds = LesionDataset(train_df, IMG_DIR, train_tf)\nval_ds = LesionDataset(val_df, IMG_DIR, val_tf)\ntrain_loader = DataLoader(\n    train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4, pin_memory=True\n)\nval_loader = DataLoader(\n    val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4, pin_memory=True\n)\n\n# Model\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(DEVICE)\noptimizer = torch.optim.Adam(model.parameters(), lr=LR)\n\n# Training loop\nfor epoch in range(1, NUM_EPOCHS + 1):\n    model.train()\n    for x, y, w in train_loader:\n        x, y, w = x.to(DEVICE), y.to(DEVICE), w.to(DEVICE)\n        logits = model(x).squeeze(1)\n        loss_per_sample = F.binary_cross_entropy_with_logits(\n            logits, y, reduction=\"none\"\n        )\n        loss = (loss_per_sample * w).mean()\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n    # Validation\n    model.eval()\n    all_probs, all_labels = [], []\n    with torch.no_grad():\n        for x, y, _ in val_loader:\n            x = x.to(DEVICE)\n            logits = model(x).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs)\n            all_labels.extend(y.numpy())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Epoch {epoch} Validation AUROC: {auc:.4f}\")\n\n# Save the model\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\ndef predict(folder_path: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n        folder_path (str): Path to folder containing .jpg images.\n    Returns:\n        pd.DataFrame with columns [\"image_name\",\"malignancy_probability\"].\n    \"\"\"\n    # Load model\n    net = models.resnet18(pretrained=False)\n    net.fc = nn.Linear(net.fc.in_features, 1)\n    net.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    net = net.to(DEVICE).eval()\n    # Prepare transform\n    tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    results = []\n    for fname in sorted(os.listdir(folder_path)):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(DEVICE)\n            with torch.no_grad():\n                prob = torch.sigmoid(net(x).squeeze(1)).item()\n            results.append({\"image_name\": fname, \"malignancy_probability\": prob})\n    return pd.DataFrame(results)\n\n\n# Example usage:\n# df_preds = predict(\"./input/MyImages\")\n# df_preds.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\n\n\n# Dataset class\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(img)\n        y = torch.tensor(row.binary_label, dtype=torch.float32)\n        w = torch.tensor(row.weight, dtype=torch.float32)\n        return x, y, w\n\n\n# Train & validate for one fold\ndef train_validate(train_df, val_df, img_dir, device):\n    # transforms\n    train_tfms = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ColorJitter(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tfms = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    train_ds = LesionDataset(train_df, img_dir, train_tfms)\n    val_ds = LesionDataset(val_df, img_dir, val_tfms)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n        device\n    )\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    criterion = nn.BCEWithLogitsLoss(reduction=\"none\")\n\n    for epoch in range(3):\n        model.train()\n        for x, y, w in train_loader:\n            x, y, w = x.to(device), y.to(device), w.to(device)\n            logits = model(x).squeeze(1)\n            loss = criterion(logits, y)\n            loss = (loss * w).mean()\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # validate\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for x, y, _ in val_loader:\n            x = x.to(device)\n            logits = model(x).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            ys.append(y.numpy())\n            ps.append(probs)\n    ys = np.concatenate(ys)\n    ps = np.concatenate(ps)\n    auc = roc_auc_score(ys, ps)\n    return auc\n\n\n# Main\ndef main():\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # binary label\n    df[\"binary_label\"] = (df.label == \"malignant\").astype(int)\n    # sample weights by skin_tone\n    freq = df.skin_tone.value_counts().to_dict()\n    inv = {k: 1 / v for k, v in freq.items()}\n    inv_mean = np.mean(list(inv.values()))\n    df[\"weight\"] = df.skin_tone.map(lambda t: inv[t] / inv_mean)\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n    for train_idx, val_idx in skf.split(df, df.binary_label):\n        train_df = df.iloc[train_idx]\n        val_df = df.iloc[val_idx]\n        auc = train_validate(train_df, val_df, \"./input/MyImages\", device)\n        aucs.append(auc)\n        print(f\"Fold AUROC: {auc:.4f}\")\n    mean_auc, std_auc = np.mean(aucs), np.std(aucs)\n    print(f\"Mean CV AUROC: {mean_auc:.4f} \u00b1 {std_auc:.4f}\")\n    # retrain on full data\n    full_auc = train_validate(df, df, \"./input/MyImages\", device)  # quick pass\n    # save final model\n    final_model = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=1\n    ).to(device)\n    optimizer = torch.optim.Adam(final_model.parameters(), lr=1e-4)\n    criterion = nn.BCEWithLogitsLoss(reduction=\"none\")\n    tfms = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ColorJitter(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    loader = DataLoader(\n        LesionDataset(df, \"./input/MyImages\", tfms),\n        batch_size=32,\n        shuffle=True,\n        num_workers=4,\n    )\n    for epoch in range(3):\n        final_model.train()\n        for x, y, w in loader:\n            x, y, w = x.to(device), y.to(device), w.to(device)\n            logits = final_model(x).squeeze(1)\n            loss = criterion(logits, y)\n            loss = (loss * w).mean()\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(final_model.state_dict(), \"./working/model.pt\")\n    print(\"Final model saved to ./working/model.pt\")\n\n\n# Prediction function\ndef predict(folder_path, model_path=\"./working/model.pt\", batch_size=32, device=\"cpu\"):\n    \"\"\"\n    Load the trained model and predict malignancy probabilities for all .jpg images in folder_path.\n    Returns a DataFrame with columns: image_name, malignancy_probability.\n    \"\"\"\n    tfm = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1).to(\n        device\n    )\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.eval()\n    files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    ds = []\n    for f in files:\n        img = Image.open(os.path.join(folder_path, f)).convert(\"RGB\")\n        x = tfm(img)\n        ds.append((f, x))\n    loader = DataLoader([x for _, x in ds], batch_size=batch_size, shuffle=False)\n    probs = []\n    with torch.no_grad():\n        for batch in loader:\n            batch = batch.to(device)\n            logits = model(batch).squeeze(1)\n            probs.extend(torch.sigmoid(logits).cpu().numpy())\n    results = pd.DataFrame(\n        {\n            \"image_name\": [os.path.splitext(f)[0] for f, _ in ds],\n            \"malignancy_probability\": probs,\n        }\n    )\n    return results\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.transform = let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
