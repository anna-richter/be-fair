let treeStructData = {"edges": [[2, 8], [3, 5], [5, 6], [5, 7], [8, 9], [9, 10], [10, 11], [11, 15], [11, 18], [11, 17], [11, 19], [11, 13], [11, 14], [11, 16], [11, 12]], "layout": [[0.21428571428571427, 0.0], [0.35714285714285715, 0.0], [0.5, 0.0], [0.7142857142857143, 0.0], [0.8571428571428571, 0.0], [0.7142857142857143, 0.19999999999999996], [0.6428571428571429, 0.4], [0.7857142857142857, 0.4], [0.5, 0.19999999999999996], [0.5, 0.4], [0.5, 0.6], [0.5, 0.8], [0.0, 1.0], [0.14285714285714285, 1.0], [0.2857142857142857, 1.0], [0.42857142857142855, 1.0], [0.5714285714285714, 1.0], [0.7142857142857143, 1.0], [0.8571428571428571, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 on ImageNet by replacing its head for binary\nclassification of malignant vs non-malignant lesions, using standard\naugmentations. We perform stratified 5-fold cross-validation on malignant vs\nother labels, training each fold for 3 epochs with Adam and BCEWithLogitsLoss,\nand compute AUROC on each validation set. We report the mean AUROC across folds,\nthen retrain on the full dataset to save the final model. We include a predict()\nfunction that loads the saved model and returns malignancy probabilities for new\nimages.", "We use a pretrained EfficientNet-B0 backbone from the timm library, freeze its\nconvolutional feature extractor, and train only a lightweight classifier head\nfor binary malignancy prediction. We perform stratified 5-fold cross-validation\non the malignant vs non-malignant labels, training each fold for 3 epochs with\nBCEWithLogitsLoss and the Adam optimizer, and report the average AUROC across\nfolds. After that, we retrain the same model on the full dataset and save it to\ndisk. A predict() function is provided to load the saved model and return\nmalignancy probabilities for new images in a given folder.", "We extract deep features from a pretrained Vision Transformer (ViT-B16) on\nImageNet for each lesion image, using a Torch DataLoader with standard 224\u00d7224\nnormalization. These fixed 768-dim embeddings serve as inputs to a LightGBM\nbinary classifier, which we train with stratified 5-fold cross-validation,\nreporting the mean AUROC. After cross-validation, we retrain the LightGBM model\non all data and save it. The provided predict() function loads the saved model,\nre-extracts features for new images, and returns malignancy probabilities.", "We extract deep image features from a frozen pretrained ResNet50 using\ntorchvision and train a LightGBM classifier on these 2048-dim features for\nbinary malignancy detection. We perform stratified five-fold cross-validation\nwith sample weights inversely proportional to skin tone frequencies and report\nthe mean AUROC across folds. Finally, we retrain the LightGBM model on the full\ndataset, save it, and provide a predict() function that loads both the frozen\nResNet50 feature extractor and the saved LightGBM model to output malignancy\nprobabilities for new images.", "We fine-tune a pretrained EfficientNet-B0 with a frozen backbone and a new\nbinary head for malignancy prediction using BCEWithLogitsLoss. We apply standard\naugmentations and perform stratified 5-fold cross\u2010validation to estimate\nperformance via AUROC. After cross\u2010validation, we retrain on the full dataset\nand save the final model. A reusable `predict()` function loads the saved model\nand returns malignancy probabilities for images in a given folder. We report the\nmean AUROC across folds as our evaluation metric.", "I will fine-tune the last convolutional block (layer4) and the fully\u2010connected\nhead of ResNet50 end\u2010to\u2010end instead of using frozen features with LightGBM. I\nwill replace the classifier head with a single\u2010output layer for binary\nmalignancy prediction and apply BCEWithLogitsLoss with sample weights based on\nskin tone. I will train for 5 epochs per fold with StratifiedKFold\ncross\u2010validation, using simple augmentations (random horizontal flips and\nrotations). After printing the mean AUROC across folds, I'll retrain the full\nmodel on all data, save it, and provide a `predict()` function to load the saved\nmodel and compute malignancy probabilities for new images.", "I will enhance the training data augmentation pipeline by adding ColorJitter and\nRandomErasing to increase model robustness and reduce overfitting. Specifically,\nColorJitter will randomly alter brightness, contrast, saturation, and hue, while\nRandomErasing will randomly occlude image regions. All other training\nprocedures, including 5-fold Stratified cross\u2010validation with fine\u2010tuned\nResNet50 (unfrozen layer4 and fc), remain unchanged. This atomic change should\nlead to improved generalization and AUROC. The script will print per\u2010fold and\nmean CV AUROC, retrain on full data, save the model, and implement a predict()\nfunction for inference.", "I will add mixup augmentation in the training loop by randomly mixing pairs of\nimages, labels, and sample weights with a mixing coefficient sampled from a Beta\ndistribution (\u03b1=0.4). This encourages the model to behave linearly between\nsamples, improving generalization. The `train_epoch` function is updated to\nperform mixup per batch, and losses are computed accordingly with\nsample\u2010weighted BCEWithLogitsLoss. The rest of the cross\u2010validation and\nfull\u2010data training pipeline remains unchanged, and we print the mean CV AUROC.", "We can work around the unsupported `early_stopping_rounds` argument by using\nLightGBM\u2019s callback interface. In the revised code, we replace\n`early_stopping_rounds` and `verbose_eval` with\n`callbacks=[lgb.callback.early_stopping(50),\nlgb.callback.log_evaluation(period=0)]`. We perform 5\u2010fold CV, collect AUCs and\nbest iterations, and print the mean CV AUC. We then retrain on all data for 1.1\u00d7\nthe average best iteration, save the model, and use a `predict()` function to\ngenerate and save a `submission.csv`.", "I propose to enhance feature robustness by applying simple test\u2010time\naugmentation: for each image, we extract ViT features on both the original and a\nhorizontally flipped version, then average these feature vectors. This TTA\nshould reduce feature variance and improve classifier performance without\nsignificantly increasing runtime. We'll apply this in both cross\u2010validation and\nfinal predictions, updating the `extract_features` calls accordingly. The rest\nof the pipeline (5\u2010fold CV with LightGBM, retraining, saving model, and\n`predict()`) remains the same, now leveraging TTA\u2010averaged features.", "I propose to enhance our test\u2010time augmentation by adding vertical flips and\ncombined horizontal+vertical flips, yielding four TTA variants (original,\nh\u2010flip, v\u2010flip, hv\u2010flip) and averaging their feature representations. This\nshould improve the model\u2019s invariance to orientation and boost generalization\nwithout changing the overall pipeline. The rest of the LightGBM\ncross\u2010validation, retraining, and prediction logic remains unchanged.", "I propose to enhance the test\u2010time augmentation by adding 90\u00b0, 180\u00b0, and 270\u00b0\nrotations alongside horizontal flips, creating eight deterministic TTA variants\n(four rotations \u00d7 two flip states). We will average ViT base patch16 features\nover these eight transforms to improve orientation invariance and robustness.\nAll other components\u2014LightGBM training, 5\u2010fold CV, hyperparameters, and the\nprediction interface\u2014remain unchanged for an isolated evaluation of this\naugmentation.", "I will ensemble the five LightGBM models trained during cross\u2010validation at\ninference time to reduce variance and boost generalization. Each fold model will\nbe saved separately, and the `predict()` function will load all fold models to\naverage their malignancy probabilities for each image. This bagging approach\nrequires no changes to feature extraction or hyperparameters and should improve\ntest\u2010time AUROC. The script will print per\u2010fold and mean CV AUC, save each fold\nmodel, and output `submission.csv`.", "I will ensemble the five LightGBM models trained during cross\u2010validation at\ninference time to reduce variance and boost generalization. After each CV fold,\neach model is saved separately, and the `predict()` function loads all fold\nmodels to average their malignancy probabilities for each image. This bagging\napproach requires no changes to feature extraction or hyperparameters and should\nimprove test\u2010time AUROC.", "I propose to extend the test\u2010time augmentation by including vertical flips as\nwell as horizontal flips, yielding four flip states (none, horizontal, vertical,\nboth) combined with the existing 0\u00b0, 90\u00b0, 180\u00b0, and 270\u00b0 rotations for a total\nof 16 TTA variants. This broader augmentation will further improve orientation\ninvariance and robustness of the ViT features without changing the LightGBM\ntraining or hyperparameters. We'll update `extract_features_tta` to loop over\nthese four flip configurations, average the features, and then proceed with the\nsame 5\u2010fold CV and final model training pipeline, printing out the mean CV AUC.", "I will save each of the five fold LightGBM models during cross\u2010validation and\nthen, at inference time, load all of them to average their malignancy\nprobability predictions (bagging) for improved robustness. During training I'll\nalso record out\u2010of\u2010fold predictions and compute the overall ensemble ROC AUC on\nthe full dataset, giving a more reliable CV estimate. The final `predict()`\nfunction will extract TTA ViT features once and then average the outputs of all\nsaved fold models to produce the submission.", "I propose to ensemble the five LightGBM models trained in cross\u2010validation at\ninference time. During CV, we will save each fold model separately\n(lgbm_fold_1.pkl ... lgbm_fold_5.pkl) and record out\u2010of\u2010fold predictions to\ncompute the overall CV AUC. In the predict() function, we will load all five\nfold models, extract TTA\u2010averaged ViT features once, then average the malignancy\nprobability predictions from each model. This bagging approach should reduce\nvariance and boost test\u2010time performance without changing feature extraction or\nhyperparameters.", "I propose to extend the test\u2010time augmentation by including vertical flips in\naddition to the existing horizontal flips, yielding four flip states (none,\nhorizontal, vertical, both) combined with the four rotations (0\u00b0, 90\u00b0, 180\u00b0,\n270\u00b0) for a total of 16 deterministic TTA variants. We will update\n`extract_features_tta` to loop over these flip configurations and rotations,\naverage the extracted ViT features over all 16 transforms, and then proceed with\nthe LightGBM 5\u2010fold CV and final training as before. This broader orientation\naugmentation should improve feature robustness and boost the overall AUROC\nwithout changing the core training pipeline.", "I will ensemble the five LightGBM models trained during cross\u2010validation at\ninference time by saving each fold model separately and then loading all fold\nmodels in the `predict()` function to average their malignancy probability\npredictions. This bagging approach reduces variance and boosts test\u2010time\nperformance without changing feature extraction or hyperparameters. The\ncross\u2010validation loop will save each fold model to\n`./working/lgbm_model_fold{fold}.pkl`, and `predict()` will discover and load\nall these fold models for ensembling. The script still prints per\u2010fold and mean\nCV AUC, and writes a `submission.csv` of ensembled predictions.", "I propose to ensemble the LightGBM models from each CV fold at inference time,\nsaving each fold model separately and averaging their predictions on new images.\nDuring cross\u2010validation, each fold\u2019s model is dumped to\n`working/lgbm_model_fold{fold}.pkl`, and the mean CV AUC is printed. The\n`predict()` function is updated to load all saved fold models, extract 8\u2010way TTA\nViT features once, and then average the malignancy probabilities from each model\nfor each image. This bagging approach reduces variance without changing feature\nextraction or hyperparameters, and should boost test\u2010time AUROC. Finally, a\n`submission.csv` of ensembled predictions is written to `./working`."], "code": ["import os\nimport random\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\nfrom tqdm import tqdm\n\n# Set seeds for reproducibility\nseed = 42\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\ntorch.cuda.manual_seed_all(seed)\n\n# Configuration\nDATA_CSV = \"input/mydataset.csv\"\nIMG_DIR = \"input/MyImages\"\nMODEL_PATH = \"working/model.pth\"\nNUM_FOLDS = 5\nBATCH_SIZE = 32\nEPOCHS = 3\nLR = 1e-4\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load data\ndf = pd.read_csv(DATA_CSV)\n# Map malignant to 1, others to 0\ndf[\"target\"] = df[\"label\"].map(lambda x: 1 if x == \"malignant\" else 0)\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, transforms):\n        self.df = df.reset_index(drop=True)\n        self.transforms = transforms\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(IMG_DIR, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transforms(img)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return img, label\n\n\n# Define transforms\ntrain_transforms = T.Compose(\n    [\n        T.RandomResizedCrop(224),\n        T.RandomHorizontalFlip(),\n        T.ToTensor(),\n        T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\nval_transforms = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# Prepare cross-validation\nskf = StratifiedKFold(n_splits=NUM_FOLDS, shuffle=True, random_state=seed)\nfold_aucs = []\n\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"])):\n    print(f\"Starting fold {fold+1}/{NUM_FOLDS}\")\n    df_train = df.iloc[train_idx]\n    df_val = df.iloc[val_idx]\n    train_ds = SkinDataset(df_train, train_transforms)\n    val_ds = SkinDataset(df_val, val_transforms)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n\n    # Training loop\n    for epoch in range(EPOCHS):\n        model.train()\n        for imgs, labels in tqdm(train_loader, desc=f\"Fold{fold+1} Epoch{epoch+1}\"):\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            optimizer.zero_grad()\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validation\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_preds.extend(probs)\n            all_labels.extend(labels.numpy().flatten())\n    auc = roc_auc_score(all_labels, all_preds)\n    print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n    fold_aucs.append(auc)\n\n# Report CV performance\nmean_auc = np.mean(fold_aucs)\nprint(f\"Mean AUROC across {NUM_FOLDS} folds: {mean_auc:.4f}\")\n\n# Retrain on full data\nfull_ds = SkinDataset(df, train_transforms)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nmodel = models.resnet18(pretrained=True)\nmodel.fc = nn.Linear(model.fc.in_features, 1)\nmodel = model.to(DEVICE)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=LR)\nfor epoch in range(EPOCHS):\n    model.train()\n    for imgs, labels in tqdm(full_loader, desc=f\"Full Training Epoch{epoch+1}\"):\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        loss = criterion(model(imgs), labels)\n        loss.backward()\n        optimizer.step()\n# Save final model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\ndef predict(image_folder):\n    \"\"\"\n    Load the trained model and predict malignancy probabilities for all .jpg images in image_folder.\n    Returns a pandas DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    # Load model\n    m = models.resnet18(pretrained=False)\n    m.fc = nn.Linear(m.fc.in_features, 1)\n    m.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    m = m.to(DEVICE).eval()\n    transform = val_transforms\n    results = []\n    for fname in os.listdir(image_folder):\n        if fname.lower().endswith(\".jpg\"):\n            img_path = os.path.join(image_folder, fname)\n            img = Image.open(img_path).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(DEVICE)\n            with torch.no_grad():\n                prob = torch.sigmoid(m(inp)).item()\n            results.append(\n                {\"image_name\": os.path.splitext(fname)[0], \"malignancy_prob\": prob}\n            )\n    return pd.DataFrame(results)\n\n\n# Example usage of predict (uncomment to run)\n# df_preds = predict('input/MyImages')\n# df_preds.to_csv('working/submission.csv', index=False)", "import os\nimport glob\nimport torch\nimport timm\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import StratifiedKFold\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport torch.nn as nn\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, image_paths, labels=None, transform=None):\n        self.image_paths = image_paths\n        self.labels = labels\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.image_paths[idx]).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        if self.labels is not None:\n            return img, self.labels[idx]\n        else:\n            return img, os.path.basename(self.image_paths[idx])\n\n\n# Prediction function\ndef predict(folder, model_path=\"model.pth\", batch_size=32):\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    image_paths = sorted(glob.glob(os.path.join(folder, \"*.jpg\")))\n    ds = SkinLesionDataset(image_paths, transform=transform, labels=None)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False)\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    probs = []\n    names = []\n    with torch.no_grad():\n        for imgs, img_names in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            p = torch.sigmoid(logits).cpu().numpy()\n            probs.extend(p.tolist())\n            names.extend(img_names)\n    return dict(zip(names, probs))\n\n\ndef main():\n    # Settings\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"path\"] = df[\"image_name\"].apply(lambda x: f\"./input/MyImages/{x}.jpg\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Transforms\n    train_tfms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomVerticalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tfms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"label_bin\"])):\n        train_paths = df.loc[train_idx, \"path\"].tolist()\n        train_labels = df.loc[train_idx, \"label_bin\"].tolist()\n        val_paths = df.loc[val_idx, \"path\"].tolist()\n        val_labels = df.loc[val_idx, \"label_bin\"].tolist()\n        train_ds = SkinLesionDataset(train_paths, train_labels, train_tfms)\n        val_ds = SkinLesionDataset(val_paths, val_labels, val_tfms)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=2)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n        # Model\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n        # Freeze backbone\n        for name, param in model.named_parameters():\n            if \"classifier\" not in name:\n                param.requires_grad = False\n        model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(\n            filter(lambda p: p.requires_grad, model.parameters()), lr=1e-3\n        )\n        # Train\n        model.train()\n        for epoch in range(3):\n            for imgs, labels in train_loader:\n                imgs = imgs.to(device)\n                labels = labels.float().to(device)\n                optimizer.zero_grad()\n                logits = model(imgs).squeeze(1)\n                loss = criterion(logits, labels)\n                loss.backward()\n                optimizer.step()\n        # Validate\n        model.eval()\n        all_probs, all_labels = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1)\n                probs = torch.sigmoid(logits).cpu().numpy()\n                all_probs.extend(probs.tolist())\n                all_labels.extend(labels.numpy().tolist())\n        auc = roc_auc_score(all_labels, all_probs)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        aucs.append(auc)\n        torch.cuda.empty_cache()\n    mean_auc = np.mean(aucs)\n    print(f\"Mean AUROC: {mean_auc:.4f}\")\n    # Retrain on full data\n    full_ds = SkinLesionDataset(\n        df[\"path\"].tolist(), df[\"label_bin\"].tolist(), train_tfms\n    )\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=2)\n    model_full = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    for name, param in model_full.named_parameters():\n        if \"classifier\" not in name:\n            param.requires_grad = False\n    model_full.to(device)\n mport Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n# Set seeds\ntorch.manual_seed(42)\nnp.random.seed(42)\n\n\n# Mixup utility\ndef mixup_data(x, y, w, alpha=0.4):\n    \"\"\"Returns mixed inputs, pairs of targets, mixed weights, and lambda\"\"\"\n    if alpha > 0:\n        lam = np.random.beta(alpha, alpha)\n    else:\n        lam = 1.0\n    batch_size = x.size()[0]\n    index = torch.randperm(batch_size).to(x.device)\n    mixed_x = lam * x + (1 - lam) * x[index, :]\n    y_a, y_b = y, y[index]\n    w_a, w_b = w, w[index]\n    return mixed_x, y_a, y_b, w_a, w_b, lam\n\n\n# Dataset\nclass ImageDataset(Dataset):\n    def __init__(self, df, transform):\n        self.paths = df[\"image_path\"].values\n        self.targets = df[\"target\"].values\n        self.weights = df[\"weight\"].values\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        img = Image.open(self.paths[idx]).convert(\"RGB\")\n        img = self.transform(img)\n        return (\n            img,\n            torch.tensor(self.targets[idx], dtype=torch.float32),\n            torch.tensor(self.weights[idx], dtype=torch.float32),\n        )\n\n\n# Load metadata\ndf = pd.read_csv(\"input/mydataset.csv\")\ndf[\"image_path\"] = df[\"image_name\"].apply(\n    lambda x: os.path.join(\"input\", \"MyImages\", f\"{x}.jpg\")\n)\ndf = df[df[\"label\"].isin([\"malignant\", \"benign\", \"non-neoplastic\"])].reset_index(\n    drop=True\n)\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\ntone_counts = df[\"skin_tone\"].value_counts()\ndf[\"weight\"] = df[\"skin_tone\"].map(lambda t: 1.0 / tone_counts[t])\n\n# Transforms\ntrain_tfms = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.RandomResizedCrop(224),\n        transforms.RandomHorizontalFlip(),\n        transforms.RandomRotation(15),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tfms = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\ndef make_model():\n    model = models.resnet50(pretrained=True)\n    for name, param in model.named_parameters():\n        if not name.startswith(\"layer4\") and not name.startswith(\"fc\"):\n            param.requires_grad = False\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    return model.to(device)\n\n\ndef train_epoch(model, loader, opt, criterion, mixup_alpha=0.4):\n    model.train()\n    total_loss = 0.0\n    for imgs, targets, weights in loader:\n        imgs = imgs.to(device)\n        targets = targets.to(device)\n        weights = weights.to(device)\n        opt.zero_grad()\n        # mixup\n        mixed_x, y_a, y_b, w_a, w_b, lam = mixup_data(\n            imgs, targets, weights, alpha=mixup_alpha\n        )\n        logits = model(mixed_x).squeeze(1)\n        loss_a = criterion(logits, y_a) * w_a\n        loss_b = criterion(logits, y_b) * w_b\n        loss = (lam * loss_a + (1 - lam) * loss_b).mean()\n        loss.backward()\n        opt.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef eval_model(model, loader):\n    model.eval()\n    preds, trues = [], []\n    with torch.no_grad():\n        for imgs, targets, _ in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1).cpu().numpy()\n            preds.extend(torch.sigmoid(torch.tensor(logits)).numpy())\n            trues.extend(targets.numpy())\n    return roc_auc_score(trues, preds)\n\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor fold, (tr_idx, val_idx) in enumerate(skf.split(df, df[\"target\"].values)):\n    df_tr, df_val = df.iloc[tr_idx], df.iloc[val_idx]\n    tr_ds = ImageDataset(df_tr, train_tfms)\n    val_ds = ImageDataset(df_val, val_tfms)\n    tr_loader = DataLoader(\n        tr_ds, batch_size=32, shuffle=True, num_workers=2, pin_memory=True\n    )\n    val_loader = DataLoader(\n        val_ds, batch_size=64, shuffle=False, num_workers=2, pin_memory=True\n    )\n    model = make_model()\n    opt = torch.optim.AdamW(\n        filter(lambda p: p.requires_grad, model.parameters()), lr=1e-4\n    )\n    criterion = nn.BCEWithLogitsLoss(reduction=\"none\")\n    for epoch in range(5):\n        train_epoch(model, tr_loader, opt, criterion, mixup_alpha=0.4)\n    auc = eval_model(model, val_loader)\n    print(f\"Fold {fold} AUROC: {auc:.4f}\")\n    aucs.append(auc)\nprint(f\"Mean CV AUROC: {np.mean(aucs):.4f}\")\n\n# Retrain on full data\nfull_ds = ImageDataset(df, train_tfms)\nfull_loader = DataLoader(\n    full_ds, batch_size=32, shuffle=True, num_workers=2, pin_memory=True\n)\nmodel_full = make_model()\nopt_full = torch.optim.AdamW(\n    filter(lambda p: p.requires_grad, model_full.parameters()), lr=1e-4\n)\ncriterion = nn.BCEWithLogitsLoss(reduction=\"none\")\nfor epoch in range(5):\n    print(f\"Full train epoch {epoch}\")\n    train_epoch(model_full, full_loader, opt_full, criterion, mixup_alpha=0.4)\n\nos.makedirs(\"working\", exist_ok=True)\ntorch.save(model_full.state_dict(), \"working/resnet50_mixup.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n        folder_path (str): path to image directory\n    Returns:\n        dict: filename -> malignancy probability\n    \"\"\"\n    model = make_model()\n    model.load_state_dict(torch.load(\"working/resnet50_mixup.pth\", map_location=device))\n    model.eval()\n    files = [\n        f\n        for f in os.listdir(folder_path)\n        if f.lower().endswith((\".jpg\", \"jpeg\", \".png\"))\n    ]\n    paths = ]\n        ),\n    )\n    loader = DataLoader(ds, batch_size=BATCH_SIZE, num_workers=4, pin_memory=True)\n    feats_list, names = [], []\n    with torch.no_grad():\n        for imgs, batch_names in loader:\n            imgs = imgs.to(device)\n            feats = model.forward_features(imgs)\n            if feats.ndim == 3:\n                feats = feats[:, 0]\n            feats_list.append(feats.cpu().numpy())\n            names.extend(batch_names)\n    return np.vstack(feats_list), names\n\n\ndef predict(image_folder: str) -> pd.DataFrame:\n    \"\"\"\n    Predict malignancy probability for all images in a folder.\n    Args:\n        image_folder (str): Path to folder containing image files.\n    Returns:\n        DataFrame with columns ['image_name', 'malignancy_probability'].\n    \"\"\"\n    files = sorted(\n        [\n            f\n            for f in os.listdir(image_folder)\n            if f.lower().endswith((\".png\", \".jpg\", \".jpeg\"))\n        ]\n    )\n    paths = [os.path.join(image_folder, f) for f in files]\n    # load models\n    lgbm = joblib.load(MODEL_PATH)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    vit = timm.create_model(\"vit_base_patch16_224\", pretrained=True)\n    vit.reset_classifier(0)\n    vit.to(device)\n    feats, names = extract_features(vit, device, paths)\n    probs = lgbm.predict(feats, num_iteration=lgbm.best_iteration)\n    return pd.DataFrame(\n        {\n            \"image_name\": [os.path.splitext(n)[0] for n in names],\n            \"malignancy_probability\": probs,\n        }\n    )\n\n\nif __name__ == \"__main__\":\n    # Load data\n    df = pd.read_csv(DATA_CSV)\n    df[\"filepath\"] = df[\"image_name\"].apply(\n        lambda x: os.path.join(IMAGE_DIR, f\"{x}.jpg\")\n    )\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    paths = df[\"filepath\"].tolist()\n    y = df[\"target\"].values\n\n    # Set up device and ViT\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    vit = timm.create_model(\"vit_base_patch16_224\", pretrained=True)\n    vit.reset_classifier(0)\n    vit.to(device)\n\n    # Extract features once\n    print(\"Extracting features...\")\n    X, _ = extract_features(vit, device, paths)\n\n    # 5-fold CV with LightGBM using callbacks for early stopping\n    skf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=SEED)\n    aucs = []\n    best_iters = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(X, y), 1):\n        X_train, X_val = X[train_idx], X[val_idx]\n        y_train, y_val = y[train_idx], y[val_idx]\n        lgb_train = lgb.Dataset(X_train, label=y_train)\n        lgb_val = lgb.Dataset(X_val, label=y_val, reference=lgb_train)\n        params = {\n            \"objective\": \"binary\",\n            \"metric\": \"auc\",\n            \"verbosity\": -1,\n            \"boosting_type\": \"gbdt\",\n            \"seed\": SEED,\n        }\n        model = lgb.train(\n            params,\n            lgb_train,\n            valid_sets=[lgb_val],\n            num_boost_round=1000,\n            callbacks=[\n                lgb.callback.early_stopping(stopping_rounds=50),\n                lgb.callback.log_evaluation(period=0),\n            ],\n        )\n        preds = model.predict(X_val, num_iteration=model.best_iteration)\n        auc = roc_auc_score(y_val, preds)\n        aucs.append(auc)\n        best_iters.append(model.best_iteration)\n        print(f\"Fold {fold} AUC: {auc:.4f}, best_iter={model.best_iteration}\")\n\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV AUC: {mean_auc:.4f}\")\n\n    # Retrain on full data\n    avg_iter = int(np.mean(best_iters) * 1.1)\n    print(f\"Retraining on full data for {avg_iter} rounds...\")\n    lgb_full = lgb.Dataset(X, label=y)\n    final_model = lgb.train(params, lgb_full, num_boost_round=avg_iter)\n    joblib.dump(final_model, MODEL_PATH)\n    print(f\"Model saved to {MODEL_PATH}\")\n\n    # Generate submission\n    preds_df = predict(IMAGE_DIR)\n    preds_df.to_csv(SUBMISSION_PATH, index=False)\n    print(f\"Saved predictions to {SUBMISSION_PATH}\")", "import os\nimport joblib\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport lightgbm as lgb\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMAGE_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/lgbm_model.pkl\"\nSUBMISSION_PATH = \"./working/submission.csv\"\nBATCH_SIZE = 32\nN_FOLDS = 5\nSEED = 42\n\n\nclass ImageDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.image_paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.image_paths)\n\n    def __getitem__(self, idx):\n        path = self.image_paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        return self.transform(img), os.path.basename(path)\n\n\ndef extract_features(model, device, image_paths, transform):\n    model.eval()\n    ds = ImageDataset(image_paths, transform)\n    loader = DataLoader(ds, batch_size=BATCH_SIZE, num_workers=4, pin_memory=True)\n    feats_list, names = [], []\n    with torch.no_grad():\n        for imgs, batch_names in loader:\n            imgs = imgs.to(device)\n            feats = model.forward_features(imgs)\n            if feats.ndim == 3:  # ViT returns (B, 1, C)\n                feats = feats[:, 0]\n            feats_list.append(feats.cpu().numpy())\n            names.extend(batch_names)\n    return np.vstack(feats_list), names\n\n\ndef extract_features_tta(model, device, image_paths):\n    # Base transform\n    base_tfm = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms. l\"] == \"malignant\").astype(int)\n    paths = df[\"filepath\"].tolist()\n    y = df[\"target\"].values\n\n    # Device & model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    vit = timm.create_model(\"vit_base_patch16_224\", pretrained=True)\n    vit.reset_classifier(0)\n    vit.to(device)\n\n    # Extract TTA-averaged features\n    print(\"Extracting TTA features...\")\n    X, _ = extract_features_tta(vit, device, paths)\n\n    # 5-fold CV with LightGBM\n    skf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=SEED)\n    aucs, best_iters = [], []\n    params = {\n        \"objective\": \"binary\",\n        \"metric\": \"auc\",\n        \"verbosity\": -1,\n        \"boosting_type\": \"gbdt\",\n        \"seed\": SEED,\n    }\n    for fold, (train_idx, val_idx) in enumerate(skf.split(X, y), 1):\n        X_train, X_val = X[train_idx], X[val_idx]\n        y_train, y_val = y[train_idx], y[val_idx]\n        lgb_train = lgb.Dataset(X_train, label=y_train)\n        lgb_val = lgb.Dataset(X_val, label=y_val, reference=lgb_train)\n        model = lgb.train(\n            params,\n            lgb_train,\n            valid_sets=[lgb_val],\n            num_boost_round=1000,\n            callbacks=[\n                lgb.callback.early_stopping(stopping_rounds=50),\n                lgb.callback.log_evaluation(period=0),\n            ],\n        )\n        preds = model.predict(X_val, num_iteration=model.best_iteration)\n        auc = roc_auc_score(y_val, preds)\n        aucs.append(auc)\n        best_iters.append(model.best_iteration)\n        print(f\"Fold {fold} AUC: {auc:.4f}, best_iter={model.best_iteration}\")\n\n    mean_auc = np.mean(aucs)\n    print(f\"Mean CV AUC: {mean_auc:.4f}\")\n\n    # Retrain on full data\n    avg_iter = int(np.mean(best_iters) * 1.1)\n    print(f\"Retraining on full data for {avg_iter} rounds...\")\n    lgb_full = lgb.Dataset(X, label=y)\n    final_model = lgb.train(params, lgb_full, num_boost_round let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
