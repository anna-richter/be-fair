let treeStructData = {"edges": [[2, 5], [3, 7], [5, 8], [5, 6], [5, 9], [9, 10], [10, 11], [11, 16], [11, 15], [11, 12], [11, 14], [12, 13], [16, 17], [17, 19], [17, 18]], "layout": [[0.0, 0.0], [0.2, 0.0], [0.4, 0.0], [0.6, 0.0], [0.8, 0.0], [0.4, 0.1428571428571429], [0.2, 0.2857142857142857], [0.6, 0.1428571428571429], [0.4, 0.2857142857142857], [0.6, 0.2857142857142857], [0.6, 0.4285714285714286], [0.6, 0.5714285714285714], [0.3, 0.7142857142857143], [0.3, 0.8571428571428572], [0.5, 0.7142857142857143], [0.7, 0.7142857142857143], [0.9, 0.7142857142857143], [0.9, 0.8571428571428572], [0.8, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 on binary labels (malignant vs. non-\nmalignant) and use a WeightedRandomSampler based on skin tone to balance groups\nfor fairness. We perform 5-fold stratified cross-validation computing AUROC on\neach fold, then retrain on the full dataset and save the final model. A\n`predict(folder_path)` function loads the saved model and returns malignant\nprobabilities for each image. Below is the implementation.", "We fine-tune a pretrained EfficientNet-B0 model with a per\u2010sample weighted\nbinary cross\u2010entropy loss where weights are inverse frequencies of each\nskin\u2010tone group to improve fairness. We perform 5\u2010fold stratified\ncross\u2010validation on the binary malignancy label, computing AUROC for each fold\nto gauge performance. After CV, we retrain the model on the full dataset for a\nfew epochs and save the final model. A `predict(folder_path)` function loads the\nsaved model and returns malignancy probabilities for all images in a given\ndirectory.", "We fine-tune a DenseNet121 backbone with a per-sample weighted binary\ncross\u2010entropy loss where weights are inversely proportional to the frequency of\neach skin\u2010tone group to improve fairness. We perform 5\u2010fold stratified\ncross\u2010validation on the binary malignant vs non\u2010malignant label, computing AUROC\nfor each fold to gauge performance. After cross\u2010validation, we retrain on the\nfull dataset for a few epochs and save the final model. A `predict(folder_path)`\nfunction loads the saved model and returns malignancy probabilities for all\nimages in a given directory.", "We fine-tune a MobileNetV2 model pretrained on ImageNet by replacing its\nclassifier with a single-neuron head for binary malignant vs. non-malignant\nclassification. To improve fairness, we compute per-sample weights as the\ninverse frequency of each skin_tone group and incorporate them into the\nBCEWithLogits loss. We perform 5-fold stratified cross-validation to report the\nmean AUROC, then retrain on the full dataset and save the model. A\n`predict(folder_path)` function loads this saved model and returns malignancy\nprobabilities for new images.", "We fine-tune a pretrained Vision Transformer (ViT-B/16) to classify malignant vs\nnon-malignant lesions, treating \u201cmalignant\u201d as the positive class and the rest\nas negative.  To ensure fairness across skin tones, we employ a\nWeightedRandomSampler that balances samples by inverse skin-tone frequency\nduring training.  We split the dataset into an 80/20 stratified train/validation\nset on the binary label, train for a few epochs with a BCEWithLogitsLoss, and\nevaluate AUROC on the hold-out set.  Finally, we save the trained model and\nprovide a `predict(folder_path)` function that loads the model and returns\nmalignancy probabilities for any folder of new images.", "We replace per\u2010sample loss weighting with a WeightedRandomSampler to oversample\nunderrepresented skin tones, ensuring each batch contains a balanced mix of skin\ntones. We remove per\u2010sample weights from the loss and use a standard\nBCEWithLogitsLoss, constructing the DataLoader with sampling probabilities\ninverse to each group\u2019s frequency. This change should enhance fairness by\nequalizing exposure to all skin\u2010tone groups during training, potentially\nimproving overall AUROC and reducing fairness gaps. We perform 5\u2010fold stratified\ncross\u2010validation to report the mean AUROC, then retrain on the full dataset and\nsave the final DenseNet121 model. The `predict()` function remains unchanged for\ninference on new images.", "We add MixUp data augmentation during training to improve generalization and\nrobustness, which often boosts AUROC.  In each training batch we sample a mixing\ncoefficient from a Beta distribution, mix pairs of images and their labels\nlinearly, and compute the loss as a weighted sum of the two targets.  All other\nparts of the pipeline, including the weighted sampler for fairness across skin\ntones, remain unchanged.  This atomic change should increase both overall\nperformance and stability across folds.", "I fixed the shape mismatch by replacing the generic `.squeeze()` calls with\n`.squeeze(1)` (and equivalently flattening logits) so that even a batch of size\n1 yields a 1-D tensor of shape `[batch_size]`. This ensures that\n`binary_cross_entropy_with_logits` always receives inputs and targets of\nmatching shapes. The same adjustment is applied during validation to get\nconsistent probability vectors. The rest of the training and cross\u2010validation\npipeline remains unchanged, and we print fold\u2010wise and mean AUROCs at the end.", "We integrate a OneCycleLR learning rate scheduler to provide dynamic learning\nrate adjustment for better convergence and generalization. A higher max learning\nrate of 1e-3 over each fold\u2019s training schedule and the full training schedule\nwill be used. The scheduler is stepped per batch during training with minimal\nmodifications to the existing training loop. All other components (weighted\nsampler for fairness, architecture, cross\u2010validation) remain unchanged to\nisolate the effect of scheduling on AUROC.", "I propose adding test-time augmentation (TTA) via horizontal flips: during\nevaluation and prediction, each image is passed through the model twice\n(original and flipped) and the probabilities are averaged. This simple\naugmentation often improves AUROC without retraining. We'll modify `eval_model`\nand `predict` to use TTA and report the updated cross\u2010validation AUROC.", "I propose extending test-time augmentation beyond simple horizontal flips by\nincluding rotations at 90\u00b0, 180\u00b0, and 270\u00b0 plus the original image, averaging\npredictions over these five views. This multi-angle TTA should improve\nrobustness and AUROC without changing training. We\u2019ll update both the\n`eval_model_tta` and `predict` functions accordingly, rerun 5-fold CV, and print\nthe mean AUROC. The rest of the pipeline (weighted sampler, architecture,\ntraining epochs) remains unchanged.", "I propose replacing the standard BCEWithLogitsLoss with Focal Loss (alpha=0.25,\ngamma=2) to focus training on hard examples and improve generalization and\nfairness. We retain the weighted sampler for skin\u2010tone balancing and multi\u2010angle\nTTA unchanged. We rerun 5\u2010fold stratified CV using Focal Loss, printing fold-\nwise and mean AUROC. The full\u2010data retraining, model saving, and multi\u2010angle TTA\nprediction function remain as before.", "We integrate CutMix augmentation into the training loop, applying it with\nprobability 0.5 to mix image patches and proportionally combine labels, which\noften improves robustness and AUROC. All other components\u2014Focal Loss, weighted\nsampling for skin\u2010tone fairness, and multi\u2010angle test\u2010time augmentation\u2014remain\nunchanged. We perform 5\u2010fold stratified cross\u2010validation, print fold\u2010wise and\nmean AUROC, then retrain on the full dataset, save the model, and generate a\nsubmission.csv with TTA predictions on the test set.", "I moved the device transfer of images and labels to the very start of each batch\nso that all tensors (imgs, labels, and the random index permutation) live on the\nsame device during CutMix. This way, `perm` can be generated on CUDA without\ncausing indexing errors, and the rest of the training loop remains unchanged.\nThe updated script now correctly trains with CutMix and prints the cross-\nvalidation AUROC, then saves the final submission.", "I propose integrating CutMix augmentation into the training loop to further\nregularize the model and improve generalization. With a CutMix probability of\n0.5 and Beta(1.0,1.0), we randomly mix images and labels per batch, adjusting\nthe loss accordingly with Focal Loss. This change works alongside the existing\nWeightedRandomSampler and multi\u2010angle TTA to potentially boost CV AUROC without\naltering the validation or prediction logic. Below is the modified end\u2010to\u2010end\ntraining script with CutMix implemented.", "I will integrate RandAugment into the training augmentation pipeline by adding a\n`transforms.RandAugment(num_ops=2, magnitude=9)` step before normalization. This\nshould enrich data diversity, improve generalization, and boost AUROC without\nchanging the core training or inference logic. The rest of the weighted\nsampling, focal loss, CutMix, multi-angle TTA, and prediction pipeline remains\nunchanged.", "We\u2019ll replace the DenseNet121 backbone with EfficientNet-B0 to leverage its\nstronger feature extraction for improved AUROC without altering the rest of the\npipeline. All existing techniques (weighted sampling for skin-tone fairness,\nFocal Loss, multi\u2010angle TTA) remain unchanged, so we can directly assess the\nimpact of the new backbone. We then rerun 5-fold CV to print per\u2010fold and mean\nAUROC, retrain on the full dataset, save the model, and output test predictions.", "I propose upgrading the backbone from EfficientNet-B0 to EfficientNet-B3 and\nincreasing the input resolution to 300\u00d7300. This atomic change leverages the\nstronger representational power of B3 to boost AUROC without altering the\nfairness strategy, loss function, sampler, or TTA. All other\ncomponents\u2014including WeightedRandomSampler, FocalLoss, multi\u2010angle TTA, and the\nprediction function\u2014remain unchanged.", "I propose integrating a OneCycleLR learning rate scheduler during training to\nimprove convergence and generalization. We\u2019ll apply OneCycleLR with a max\nlearning rate of 1e-3 over each fold\u2019s CV training schedule and the full-data\ntraining, stepping the scheduler every batch. All other components remain the\nsame (EfficientNet-B3, weighted sampling for fairness, FocalLoss, RandAugment,\nand multi-angle TTA). This atomic change should boost the mean CV AUROC without\naltering the existing pipeline structure.", "I propose adding RandAugment to the training augmentation pipeline to enrich\ndata diversity and boost generalization. We insert\n`transforms.RandAugment(num_ops=2, magnitude=9)` before normalization in\n`train_tf` and rerun 5\u2010fold CV to measure the impact on AUROC. All other\ncomponents\u2014including the weighted sampler for skin-tone fairness, Focal Loss,\nEfficientNet-B3 backbone, and multi\u2010angle TTA\u2014remain unchanged."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\n# Dataset\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        tone = row.skin_tone\n        return img, label, tone\n\n\n# Transforms\ntransform = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# Load and prepare data\ndf = pd.read_csv(DATA_CSV)\n# Binary label: malignant=1, else=0\ndf[\"label_bin\"] = (df.label == \"malignant\").astype(int)\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\n\n# Cross-validation\nfor train_idx, val_idx in skf.split(df, df[\"label_bin\"]):\n    df_train = df.iloc[train_idx]\n    df_val = df.iloc[val_idx]\n    # compute sample weights by skin tone in train\n    tone_counts = df_train.skin_tone.value_counts().to_dict()\n    weights = df_train.skin_tone.map(lambda t: 1.0 / tone_counts[t]).values\n    sampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n    train_ds = SkinDataset(df_train, IMG_DIR, transform)\n    val_ds = SkinDataset(df_val, IMG_DIR, transform)\n    train_loader = DataLoader(train_ds, batch_size=32, sampler=sampler, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    model = timm.create_model(\"resnet18\", pretrained=True, num_classes=1).to(DEVICE)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # Train for 3 epochs\n    model.train()\n    for epoch in range(3):\n        for imgs, labels, _ in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            optimizer.zero_grad()\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n    # Validate\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, labels, _ in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).cpu().squeeze(1)\n            probs = torch.sigmoid(logits)\n            all_labels.extend(labels.numpy())\n            all_probs.extend(probs.numpy())\n    auc = roc_auc_score(all_labels, all_probs)\n    aucs.append(auc)\n# Print CV result\nmean_auc = np.mean(aucs)\nprint(f\"CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data\n# sampler on full data\ntone_counts = df.skin_tone.value_counts().to_dict()\nweights = df.skin_tone.map(lambda t: 1.0 / tone_counts[t]).values\nsampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\nfull_ds = SkinDataset(df, IMG_DIR, transform)\nfull_loader = DataLoader(full_ds, batch_size=32, sampler=sampler, num_workers=4)\nmodel = timm.create_model(\"resnet18\", pretrained=True, num_classes=1).to(DEVICE)\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\nmodel.train()\nfor epoch in range(3):\n    for imgs, labels, _ in full_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        loss = criterion(model(imgs), labels)\n        loss.backward()\n        optimizer.step()\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\ndef predict(folder_path: str) -> pd.DataFrame:\n    \"\"\"\n    Load saved model and predict malignancy probability for images in folder_path.\n    Returns a DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    # load model\n    mdl = timm.create_model(\"resnet18\", pretrained=False, num_classes=1).to(DEVICE)\n    mdl.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    mdl.eval()\n    tf = transform\n    records = []\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith((\".jpg\", \".png\")):\n                continue\n            path = os.path.join(folder_path, fname)\n            img = Image.open(path).convert(\"RGB\")\n            img_t = tf(img).unsqueeze(0).to(DEVICE)\n            prob = torch.sigmoid(mdl(img_t)).cpu().item()\n            records.append(\n                {\"image_name\": os.path.splitext(fname)[0], \"malignancy_prob\": prob}\n            )\n    return pd.DataFrame(records)\n\n\n# Example usage:\n# df_preds = predict(\"./input/MyImages\")\n# print(df_preds.head())", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nN_FOLDS = 5\nRANDOM_STATE = 42\nEPOCHS_CV = 3\nEPOCHS_FULL = 5\nBATCH_SIZE = 32\nLR = 1e-4\nIMG_SIZE = 224\n\n# Read data\ndf = pd.read_csv(DATA_CSV)\n# Encode label: malignant=1, else=0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Skin tone groups, fill missing as own group\ndf[\"skin_tone\"] = df[\"skin_tone\"].fillna(-1).astype(int)\ngroups = df[\"skin_tone\"].unique()\n# Compute inverse-frequency weights per group\ncounts = df[\"skin_tone\"].value_counts().to_dict()\ninv_freq = {g: 1.0 / counts[g] for g in counts}\n# Normalize so average weight = 1\nmean_w = np.mean(list(inv_freq.values()))\ngroup_weights = {g: w / mean_w for g, w in inv_freq.items()}\ndf[\"group_weight\"] = df[\"skin_tone\"].map(group_weights)\n\n\n# Dataset\nclass LesionDataset(Dataset):\n    def __init__(self, df, transform):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(IMG_DIR, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(image)\n        y = torch.tensor(row[\"target\"], dtype=torch.float32)\n        w = torch.tensor(row[\"group_weight\"], dtype=torch.float32)\n        return x, y, w\n\n\n# Transforms\ntrain_transform = T.Compose(\n    [\n        T.Resize((IMG_SIZE, IMG_SIZE)),\n        T.RandomHorizontalFlip(),\n        T.RandomRotation(15),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\nval_transform = T.Compose(\n    [\n        T.Resize((IMG_SIZE, IMG_SIZE)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n\ndef train_one(model, loader, optimizer, criterion):\n    model.train()\n    total_loss = 0.0\n    for x, y, w in loader:\n        x, y, w = x.to(device), y.to(device), w.to(device)\n        preds = model(x).squeeze(1)\n        loss = criterion(preds, y)\n        # per-sample BCEWithLogitsLoss -> multiply weights\n        loss = (loss * w).mean()\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * x.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef validate(model, loader):\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for x, y, _ in loader:\n            x = x.to(device)\n            preds = model(x).squeeze(1)\n            probs = torch.sigmoid(preds).cpu().numpy()\n            ys.extend(y.numpy())\n            ps.extend(probs)\n    return roc_auc_score(ys, ps)\n\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=RANDOM_STATE)\naucs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"])):\n    df_train = df.iloc[train_idx]\n    df_val = df.iloc[val_idx]\n    ds_train = LesionDataset(df_train, train_transform)\n    ds_val = LesionDataset(df_val, val_transform)\n    loader_train = DataLoader(\n        ds_train, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    loader_val = DataLoader(ds_val, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    # Model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n        device\n    )\n    optimizer = torch.optim.Adam(model.parameters(), lr=LR)\n    bce = nn.BCEWithLogitsLoss(reduction=\"none\")\n    # Train\n    for epoch in range(EPOCHS_CV):\n        train_loss = train_one(model, loader_train, optimizer, bce)\n    auc = validate(model, loader_val)\n    print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n    aucs.append(auc)\nprint(f\"Mean CV AUROC: {np.mean(aucs):.4f}\")\n\n# Retrain on full data\nfull_ds = LesionDataset(df, train_transform)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nmodel_full = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n    device\n)\nopt_full = torch.optim.Adam(model_full.parameters(), lr=LR)\nbce = nn.BCEWithLogitsLoss(reduction=\"none\")\nfor epoch in range(EPOCHS_FULL):\n    loss = train_one(model_full, full_loader, opt_full, bce)\n    print(f\"Full train epoch {epoch+1}/{EPOCHS_FULL} loss: {loss:.4f}\")\n# Save model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model_full.state_dict(), MODEL_PATH)\n\n\ndef predict(folder_path):\n    \"\"\"\n    Load saved model and predict malignancy probabilities for all images in folder_path.\n    Returns a dict: {filename: probability}.\n    \"\"\"\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1).to(\n        device\n    )\n    model.load_state_dict(torch.load(MODEL_PATH, map_location=device))\n    model.eval()\n    transform = val_transform\n    results = {}\n    for fn in sorted(os.listdir(folder_path)):\n        if fn.lower().endswith((\".j ransforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_tf = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\ndef mixup_data(x, y, alpha=MIXUP_ALPHA):\n    \"\"\"Returns mixed inputs, pairs of targets, and lambda\"\"\"\n    if alpha > 0:\n        lam = np.random.beta(alpha, alpha)\n    else:\n        lam = 1.0\n    batch_size = x.size()[0]\n    index = torch.randperm(batch_size).to(DEVICE)\n    mixed_x = lam * x + (1 - lam) * x[index, :]\n    y_a, y_b = y, y[index]\n    return mixed_x, y_a, y_b, lam\n\n\ndef train_one_epoch(model, loader, optimizer, criterion):\n    model.train()\n    total_loss = 0.0\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE)\n        # apply MixUp\n        mixed_imgs, targets_a, targets_b, lam = mixup_data(imgs, labels)\n        optimizer.zero_grad()\n        logits = model(mixed_imgs).squeeze(1)\n        loss = lam * criterion(logits, targets_a) + (1 - lam) * criterion(\n            logits, targets_b\n        )\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef eval_model(model, loader):\n    model.eval()\n    preds, trues = [], []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            preds.extend(probs.tolist())\n            trues.extend(labels.numpy().tolist())\n    return roc_auc_score(trues, preds)\n\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=N_FOLDS, shuffle=True, random_state=SEED)\naucs = []\nfor fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"])):\n    df_train, let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
