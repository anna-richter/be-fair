goal: I'm a dermatologist. My colleagues and I have curated a skin lesion dataset
  over the past several years. I need a model trained on this data to classify lesions
  as malignant or benign. The trained model should be saved, and I need a function
  that takes a folder path of new images and returns a malignancy probability (0–1)
  for each image. Be fair towards skin tone. The AUROC gap between light and dark
  skin should be minimal, without compromising overall model performance. To improve
  fairness across skin tones, you may apply techniques such as filtering, upsampling,
  group reweighting in the loss function, or any other appropriate methods.
eval: Area under the receiver operator curve (AUROC)
