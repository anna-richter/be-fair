let treeStructData = {"edges": [[2, 7], [2, 6], [2, 5], [7, 9], [7, 8], [7, 11], [7, 10], [11, 12], [12, 16], [12, 15], [12, 17], [12, 13], [13, 14], [16, 18], [17, 19]], "layout": [[0.0, 0.0], [0.16666666666666666, 0.0], [0.3333333333333333, 0.0], [0.5, 0.0], [0.6666666666666666, 0.0], [0.16666666666666666, 0.19999999999999996], [0.3333333333333333, 0.19999999999999996], [0.5, 0.19999999999999996], [0.25, 0.4], [0.4166666666666667, 0.4], [0.5833333333333334, 0.4], [0.75, 0.4], [0.75, 0.6], [0.5, 0.8], [0.5, 1.0], [0.6666666666666666, 0.8], [0.8333333333333334, 0.8], [1.0, 0.8], [0.8333333333333334, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 model from the timm library to perform binary\nclassification, mapping \u201cmalignant\u201d to 1 and all other labels to 0. We split the\ndata 80/20 using a stratified split, apply standard transforms (resize to\n224\u00d7224, normalize), and train with Adam and BCEWithLogitsLoss for a few epochs.\nAfter training we compute the ROC AUC on the hold-out validation set and print\nit. The model weights are saved, and a predict(folder_path) function loads the\nweights and returns malignancy probabilities for new images.", "We fine-tune a pretrained EfficientNet-B0 model from the timm library to\nclassify lesions as malignant or non-malignant, mapping \u201cmalignant\u201d to 1 and\nothers to 0, and applying standard ImageNet transforms. We perform 5-fold\nstratified cross-validation, training each fold for 3 epochs with AdamW and\nBCEWithLogitsLoss, and compute the AUROC on each validation set. After CV we\nretrain the same model on the full dataset for 3 epochs and save the final\nweights. A `predict(folder_path)` function is provided that loads the saved\nmodel and returns malignancy probabilities for new images.", "We fine-tune a pretrained DenseNet121 on our skin lesion dataset, mapping\n\u201cmalignant\u201d to 1 and the other labels to 0, and use standard ImageNet\nnormalization with Resize(224) and CenterCrop(224). We split the data 80/20 with\nstratification on the binary label, train for 3 epochs using Adam and\nBCEWithLogitsLoss on GPU if available, and compute AUROC on the hold-out\nvalidation set. The model weights are saved to \u201cworking/model.pth\u201d. We also\nprovide a predict(folder_path) function that loads these weights and returns\nmalignancy probabilities for new images.", "We fine-tune a pretrained Vision Transformer (ViT-B/16) from timm for binary\nclassification, mapping \u201cmalignant\u201d to 1 and all other labels to 0, using an\n80/20 stratified split. We apply standard ImageNet transforms, train for 3\nepochs with AdamW and BCEWithLogitsLoss, and evaluate ROC AUC on the hold-out\nvalidation set. The trained model is saved to \u201cworking/model.pth\u201d and a\n`predict(folder_path)` function loads this model to return malignancy\nprobabilities for new images. We report the validation ROC AUC after training.", "We fine-tune a pretrained ResNet34 on the skin lesion dataset to classify\nmalignant versus benign lesions, mapping \u201cmalignant\u201d to 1 and others to 0. We\nsplit the data 80/20 in a stratified manner, apply data augmentations during\ntraining and center cropping during validation, and train for 5 epochs with\nAdamW and BCEWithLogitsLoss. After training, we compute the ROC AUC on the hold-\nout validation set, print it, and save the model weights. We also provide a\n`predict(folder_path)` function to load the saved model and return malignancy\nprobabilities for new images.", "We enhance the training pipeline by introducing stronger data\naugmentations\u2014RandomResizedCrop, random horizontal/vertical flips, and\nColorJitter\u2014to improve model generalization. The validation pipeline remains\nunchanged with CenterCrop for consistency. All other components (architecture,\noptimizer, epochs) are kept constant to isolate the effect of augmentations. We\nretrain DenseNet121 for 3 epochs and report the validation ROC AUC.", "We introduce Mixup augmentation into the training loop to regularize the model\nand improve generalization. Mixup blends pairs of images and their labels with a\nmixing coefficient sampled from a Beta distribution. We keep all other settings\n(DenseNet121 backbone, transforms, optimizer, epochs) constant to isolate the\neffect of mixup. After training, we evaluate on the stratified hold-out set and\nprint the validation ROC AUC.", "We integrate CutMix augmentation into the training loop to further regularize\nthe model and improve generalization. During each training batch, with a set\nprobability, we blend pairs of images and their labels using a randomly sampled\nmixing coefficient and bounding box, computing the loss as a weighted sum of the\ntwo corresponding labels. All other components, including image transforms,\nmodel architecture (DenseNet121), optimizer, and training schedule, remain\nunchanged to isolate the effect of CutMix. Finally, we evaluate the model on the\nhold-out validation set and print the ROC AUC, and provide a `predict()`\nfunction that loads the saved model and outputs malignancy probabilities for new\nimages.", "We will implement test-time augmentation by averaging predictions between\noriginal and horizontally flipped images. During validation, for each batch we\ncompute predictions on both original images and their horizontal flips, average\nthe predicted probabilities, and use these averaged probabilities to compute ROC\nAUC. We also extend this TTA logic to the predict function so that test-time\npredictions are similarly averaged across two views. This simple TTA often\nimproves model robustness and can lift the validation ROC AUC slightly.", "We integrate stronger online augmentations such as RandomResizedCrop, random\nflips, and ColorJitter into the training pipeline, while keeping the validation\ntransform unchanged to improve model generalization. All other settings,\nincluding the DenseNet121 architecture, CutMix augmentation, optimizer, and\ntraining schedule, remain identical. This enhanced diversity of training samples\nshould boost the validation ROC AUC.", "We integrate both MixUp and CutMix augmentations in the training loop by\nrandomly choosing between them for each batch. MixUp blends pairs of images and\nlabels using a beta\u2010distributed coefficient, while CutMix swaps image patches;\nboth regularizations help the network generalize. All other settings\n(DenseNet121 backbone, transforms, optimizer, epochs) remain unchanged. We then\nevaluate on the hold-out validation set and print the ROC AUC.", "I will implement 5\u2010fold stratified cross\u2010validation to train five DenseNet121\nmodels with CutMix augmentation and report each fold\u2019s ROC AUC as well as the\nmean. At inference time I will ensemble all five fold models by averaging their\nsigmoid outputs for more robust predictions. The `predict()` function will load\nall saved fold models and average their predictions. A `submission.csv` will be\ngenerated if a test folder is present.", "We switch to the AdamW optimizer with weight decay and add a CosineAnnealingLR\nscheduler to smoothly decrease the learning rate over each epoch. This change\nhelps regularize training and escape sharp minima, improving generalization\nwithout altering the rest of the 5\u2010fold DenseNet121 + CutMix pipeline. All other\nsettings, including CutMix, transforms, and evaluation, remain the same so we\ncan isolate the effect of the scheduler.", "I propose integrating Stochastic Weight Averaging (SWA) into the existing 5-fold\nDenseNet121 + CutMix training loop to further smooth the loss landscape and\nboost generalization. For each fold, we maintain an AveragedModel and SWALR\nalongside the existing optimizer and CosineAnnealingLR; after each epoch we\nupdate the SWA weights and step the SWALR scheduler. Once training is complete,\nwe run batch\u2010norm statistics updating via `update_bn`, then evaluate and save\nthe SWA\u2010averaged model for each fold. At inference, we ensemble these SWA models\nas before to generate predictions.", "We wrap the training DataLoader in a small wrapper that moves each batch to the\nGPU before calling update_bn, so that the input and the SWA model\u2019s weights live\non the same device. This ensures batch\u2010norm statistics are updated properly\nwithout type mismatches. We then call update_bn with this wrapped loader and\nproceed to evaluate and save predictions as before.", "We introduce Stochastic Weight Averaging (SWA) to improve generalization by\naveraging model parameters over the latter part of each fold\u2019s training. After\ninitializing a standard DenseNet121 and optimizer/scheduler, we wrap the model\nwith torch.optim.swa_utils.AveragedModel and use SWALR for the last epochs.\nDuring training, we update the SWA model once past a warm-up epoch, then after\ntraining we update its BatchNorm stats on the training loader. Finally we\nevaluate the SWA\u2010averaged model on the validation set and save it for inference.\nThis atomic change typically yields a smoother minima and higher AUROC.", "I will integrate PyTorch\u2019s Stochastic Weight Averaging (SWA) into each fold:\nafter a warm-up period (first half of epochs), I will start collecting model\nsnapshots with AveragedModel and use SWALR for a constant learning rate. After\ntraining, I'll update batch\u2010norm statistics on the SWA model and evaluate it\ninstead of the raw model, saving this averaged model for inference. This should\nimprove generalization with minimal changes to the existing pipeline.", "We increase the number of training epochs from 3 to 5, giving the\nCosineAnnealingLR scheduler more iterations to optimize, while keeping all other\nsettings identical (5-fold CV, DenseNet121, CutMix, AdamW). This allows the\nmodel to converge more fully and can lift the ROC AUC. The scheduler\u2019s T_max is\nupdated to match the new epoch count. We then print the per\u2010fold and mean ROC\nAUC and save test predictions as before.", "We encountered a mismatch when updating batch\u2010norm running statistics because\n`update_bn` uses CPU tensors against a GPU model. To fix this, we implement our\nown `update_bn` routine that explicitly moves each batch to the model\u2019s device\nbefore forwarding. We replace the `torch.optim.swa_utils.update_bn` call with\nthis custom version so that the SWA model\u2019s batch\u2010norm layers are correctly\nupdated on the GPU. This ensures inputs and weights share the same device and\nresolves the type mismatch error.", "We implement horizontal flip test\u2010time augmentation (TTA) by averaging model\npredictions on original and flipped images during validation and inference. This\nadds minimal complexity but can improve robustness and lift the ROC AUC\nslightly. We update the validation loop to compute predictions on both versions\nof each batch and average their sigmoid outputs. The `predict()` function is\nsimilarly modified to apply TTA across all fold models when generating the\nsubmission."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import StratifiedShuffleSplit\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None, is_test=False):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        self.is_test = is_test\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        img_name = self.df.loc[idx, \"image_name\"] + \".jpg\"\n        img_path = os.path.join(self.img_dir, img_name)\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        if self.is_test:\n            return img, self.df.loc[idx, \"image_name\"]\n        label = self.df.loc[idx, \"binary_label\"]\n        return img, torch.tensor(label, dtype=torch.float32)\n\n\ndef predict(images_folder: str, model_path: str = \"model.pth\", batch_size: int = 32):\n    \"\"\"\n    Predict malignancy probabilities for images in the given folder.\n    Args:\n        images_folder (str): Path to folder containing images.\n        model_path (str): Path to saved model weights.\n        batch_size (int): Batch size for inference.\n    Returns:\n        pandas.DataFrame: columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Build model\n    model = timm.create_model(\"resnet18\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # Prepare dataset\n    img_files = [f for f in os.listdir(images_folder) if f.lower().endswith(\".jpg\")]\n    df_test = pd.DataFrame({\"image_name\": [os.path.splitext(f)[0] for f in img_files]})\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = SkinDataset(df_test, images_folder, transform, is_test=True)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False)\n    results = []\n    with torch.no_grad():\n        for imgs, names in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            for name, p in zip(names, probs):\n                results.append({\"image_name\": name, \"malignancy_prob\": float(p)})\n    return pd.DataFrame(results)\n\n\nif __name__ == \"__main__\":\n    # Configuration\n    CSV_PATH = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    MODEL_PATH = \"model.pth\"\n    BATCH_SIZE = 32\n    EPOCHS = 3\n    lr = 1e-4\n\n    # Load data\n    df = pd.read_csv(CSV_PATH)\n    # Binary label: malignant=1, else=0\n    df[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Stratified split\n    splitter = StratifiedShuffleSplit(n_splits=1, test_size=0.2, random_state=42)\n    train_idx, val_idx = next(splitter.split(df, df[\"binary_label\"]))\n    df_train, df_val = df.loc[train_idx], df.loc[val_idx]\n\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.RandomVerticalFlip(),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets & Loaders\n    train_ds = SkinDataset(df_train, IMG_DIR, train_tf)\n    val_ds = SkinDataset(df_val, IMG_DIR, val_tf)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"resnet18\", pretrained=True, num_classes=1)\n    model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=lr)\n\n    # Training loop\n    for epoch in range(EPOCHS):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        epoch_loss = running_loss / len(train_ds)\n        print(f\"Epoch {epoch+1}/{EPOCHS}, Training Loss: {epoch_loss:.4f}\")\n\n    # Validation\n    model.eval()\n    all_logits, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1).cpu().numpy()\n            all_logits.extend(logits)\n            all_labels.extend(labels.numpy())\n    probs = 1 / (1 + np.exp(-np.array(all_logits)))\n    auc = roc_auc_score(all_labels, probs)\n    print(f\"Validation ROC AUC: {auc:.4f}\")\n\n    # Save model\n    torch.save(model.state_dict(), MODEL_PATH)\n\n    # Example: generate predictions on new images folder (uncomment to use)\n    # df_preds = predict(IMG_DIR, MODEL_PATH)\n    # df_preds.to_csv('./working/submission.csv', index=False)", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset class\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        return image, label\n\n\n# Training and validation functions\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n        preds = model(imgs)\n        loss = criterion(preds, labels)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n\n\ndef eval_epoch(model, loader, device):\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for imgs, labels in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().ravel()\n            ys.extend(labels.numpy().ravel())\n            ps.extend(probs)\n    return roc_auc_score(ys, ps)\n\n\n# Main training and CV\ndef main():\n    # Config\n    IMG_DIR = \"./input/MyImages\"\n    CSV_PATH = \"./input/mydataset.csv\"\n    MODEL_PATH = \"./working/model.pth\"\n    N_SPLITS = 5\n    BATCH_SIZE = 32\n    LR = 1e-4\n    EPOCHS_CV = 3\n    EPOCHS_FULL = 3\n    DEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Data\n    df = pd.read_csv(CSV_PATH)\n    df[\"label\"] = df.label.apply(lambda x: 1 if x == \"malignant\" else 0)\n    y = df[\"label\"].values\n\n    # Transforms\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n\n    # 5-fold CV\n    skf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, y), 1):\n        df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n        ds_train = LesionDataset(df_train, IMG_DIR, transform)\n        ds_val = LesionDataset(df_val, IMG_DIR, transform)\n        loader_train = DataLoader(\n            ds_train, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n        )\n        loader_val = DataLoader(\n            ds_val, batch_size=BATCH_SIZE, shuffle=False, num_workers=4\n        )\n\n        # Model\n        model = timm.creat let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
