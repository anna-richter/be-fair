let treeStructData = {"edges": [[2, 6], [2, 5], [6, 8], [6, 7], [8, 9], [9, 11], [9, 13], [9, 10], [9, 12], [13, 18], [13, 14], [13, 15], [13, 17], [13, 16], [13, 19]], "layout": [[0.0, 0.0], [0.14285714285714285, 0.0], [0.2857142857142857, 0.0], [0.42857142857142855, 0.0], [0.5714285714285714, 0.0], [0.21428571428571427, 0.19999999999999996], [0.35714285714285715, 0.19999999999999996], [0.2857142857142857, 0.4], [0.42857142857142855, 0.4], [0.42857142857142855, 0.6], [0.21428571428571427, 0.8], [0.35714285714285715, 0.8], [0.5, 0.8], [0.6428571428571429, 0.8], [0.2857142857142857, 1.0], [0.42857142857142855, 1.0], [0.5714285714285714, 1.0], [0.7142857142857143, 1.0], [0.8571428571428571, 1.0], [1.0, 1.0]], "plan": ["We finetune a pretrained ResNet18 on binary labels (malignant vs others) with\nstandard augmentations and 5\u2010fold stratified CV, using per\u2010sample weights\ninversely proportional to skin_tone frequency to improve fairness. We evaluate\nmean AUROC across folds and then retrain on the full dataset before saving the\nfinal model. A predict() function loads the saved model and returns malignancy\nprobabilities for all images in a given folder.", "I propose fine-tuning a pretrained EfficientNet-B0 in PyTorch to classify\nlesions as malignant or benign, using a weighted random sampler to balance\nskin_tone groups in each batch for fairness. We'll run 5-fold stratified cross-\nvalidation on the binary labels, training for a few epochs with standard\naugmentations and computing AUROC on each fold. After reporting the mean CV\nAUROC, we'll retrain on the full dataset and save the final model. A predict()\nfunction will load the saved model and return malignancy probabilities for new\nimages in a specified folder.", "I propose fine-tuning a pretrained DenseNet121 to predict lesion malignancy,\nusing a weighted random sampler based on skin tone frequencies to ensure\nfairness. We will apply standard image augmentations (resize, flips, rotations)\nand optimize binary cross\u2010entropy loss using 5\u2010fold stratified CV, reporting\nAUROC per fold. After CV, we retrain on the full dataset, save the model, and\nprovide a `predict()` function that outputs malignancy probabilities for all\nimages in a folder. Our evaluation metric will be the mean AUROC across folds.", "I propose fine-tuning a pretrained MobileNetV2 from timm with a single-output\nhead and using per-sample weights based on inverse skin-tone frequencies in the\nloss to improve fairness. We perform 5-fold stratified CV on the binary\nmalignant label with standard augmentations, computing a weighted BCE loss and\nreporting mean AUROC. After CV evaluation, we retrain on the full dataset and\nsave the final model. A `predict()` function loads the saved model and returns\nmalignancy probabilities for images in a given folder.", "We extract deep features from images using a pretrained ResNet152 feature\nextractor without fine-tuning, then train a LightGBM classifier on these\nfeatures. To mitigate skin tone imbalance, we weight samples inversely by their\nskin_tone group frequency. We evaluate using 5-fold stratified CV on the\nmalignant vs benign/other binary label, reporting mean AUROC. After CV, we train\non the full dataset and save the classifier, and we implement a predict()\nfunction that loads the model and returns malignancy probabilities for new\nimages in a folder.", "I propose adding Mixup augmentation during training to improve model\ngeneralization and fairness across skin tones. We'll implement a `mixup_data`\nfunction with alpha=0.4 and apply it in the `train_fold` loop, combining image-\nlabel pairs and adjusting the loss calculation accordingly. All other components\nremain the same, including the weighted sampler for skin-tone balancing. This\natomic change should boost cross-validated AUROC without altering the overall\ntraining pipeline.", "I propose adding simple test\u2010time augmentation (horizontal flipping) during\nevaluation to improve prediction robustness and boost AUROC without altering the\ntraining pipeline. In `eval_fold`, for each batch we predict on the original and\nhorizontally flipped images, then average their probabilities. We also apply the\nsame TTA in the final `predict()` function so that submission predictions\nbenefit from this enhancement. This atomic change should yield a measurable\nimprovement in cross\u2010validated AUROC.", "I propose adding Random Erasing augmentation to the training pipeline to improve\nmodel robustness and generalization, which can also help reduce performance gaps\nacross skin tones by making the model less sensitive to localized features.\nSpecifically, we'll append `transforms.RandomErasing` to the training transforms\nwith a probability of 0.5. This atomic change should yield a measurable boost in\ncross\u2010validated AUROC without altering any other parts of the pipeline.", "I propose replacing the simple horizontal\u2010flip TTA with a 10\u2010crop TTA (five\ncorner+center and their flips) in both fold evaluation and final prediction,\naveraging predictions over the ten crops for each image. This should improve\nrobustness and AUROC without changing training. We'll adjust the validation\ntransforms to output ten crops per image, update `eval_fold` to average over\nthem, and similarly update `predict()`.", "I propose replacing the Adam optimizer with AdamW (adding weight decay for\nregularization) and introducing a CosineAnnealingLR scheduler over 5 epochs per\nfold to better control the learning rate decay. We also increase training epochs\nfrom 3 to 5 in cross\u2010validation to give the scheduler room to improve\ngeneralization. This atomic change should boost the model\u2019s AUROC without\naltering the overall pipeline.", "I propose adding a ColorJitter augmentation to the training pipeline to\ndiversify color and lighting conditions, which should improve robustness and\nreduce reliance on skin-tone\u2013correlated cues. This atomic change involves\ninserting `transforms.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2,\nhue=0.1)` into the `train_tf` sequence before converting to tensor. All other\ncomponents, including the weighted sampler for skin\u2010tone balancing, 5\u2010fold CV,\nand ten\u2010crop TTA, remain unchanged. This should boost overall AUROC and help\nminimize performance gaps across skin tones.", "I propose strengthening the training-time augmentation by replacing the fixed\nresize with a RandomResizedCrop to introduce scale and aspect ratio variability,\nwhich should improve model generalization and further boost AUROC without\naltering the rest of the pipeline. All other components\u2014including weighted\nsampling for skin tone fairness, AdamW with cosine annealing, 5\u2010fold CV, and\nten\u2010crop TTA\u2014remain unchanged, isolating the effect of this single augmentation.\nThe script below implements this change and prints the cross-validated AUROC\nbefore retraining on the full dataset and saving the final model and submission.", "I propose to integrate CutMix augmentation into the training loop to further\nenhance generalization and fairness across skin tones. We will implement a\n`cutmix_data` function with alpha=1.0 and apply it with probability 0.5 in\n`train_fold`, mixing images and labels and adjusting the loss accordingly. All\nother components\u2014including the weighted sampler, RandomResizedCrop, AdamW with\ncosine annealing, 5\u2010fold CV, and ten\u2010crop TTA\u2014remain unchanged.", "I propose strengthening the training-time augmentation by adding RandomErasing\n(p=0.5) after normalization in the training transforms, which should improve\nrobustness and generalization without altering any other part of the pipeline.\nThis atomic change complements our weighted sampler for skin-tone balancing,\nexisting augmentations, AdamW optimizer with cosine annealing, and ten\u2010crop TTA.\nWe will rerun 5\u2010fold CV to measure the impact on AUROC and then retrain on the\nfull dataset.", "I propose to replace the fixed Resize in the training transformations with a\nRandomResizedCrop(224) augmentation to introduce random scaling and aspect\u2010ratio\nperturbations, improving model generalization and robustness. This atomic change\nleaves the weighted sampler, optimizer, scheduler, and ten\u2010crop TTA unchanged,\nisolating the effect of the new augmentation. We will rerun 5\u2010fold CV to measure\nits impact on AUROC and then retrain on the full dataset, saving the final model\nand submission.", "I propose replacing the binary cross\u2010entropy loss with a Focal Loss (\u03b3=2) to\nfocus training on hard\u2010to\u2010classify examples and improve discrimination, while\nretaining our weighted sampler for skin tone fairness. This atomic change\nrequires defining a `FocalLoss` class and swapping it in for `BCEWithLogitsLoss`\nin both cross\u2010validation and full\u2010data retraining. All other\ncomponents\u2014including augmentations, optimizer, scheduler, and ten\u2010crop\nTTA\u2014remain unchanged to isolate the effect on AUROC.", "I propose replacing the fixed Resize in the training transforms with a\nRandomResizedCrop(224) augmentation (scale=(0.8,1.0), ratio=(3/4,4/3)) to\nintroduce random scaling and aspect\u2010ratio variability, which should improve\nmodel generalization and robustness without altering the rest of the pipeline.\nAll other components\u2014including the weighted sampler for skin tone fairness,\nAdamW optimizer with cosine annealing, 5\u2010fold CV, and ten\u2010crop TTA\u2014remain\nunchanged. This atomic change isolates the effect of the new augmentation and\nshould boost overall AUROC.", "I propose replacing the fixed `Resize` in the training transforms with\n`RandomResizedCrop(224, scale=(0.8,1.0), ratio=(3/4,4/3))` to introduce random\nscaling and aspect\u2010ratio variability, improving model generalization and\nrobustness. All other components\u2014including the weighted sampler for skin-tone\nbalancing, AdamW optimizer with cosine annealing, 5\u2010fold CV, and ten\u2010crop\nTTA\u2014remain unchanged. We will rerun 5-fold CV to measure its impact on mean\nAUROC, then retrain on the full dataset, save the final model, and generate\n`submission.csv`.", "I propose to strengthen the training augmentation by inserting the torchvision\nAutoAugment policy (ImageNet) into the `train_tf` pipeline, which applies\ndiverse, learned transformations that can improve generalization and reduce\noverfitting to skin\u2010tone\u2013correlated artifacts. This atomic change leaves the\nrest of the training loop, sampler, optimizer, scheduler, and ten\u2010crop TTA\nunchanged. We will rerun 5\u2010fold CV to measure its impact on mean AUROC and then\nretrain on the full dataset and save the final model and submission.", "I propose increasing the number of training epochs from 5 to 10 to give the\nmodel more opportunity to converge and allow the cosine annealing scheduler to\nfully cycle, which should improve overall AUROC without altering the rest of the\npipeline. This single change should yield a noticeable boost in performance\nwhile keeping fairness techniques and augmentations intact."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Dataset definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        target = torch.tensor(row.target, dtype=torch.float32)\n        weight = torch.tensor(row.sample_weight, dtype=torch.float32)\n        return img, target, weight\n\n\n# Define training and evaluation\ndef train_one_epoch(model, loader, optimizer, device):\n    model.train()\n    total_loss = 0\n    for imgs, targets, weights in loader:\n        imgs, targets, weights = imgs.to(device), targets.to(device), weights.to(device)\n        logits = model(imgs).squeeze(1)\n        loss = nn.BCEWithLogitsLoss(reduction=\"none\")(logits, targets)\n        loss = (loss * weights).mean()\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef eval_one_epoch(model, loader, device):\n    model.eval()\n    preds = []\n    trues = []\n    with torch.no_grad():\n        for imgs, targets, _ in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            preds.extend(probs)\n            trues.extend(targets.numpy())\n    return roc_auc_score(trues, preds)\n\n\ndef main():\n    # Load data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # Binary target: malignant vs others\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Compute per-skin_tone weights for fairness\n    freq = df[\"skin_tone\"].value_counts().to_dict()\n    inv = {k: 1.0 / v for k, v in freq.items()}\n    # normalize to mean 1\n    mean_inv = np.mean(list(inv.values()))\n    inv = {k: v / mean_inv for k, v in inv.items()}\n    df[\"sample_weight\"] = df[\"skin_tone\"].map(inv).fillna(1.0)\n\n    img_dir = \"input/MyImages\"\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Transforms\n    train_transform = T.Compose(\n        [\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.ColorJitter(0.1, 0.1, 0.1, 0.1),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    fold_aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"target\"])):\n        df_train = df.iloc[train_idx]\n        df_val = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(df_train, img_dir, train_transform)\n        val_ds = SkinLesionDataset(df_val, img_dir, val_transform)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n        model = models.resnet18(pretrained=True)\n        model.fc = nn.Linear(model.fc.in_features, 1)\n        model = model.to(device)\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n        for epoch in range(5):\n            train_loss = train_one_epoch(model, train_loader, optimizer, device)\n\n        auc = eval_one_epoch(model, val_loader, device)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        fold_aucs.append(auc)\n\n    print(f\"Mean CV AUROC: {np.mean(fold_aucs):.4f}\")\n\n    # Retrain on full data\n    full_ds = SkinLesionDataset(df, img_dir, train_transform)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=4)\n    final_model = models.resnet18(pretrained=True)\n    final_model.fc = nn.Linear(final_model.fc.in_features, 1)\n    final_model = final_model.to(device)\n    optimizer = torch.optim.Adam(final_model.parameters(), lr=1e-4)\n    for epoch in range(5):\n        train_loss = train_one_epoch(final_model, full_loader, optimizer, device)\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(final_model.state_dict(), \"working/model.pth\")\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for all images in image_folder.\n    Returns a DataFrame with columns ['image_name', 'malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    records = []\n    filenames = sorted(\n        [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    )\n    batch_imgs = []\n    batch_names = []\n    for fname in filenames:\n        img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n        batch_imgs.append(transform(img))\n        batch_names.append(fname)\n        if len(batch_imgs) == 32:\n            imgs_tensor = torch.stack(batch_imgs).to(device)\n            with torch.no_grad():\n                probs = torch.sigmoid(model(imgs_tensor).squeeze(1)).cpu().numpy()\n            for n, p in zip(batch_names, probs):\n                records.append({\"image_name\": n, \"malignancy_probability\": p})\n            batch_imgs, batch_names = [], []\n    if batch_imgs:\n        imgs_tensor = torch.stack(batch_imgs).to(device)\n        with torch.no_grad():\n            probs = torch.sigmoid(model(imgs_tensor).squeeze(1)).cpu().numpy()\n        for n, p in zip(batch_names, probs):\n            records.append({\"image_name\": n, \"malignancy_probability\": p})\n\n    submission = pd.DataFrame(records)\n    submission.to_csv(\"working/submission.csv\", index=False)\n    return submission\n\n\nif __name__ == \"__main__\":\n    main()", "import os, pandas as pd, numpy as np\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img = Image.open(os.path.join(self.img_dir, row.image_name + \".jpg\")).convert(\n            \"RGB\"\n        )\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        return img, label, row.skin_tone, row.image_name\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    total_loss = 0\n    for imgs, labels, _, _ in loader:\n        imgs, labels = imgs.to(device), labels.to(device)\n        optimizer.zero_grad()\n        outputs = model(imgs).squeeze(1)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef eval_model(model, loader, device):\n    model.eval()\n    preds, targets = [], []\n    with torch.no_grad():\n        for imgs, labels, _, _ in loader:\n            imgs = imgs.to(device)\n            outputs = torch.sigmoid(model(imgs).squeeze(1))\n            preds.append(outputs.cpu().numpy())\n            targets.append(labels.numpy())\n    preds = np.concatenate(preds)\n    targets = np.concatenate(targets)\n    return roc_auc_score(targets, preds)\n\n\ndef predict(image_folder):\n    \"\"\"\n    Loads the trained model from 'working/model.pth' and returns a dict mapping\n    image filenames to malignancy probability.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(\n        torch.load(os.path.join(\"working\", \"model.pth\"), map_location=device)\n    )\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = {}\n    for fname in os.listdir(image_folder):\n        if not fname.lower().endswith(\".jpg\"):\n            continue\n        img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n        inp = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            prob = torch.sigmoid(model(inp).squeeze(1)).item()\n        results[fname] = prob\n    return results\n\n\ndef main():\n    # Load and preprocess metadata\n    df = pd.read_csv(os.path.join(\"input\", \"mydataset.csv\"))\n    df = df[df.label.notnull()].copy()\n    df[\"label\"] = (df.label == \"malignant\").astype(int)\n    img_dir = os.path.join(\"input\", \"MyImages\")\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Data transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"label\"])):\n        train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n        # Skin-tone balancing sampler\n        counts = train_df.skin_tone.value_counts().to_dict()\n        weights = train_df.skin_tone.map(lambda s: 1.0 / counts.get(s, 1)).values\n        sampler = WeightedRandomSampler(\n            weights, num_samples=len(weights), replacement=True\n        )\n        train_ds = SkinLesionDataset(train_df, img_dir, transform=train_tf)\n        val_ds = SkinLesionDataset(val_df, img_dir, transform=val_tf)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, sampler=sampler, num_workers=4\n        )\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n        # Model setup\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n            device\n        )\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # Training epochs\n        for epoch in range(3):\n            train_one_epoch(model, train_loader, criterion, optimizer, device)\n        # Validation\n        auc = eval_model(model, val_loader, device)\n        print(f\"Fold {fold} AUROC: {auc:.4f}\")\n        aucs.append(auc)\n    print(f\"Mean CV AUROC: {np.mean(aucs):.4f}\")\n    # Retrain on full data\n    counts = df.skin_tone.value_counts().to_dict()\n    weights = df.skin_tone.map(lambda s: 1.0 / counts.get(s, 1)).values\n    sampler = WeightedRandomSampler(weights, num_samples=len(weights), replacement=True)\n    full_ds = SkinLesionDataset(df, img_dir, transform=train_tf)\n    full_loader r imgs, labels in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy())\n    return roc_auc_score(all_labels, all_probs)\n\n\ndef main():\n    # Config\n    data_csv = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    df = pd.read_csv(data_csv)\n    # Binary label: malignant=1 else 0\n    df[\"label\"] = (df.label == \"malignant\").astype(int)\n    # Sample weights by skin_tone\n    tone_counts = df.skin_tone.value_counts().to_dict()\n    df[\"weight\"] = df.skin_tone.map(lambda t: 1.0 / tone_counts.get(t, 1))\n\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    cv_scores = []\n    # Transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label)):\n        df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n        # Sampler\n        weights = df_train.weight.values\n        sampler = WeightedRandomSampler(weights, len(weights), replacement=True)\n        train_ds = SkinLesionDataset(df_train, img_dir, train_tf)\n        val_ds = SkinLesionDataset(df_val, img_dir, val_tf)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, sampler=sampler, num_workers=4\n        )\n        val_loader = DataLoader( s for all images in folder_path.\n    Returns a pandas DataFrame with columns ['image_name','malignancy_probability'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"mobilenetv2_100\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    transform = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = []\n    for fname in sorted(os.listdir(folder_path)):\n        if fname.lower().endswith((\".jpg\", \".png\", \"jpeg\")):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(x))[0, 0].item()\n            results.append({\"image_name\": fname, \"malignancy_probability\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # Settings\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n    skins = df[\"skin_tone\"].values\n    # compute inverse freq weights\n    unique, counts = np.unique(skins, return_counts=True)\n    inv_freq = {u: 1.0 / c for u, c in zip(unique, counts)}\n    sample_weights = np.array([inv_freq[s] for s in skins], dtype=np.float32)\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # transforms\n    train_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.RandomHorizontalFlip(),\n            T.RandomVerticalFlip(),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize((224, 224)),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n\n    aurocs = []\n    for fold, (tr_idx, val_idx) in enumerate(skf.split(df, df[\"label\"])):\n        train_ds = SkinLesionDataset(\n            df.iloc[tr_idx], \"./input/MyImages\", train_tf, sample_weights[tr_idx]\n        )\n        val_ds = SkinLesionDataset(\n            df.iloc[val_idx], \"./input/MyImages\", val_tf, sample_weights[val_idx]\n        )\n        tr_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=2)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=2)\n\n        model = timm.create_model(\"mobilenetv2_100\", pretrained=True, num_classes=1).to(\n            device\n        )\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n        # train 3 epochs\n        for epoch in range(3):\n            model.train()\n            for x, y, w in tr_loader:\n                x, y, w = x.to(device), y.to(device), w.to(device)\n                logits = model(x).view(-1)\n                loss = nn.BCEWithLogitsLoss(reduction=\"none\")(logits, y) * w\n                loss = loss.mean()\n                optimizer.zero_grad()\n                loss.backward()\n                optimizer.step()\n        # validation\n        model.eval()\n        ys, ps = [], []\n        with torch.no_grad():\n            for x, y, _ in val_loader:\n                x = x.to(device)\n                logits = model(x).view(-1).cpu().numpy()\n                ys.extend(y.numpy())\n                ps.extend(1 / (1 + np.exp(-logits)))\n        auc = roc_auc_score(ys, ps)\n        print(f\"Fold {fold+1} AUROC: {auc:.4f}\")\n        aurocs.append(auc)\n\n    mean_auc = np.mean(aurocs)\n    print(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n    # retrain full model\n    full_ds = SkinLesionDataset(df, \"./input/MyImages\", train_tf, sample_weights)\n    full_loader = DataLoader(full_ds, batch_size=32, shuffle=True, num_workers=2)\n    model = timm.create_model(\"mobilenetv2_100\", pretrained=True, num_classes=1).to(\n        device\n    )\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    for epoch in range(3):\n        model.train()\n        for x, y, w in full_loader:\n            x, y, w = x.to(device), y.to(device), w.to(device)\n            logits = model(x).view(-1)\n            loss = nn.BCEWithLogitsLoss(reduction=\"none\")(logits, y) * w\n            loss = loss.mean()\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model.state_dict(), \"./working/model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pickle\nfrom typing import List\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport lightgbm as lgb\n\n\n# Dataset for feature extraction\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df: pd.DataFrame, image_dir: str, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        return image, row[\"label_bin\"], row[\"skin_tone\"], row[\"image_name\"]\n\n\n# Feature extraction function\ndef extract_features(model: nn.Module, loader: DataLoader, device: torch.device):\n    model.eval()\n    features = []\n ":\n    # Paths\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    image_dir = \"input/MyImages\"\n    # Transforms and dataset\n    transform = transforms.Compose(\n        [\n            transforms.Resize(224),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    dataset = SkinLesionDataset(df, image_dir, transform)\n    loader = DataLoader(dataset, batch_size=32, shuffle=False, num_workers=4)\n    # Device and feature extractor\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    resnet = models.resnet152(pretrained=True)\n    resnet.fc = nn.Identity()\n    resnet = resnet.to(device)\n    # Extract features\n    X, y, skins, names = extract_features(resnet, loader, device)\n    # Compute sample weights inverse to skin tone frequency\n    unique, counts = np.unique(skins, return_counts=True)\n    inv_freq = {u: 1.0 / count for u, count in zip(unique, counts)}\n    sample_weights = np.array([inv_freq[s] for s in skins])\n    # 5-fold stratified CV\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    cv_scores = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(X, y), 1):\n        model = lgb.LGBMClassifier(n_estimators=200, random_state=42)\n        model.fit(X[train_idx], y[train_idx], sample_weight=sample_weights[train_idx])\n        preds = model.predict_proba(X[val_idx])[:, 1]\n        score = roc_auc_score(y[val_idx], preds)\n        print(f\"Fold {fold} AUROC: {score:.4f}\")\n        cv_scores.append(score)\n    mean_auc = np.mean(cv_scores)\n    print(f\"Mean CV AUROC: {mean_auc:.4f}\")\n    # Train final model on full data\n    final_model = lgb.LGBMClassifier(n_estimators=200, random_state=42)\n    final_model.fit(X, y, sample_weight=sample_weights)\n    # Save model\n    os.makedirs(\"working\", exist_ok=True)\n    with open(\"working/lgb_model.pkl\", \"wb\") as f:\n        pickle.dump(final_model, f)\n    # Example: generate predictions on a new folder (uncomment to run)\n    # df_out = predict('input/MyImages')\n    # df_out.to_csv('working/submission.csv', index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\n# Mixup utilities\ndef mixup_data(x, y, alpha=0.4):\n    if alpha > 0:\n        lam = np.random.beta(alpha, alpha)\n    else:\n        lam = 1\n    batch_size = x.size()[0]\n    index = torch.randperm(batch_size).to(x.device)\n    mixed_x = lam * x + (1 - lam) * x[index, :]\n    y_a, y_b = y, y[index]\n    return mixed_x, y_a, y_b, lam\n\n\ndef mixup_criterion(criterion, pred, y_a, y_b, lam):\n    return lam * criterion(pred, y_a) + (1 - lam) * criterion(pred, y_b)\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        return img, label\n\n\n# Training & Evaluation\ndef train_fold(model, loader, criterion, optimizer, device, mixup_alpha=0.4):\n    model.train()\n    for imgs, labels in loader:\n        imgs, labels = imgs.to(device), labels.to(device)\n        inputs, targets_a, targets_b, lam = mixup_data(imgs, labels, taset(df_train, img_dir, train_tf)\n        val_ds = SkinLesionDataset(df_val, img_dir, val_tf)\n        train_loader = DataLoader(\n            train_ds, batch_size=32, sampler=sampler, num_workers=4\n        )\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n        model = models.densenet121(pretrained=True)\n        model.classifier = nn.Linear(model.classifier.in_features, 1)\n        model = model.to(device)\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n        for epoch in range(3):\n            train_fold(\n                model, train_loader, criterion, optimizer, device, mixup_alpha=0.4\n            )\n\n        score = eval_fold(model, val_loader, device)\n        print(f\"Fold {fold+1} AUROC: {score:.4f}\")\n        cv_scores.append(score)\n\n    mean_score = np.mean(cv_scores)\n    print(f\"Mean CV AUROC: {mean_score:.4f}\")\n\n    # Retrain on full data\n    full_sampler = WeightedRandomSampler(df.weight.values, len(df), replacement=True)\n    full_ds = SkinLesionDataset(df, img_dir, train_tf)\n    full_loader = DataLoader(\n        full_ds, batch_size=32, sampler=full_sampler, num_workers=4\n    )\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    for epoch in range(5):\n        train_fold(model, full_loader, criterion, optimizer, device, mixup_alpha=0.4)\n    torch.save(model.state_dict(), \"./working/model.pth\")\n    print(\"Model saved to ./working/model.pth\")\n\n\n# Prediction function\ndef predict(model_path, img_folder):\n    \"\"\"\n    Predict malignancy probabilities for all images in img_folder.\n    Args:\n      model_path (str): path to saved model weights (.pth)\n      img_folder (str): folder containing images to predict\n    Retu class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
