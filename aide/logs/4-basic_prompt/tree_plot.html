let treeStructData = {"edges": [[2, 5], [5, 6], [5, 9], [5, 7], [5, 8], [9, 10], [9, 11], [11, 16], [11, 14], [11, 19], [11, 13], [11, 12], [11, 18], [11, 15], [11, 17]], "layout": [[0.0, 0.0], [0.13333333333333333, 0.0], [0.26666666666666666, 0.0], [0.4, 0.0], [0.5333333333333333, 0.0], [0.26666666666666666, 0.25], [0.06666666666666667, 0.5], [0.2, 0.5], [0.3333333333333333, 0.5], [0.4666666666666667, 0.5], [0.4, 0.75], [0.5333333333333333, 0.75], [0.06666666666666667, 1.0], [0.2, 1.0], [0.3333333333333333, 1.0], [0.4666666666666667, 1.0], [0.6, 1.0], [0.7333333333333333, 1.0], [0.8666666666666667, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 on our binary task of malignant vs non-\nmalignant using a stratified 80/20 train/validation split with standard image\naugmentations and BCEWithLogitsLoss. Training runs for a few epochs on GPU if\navailable, and we evaluate on the hold-out set using ROC AUC. The trained model\nis saved to disk, and a predict(folder_path) function loads the model and\nreturns malignancy probabilities for new images in a pandas DataFrame.", "We fine-tune an EfficientNet\u2010B0 on lesions with simple augmentations, using\n5\u2010fold stratified cross\u2010validation and BCEWithLogitsLoss.  We train for 2 epochs\nper fold, compute ROC AUC on each hold\u2010out partition, and report mean \u00b1 std.\nFinally we retrain on the full dataset, save the model, and provide a\n`predict(folder_path)` function that returns malignancy probabilities for new\nimages.", "We fine-tune a pretrained DenseNet\u2010121 on our binary malignant vs benign task\nusing 3\u2010fold stratified cross\u2010validation with random horizontal flips and\nrotations, resizing all images to 224\u00d7224. Each fold is trained for 3 epochs\nwith Adam and a cosine annealing scheduler, using BCEWithLogitsLoss, and we\ncompute ROC AUC on each validation split. We then retrain the model on the full\ndataset for 3 epochs, save the weights, and provide a `predict(folder_path)`\nfunction that returns malignancy probabilities for new images. Finally, we print\nthe mean and standard deviation of the cross\u2010validation ROC AUC scores.", "We fine-tune a pretrained MobileNetV2 to classify malignant vs non-malignant\nlesions, freezing the backbone and retraining the classifier head. We split the\ndataset 80/20 with stratification, apply standard augmentations during training,\nand evaluate via ROC AUC on the hold-out set. We train for 5 epochs using Adam\nand BCEWithLogitsLoss, then save the model weights. Finally, we provide a\npredict(folder_path) function that loads the saved model and returns malignancy\nprobabilities for new images in a pandas DataFrame. The script prints the final\nvalidation ROC AUC.", "We fine-tune a pretrained ResNet34 on the binary malignant vs non-malignant task\nusing an 80/20 stratified split, applying random flips, rotations, and color\njitter to augment training images resized to 224\u00d7224. The final fully\u2010connected\nlayer is replaced with a single\u2010unit head trained with BCEWithLogitsLoss for 5\nepochs, and we evaluate on the hold\u2010out set via ROC AUC. The script saves the\ntrained weights and defines a predict(folder_path) function that loads the model\nand returns malignancy probabilities for new images. The final validation ROC\nAUC is printed at the end.", "I propose incorporating simple test-time augmentation (horizontal flip) during\nvalidation and inference by averaging predictions on the original and flipped\nimages. This TTA should improve robustness and increase the validation AUROC\nwithout changing the training setup. We update `eval_model` to perform TTA\naveraging and adjust `predict()` similarly for more reliable projections. All\nother training parameters, model architecture, and data handling remain\nunchanged.", "I propose extending test-time augmentation to include vertical flips and\ncombined horizontal+vertical flips in addition to the original and horizontal\nflip, averaging predictions across these four versions to further improve\nrobustness. This change only affects inference and requires minimal code\nadjustments. Both `eval_model` and `predict` will be updated to perform TTA over\n[identity, horiz flip, vert flip, horiz+vert flip]. All training parameters and\nprocesses remain unchanged.", "I propose adding mixup augmentation during training with alpha=0.4 to improve\ngeneralization and robustness. Mixup will randomly mix pairs of images and their\nlabels within each batch, encouraging the model to behave linearly between\nsamples and reducing overfitting. All other training settings, model\narchitecture, and TTA during evaluation/inference remain unchanged, allowing us\nto isolate the impact of mixup on ROC AUC. Below is the updated training script\nwith mixup integrated.", "I propose to replace the standard BCEWithLogitsLoss with a binary focal loss\n(\u03b3=2, \u03b1=0.25) to focus training on hard\u2010to\u2010classify samples and mitigate class\nimbalance. This change is isolated to the loss function and should improve\ndiscriminative performance without altering the rest of the training pipeline.\nWe\u2019ll keep the 3\u2010fold CV, TTA, and final full\u2010data training unchanged. The new\nfocal loss is implemented, and we\u2019ll print per\u2010fold and mean ROC AUC to measure\nimpact.", "We can improve the model capacity by replacing the DenseNet-121 backbone with a\ndeeper DenseNet-161 pretrained model, which should capture more complex skin\nlesion features and boost CV ROC AUC without changing the rest of the pipeline.\nAll training, TTA, and evaluation settings remain the same except swapping to\nDenseNet-161. This is an atomic change focusing on testing the effect of\nincreased model capacity.", "We will integrate a ColorJitter augmentation into the training pipeline, adding\nrandom brightness, contrast, saturation, and hue variations to the existing\nhorizontal flips and rotations. This should improve model robustness to diverse\nskin tone and lighting conditions. We will keep the DenseNet-161 backbone,\n3-fold stratified cross-validation, and horizontal-flip TTA unchanged, then\nretrain on the full dataset with the new augmentation and save the model. The\npredict() function remains the same.", "I propose extending our cross\u2010validation to 5 stratified folds and ensembling\nthe five fold\u2010trained DenseNet\u2010161 models at inference by averaging their\nsigmoid outputs with horizontal\u2010flip test\u2010time augmentation. Each model is\ntrained on its own train split with the same augmentations and scheduler, and\nits weights are saved. During prediction, we load all five models, apply the\nstandard resize\u2010normalize transform plus horizontal\u2010flip TTA, and average their\noutputs to produce final malignancy probabilities. This ensemble approach should\nboost robustness and AUROC without changing the underlying training regimen.", "I propose augmenting the training pipeline with ColorJitter\u2014random brightness,\ncontrast, saturation, and hue perturbations\u2014to make the model more robust to\nvarying lighting and skin tones. This change is isolated to the training\ntransforms and should boost generalization without altering the ensemble, TTA,\nor model architecture. We will retrain the 5\u2010fold DenseNet\u2010161 ensemble with the\nupdated augmentation and report the cross\u2010validation ROC AUC.", "I propose to enhance inference robustness by implementing 10\u2010crop test\u2010time\naugmentation (TTA) during both cross\u2010validation evaluation and final prediction.\nFor each image we will generate the standard five crops plus their horizontal\nflips at size 224 on a 256\u2010pixel resize, pass all ten through each fold model,\nand average the sigmoid outputs. This requires only adjusting the validation\ntransform, `eval_model`, and `predict` functions without altering training. We\nthen report the updated CV ROC AUC and save the ensembled predictions in\n`submission.csv`.", "I propose replacing the Adam optimizer and cosine annealing scheduler with AdamW\n(weight_decay=1e-2) and a OneCycleLR scheduler (max_lr=1e-3) to improve\ngeneralization and convergence. We'll step the scheduler once per batch over the\nfull 3\u2010epoch training cycle. All other aspects\u2014including 5\u2010fold CV, DenseNet\u2010161\nbackbone, data augmentations, and horizontal-flip TTA\u2014remain unchanged for an\nisolated comparison.", "I propose enriching the training augmentations by replacing the fixed resize\nwith RandomResizedCrop to encourage scale invariance, and adding RandomErasing\nto randomly occlude patches and improve robustness. We keep the 5\u2010fold\nDenseNet\u2010161 ensemble, horizontal\u2010flip TTA, and training schedule unchanged to\nisolate the effect of these augmentations. This should help the model generalize\nbetter to varied lesion appearances and boost AUROC.", "I propose extending test\u2010time augmentation to include vertical flips and\ncombined horizontal+vertical flips, averaging predictions over the original,\nhorizontal, vertical, and horizontal+vertical images during validation and\ninference. This change requires only updating `eval_model` and `predict` to use\nfour TTA variants, without altering the training setup. By aggregating these\nextra flips, the model\u2019s robustness to spatial variations will increase,\npotentially improving AUROC. Below is the updated script with 5\u2010fold CV,\nDenseNet\u2010161, and enhanced TTA.", "I propose integrating CutMix augmentation (\u03b2=1.0, probability=0.5) into our\ntraining loop to further improve generalization by forcing the model to learn\nfrom mixed regions of two images and their soft labels. This only requires\nupdating `train_one_epoch` to perform CutMix on half of the batches and adjust\nthe loss accordingly, keeping the rest of the 5\u2010fold DenseNet\u2010161 ensemble,\ntransforms, scheduler, and TTA\u2010based inference unchanged. Below is the updated\ntraining and evaluation script with CutMix and ROC AUC printed per fold and\noverall.", "I propose replacing the DenseNet\u2010161 backbone with a ResNeXt\u201050 (32\u00d74d)\npretrained model, which often delivers stronger representations for fine\u2010grained\ntasks without substantially increasing compute. We will keep the same 5\u2010fold\nstratified CV, data augmentations, training schedule, horizontal\u2010flip TTA and\nensembling protocol, and simply swap in ResNeXt\u201050 and adjust its final layer.\nThis atomic change should yield an uplift in ROC AUC by leveraging ResNeXt\u2019s\ncardinality\u2010based features.", "I propose extending test\u2010time augmentation to include vertical flips and\ncombined horizontal+vertical flips, averaging predictions over the original,\nhorizontally flipped, vertically flipped, and both\u2010flipped images during both\nvalidation and inference. This change only affects `eval_model` and `predict`\nfunctions and should boost robustness to spatial variations without altering\ntraining. I will update these functions accordingly while keeping the 5\u2010fold\nDenseNet\u2010161 training pipeline unchanged."], "code": ["import os\nimport glob\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n# Configuration\nDATA_CSV = \"./input/mydataset.csv\"\nIMG_DIR = \"./input/MyImages\"\nMODEL_PATH = \"./working/model.pth\"\nBATCH_SIZE = 32\nNUM_EPOCHS = 5\nLEARNING_RATE = 1e-4\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nIMAGE_SIZE = 224\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_binary, dtype=torch.float32)\n        return img, label\n\n\n# Read data\ndf = pd.read_csv(DATA_CSV)\n# Map malignant=1, others=0\ndf[\"label_binary\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Stratified split\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"label_binary\"], random_state=42\n)\n\n# Transforms\ntrain_transform = transforms.Compose(\n    [\n        transforms.RandomResizedCrop(IMAGE_SIZE),\n        transforms.RandomHorizontalFlip(),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\nval_transform = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(IMAGE_SIZE),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# DataLoaders\ntrain_ds = SkinLesionDataset(train_df, IMG_DIR, transform=train_transform)\nval_ds = SkinLesionDataset(val_df, IMG_DIR, transform=val_transform)\ntrain_loader = DataLoader(train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n# Model\nmodel = models.resnet18(pretrained=True)\nin_f = model.fc.in_features\nmodel.fc = nn.Linear(in_f, 1)\nmodel = model.to(DEVICE)\n\n# Loss and optimizer\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=LEARNING_RATE)\n\n# Training loop\nfor epoch in range(1, NUM_EPOCHS + 1):\n    model.train()\n    running_loss = 0.0\n    for imgs, labels in train_loader:\n        imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, labels)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    epoch_loss = running_loss / len(train_loader.dataset)\n    print(f\"Epoch {epoch}/{NUM_EPOCHS}, Loss: {epoch_loss:.4f}\")\n\n# Validation\nmodel.eval()\nall_targets = []\nall_preds = []\nwith torch.no_grad():\n    for imgs, labels in val_loader:\n        imgs = imgs.to(DEVICE)\n        outputs = model(imgs)\n        probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n        all_preds.extend(probs.tolist())\n        all_targets.extend(labels.numpy().tolist())\nauc = roc_auc_score(all_targets, all_preds)\nprint(f\"Validation ROC AUC: {auc:.4f}\")\n\n# Save model\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\ntorch.save(model.state_dict(), MODEL_PATH)\n\n\ndef predict(folder_path):\n    \"\"\"\n    Load the trained model and predict malignancy probability for each image in folder_path.\n    Args:\n        folder_path (str): Path to a folder containing .jpg images.\n    Returns:\n        pandas.DataFrame with columns ['image_name','malignancy_probability'].\n    \"\"\"\n    # Rebuild model architecture\n    m = models.resnet18(pretrained=False)\n    m.fc = nn.Linear(in_f, 1)\n    m.load_state_dict(torch.load(MODEL_PATH, map_location=DEVICE))\n    m = m.to(DEVICE).eval()\n    # Prepare transform\n    tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(IMAGE_SIZE),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    records = []\n    for img_path in glob.glob(os.path.join(folder_path, \"*.jpg\")):\n        img = Image.open(img_path).convert(\"RGB\")\n        inp = tf(img).unsqueeze(0).to(DEVICE)\n        with torch.no_grad():\n            prob = torch.sigmoid(m(inp)).item()\n        name = os.path.splitext(os.path.basename(img_path))[0]\n        records.append((name, prob))\n    return pd.DataFrame(records, columns=[\"image_name\", \"malignancy_probability\"])\n\n\n# Example: generate submission if needed\n# If there's a folder './input/test' with images to predict, uncomment:\n# df_sub = predict('./input/test')\n# df_sub.to_csv('./working/submission.csv', index=False)", "import os\nimport pandas as pd\nimport numpy as np\nimport torch\nfrom torch import nn, optim\nfrom torchvision import transforms\nfrom torch.utils.data import Dataset, DataLoader\nfrom PIL import Image\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\n\n\nclass LesionDataset(Dataset):\n    def __init__(self, df, transform):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img = Image.open(row[\"image_path\"]).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row[\"label\"], dtype=torch.float32)\n        return img, label\n\n\ndef main():\n    # Load and prepare data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    df[\"image_path\"] = df[\"image_name\"].apply(\n        lambda x: os.path.join(\"./input/MyImages\", f\"{x}.jpg\")\n    )\n    # Transforms\n    train_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aucs = []\n\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"label\"])):\n        train_df, val_df = df.iloc[train_idx], df.iloc[val_idx]\n        train_loader = DataLoader(\n            LesionDataset(train_df, train_transform),\n            batch_size=32,\n            shuffle=True,\n            num_workers=4,\n        )\n        val_loader = DataLoader(\n            LesionDataset(val_df, val_transform),\n            batch_size=64,\n            shuffle=False,\n            num_workers=4,\n        )\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1).to(\n            device\n        )\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = optim.AdamW(model.parameters(), lr=1e-4, weight_decay=1e-5)\n        for epoch in range(2):\n            model.train()\n            for imgs, labels in train_loader:\n                imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n                optimizer.zero_grad()\n                logits = model(imgs)\n                loss = criterion(logits, labels)\n                loss.backward()\n                optimizer.step()\n        # Validation\n        model.eval()\n        all_probs, all_labels = [], []\n        with torch.no_grad():\n            for imgs, labels in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs)\n                probs = torch.sigmoid(logits).cpu().numpy().flatten()\n                all_probs.extend(probs)\n                all_labels.extend(labels.numpy().flatten())\n        auc = roc_auc_score(all_labels, all_probs)\n        print(f\"Fold {fold} AUC: {auc:.4f}\")\n        aucs.append(auc)\n\n    print(f\"Mean CV ROC AUC: {np.mean(aucs):.4f} +/- {np.std(aucs):.4f}\")\n\n    # Retrain on full dataset\n    full_loader = DataLoader(\n        LesionDataset(df, train_transform), batch_size=32, shuffle=True, num_workers=4\n    )\n    final_model = timm.create_model(\n        \"efficientnet_b0\", pretrained=True, num_classes=1\n    ).to(device)\n    optimizer = optim.AdamW(final_model.parameters(), lr=1e-4, weight_decay=1e-5)\n    criterion = nn.BCEWithLogitsLoss()\n    for epoch in range(2):\n        final_model.train()\n        for imgs, labels in full_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            logits = final_model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(final_model.state_dict(), \"./working/model.pth\")\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all images in folder_path.\n    Returns a pandas DataFrame with columns ['image_name', 'malignant_prob'].\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    data = []\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith((\".jpg\", \".jpeg\", \".png\")):\n            path = os.path.join(folder_path, fname)\n            img = Image.open(path).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(inp)).item()\n            data.append({\"image_name\": fname, \"malignant_prob\": prob})\n    return pd.DataFrame(data)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\n\n\n# Dataset for images and labels\nclass LesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = float(row[\"label_bin\"])\n        return image, label\n\n\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    running_loss = 0.0\n    for imgs, lbls in loader:\n        imgs = imgs.to(device)\n        lbls = lbls.to(device).unsqueeze(1)\n        optimizer.zero_grad()\n        outputs = model(imgs)\n        loss = criterion(outputs, lbls)\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    return running_loss / len(loader.dataset)\n\n\ndef eval_model(model, loader, device):\n    model.eval()\n    preds, truths = [], []\n    with torch.no_grad():\n        for imgs, lbls in loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs)\n            probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n            preds.extend(probs)\n            truths.extend(lbls.numpy().flatten())\n    auc = roc_auc_score(truths, preds)\n    return auc ancy_probability'] and writes submission.csv.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    models_list = []\n    for fold in range(5):\n        model = models.densenet161(pretrained=False)\n        model.classifier = nn.Linear(model.classifier.in_features, 1)\n        state_path = os.path.join(\"working\", f\"densenet161_fold{fold}.pth\")\n        model.load_state_dict(torch.load(state_path, map_location=device))\n        model.to(device).eval()\n        models_list.append(model)\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    results = []\n    for fname in sorted(os.listdir(folder_path)):\n        if not fname.lower().endswith((\".jpg\", \".jpeg\", \".png\")):\n            continue\n        img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n        inp = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            sum_prob = 0.0\n            for model in models_list:\n                o1 = model(inp)\n                o2 = model(torch.flip(inp, dims=[3]))\n                o3 = model(torch.flip(inp, dims=[2]))\n                o4 = model(torch.flip(inp, dims=[2, 3]))\n                prob = torch.sigmoid((o1 + o2 + o3 + o4) / 4).item()\n                sum_prob += prob\n            avg_prob = sum_prob / len(models_list)\n        results.append({\"image_name\": fname, \"malignancy_probability\": avg_prob})\n    df = pd.DataFrame(results)\n    os.makedirs(\"working\", exist_ok=True)\n    df.to_csv(os.path.join(\"working\", \"submission.csv\"), index=False)\n    return df\n\n\nif __name__ == \"__main__\":\n    csv_path = os.path.join(\"input\", \"mydataset.csv\")\n    img_dir = os.path.join(\"input\", \"MyImages\")\n    df = pd.read_csv(csv_path)\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    train_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n\n    os.makedirs(\"working\", exist_ok=True)\n    aucs = []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df[\"label_bin\"])):\n        train_df = df.iloc[train_idx].reset_index(drop=True)\n        val_df = df.iloc[val_idx].reset_index(drop=True)\n        train_ds = LesionDataset(train_df, img_dir, train_transform)\n        val_ds = LesionDataset(val_df, img_dir, val_transform)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n        model = models.densenet161(pretrained=True)\n        model.classifier = nn.Linear(model.classifier.in_features, 1)\n        model.to(device)\n\n        optimizer = optim.Adam(model.parameters(), lr=1e-4)\n        criterion = nn.BCEWithLogitsLoss()\n        scheduler = optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=3)\n\n        for epoch in range(3):\n            train_one_epoch(model, train_loader, criterion, optimizer, device)\n            scheduler.step()\n\n        auc = eval_model(model, val_loader, device)\n        print(f\"Fold {fold+1} ROC AUC: {auc:.4f}\")\n        aucs.append(auc)\n        torch.save(\n            model.state_dict(), os.path.join(\"working\", f\"densenet161_fold{fold}.pth\")\n        )\n\n    mean_auc, std_auc = np.mean(aucs), np.std(aucs)\n    print(f\"Mean CV ROC AUC: {mean_auc:.4f} \u00b1 {std_auc:.4f}\")"], "term_out": ["Epoch 1/5, Loss: 0.3246\nEpoch 2/5, Loss: 0.2754\nEpoch 3/5, Loss: 0.2516\nEpoch 4/5, Loss: 0.2405\nEpoch 5/5, Loss: 0.2250\nValidation ROC AUC: 0.8743\nExecution time: 2 minutes seconds (time limit is an hour).", "[23:59:16] INFO     [23:59:16] - timm.models._builder - INFO -   _builder.py:217\n                    Loading pretrained weights from Hugging Face                \n                    hub (timm/efficientnet_b0.ra_in1k)                          \n           INFO     [23:59:16] - timm.models._hub - INFO -           _hub.py:233\n                    [timm/efficientnet_b0.ra_in1k] Safe alternative             \n                    available for 'pytorch_model.bin' (as                       \n                    'model.safetensors'). Loading weights using                 \n                    safetensors.                                                \n           INFO     [23:59:16] - timm.models._builder - INFO -   _builder.py:282\n                    Missing keys (classifier.weight,                            \n                    classifier.bias) discovered while loading                   \n                    pretrained weights. This is expected if                     \n                    model is being adapted.                                     \nFold 0 AUC: 0.8662\n[00:00:22] INFO     [00:00:22] - timm.models._builder - INFO -   _builder.py:217\n                    Loading pretrained weights from Hugging Face                \n                    hub (timm/efficientnet_b0.ra_in1k)                          \n           INFO     [00:00:22] - timm.models._hub - INFO -           _hub.py:233\n                    [timm/efficientnet_b0.ra_in1k] Safe alternative             \n                    available for 'pytorch_model.bin' (as                       \ let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
