let treeStructData = {"edges": [[4, 9], [4, 7], [4, 10], [4, 6], [4, 8], [4, 5], [10, 12], [10, 11], [12, 14], [12, 13], [14, 15], [15, 17], [15, 18], [15, 19], [15, 16]], "layout": [[0.0, 0.0], [0.1111111111111111, 0.0], [0.2222222222222222, 0.0], [0.3333333333333333, 0.0], [0.4444444444444444, 0.0], [0.16666666666666666, 0.19999999999999996], [0.2777777777777778, 0.19999999999999996], [0.3888888888888889, 0.19999999999999996], [0.5, 0.19999999999999996], [0.6111111111111112, 0.19999999999999996], [0.7222222222222222, 0.19999999999999996], [0.6666666666666666, 0.4], [0.7777777777777778, 0.4], [0.7222222222222222, 0.6], [0.8333333333333334, 0.6], [0.8333333333333334, 0.8], [0.6666666666666666, 1.0], [0.7777777777777778, 1.0], [0.8888888888888888, 1.0], [1.0, 1.0]], "plan": ["We will extract fixed features using a pretrained ResNet18 and then train a\nLightGBM classifier to distinguish malignant from non-malignant lesions. To\nenforce fairness across skin tones, each sample will be weighted inversely to\nthe frequency of its skin tone in the loss function. We\u2019ll perform stratified\n5-fold cross-validation to estimate performance via AUROC, and then fit a final\nmodel on all data. A `predict(folder)` function will extract features from new\nimages and return malignancy probabilities.", "We will fine-tune a pretrained ResNet18 end-to-end to classify lesions as\nmalignant or benign, using a weighted binary cross\u2010entropy loss where each\nsample\u2019s weight is inversely proportional to its skin tone frequency to promote\nfairness.  We map malignant to 1 and others to 0 and split the data stratified\nby label into 80% train and 20% validation sets.  During training we resize and\nnormalize images, train for a few epochs on GPU if available, and compute the\nvalidation AUROC to assess performance.  After training we save the model and\nimplement a `predict(folder)` function that loads it, preprocesses new images,\nand returns malignancy probabilities for each.", "We will fine-tune a pretrained EfficientNet-B0 by freezing the bulk of its\nlayers and training only a new linear head for binary malignant/benign\nclassification. Each lesion sample is weighted inversely to its skin\u2010tone\nfrequency and these weights are applied in a weighted BCE loss. We perform\nstratified 5\u2010fold cross\u2010validation on the malignant label and report mean AUROC.\nFinally, we retrain on the full dataset and save the model, supplying a\n`predict(folder)` function that loads the model and returns malignancy\nprobabilities.", "We will leverage a pretrained ResNet50 as a fixed feature extractor and train a\nlogistic regression classifier on these embeddings for binary malignant vs non-\nmalignant classification. To address fairness across skin tones, we weight each\nsample inversely proportional to its skin tone frequency. We will perform\nstratified 5\u2010fold cross\u2010validation to evaluate performance using AUROC, then\nretrain on the full dataset. Finally, we implement a predict(folder) function\nthat preprocesses new images, extracts features, and returns malignancy\nprobabilities.", "We fine-tune a pretrained DenseNet121, freezing all layers except the last dense\nblock and classification head, using a weighted binary cross\u2010entropy loss where\neach sample\u2019s weight is inversely proportional to its skin\u2010tone frequency to\npromote fairness. Images are resized to 224\u00d7224, normalized with ImageNet\nstatistics, and we perform stratified 5\u2010fold cross\u2010validation on the malignant\nlabel, reporting mean AUROC. After cross\u2010validation, we retrain the model on the\nfull dataset and save it. A `predict(folder: str) -> Dict[str, float]` function\nis provided to load the saved model and return malignancy probabilities for new\nimages.", "We will balance skin\u2010tone representation in training by using a\nWeightedRandomSampler with sample weights inversely proportional to skin\u2010tone\nfrequency, ensuring each batch contains more examples from underrepresented skin\ntones. This oversampling strategy replaces uniform random sampling in the train\nDataLoader, which should improve fairness without altering the model\narchitecture or loss function. We keep the same DenseNet121 backbone with\npartial freezing and weighted BCE loss, perform 5\u2010fold CV to report mean AUROC,\nthen retrain on the full dataset using the sampler and save the final model. A\npredict(folder) function loads the saved model and returns malignancy\nprobabilities for new images.", "I propose enhancing the training data augmentations by adding random rotations,\nhorizontal and vertical flips, and color jitter to improve the model\u2019s\nrobustness and generalization, which should boost AUROC and help mitigate\nfairness gaps across skin tones. This change is atomic and directly targets the\nmodel\u2019s ability to learn invariant features under diverse image transformations.\nWe keep the rest of the fine\u2010tuning pipeline intact to isolate the effect of the\nstronger augmentation.", "I propose improving model generalization and fairness by enhancing data\naugmentation during training. Specifically, I will add random\nhorizontal/vertical flips, rotations, and color jitter to the training\ntransforms while keeping validation transforms unchanged. This should help the\nmodel learn more invariant features across skin tones without other changes to\nthe training pipeline.", "I propose augmenting the training data with RandomResizedCrop, random flips,\nrotations, and color jitter to improve generalization and robustness across skin\ntones. This atomic change enhances model invariance without altering\narchitecture or loss, and should boost AUROC and fairness. We keep the weighted\nBCE loss and 5\u2010fold CV setup unchanged, only modifying the training transforms.", "I propose adding stronger data augmentations during training\u2014specifically, use\nRandomResizedCrop to 224\u00d7224, random horizontal and vertical flips, small\nrotations, and color jitter\u2014to help the model learn more invariant and robust\nfeatures across skin tones. This augmentation scheme should boost generalization\nand fairness without altering the model architecture or loss. The validation\npipeline remains unchanged, and we keep the weighted BCE loss with\ninverse\u2010frequency skin\u2010tone weights. We then perform 5\u2010fold CV to quantify the\nimprovement in AUROC.", "I propose integrating a One Cycle learning rate scheduler and increasing\ntraining epochs to 5, which will dynamically adjust the learning rate between a\nlow initial value and a peak of 1e-3 to improve convergence and generalization.\nWe will keep the weighted BCE loss for skin\u2010tone fairness and the partial\nfreezing of DenseNet121 unchanged. The scheduler will be stepped after each\nbatch during training. We will evaluate the impact via 5\u2010fold cross\u2010validation\non AUROC.", "I propose integrating Mixup data augmentation during training by randomly mixing\npairs of images, labels, and corresponding sample weights with a Beta(\u03b1=0.2)\ndistribution. This atomic change doesn\u2019t alter the model architecture or loss\nfunction but should improve generalization and fairness by encouraging the model\nto handle convex combinations of different skin tones. We\u2019ll implement Mixup\nwithin the training loop, keeping the weighted BCE loss and OneCycleLR scheduler\nunchanged. We then evaluate the impact via stratified 5\u2010fold cross\u2010validation on\nAUROC.", "I propose adding simple test\u2010time augmentation (TTA) by averaging predictions on\neach image and its horizontally flipped version. This change is atomic and\naffects only the inference stage, improving robustness without altering\ntraining. We apply TTA during validation to compute CV AUROC and in the\npredict() function for final predictions. All other aspects\u2014including weighted\nBCE loss, OneCycleLR scheduler, and partial freezing of DenseNet121\u2014remain\nunchanged.", "I propose enhancing the training data augmentations by replacing the simple\nResize+CenterCrop pipeline with stronger transforms: RandomResizedCrop, random\nhorizontal and vertical flips, small rotations, color jitter, and RandomErasing.\nThis will improve the model\u2019s robustness and generalization across diverse skin\ntones without changing the architecture, loss, or training regimen. We keep the\nweighted BCE loss, OneCycleLR scheduler, partial freezing of DenseNet121, and\nTTA inference unchanged to isolate the effect of improved augmentations.", "I suggest enhancing test-time augmentation (TTA) by using ten-crop inference:\nfor each image, generate the 5 crops plus their horizontal flips (10 total),\nnormalize each, run through the model, then average the probabilities. This\natomic change to only the inference stage should improve robustness and boost\nAUROC without retraining. The training loop remains the same, and we\u2019ll print\nthe updated CV AUROC.", "We integrate Mixup data augmentation into the training loop by randomly mixing\npairs of images, labels, and corresponding sample weights with a Beta(\u03b1=0.2)\ndistribution. This encourages the model to learn more robust and fair\nrepresentations by handling convex combinations of samples. We keep the weighted\nBCE loss, OneCycleLR scheduler, partial freezing of DenseNet121, and TenCrop TTA\ninference unchanged. We then perform 5-fold cross-validation with Mixup and\nprint the updated mean CV AUROC.", "I propose enhancing the training data augmentation pipeline by replacing the\nsimple Resize+CenterCrop with stronger, more diverse transforms:\nRandomResizedCrop, random horizontal and vertical flips, small rotations, color\njitter, and RandomErasing applied before normalization. This atomic change will\nimprove the model\u2019s robustness and generalization across different skin tones\nwithout altering the core training loop, loss, or inference TTA. We keep the\nexisting Mixup, OneCycleLR scheduler, weighted BCE loss, partial freezing of\nDenseNet121, and TenCrop TTA unchanged. We then rerun 5\u2010fold cross\u2010validation to\nmeasure the impact on mean AUROC.", "We will enhance training data augmentations by replacing the simple\nResize+CenterCrop pipeline with stronger transforms: RandomResizedCrop, random\nflips, small rotations, color jitter, and RandomErasing. This richer\naugmentation helps the model learn invariant features across diverse skin tones,\nimproving robustness without changing the model or loss. We keep Mixup,\nOneCycleLR, weighted BCE loss, partial freezing of DenseNet121, and TenCrop TTA\ninference unchanged. We then rerun 5-fold cross-validation and report the mean\nAUROC.", "We will fully fine\u2010tune the DenseNet121 backbone by removing the partial\nfreezing policy, allowing all convolutional layers to adapt to the skin lesion\ndomain. This should help the network learn more specialized features and improve\nAUROC. We keep Mixup, OneCycleLR, weighted BCE loss, and TenCrop TTA inference\nunchanged for an atomic comparison.", "We can improve fairness by replacing uniform random sampling in the training\nDataLoader with a WeightedRandomSampler that oversamples underrepresented skin\ntones according to their inverse\u2010frequency weights. This ensures each batch\ncontains a balanced representation of skin tones and may also boost overall\nAUROC. The rest of the pipeline\u2014including mixup, OneCycleLR, partial freezing,\nand TTA\u2014in remains unchanged so we can isolate the effect. We apply this sampler\nin both cross\u2010validation and final full\u2010data training."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nimport torch\nfrom torch import nn\nfrom torchvision import transforms, models\nfrom torch.utils.data import Dataset, DataLoader\nfrom PIL import Image\nimport lightgbm as lgb\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport joblib\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(path).convert(\"RGB\")\n        return self.transform(img)\n\n\nclass Identity(nn.Module):\n    def forward(self, x):\n        return x\n\n\ndef extract_features(df, img_dir=\"input/MyImages\"):\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    ds = SkinDataset(df, img_dir, transform)\n    loader = DataLoader(ds, batch_size=32, num_workers=4, pin_memory=True)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    backbone = models.resnet18(pretrained=True)\n    backbone.fc = Identity()\n    backbone = backbone.to(device).eval()\n    feats = []\n    with torch.no_grad():\n        for imgs in loader:\n            imgs = imgs.to(device)\n            f = backbone(imgs).cpu().numpy()\n            feats.append(f)\n    return np.vstack(feats)\n\n\ndef predict(folder):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in `folder`.\n    Returns a dict {image_name: probability}.\n    \"\"\"\n    names = [f[:-4] for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n    df = pd.DataFrame({\"image_name\": names})\n    feats = extract_features(df, img_dir=folder)\n    model = joblib.load(\"working/model.pkl\")\n    probs = model.predict_proba(feats)[:, 1]\n    return dict(zip(names, probs))\n\n\nif __name__ == \"__main__\":\n    # Load and prepare data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"binary_label\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Compute sample weights inversely to skin_tone frequency\n    counts = df[\"skin_tone\"].value_counts().to_dict()\n    tone_w = {t: 1.0 / v for t, v in counts.items()}\n    sample_w = df[\"skin_tone\"].map(tone_w).values\n    # Extract features\n    features = extract_features(df)\n    y = df[\"binary_label\"].values\n    # 5-fold CV evaluation\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    aurocs = []\n    for tr, va in skf.split(features, y):\n        clf = lgb.LGBMClassifier(n_estimators=100, random_state=42)\n        clf.fit(features[tr], y[tr], sample_weight=sample_w[tr])\n        preds = clf.predict_proba(features[va])[:, 1]\n        aurocs.append(roc_auc_score(y[va], preds))\n    print(f\"Mean AUROC: {np.mean(aurocs):.4f}\")\n    # Train final model on full data and save\n    final_clf = lgb.LGBMClassifier(n_estimators=100, random_state=42)\n    final_clf.fit(features, y, sample_weight=sample_w)\n    os.makedirs(\"working\", exist_ok=True)\n    joblib.dump(final_clf, \"working/model.pkl\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        image = self.transform(image)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        weight = torch.tensor(row.sample_weight, dtype=torch.float32)\n        return image, label, weight\n\n\ndef train_and_evaluate():\n    # Load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # Binary label: malignant=1, others=0\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Compute skin tone weights\n    counts = df[\"skin_tone\"].value_counts().to_dict()\n    inv_counts = {tone: 1.0 / count for tone, count in counts.items()}\n    df[\"sample_weight\"] = df[\"skin_tone\"].map(inv_counts)\n    # Train/Val split stratified by malignant label\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n    )\n    # Transforms\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Datasets & loaders\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    criterion = nn.BCEWithLogitsLoss(reduction=\"none\")\n    # Training\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        for imgs, labels, weights in train_loader:\n            imgs, labels, weights = (\n                imgs.to(device),\n                labels.to(device),\n                weights.to(device),\n            )\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            losses = criterion(logits, labels)\n            loss = (losses * weights).mean()\n            loss.backward()\n            optimizer.step()\n    # Validation\n    model.eval()\n    all_logits = []\n    all_labels = []\n    with torch.no_grad():\n        for imgs, labels, _ in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1).cpu().numpy()\n            all_logits.extend(logits.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    preds = 1 / (1 + np.exp(-np.array(all_logits)))\n    auc = roc_auc_score(all_labels, preds)\n    print(f\"Validation AUROC: {auc:.4f}\")\n    # Save model\n    torch.save(model.state_dict(), \"./working/model.pth\")\n    return model\n\n\n# Prediction function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probabilities for all images in a folder.\n    Returns a dict {image_filename: probability}.\n    \"\"\"\n    # Load model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(\"./working/model.pth\", map_location=device))\n    model = model.to(device).eval()\n    # Prepare transform\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Load images\n    files = [\n        f\n        for f in os.listdir(folder_path)\n        if f.lower().endswith((\".jpg\", \".png\", \".jpeg\"))\n    ]\n    results = {}\n    with torch.no_grad():\n        for fname in files:\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(device)\n            logit = model(inp).item()\n            prob = 1.0 / (1.0 + np.exp(-logit))\n            results[fname] = prob\n    return results\n\n\nif __name__ == \"__main__\":\n    train_and_evaluate()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import StratifiedKFold\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset for loading images, labels, and sample weights\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transforms, weight_map):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transforms = transforms\n        self.weight_map = weight_map\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transforms(img)\n        label = torch.tensor(row.label, dtype=torch.float32)\n        weight = torch.tensor(self.weight_map[row.skin_tone], dtype=torch.float32)\n        return img, label, weight\n\n\ndef train_one_epoch(model, loader, optimizer, device):\n    model.train()\n    total_loss = 0.0\n    for imgs, labels, weights in loader:\n        imgs = imgs.to(device)\n        labels = labels.to(device).unsqueeze(1)\n        weights = weights.to(device).unsqueeze(1)\n        logits = model(imgs)\n        loss = nn.BCEWithLogitsLoss(reduction=\"none\")(logits, labels)\n        loss = (loss * weights).mean()\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        total_loss += loss.item() * imgs.size(0)\n    return total_loss / len(loader.dataset)\n\n\ndef evaluate(model, loader, device):\n    model.eval()\n    ys, ps = [], []\n    with torch.no_grad():\n        for imgs, labels, _ in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            ps.extend(probs.tolist())\n            ys.extend(labels.numpy().flatten().tolist())\n    return roc_auc_score(ys, ps)\n\n\ndef main():\n    # Configuration\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label\"] = df.label.map(lambda x: 1 if x == \"malignant\" else 0)\n    # compute inverse-frequency weights for skin_tone\n    tone_counts = df.skin_tone.value_counts().to_dict()\n    total = len(df)\n    weight_map = {tone: total / count for tone, count in tone_counts.items()}\n    # transforms\n    transforms = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    aucs = []\n\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.label)):\n        train_df = df.iloc[train_idx]\n        val_df = df.iloc[val_idx]\n        train_ds = SkinLesionDataset(\n            train_df, \"./input/MyImages\", transforms, weight_map\n        )\n        val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transforms, weight_map)\n        train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n        val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n        # model setup\n        model = timm.create_model(\"efficientnet_b0\", pretrained=True)\n        # freeze all layers\n        for p in model.parameters():\n            p.requires_grad = False\n        # replace classifier\n        in_f = model.classifier.in_features\n        model.classifier = nn.Linear(in_f, 1)\n        model = model.to(device)\n        optimizer = torch.optim.Adam(\n            filter(lambda p: p.requires_grad, model.para ract_features(df, img_dir, batch_size=32):\n    ds = SkinDataset(df, img_dir, transform)\n    loader = DataLoader(ds, batch_size=batch_size, shuffle=False, num_workers=4)\n    feats, labels, weights, names = [], [], [], []\n    with torch.no_grad():\n        for imgs, labs, wts, nms in loader:\n            imgs = imgs.to(device)\n            out = feature_extractor(imgs).cpu().numpy()\n            feats.append(out)\n            labels.append(labs.numpy())\n            weights.append(wts.numpy())\n            names.extend(nms)\n    return (np.vstack(feats), np.concatenate(labels), np.concatenate(weights), names)\n\n\n# Load data\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\ncounts = df[\"skin_tone\"].value_counts().to_dict()\ndf[\"weight\"] = df[\"skin_tone\"].map(lambda x: 1.0 / counts.get(x, 1))\n\n# Extract features\nX, y, w, names = extract_features(df, \"./input/MyImages\")\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nscores = []\nfor train_idx, val_idx in skf.split(X, y):\n    clf = LogisticRegression(max_iter=1000)\n    clf.fit(X[train_idx], y[train_idx], sample_weight=w[train_idx])\n    preds = clf.predict_proba(X[val_idx])[:, 1]\n    scores.append(roc_auc_score(y[val_idx], preds))\nprint(\"Mean CV AUROC:\", np.mean(scores))\n\n# Retrain on full data and save\nfinal_clf = LogisticRegression(max_iter=1000)\nfinal_clf.fit(X, y, sample_weight=w)\njoblib.dump(final_clf, os.path.join(\"model.joblib\"))\n\n\ndef predict(folder):\n    \"\"\"\n    Predict malignancy probabilities for all .jpg images in `folder`.\n    Returns a dict {image_filename: probability}.\n    \"\"\"\n    files = [f for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n    df2 = pd.DataFrame({\"image_name\": [os.path.splitext(f)[0] for f in files]})\n    X2, _, _, _ = extract_features(df2, folder)\n    clf = joblib.load(\"model.joblib\")\n    probs = clf.predict_proba(X2)[:, 1]\n    r let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
