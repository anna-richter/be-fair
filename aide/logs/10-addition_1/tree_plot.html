let treeStructData = {"edges": [[1, 7], [1, 6], [4, 5], [7, 9], [7, 8], [7, 10], [10, 11], [11, 14], [11, 12], [11, 18], [11, 15], [11, 13], [11, 17], [11, 19], [11, 16]], "layout": [[0.14285714285714285, 0.0], [0.2857142857142857, 0.0], [0.42857142857142855, 0.0], [0.5714285714285714, 0.0], [0.7142857142857143, 0.0], [0.7142857142857143, 0.25], [0.21428571428571427, 0.25], [0.35714285714285715, 0.25], [0.21428571428571427, 0.5], [0.35714285714285715, 0.5], [0.5, 0.5], [0.5, 0.75], [0.0, 1.0], [0.14285714285714285, 1.0], [0.2857142857142857, 1.0], [0.42857142857142855, 1.0], [0.5714285714285714, 1.0], [0.7142857142857143, 1.0], [0.8571428571428571, 1.0], [1.0, 1.0]], "plan": ["We extract 512-d features from each image with a frozen pretrained ResNet-18,\nthen train a class-balanced logistic regression on those features to predict\nmalignant vs non-malignant. We split the data stratified by malignancy into\ntrain and validation sets, extract features via DataLoader, and fit the\nclassifier. We evaluate performance with AUROC on the validation set and save\nboth the encoder and classifier. A predict(folder_path) function loads these\nmodels, extracts features for new images, and returns malignancy probabilities.", "We fine-tune a pretrained EfficientNet-B0 by replacing its classifier with a\nbinary output layer and train it to predict malignancy using binary cross-\nentropy loss. We split the dataset into stratified 80/20 train/validation sets,\napply data augmentations (random resized crops, flips, rotations, color jitter)\nduring training and standard resizing/cropping for validation, and train for 5\nepochs with the Adam optimizer. After training we evaluate performance via AUROC\non the validation set, save the trained model, and provide a\npredict(folder_path) function that returns malignancy probabilities for new\nimages.", "We compute simple color-based features (channel means, standard deviations, and\nhistograms) for each image plus available metadata (skin_tone,\nalternative_skin_tone) and binarize the target as malignant vs. non-malignant.\nWe train a LightGBM classifier using stratified 5\u2010fold cross\u2010validation to\noptimize AUROC, report the mean CV AUROC, then retrain on the full dataset. A\n`predict(folder_path)` function loads the final model and returns malignancy\nprobabilities for new images. The script prints the average CV AUROC.", "We fine-tune a pretrained DenseNet-121 by replacing its classifier with a binary\noutput, using stratified train/validation split and balanced BCE loss to address\nclass imbalance. During training we apply data augmentation (random resized\ncrops, flips, rotations, color jitter) and standard resizing for validation,\noptimizing with Adam. We monitor AUROC on the validation set and save the best\nmodel. A predict(folder_path) function loads the saved model and returns\nmalignancy probabilities for new images. We report the validation AUROC after\ntraining.", "We freeze an EfficientNet-B0 pretrained on ImageNet to extract 1280-dim\nembeddings for each lesion image and train a LightGBM classifier on these\nembeddings. We perform stratified 5-fold cross-validation to evaluate AUROC and\nprint the mean CV score. Finally we retrain on the full dataset, save the model,\nand provide a `predict(folder_path)` function that loads the saved model and\nreturns malignancy probabilities for new images.", "We update the LightGBM fit calls to use the callbacks API for early stopping\ninstead of the unsupported `early_stopping_rounds` argument. Specifically, we\npass `callbacks=[lgb.early_stopping(50), lgb.log_evaluation(0)]` to silence\nverbose output and enable stopping. The rest of the pipeline (feature\nextraction, cross\u2010validation, final training, and `predict` function) remains\nunchanged, and we print the mean CV AUROC at the end.", "We'll replace the single 80/20 split with 5\u2010fold stratified cross\u2010validation,\ntraining EfficientNet-B0 for each fold and computing per\u2010fold AUROCs. We train\neach fold for 3 epochs to keep runtime reasonable, save each fold model, and\nthen average their predictions at inference for better generalization. The\nscript prints the mean CV AUROC and defines a `predict(folder_path)` function\nthat loads the 5 saved models and returns ensemble malignancy probabilities for\nnew images.", "We will add test-time augmentation (TTA) by using torchvision\u2019s TenCrop to\ngenerate ten 224\u00d7224 crops of each image during validation and inference,\nnormalize each crop, average the model predictions across the ten crops, and\nthereby smooth and potentially improve the AUROC. This atomic change only\nmodifies the validation and prediction pipelines, leaving training unchanged.\nThe updated validation loop reshapes the batched crops, runs them through the\nmodel, applies sigmoid, reshapes back to per\u2010image predictions, and averages\nthem. The `predict` function is also updated to use TenCrop TTA for inference.", "We integrate MixUp data augmentation into the training loop with an alpha of 0.4\nto blend image pairs and their labels, which can improve generalization. We keep\nthe EfficientNet-B0 backbone and existing TTA inference unchanged but modify the\ntraining step to mix inputs and compute a weighted loss. The rest of the\npipeline (data loading, validation, and prediction) remains the same. Finally,\nwe print the validation AUROC and save the trained model.", "We add RandomErasing augmentation to the training pipeline to force the model to\nlearn robustness to occlusions and improve generalization. The rest of the\ntraining, including EfficientNet\u2010B0 backbone, optimizer, TenCrop TTA for\nvalidation, and evaluation via AUROC, remains the same.", "We can further improve performance by upgrading the backbone to a larger\nEfficientNet-B2 model with higher\u2010resolution inputs. We'll adjust training\ntransforms to RandomResizedCrop(260) and validation/inference to\nResize(288)\u2009+\u2009TenCrop(260) for TTA, keep the existing 5-epoch training, Adam\noptimizer, and BCEWithLogitsLoss. This should yield richer feature\nrepresentations and a higher AUROC. Below is the updated script:", "We upgrade the backbone from EfficientNet-B2 to EfficientNet-B3 and increase\ninput resolution to 300\u00d7300 for training and 320\u00d7320+TenCrop(300) for\nvalidation/TTA. This richer representation should boost AUROC. The rest of the\ntraining, TTA, and evaluation pipeline remains unchanged.", "I propose to improve generalization by replacing the Adam optimizer with AdamW\n(adding weight decay) and introducing a Cosine Annealing learning\u2010rate scheduler\nover the 5 training epochs. This regularizes the model and smoothly decays the\nlearning rate, often boosting validation AUROC without other changes. The rest\nof the training and TTA inference pipeline remains unchanged.", "We will integrate the OneCycleLR scheduler with an AdamW optimizer to\ndynamically vary the learning rate between a low start (1e-5) and peak (1e-3)\nover the 5\u2010epoch run, which often yields better convergence and generalization\nthan a fixed learning rate. We'll set a small weight decay (1e\u20104) for\nregularization and step the scheduler after each batch. All other\naspects\u2014including EfficientNet\u2010B3 backbone, data augmentations, TenCrop TTA, and\nevaluation pipeline\u2014remain unchanged.", "We will incorporate a WeightedRandomSampler in the training DataLoader to\naddress class imbalance by oversampling malignant cases. We'll compute sample\nweights as the inverse frequency of each class, then use the sampler to yield\nbalanced batches during training. This simple change aims to improve the model's\nsensitivity to the minority class and overall AUROC. All other aspects of the\npipeline, including data augmentations, model architecture, training epochs, and\nTTA inference, remain the same.", "I will integrate Stochastic Weight Averaging (SWA) by maintaining an averaged\nmodel over the training epochs using torch.optim.swa_utils.AveragedModel, then\nupdating batch\u2010norm statistics before validation. This introduces minimal\nchanges to the training loop yet often yields notable generalization gains.\nAfter training, I\u2019ll swap to the SWA model for evaluation and saving, keeping\nTTA inference unchanged.", "I propose to replace the standard BCEWithLogitsLoss with a Focal Loss to focus\nlearning on hard and minority malignant examples, which can improve\ndiscrimination under class imbalance. We keep the EfficientNet-B3 backbone, data\naugmentations, optimizer, and test\u2010time augmentation unchanged, only swapping in\nFocalLoss with alpha=0.25 and gamma=2. This atomic change should boost the\nmodel\u2019s ability to detect malignant lesions and improve validation AUROC.", "I propose to integrate CutMix data augmentation into the training loop with\nprobability 0.5 and \u03b1=1.0, mixing random patches between image pairs and their\nlabels. This encourages the model to focus on local features and improves\ngeneralization. All other aspects of the pipeline\u2014including the EfficientNet-B3\nbackbone, optimizer, and TTA inference\u2014remain unchanged.", "I will add RandAugment to the training pipeline to introduce a wider variety of\nstrong, random augmentations that improve robustness. Everything\nelse\u2014EfficientNet-B3 backbone, optimizer, training schedule, and TenCrop\nTTA\u2014remains unchanged. This atomic change should give a small boost in\nvalidation AUROC without significant overhead.", "I propose to integrate Stochastic Weight Averaging (SWA) into the training loop\nby maintaining an averaged model from epoch 3 onward, then updating its\nbatch\u2010norm statistics after training. We will replace the final evaluation to\nuse the SWA\u2010averaged model weights, which often boosts generalization and AUROC.\nThe existing data augmentations, EfficientNet\u2010B3 backbone, TTA inference, and\nprediction function remain unchanged. Below is the updated script implementing\nSWA and printing the validation AUROC."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score\nimport joblib\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n\n# Dataset for image feature extraction\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = row.target\n        return img, label\n\n\n# Read metadata and prepare targets\ndf = pd.read_csv(\"./input/mydataset.csv\")\ndf[\"target\"] = df.label.apply(lambda x: 1 if x == \"malignant\" else 0)\ntrain_df, val_df = train_test_split(\n    df, test_size=0.2, stratify=df[\"target\"], random_state=42\n)\n\n# Transforms and DataLoaders\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\ntrain_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform)\nval_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform)\ntrain_loader = DataLoader(train_ds, batch_size=32, shuffle=False, num_workers=4)\nval_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n# Prepare feature extractor\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nresnet = models.resnet18(pretrained=True)\nmodules = list(resnet.children())[:-1]  # drop final fc\nencoder = torch.nn.Sequential(*modules).to(device)\nencoder.eval()\n\n\ndef extract_features(loader):\n    feats = []\n    labels = []\n    with torch.no_grad():\n        for imgs, lbls in loader:\n            imgs = imgs.to(device)\n            out = encoder(imgs)  # [B,512,1,1]\n            out = out.view(out.size(0), -1).cpu().numpy()\n            feats.append(out)\n            labels.extend(lbls.numpy())\n    return np.vstack(feats), np.array(labels)\n\n\n# Extract features\nX_train, y_train = extract_features(train_loader)\nX_val, y_val = extract_features(val_loader)\n\n# Train logistic regression\nclf = LogisticRegression(max_iter=1000, class_weight=\"balanced\")\nclf.fit(X_train, y_train)\n\n# Validate\nprobs = clf.predict_proba(X_val)[:, 1]\nauc = roc_auc_score(y_val, probs)\nprint(\"Validation AUROC:\", auc)\n\n# Save models\nos.makedirs(\"./working\", exist_ok=True)\njoblib.dump(clf, \"./working/logistic_model.pkl\")\ntorch.save(encoder.state_dict(), \"./working/encoder.pth\")\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probability for all .jpg images in image_folder.\n    Returns a DataFrame with columns: image_name, malignancy_prob.\n    \"\"\"\n    # load models\n    clf = joblib.load(\"./working/logistic_model.pkl\")\n    encoder = models.resnet18(pretrained=False)\n    modules = list(encoder.children())[:-1]\n    encoder = torch.nn.Sequential(*modules).to(device)\n    encoder.load_state_dict(torch.load(\"./working/encoder.pth\"))\n    encoder.eval()\n    # prepare transforms\n    tfm = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    # collect images\n    imgs = []\n    names = []\n    for fname in os.listdir(image_folder):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n            imgs.append(tfm(img))\n            names.append(os.path.splitext(fname)[0])\n    if not imgs:\n        return pd.DataFrame(columns=[\"image_name\", \"malignancy_prob\"])\n    batch = torch.stack(imgs).to(device)\n    with torch.no_grad():\n        feats = encoder(batch).view(len(imgs), -1).cpu().numpy()\n    probs = clf.predict_proba(feats)[:, 1]\n    return pd.DataFrame({\"image_name\": names, \"malignancy_prob\": probs})\n\n\n# Example usage (uncomment to run on new data):\n# preds = predict(\"./input/MyImages\")\n# preds.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\nfrom PIL import Image\nfrom tqdm import tqdm\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = 1 if row[\"label\"] == \"malignant\" else 0\n        return image, label\n\n\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for all images in a folder.\n    Args:\n        folder_path (str): Path to folder containing images (jpg/png).\n    Returns:\n        dict: mapping image filename to malignancy probability (0-1).\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.efficientnet_b0(pretrained=False)\n    model.classifier[1] = nn.Linear(model.classifier[1].in_features, 1)\n    model.load_state_dict(\n        torch.load(\"./working/efficientnet_model.pth\", map_location=device)\n    )\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    for fname in os.listdir(folder_path):\n        if not fname.lower().endswith((\".jpg\", \".png\")):\n            continue\n        img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n        img = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            prob = torch.sigmoid(model(img)).item()\n        results[fname] = prob\n    return results\n\n\ndef main():\n    # Load and split data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    df[\"label\"] = df[\"label\"].astype(str)\n    df[\"binary\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n    train_df, val_df = train_test_split(\n        df, stratify=df[\"binary\"], test_size=0.2, random_state=42\n    )\n\n    # Transforms\n    train_transform = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ColorJitter(brightness=0.2, contrast=0.2, saturation=0.2),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, \"./input/MyImages\", train_transform)\n    val_ds = SkinDataset(val_df, \"./input/MyImages\", val_transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.efficientnet_b0(pretrained=True)\n    model.classifier[1] = nn.Linear(model.classifier[1].in_features, 1)\n    model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    for epoch in range(5):\n        model.train()\n        for images, labels in tqdm(train_loader, desc=f\"Epoch {epoch+1}/5\"):\n            images, labels = images.to(device), labels.float().unsqueeze(1).to(device)\n            optimizer.zero_grad()\n            outputs = model(images)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n\n    # Validation\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for images, labels in val_loader:\n            images = images.to(device)\n            outputs = model(images)\n            probs = torch.sigmoid(outputs).cpu().numpy().flatten()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Save model\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model.state_dict(), \"./working/efficientnet_model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom lightgbm import LGBMClassifier\nimport pickle\n\n\n# Feature extraction: color statistics + histograms + metadata\ndef extract_features(image_path):\n    img = Image.open(image_path).convert(\"RGB\")\n    arr = np.array(img)\n    feats = []\n    # channel means and stds\n    means = arr.mean(axis=(0, 1))\n    stds = arr.std(axis=(0, 1))\n    feats.extend(means.tolist())\n    feats.extend(stds.tolist())\n    # histograms: 16 bins per channel\n    for c in range(3):\n        hist, _ = np.histogram(arr[:, :, c], bins=16, range=(0, 255), density=True)\n        feats.extend(hist.tolist())\n    return feats\n\n\n# Main script\ndf = pd.read_csv(\"input/mydataset.csv\")\n# Binarize target: malignant=1 else 0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n\n# Extract features for all images\nfeature_list = []\nfor idx, row in df.iterrows():\n    img_path = os.path.join(\"input\", \"MyImages\", f\"{row['image_name']}.jpg\")\n    feats = extract_features(img_path)\n    # add metadata\n    feats.append(row[\"skin_tone\"])\n    feats.append(row[\"alternative_skin_tone\"])\n    feature_list.append(feats)\nX = np.array(feature_list)\ny = df[\"target\"].values\n\n# 5\u2010fold stratified CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\nfor train_idx, val_idx in skf.split(X, y):\n    X_train, X_val = X[train_idx], X[val_idx]\n    y_train, y_val = y[train_idx], y[val_idx]\n    clf = LGBMClassifier(n_estimators=100, learning_rate=0.1, random_state=42)\n    clf.fit(X_train, y_train)\n    preds = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, preds)\n    aucs.append(auc)\nprint(f\"Mean CV AUROC: {np.mean(aucs):.4f}\")\n\n# Retrain on full data\nfinal_clf = LGBMClassifier(n_estimators=100, learning_rate=0.1, random_state=42)\nfinal_clf.fit(X, y)\n# Save model\nwith open(\"working/lightgbm_skin_lesion.pkl\", \"wb\") as f:\n    pickle.dump(final_clf, f)\n\n\ndef predict(folder_path):\n    \"\"\"\n    Given a folder of images, returns a dict mapping image filename to\n    malignancy probability [0-1].\n    \"\"\"\n    # load model\n    with open(\"working/lightgbm_skin_lesion.pkl\", \"rb\") as f:\n        model = pickle.load(f)\n    results = {}\n    for fname in os.listdir(folder_path):\n        if fname.lower().endswith((\".jpg\", \".png\", \".jpeg\")):\n            path = os.path.join(folder_path, fname)\n            feats = extract_features(path)\n            # assume metadata unknown => set to -1\n            feats.append(-1)  # skin_tone unknown\n            feats.append(-1)  # alternative_skin_tone unknown\n            prob = model.predict_proba([feats])[0, 1]\n            results[fname] = prob\n    return results\n\n\n# Example usage of predict (uncomment to run on new folder)\n# preds = predict('input/MyImages')\n# print(preds)", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, images_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.images_dir = images_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.loc[idx]\n        img_path = os.path.join(self.images_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\n# Predict function\ndef predict(folder_path, model_path=\"working/densenet121_best.pt\", batch_size=32):\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.densenet121(pretrained=False)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    imgs = sorted([f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")])\n    probs = []\n    with torch.no_grad():\n        for i in range(0, len(imgs), batch_size):\n            batch = imgs[i : i + batch_size]\n            x = torch.stack(\n                [\n                    tf(Image.open(os.path.join(folder_path, f)).convert(\"RGB\"))\n                    for f in batch\n                ]\n            ).to(device)\n            logits = model(x).squeeze(1)\n            probs.extend(torch.sigmoid(logits).cpu().numpy())\n    return pd.DataFrame({\"image_name\": imgs, \"malignancy_prob\": probs})\n\n\n# Main\ndef main():\n    # Load data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # Binary label\n    df[\"label_bin\"] = (df.label == \"malignant\").astype(int)\n    # Split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n    )\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.RandomRotation(15),\n            T.ColorJitter(0.1, 0.1, 0.1, 0.1),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, \"input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"input/MyImages\", transform=val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.densenet121(pretrained=True)\n    model.classifier = nn.Linear(model.classifier.in_features, 1)\n    model = model.to(device)\n\n    # Loss with pos_weight\n    pos = train_df[\"label_bin\"].sum()\n    neg = len(train_df) - pos\n    pos_weight = torch.tensor([neg / pos], device=device)\n    criterion = nn.BCEWithLogitsLoss(pos_weight=pos_weight)\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n    best_auc = 0.0\n    os.makedirs(\"working\", exist_ok=True)\n    # Train\n    for epoch in range(1, 6):\n        model.train()\n        for imgs, lbls in train_loader:\n            imgs, lbls = imgs.to(device), lbls.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = criterion(logits, lbls)\n            loss.backward()\n            optimizer.step()\n        # Validate\n        model.eval()\n        all_logits, all_lbls = [], []\n        with torch.no_grad():\n            for imgs, lbls in val_loader:\n                imgs = imgs.to(device)\n                logits = model(imgs).squeeze(1).cpu().numpy()\n                all_logits.extend(logits)\n                all_lbls.extend(lbls.numpy())\n        probs = 1 / (1 + np.exp(-np.array(all_logits)))\n        auc = roc_auc_score(all_lbls, probs)\n        print(f\"Epoch {epoch}: val AUROC = {auc:.4f}\")\n        if auc > best_auc:\n            best_auc = auc\n            torch.save(model.state_dict(), \"working/densenet121_best.pt\")\n\n    print(f\"Best validation AUROC: {best_auc:.4f}\")\n\n    # Example usage of predict()\n    # preds = predict('input/MyImages')  # uncomment to run prediction on input images\n    # preds.to_csv('wo let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
