let treeStructData = {"edges": [[4, 5], [5, 6], [6, 17], [6, 8], [6, 9], [6, 7], [6, 13], [6, 12], [6, 14], [6, 11], [6, 16], [6, 15], [6, 10], [17, 18], [18, 19]], "layout": [[0.1, 0.0], [0.2, 0.0], [0.3, 0.0], [0.4, 0.0], [0.5, 0.0], [0.5, 0.19999999999999996], [0.5, 0.4], [0.0, 0.6], [0.1, 0.6], [0.2, 0.6], [0.3, 0.6], [0.4, 0.6], [0.5, 0.6], [0.6, 0.6], [0.7, 0.6], [0.8, 0.6], [0.9, 0.6], [1.0, 0.6], [1.0, 0.8], [1.0, 1.0]], "plan": ["I propose fine-tuning ImageNet\u2010pretrained ResNet\u201018 as a feature extractor and\ntraining a lightweight logistic regression classifier on its pooled output with\nsample weights inversely proportional to each skin tone\u2019s frequency to mitigate\nbias. We perform stratified 5\u2010fold cross\u2010validation on malignant vs.\nnon\u2010malignant labels, reporting overall AUROC. After CV, we retrain on the full\ndataset, save the logistic model, and expose a predict(folder) function that\nloads the saved models to compute malignancy probabilities on new images.", "We fine-tune an ImageNet-pretrained EfficientNet\u2010b0 to classify lesions as\nmalignant vs non\u2010malignant using a weighted binary cross\u2010entropy loss with\nsample weights inversely proportional to skin tone frequency to promote\nfairness. We perform an 80/20 stratified train/validation split preserving both\nmalignancy labels and skin tone distributions. After training for a few epochs,\nwe evaluate model performance with AUROC on the hold\u2010out set and save the\ntrained model. A predict(folder) function loads the saved model and returns\nmalignancy probabilities for new images.", "We fine\u2010tune an ImageNet\u2010pretrained ResNet-50 by freezing the backbone and\ntraining only its final layer for binary malignancy classification, using\nweighted sampling inversely proportional to skin tone frequencies to promote\nfairness. We split data 80/20 with stratification on combined malignancy label\nand skin tone, train for 5 epochs with weighted binary cross\u2010entropy loss, and\nevaluate on the hold\u2010out set using AUROC. The trained model is saved and a\n`predict(folder)` function is provided to load the model and return malignancy\nprobabilities for new images.", "We will extract 512\u2010dim features for each lesion image using a frozen\nImageNet\u2010pretrained ResNet-18, then train a weighted logistic regression\nclassifier on these features with sample weights inversely proportional to skin\ntone frequency. We split the dataset into an 80/20 stratified train/validation\nset by combining malignancy label and skin tone to preserve distribution. After\nfitting, we evaluate the model\u2019s discriminative power via AUROC on the hold-out\nset. Finally, we save the trained classifier and implement a predict(folder)\nfunction that extracts features for new images and outputs malignancy\nprobabilities.", "We fine-tune an ImageNet\u2010pretrained DenseNet121 end\u2010to\u2010end to classify lesions\nas malignant vs non\u2010malignant, using weighted binary cross\u2010entropy loss with\nsample weights inversely proportional to skin tone frequency to promote\nfairness. Images are resized to 224\u00d7224 with augmentation for training and\nnormalized to ImageNet statistics. We perform stratified 5\u2010fold cross\u2010validation\non the binary targets and report mean AUROC across folds. Finally, we retrain\nthe model on the full dataset, save the weights, and provide a predict(folder)\nfunction to compute malignancy probabilities for new images.", "I propose integrating mixup data augmentation into the training loop, mixing\nboth inputs and targets (and their corresponding sample weights) to improve\ngeneralization and fairness. We will implement a `mixup_data` function with\nalpha=0.4, apply it during each training batch in both cross\u2010validation and\nfull\u2010data retraining, and then evaluate the impact on CV AUROC. This atomic\nchange should yield a measurable performance boost without altering other\naspects of the pipeline.", "I propose to add simple test-time augmentation (horizontal flip) during\nvalidation and inference: for each image we predict on both the original and its\nhorizontal flip, then average the sigmoid probabilities. This requires no extra\ntraining, slightly increases inference time, and often boosts AUROC by reducing\nprediction variance. We\u2019ll integrate this into the cross\u2010validation loop to\nmeasure uplift and into the `predict` function. The rest of the training\npipeline remains unchanged.", "We will improve the existing test\u2010time augmentation by expanding it from two\nviews (original + horizontal flip) to four views (original, horizontal flip,\nvertical flip, and both flips). During validation and in the `predict` function,\nwe will average the sigmoid outputs of these four crops to reduce prediction\nvariance and boost AUROC. This is an atomic change that requires no extra\ntraining modifications. The script below implements 5\u2010fold CV with the new\n4\u2010view TTA and prints the mean AUROC.", "I propose adding random color jitter augmentation to the training pipeline to\nimprove the model\u2019s robustness to variations in lighting and color, which can\nboost generalization and AUROC. Specifically, we will insert a `T.ColorJitter`\ntransformation in the training `Compose` before converting to tensor, keeping\nall other components (mixup, weighted loss, TTA) unchanged. This atomic change\ntargets augmentation diversity without altering the architecture or training\nloop. We then rerun 5\u2010fold CV to measure the uplift in mean AUROC and retrain on\nthe full dataset before saving the model.", "We replace the weighted BCE loss with a weighted Focal Loss (gamma=2) to focus\nthe model on harder and potentially under\u2010represented examples without changing\nthe rest of the pipeline. We define a `focal_loss` that applies sample weights\nand the modulating factor `(1-p_t)^\u03b3` to each example\u2019s BCE loss, then use it in\nboth cross\u2010validation and full\u2010data retraining loops. Everything else\u2014mixup,\naugmentations, TTA in validation, inverse\u2010frequency skin\u2010tone weighting, and the\npredict function\u2014remains unchanged so we isolate the impact of focal loss on\nAUROC.", "I propose adding RandomErasing augmentation to the training pipeline, inserting\nit after normalization to randomly occlude patches and improve model robustness\nwithout changing the rest of the training loop. This simple, atomic change\nshould further boost generalization and fairness when combined with our existing\nmixup, weighted loss, and horizontal TTA. We will rerun the 5-fold CV with\nDenseNet121, report the updated mean AUROC, then retrain on the full dataset and\nsave the model. The predict() function remains unchanged, still averaging\noriginal and flipped predictions for inference.", "I propose to enhance test\u2010time augmentation by expanding it to four views:\noriginal, horizontal flip, vertical flip, and both flips. By averaging the\nsigmoid outputs over these four variants during validation and inference, we\nreduce prediction variance and boost AUROC without changing the training\nprocedure. We integrate this 4\u2010view TTA in both the cross\u2010validation loop and\nthe `predict()` function, then report the mean CV AUROC.", "I propose expanding test\u2010time augmentation to four views\u2014original, horizontal\nflip, vertical flip, and both flips\u2014and averaging their predictions during\nvalidation and inference. This requires minimal code changes but can reduce\nprediction variance and boost AUROC without touching the training loop. We\u2019ll\nintegrate this 4\u2010view TTA in the 5\u2010fold CV loop and in the `predict()` function,\nthen print the mean CV AUROC.", "I propose expanding test-time augmentation to four views\u2014original, horizontal\nflip, vertical flip, and both flips\u2014and averaging their sigmoid outputs during\nboth cross-validation and inference. This change is atomic, requires no\nmodifications to training, and should reduce prediction variance to improve\nAUROC. We will update the validation loop and the `predict()` function\naccordingly and print the updated mean CV AUROC.", "We extend test-time augmentation to four views: original, horizontal flip,\nvertical flip, and both flips, averaging their sigmoid outputs. We modify both\nthe cross-validation evaluation loop and the predict() function to use this\n4-view TTA. No other parts of the training pipeline or model architecture are\nchanged. This should reduce prediction variance and boost the AUROC.", "We expand test-time augmentation from two to four variants\u2014original, horizontal\nflip, vertical flip, and both flips\u2014averaging their sigmoid outputs during both\ncross\u2010validation evaluation and inference. This change requires only modifying\nthe evaluation loops and the `predict()` function without touching the training\nprocedure, allowing us to isolate the effect of richer TTA on AUROC. The rest of\nthe pipeline, including mixup, weighted BCE loss, and retraining on the full\ndataset, remains unchanged.", "I propose to expand our test\u2010time augmentation from two to four\nvariants\u2014original, horizontal flip, vertical flip, and both flips\u2014and average\ntheir sigmoid outputs during both cross\u2010validation evaluation and inference.\nThis change requires only modifying the evaluation loops and the `predict()`\nfunction without touching the training procedure, allowing us to isolate the\neffect of richer TTA on AUROC. We\u2019ll implement 4\u2010view TTA in the 5\u2010fold CV loop,\nprint the mean CV AUROC, then retrain on the full dataset and save the model\nwith the updated `predict()`.", "I propose replacing the simple horizontal\u2010flip test\u2010time augmentation with a\n10\u2010crop TTA (using torchvision.transforms.TenCrop), averaging predictions over\nthe ten center and corner crops for each image. We\u2019ll update the validation\ntransforms to output ten normalized tensors per image and modify the evaluation\nloop to reshape the batch, run all crops through the model, and average their\nsigmoid outputs. The same 10\u2010crop logic will be applied in the `predict()`\nfunction to ensure consistency at inference. This richer TTA should reduce\nprediction variance and boost AUROC without altering the training procedure.", "I propose replacing the DenseNet121 backbone with an EfficientNet\u2010B0 pretrained\nmodel to leverage its superior parameter efficiency and representation power. We\nwill keep all other elements (mixup, weighted BCE loss, 10\u2010crop TTA, training\nschedule) unchanged and simply swap in EfficientNet\u2010B0, adjusting its classifier\nto output a single logit. This atomic change should isolate the architecture\neffect and boost our AUROC.", "We integrate a cosine annealing learning rate scheduler to gradually reduce the\nlearning rate from 1e-4 to 1e-6 over each 3\u2010epoch training cycle. This scheduler\nis applied in both the 5\u2010fold CV training loops and the final full\u2010dataset\nretraining, calling `scheduler.step()` at the end of each epoch. By smoothing\nthe LR decay in a cosine fashion, we expect improved convergence and\ngeneralization, boosting the AUROC."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport torchvision.models as models\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport joblib\n\n# 1. Load metadata\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# Binary label: malignant=1, else=0\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Skin\u2010tone weights: inverse frequency\ntone_counts = df[\"skin_tone\"].value_counts().to_dict()\ndf[\"sw\"] = df[\"skin_tone\"].map(lambda x: 1.0 / tone_counts[x])\n\n\n# 2. Dataset & feature extraction\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_folder, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_folder = img_folder\n        self.tf = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, i):\n        row = self.df.iloc[i]\n        img = Image.open(\n            os.path.join(self.img_folder, row[\"image_name\"] + \".jpg\")\n        ).convert(\"RGB\")\n        return self.tf(img), row[\"target\"], row[\"sw\"]\n\n\n# Transforms\ntransform = T.Compose(\n    [\n        T.Resize((224, 224)),\n        T.ToTensor(),\n        T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n# Extract features\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nbackbone = models.resnet18(pretrained=True)\nbackbone.fc = nn.Identity()\nbackbone = backbone.to(device).eval()\n\nfull_ds = SkinDataset(df, \"./input/MyImages\", transform)\nloader = DataLoader(full_ds, batch_size=32, shuffle=False, num_workers=4)\n\nfeatures = []\ntargets = []\nsweights = []\nwith torch.no_grad():\n    for xb, yb, swb in loader:\n        xb = xb.to(device)\n        feats = backbone(xb).cpu().numpy()\n        features.append(feats)\n        targets.append(yb.numpy())\n        sweights.append(swb.numpy())\nfeatures = np.vstack(features)\ny = np.concatenate(targets)\nsample_weights = np.concatenate(sweights)\n\n# 3. 5-fold CV with logistic regression\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\noof_preds = np.zeros_like(y, dtype=float)\nfor train_idx, val_idx in skf.split(features, y):\n    X_tr, X_val = features[train_idx], features[val_idx]\n    y_tr, y_val = y[train_idx], y[val_idx]\n    sw_tr = sample_weights[train_idx]\n    clf = LogisticRegression(max_iter=1000, solver=\"lbfgs\")\n    clf.fit(X_tr, y_tr, sample_weight=sw_tr)\n    oof_preds[val_idx] = clf.predict_proba(X_val)[:, 1]\n\nauroc = roc_auc_score(y, oof_preds)\nprint(f\"5-fold CV AUROC: {auroc:.4f}\")\n\n# 4. Retrain on full data and save model\nfinal_clf = LogisticRegression(max_iter=1000, solver=\"lbfgs\")\nfinal_clf.fit(features, y, sample_weight=sample_weights)\nos.makedirs(\"./working\", exist_ok=True)\njoblib.dump(final_clf, \"./working/logreg.pkl\")\ntorch.save(backbone.state_dict(), \"./working/backbone.pth\")\n\n\n# 5. Prediction function\ndef predict(image_folder):\n    \"\"\"\n    Load saved models and predict malignancy probabilities.\n    Args:\n      image_folder (str): path to folder with .jpg images named <image_name>.jpg\n    Returns:\n      pandas.DataFrame with columns ['image_name','malignancy_prob']\n    \"\"\"\n    # load backbone\n    bb = models.resnet18(pretrained=False)\n    bb.fc = nn.Identity()\n    bb.load_state_dict(torch.load(\"./working/backbone.pth\", map_location=device))\n    bb = bb.to(device).eval()\n    # load classifier\n    clf = joblib.load(\"./working/logreg.pkl\")\n    # gather images\n    imgs = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    data = []\n    for img_name in imgs:\n        img = Image.open(os.path.join(image_folder, img_name)).convert(\"RGB\")\n        xb = transform(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            feat = bb(xb).cpu().numpy()\n        prob = clf.predict_proba(feat)[:, 1][0]\n        data.append((img_name.replace(\".jpg\", \"\"), prob))\n    return pd.DataFrame(data, columns=[\"image_name\", \"malignancy_prob\"])\n\n\n# Example usage (uncomment if needed):\n# preds_df = predict('./input/MyImages')\n# preds_df.to_csv('./working/submission.csv', index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nfrom PIL import Image\nimport timm\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, image_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n        # compute skin-tone weights\n        freq = self.df.skin_tone.value_counts().to_dict()\n        self.weights = self.df.skin_tone.map(lambda x: 1.0 / freq[x]).values.astype(\n            np.float32\n        )\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row.label_enc, dtype=torch.float32)\n        weight = torch.tensor(self.weights[idx], dtype=torch.float32)\n        return img, label, weight, row.image_name\n\n\n# predict function\ndef predict(folder):\n    \"\"\"\n    Predict malignancy probabilities on new images.\n    Args:\n      folder (str): path to folder of .jpg images\n    Returns:\n      pd.DataFrame with columns ['image_name','probability']\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model.to(device).eval()\n    tf = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = []\n    for fname in os.listdir(folder):\n        if not fname.lower().endswith(\".jpg\"):\n            continue\n        img = Image.open(os.path.join(folder, fname)).convert(\"RGB\")\n        x = tf(img).unsqueeze(0).to(device)\n        with torch.no_grad():\n            prob = torch.sigmoid(model(x)).item()\n        results.append({\"image_name\": fname, \"probability\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # config\n    DATA_CSV = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    MODEL_PATH = \"working/model.pth\"\n    BATCH_SIZE = 32\n    EPOCHS = 3\n    DEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load\n    df = pd.read_csv(DATA_CSV)\n    # drop unknown skin tone\n    df = df[df.skin_tone != -1].copy()\n    # encode label: malignant=1, else=0\n    df[\"label_enc\"] = (df.label == \"malignant\").astype(int)\n    # train/val split stratified by label & skin_tone\n    strat = df.label_enc.astype(str) + \"_\" + df.skin_tone.astype(str)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, random_state=42, stratify=strat\n    )\n    # transforms\n    tf_train = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224, scale=(0.8, 1.0)),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    tf_val = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    # datasets & loaders\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, tf_train)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, tf_val)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    # model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    model.to(DEVICE)\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    # training\n    for epoch in range(EPOCHS):\n        model.train()\n        total_loss = 0.0\n        for imgs, labels, weights, _ in train_loader:\n            imgs, labels, weights = (\n                imgs.to(DEVICE),\n                labels.to(DEVICE),\n                weights.to(DEVICE),\n            )\n            optimizer.zero_grad()\n            logits = model(imgs).squeeze(1)\n            loss = nn.functional.binary_cross_entropy_with_logits(\n                logits, labels, reduction=\"none\"\n            )\n            loss = (loss * weights).mean()\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch+1}/{EPOCHS} train_loss={total_loss/len(train_ds):.4f}\")\n    # eval\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, labels, _, _ in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs)\n            all_labels.extend(labels.numpy())\n    auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n    # save model\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(model.state_dict(), MODEL_PATH)\n    # if test folder exists, optionally create submission.csv\n    test_folder = \"./input/test_images\"\n    if os.path.isdir(test_folder):\n        sub = predict(test_folder)\n        sub.to_csv(\"working/submission.csv\", index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport torchvision.models as models\n\n\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        img = self.transform(img)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return img, label\n\n\ndef predict(folder, model_path=\"./working/resnet50_malignancy.pth\", batch_size=32):\n    \"\"\"\n    Predict malignancy probabilities for all jpg images in `folder`.\n    Returns a dict {image_name: probability}.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # define model\n    model = models.resnet50(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # transform\n    transform = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    files = [f for f in os.listdir(folder) if f.lower().endswith(\".jpg\")]\n    probs = {}\n    with torch.no_grad():\n        for i in range(0, len(files), batch_size):\n            batch_files = files[i : i + batch_size]\n            imgs = []\n            for f in batch_files:\n                img = Image.open(os.path.join(folder, f)).convert(\"RGB\")\n                imgs.append(transform(img))\n            imgs = torch.stack(imgs).to(device)\n            logits = model(imgs).squeeze(1)\n            batch_probs = torch.sigmoid(logits).cpu().numpy()\n            for f, p in zip(batch_files, batch_probs):\n                probs[f] = float(p)\n    return probs\n\n\nif __name__ == \"__main__\":\n    # load data\n let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
