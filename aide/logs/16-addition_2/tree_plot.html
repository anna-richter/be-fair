let treeStructData = {"edges": [[1, 5], [5, 6], [5, 7], [7, 18], [7, 14], [7, 16], [7, 15], [7, 8], [7, 9], [7, 12], [7, 19], [7, 11], [7, 13], [7, 10], [7, 17]], "layout": [[0.36363636363636365, 0.0], [0.45454545454545453, 0.0], [0.5454545454545454, 0.0], [0.6363636363636364, 0.0], [0.7272727272727273, 0.0], [0.45454545454545453, 0.33333333333333337], [0.4090909090909091, 0.6666666666666667], [0.5, 0.6666666666666667], [0.0, 1.0], [0.09090909090909091, 1.0], [0.18181818181818182, 1.0], [0.2727272727272727, 1.0], [0.36363636363636365, 1.0], [0.45454545454545453, 1.0], [0.5454545454545454, 1.0], [0.6363636363636364, 1.0], [0.7272727272727273, 1.0], [0.8181818181818182, 1.0], [0.9090909090909091, 1.0], [1.0, 1.0]], "plan": ["We fine-tune a pretrained ResNet18 to discriminate malignant vs benign skin\nlesions using binary cross-entropy on resized and normalized images. We split\ndata into stratified 80/20 train/validation by malignancy label to evaluate\ngeneralization via AUROC. To mitigate class imbalance we use pos_weight in the\nBCE loss. The trained model is saved, and a predict() function loads it and\nreturns malignancy probabilities for images in a given folder. We report the\nvalidation AUROC as our evaluation metric.", "We fine-tune a pretrained EfficientNet-B0 from timm to predict malignancy, and\nexplicitly incorporate skin tone as a learnable embedding concatenated to the\nimage feature vector to help the model adjust its predictions by skin tone. We\nmap skin tone categories to integer indices, embed them, and concatenate with\nthe pooled image features before the final linear layer, training with a class-\nweighted BCEWithLogitsLoss. We apply standard augmentations during training and\nperform an 80/20 stratified by malignancy split to evaluate generalization. We\nreport the AUROC on the validation set and save the model; a predict() function\nloads the checkpoint and returns malignancy probabilities for images in a given\nfolder.", "We fine-tune a pretrained EfficientNet-B0 on our skin lesion dataset to predict\nmalignancy, using a binary cross-entropy loss with a positive\u2010class weight to\ncounter class imbalance. We split the data 80/20 stratified by malignancy label,\napply standard image augmentations during training, and evaluate on the hold-out\nset via AUROC. The trained model is saved, and a reusable `predict()` function\nloads it to return malignancy probabilities for any folder of new images. We\nprint the validation AUROC at the end of training.", "We fine-tune a pretrained DenseNet-121 from the timm library on 224\u00d7224 skin\nlesion images, applying data augmentation and a WeightedRandomSampler to balance\nboth malignant vs non\u2010malignant labels and skin-tone groups to reduce bias. We\nperform 5-fold stratified cross\u2013validation on the malignancy label to compute\nmean AUROC and the AUROC gap between light and dark skin, then retrain on the\nfull dataset to produce our final model. A `predict()` function is provided to\nload the saved model and output malignancy probabilities for any folder of new\nimages, and a `submission.csv` is written in `./working`.", "We fine-tune a pretrained ResNet34 on the skin lesion images using a weighted\nbinary cross-entropy loss to account for class imbalance. We perform an 80/20\nstratified split by malignancy label, apply standard augmentations during\ntraining, and evaluate on the validation set via AUROC. After training for five\nepochs, we save the model to `working/model.pth` and implement a `predict()`\nfunction that loads this model to return malignancy probabilities for all images\nin a given folder. Finally, we print the validation AUROC.", "We avoid pickling the model class by saving only its `state_dict` and the\n`num_tones` metadata in a checkpoint dict. After training we serialize this\ncheckpoint, and in `predict()` we load it, recreate the model with the correct\nembedding size, and load its weights. This ensures the class definition need not\nbe pickled, and the pipeline runs without errors. We then train, evaluate, print\nvalidation AUROC, and expose a reusable `predict()` function.", "We introduce a WeightedRandomSampler on the skin\u2010tone attribute to ensure each\nbatch during training contains equally represented skin tones, which should\nmitigate bias and improve fair generalization. We compute sample weights\ninversely proportional to each tone\u2019s frequency and feed them to the DataLoader.\nAll other components (model, loss, training loop) remain the same, and we still\nprint the validation AUROC at the end.", "We can improve convergence and generalization by introducing a cosine annealing\nlearning\u2010rate scheduler and increasing training from 5 to 10 epochs. The\nscheduler will smoothly decay the learning rate, helping the model settle into\nflatter minima and reducing overfitting. This change is atomic\u2014only the training\nloop and optimizer setup are modified\u2014while all other components (data\naugmentation, class\u2010imbalance handling, skin\u2010tone embedding) remain unchanged.", "We add simple test-time augmentation by averaging predictions on original and\nhorizontally flipped images. During validation, for each batch we run the model\non the batch and on its flipped version and average their probabilities, which\nboosts AUROC without retraining. We also apply the same TTA logic in the\n`predict()` function to improve inference on new images. Below is the updated\ncode.", "We will implement simple test-time augmentation (TTA) by averaging predictions\non original and horizontally flipped images during validation and in the\npredict() function. For each batch in validation, we run the model on the batch\nand its horizontally flipped version, average the predicted probabilities before\ncomputing AUROC. The predict() function is updated similarly to average\nprobabilities for each image.", "We\u2019ll replace the standard binary cross\u2010entropy with a binary focal loss (\u03b3=2,\n\u03b1=0.25) so the model focuses on hard, ambiguous examples and reduces\noverfitting. This only requires swapping out the loss function, leaving all\nother training components (augmentations, backbone, scheduler, skin\u2010tone\nembedding, etc.) unchanged. We keep the same training loop, optimizer, and\nscheduler, and then evaluate AUROC on the validation set.", "I propose adding simple test-time augmentation (TTA) by averaging predictions on\noriginal and horizontally flipped images during both validation and inference.\nThis requires only modifying the validation loop and the `predict()` function,\nleaving training unchanged. TTA typically yields a few percent boost in AUROC\nwithout extra training cost. The rest of the pipeline\u2014including skin\u2010tone\nembedding, cosine\u2010annealing scheduler, and BCE loss\u2014remains the same.", "I propose replacing the EfficientNet\u2010B0 backbone with EfficientNet\u2010B1 and\nincreasing the input resolution to 240\u00d7240, which provides richer feature\nrepresentations without drastically increasing training time. We adjust the\ntraining and validation transforms to use 240\u00d7240 crops and keep all other\nsettings (loss weighting, scheduler, embeddings) unchanged. This atomic change\nshould yield a measurable boost in AUROC.", "We add simple test-time augmentation (TTA) by averaging predictions on original\nand horizontally flipped images during both validation and inference. In the\nvalidation loop, for each batch we compute logits on the batch and its flipped\nversion and average before applying the sigmoid. The `predict()` function is\nupdated to apply the same TTA logic for each image in the folder. This requires\nminimal changes to the validation loop and `predict()` while leveraging our\nexisting trained model.", "I propose extending our test-time augmentation by averaging predictions across\nfour views: the original image, its horizontal flip, vertical flip, and both\nflips combined. This only requires minor changes to the validation loop and the\n`predict()` function to apply these flips on the tensor level and average their\nprobabilities. No retraining is needed, and we expect a small boost in AUROC\nfrom the richer ensemble of augmented views.", "We add RandomErasing to the training transforms to improve robustness and\ngeneralization by simulating occlusions. This is an atomic change: no other\nparts of the training loop, model, scheduler, or evaluation pipeline are\nmodified. The model is retrained on the same data with the same training regime,\nand we report the new validation AUROC. RandomErasing is applied with\nprobability 0.5 after normalization.", "I propose adding MixUp augmentation in the training loop: for each batch, sample\na mixing coefficient \u03bb from a Beta(\u03b1,\u03b1) distribution and combine pairs of\nimages, their skin-tone embeddings, and labels accordingly. This encourages\nsmoother decision boundaries and reduces overfitting, potentially improving\ngeneralization without changing any other part of the pipeline. We mix both the\nimage features (via the EfficientNet backbone) and the skin-tone embeddings\nbefore passing them through the classifier and compute the loss as the weighted\nsum of the two labels. All other settings\u2014transforms, optimizer, scheduler, and\ninference routine\u2014remain unchanged.", "I will add ten\u2010crop test\u2010time augmentation to both the validation loop and the\n`predict()` function. For each image we will extract the five corner + center\ncrops and their horizontal flips, run them as a batch through the model, average\ntheir sigmoid probabilities, and use those as the final prediction. This only\nmodifies the evaluation/inference code\u2014training remains unchanged\u2014allowing us to\nmeasure the AUROC gain from richer TTA with minimal risk.", "I propose adding RandAugment to the training data pipeline to introduce\nstronger, automated augmentation and improve generalization. Specifically, we\ninsert torchvision.transforms.RandAugment (with 2 operations at magnitude 9)\nafter the random crop and before flips, keeping the rest of the training regime\n(EfficientNet-B0, skin-tone embedding, cosine scheduler, 10 epochs) unchanged.\nThis atomic change should boost robustness without extra training time.", "I propose integrating Stochastic Weight Averaging (SWA) by wrapping our base\nmodel in an AveragedModel from epoch 6 onward and switching to an SWALR\nscheduler for the final epochs. After training, we update batch normalization\nstats on the SWA model using the training loader, then evaluate its AUROC on the\nvalidation set for a more robust final model. This requires minimal changes\u2014just\nadding SWA utilities and update_bn\u2014while typically boosting generalization.\nWe\u2019ll save and use the SWA-averaged model for inference."], "code": ["import os\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\n# Custom dataset for loading images and labels\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row.target, dtype=torch.float32)\n        return image, label\n\n\n# Prediction function\ndef predict(folder_path, model_path=\"./working/model.pth\", device=\"cpu\"):\n    \"\"\"\n    Predict malignancy probabilities for all images in folder_path.\n    Returns a DataFrame with columns ['image_name', 'malignancy_prob'].\n    \"\"\"\n    device = torch.device(device)\n    # Define transforms matching training\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # Load model\n    model = models.resnet18(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    results = []\n    for fname in sorted(os.listdir(folder_path)):\n        if fname.lower().endswith((\".jpg\", \".png\", \".jpeg\")):\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(x)).item()\n            results.append({\"image_name\": fname, \"malignancy_prob\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # Paths and parameters\n    DATA_CSV = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    MODEL_PATH = \"./working/model.pth\"\n    DEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    BATCH_SIZE = 32\n    EPOCHS = 3\n\n    # Load and prepare data\n    df = pd.read_csv(DATA_CSV)\n    # Binary target: malignant=1, else=0\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Split stratified by target\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, random_state=42, stratify=df[\"target\"]\n    )\n\n    # Transforms\n    train_transforms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomVerticalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transforms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, transform=train_transforms)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, transform=val_transforms)\n    train_loader = DataLoader(\n        train_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n    )\n    val_loader = DataLoader(val_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(DEVICE)\n    # Handle class imbalance\n    pos = train_df[\"target\"].sum()\n    neg = len(train_df) - pos\n    pos_weight = torch.tensor([neg / pos], device=DEVICE)\n    criterion = nn.BCEWithLogitsLoss(pos_weight=pos_weight)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    model.train()\n    for epoch in range(EPOCHS):\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(DEVICE), labels.to(DEVICE).unsqueeze(1)\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n\n    # Evaluation\n    model.eval()\n    all_targets = []\n    all_probs = []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(DEVICE)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            all_probs.extend(probs.tolist())\n            all_targets.extend(labels.numpy().tolist())\n    auc = roc_auc_score(all_targets, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Save model\n    os.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\n    torch.save(model.state_dict(), MODEL_PATH)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport timm\nimport torchvision.transforms as T\n\n\n# Dataset class\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        # map skin_tone values to 0..6\n        tones = sorted(self.df[\"skin_tone\"].unique())\n        self.tone2idx = {v: i for i, v in enumerate(tones)}\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        tone = self.tone2idx[row[\"skin_tone\"]]\n        tone = torch.tensor(tone, dtype=torch.long)\n        label = torch.tensor(row[\"label_bin\"], dtype=torch.float32)\n        return img, tone, label\n\n\n# Model definition\nclass EfficientNetSkinTone(nn.Module):\n    def __init__(self, num_tones):\n        super().__init__()\n        self.backbone = timm.create_model(\n            \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n        )\n        feat_dim = self.backbone.num_features\n        self.tone_emb = nn.Embedding(num_tones, 16)\n        self.classifier = nn.Sequential(\n            nn.Linear(feat_dim + 16, 128),\n            nn.ReLU(inplace=True),\n            nn.Dropout(0.3),\n            nn.Linear(128, 1),\n        )\n\n    def forward(self, x, tone):\n        x_feat = self.backbone(x)  # B x feat_dim\n        t = self.tone_emb(tone)  # B x 16\n        x_cat = torch.cat([x_feat, t], dim=1)\n        return self.classifier(x_cat).squeeze(1)\n\n\n# Predict function\ndef predict(\n    model_path, folder_path, device=\"cuda\" if torch.cuda.is_available() else \"cpu\"\n):\n    model = torch.load(model_path, map_location=device)\n    model.eval()\n    model.to(device)\n    transform = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith((\".jpg\", \".png\")):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            # dummy tone 0 if unknown\n            tone = torch.tensor([0], device=device, dtype=torch.long)\n            prob = torch.sigmoid(model(x, tone)).item()\n            results[fname] = prob\n    return results\n\n\ndef main():\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # binary labels: malignant=1, others=0\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # train/val split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n    )\n    # transforms\n    train_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.RandomRotation(15),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\n    num_tones = len(train_ds.tone2idx)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # model, loss, optimizer\n    model = EfficientNetSkinTone(num_tones).to(device)\n    # class weighting\n    pos = train_df[\"label_bin\"].sum()\n    neg = len(train_df) - pos\n    pos_weight = torch.tensor(neg / pos, device=device)\n    criterion = nn.BCEWithLogitsLoss(pos_weight=pos_weight)\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4)\n    # training loop\n    for epoch in range(1, 6):\n        model.train()\n        running_loss = 0.0\n        for imgs, tones, labels in train_loader:\n            imgs, tones, labels = imgs.to(device), tones.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs, tones)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch} train loss: {running_loss/len(train_ds):.4f}\")\n    # validation\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, tones, labels in val_loader:\n            imgs, tones = imgs.to(device), tones.to(device)\n            logits = model(imgs, tones)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    val_auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {val_auc:.4f}\")\n    # save model\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model, \"./working/efficientnet_skintone.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        x = self.transform(img)\n        y = torch.tensor(row.target, dtype=torch.float32)\n        return x, y\n\n\n# Predict function\ndef predict(model_path, image_folder, device=\"cpu\", batch_size=32):\n    # load model\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(model_path, map_location=device))\n    model.to(device).eval()\n    # transforms\n    tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # list images\n    files = [\n        f for f in os.listdir(image_folder) if f.lower().endswith((\".jpg\", \".png\"))\n    ]\n    ds = [\n        (f, tf(Image.open(os.path.join(image_folder, f)).convert(\"RGB\"))) for f in files\n    ]\n    loader = DataLoader(\n        ds,\n        batch_size=batch_size,\n        shuffle=False,\n        collate_fn=lambda batch: (\n            torch.stack([item[1] for item in batch]),\n            [item[0] for item in batch],\n        ),\n    )\n    probs = {}\n    with torch.no_grad():\n        for xb, names in loader:\n            xb = xb.to(device)\n            logits = model(xb).squeeze(1)\n            p = torch.sigmoid(logits).cpu().numpy()\n            for name, pv in zip(names, p):\n                probs[name] = float(pv)\n    return probs\n\n\ndef main():\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    # load data\n    df = pd.read_csv(\"./input/mydataset.csv\")\n    # binary target: malignant=1 else=0\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # train/val split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"target\"], random_state=42\n    )\n    # transforms\n    train_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    # datasets and loaders\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # model, loss, optimizer\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    model.to(device)\n    # pos_weight to balance classes\n    pos = train_df[\"target\"].sum()\n    neg = len(train_df) - pos\n    pos_weight = torch.tensor([neg / pos], device=device)\n    criterion = nn.BCEWithLogitsLoss(pos_weight=pos_weight)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n    # train\n    epochs = 5\n    for epoch in range(1, epochs + 1):\n        model.train()\n        running_loss = 0.0\n        for xb, yb in train_loader:\n            xb, yb = xb.to(device), yb.to(device)\n            optimizer.zero_grad()\n            logits = model(xb).squeeze(1)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * xb.size(0)\n        epoch_loss = running_loss / len(train_loader.dataset)\n        print(f\"Epoch {epoch}/{epochs} - train loss: {epoch_loss:.4f}\")\n    # eval\n    model.eval()\n    all_probs, all_targets = [], []\n    with torch.no_grad():\n        for xb, yb in val_loader:\n            xb = xb.to(device)\n            logits = model(xb).squeeze(1)\n            p = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(p.tolist())\n            all_targets.extend(yb.numpy().tolist())\n    auc = roc_auc_score(all_targets, all_probs)\n    print(f\"Validation AUROC: {auc:.4f}\")\n    # save model\n    os.makedirs(\"./working\", exist_ok=True)\n    torch.save(model.state_dict(), \"./working/model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader, WeightedRandomSampler\nimport torchvision.transforms as T\nimport timm\n\n\n# Dataset Definition\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, f\"{row.image_name}.jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        y = float(row.target)\n        skin = int(row.skin_tone)\n        return img, y, skin\n\n\n# Training & validation function\ndef train_one_epoch(model, loader, criterion, optimizer, device):\n    model.train()\n    running_loss = 0.0\n    for imgs, targets, _ in loader:\n        imgs, targets = imgs.to(device), targets.to(device).unsqueeze(1)\n        logits = model(imgs)\n        loss = criterion(logits, targets)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        running_loss += loss.item() * imgs.size(0)\n    return running_loss / len(loader.dataset)\n\n\ndef validate(model, loader, device):\n    model.eval()\n    ys, ps, skins = [], [], []\n    with torch.no_grad():\n        for imgs, targets, skin in loader:\n            imgs = imgs.to(device)\n            logits = model(imgs)\n            probs = torch.sigmoid(logits).cpu().numpy().flatten()\n            ys.extend(targets.numpy().tolist())\n            ps.extend(probs.tolist())\n            skins.extend(skin.tolist())\n    return np.array(ys), np.array(ps), np.array(skins)\n\n\n# Prediction function\ndef predict(folder: str):\n    \"\"\"\n    Load the saved model and predict malignancy probabilities for all .jpg in folder.\n    Returns a dict {filename: probability}.\n    Also writes submission.csv in ./working.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"densenet121\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model.to(device).eval()\n    tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = {}\n    for fname in sorted(os.listdir(folder)):\n        if fname.lower().endswith(\".jpg\"):\n            img = Image.open(os.path.join(folder, fname)).convert(\"RGB\")\n            x = tf(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                prob = torch.sigmoid(model(x)).item()\n            results[fname] = prob\n    # write submission\n    df = pd.DataFrame(list(results.items()), columns=[\"image_name\", \"probability\"])\n    df.to_csv(\"working/submission.csv\", index=False)\n    return results\n\n\ndef main():\n    # Config\n    DATA_CSV = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    N_SPLITS = 5\n    BATCH_SIZE = 32\n    EPOCHS = 3\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Load data\n    df = pd.read_csv(DATA_CSV)\n    df[\"target\"] = (df.label == \"malignant\").astype(int)\n    skf = StratifiedKFold(n_splits=N_SPLITS, shuffle=True, random_state=42)\n\n    # Transforms\n    train_tf = T.Compose(\n        [\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.RandomVerticalFlip(),\n            T.ColorJitter(0.2, 0.2, 0.2, 0.1),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n\n    fold_aucs, fold_gaps = [], []\n    for fold, (train_idx, val_idx) in enumerate(skf.split(df, df.target)):\n        print(f\"Fold {fold+1}/{N_SPLITS}\")\n        df_train, df_val = df.iloc[train_idx], df.iloc[val_idx]\n        # compute sample weights to balance label & skin_tone\n        lbl_counts = df_train.target.value_counts().to_dict()\n        skin_counts = df_train.skin_tone.value_counts().to_dict()\n        weights = []\n        for _, row in df_train.iterrows():\n            w = 1.0 / lbl_counts[row.target] * 1.0 / skin_counts[row.skin_tone]\n            weights.append(w)\n        sampler = WeightedRandomSampler(\n            weights, num_samples=len(weights), replacement=True\n        )\n        # Datasets & loaders\n        ds_train = SkinLesionDataset(df_train, IMG_DIR, transform=train_tf)\n        ds_val = SkinLesionDataset(df_val, IMG_DIR, transform=val_tf)\n        loader_train = DataLoader(\n            ds_train, batch_size=BATCH_SIZE, sampler=sampler, num_workers=4\n        )\n        loader_val = DataLoader(\n            ds_val, batch_size=BATCH_SIZE, shuffle=False, num_workers=4\n        )\n        # Model, loss, optimizer\n        model = timm.create_model(\"densenet121\", pretrained=True, num_classes=1).to(\n            device\n        )\n        criterion = nn.BCEWithLogitsLoss()\n        optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4, weight_decay=1e-5)\n        # Train\n        for epoch in range(EPOCHS):\n            loss = train_one_epoch(model, loader_train, criterion, optimizer, device)\n            print(f\"  Epoch {epoch+1}/{EPOCHS} loss={loss:.4f}\")\n        # Validate\n        y_true, y_pred, skins = validate(model, loader_val, device)\n        auc = roc_auc_score(y_true, y_pred)\n        # compute skin-tone groups: light (1\u20103), dark (4\u20106)\n        mask_light = np.isin(skins, [1, 2, 3])\n        mask_dark = np.isin(skins, [4, 5, 6])\n        auc_light = (\n            roc_auc_score(y_true[mask_light], y_pred[mask_light])\n            if mask_light.sum() > 0\n            else np.nan\n        )\n        auc_dark = (\n            roc_auc_score(y_true[mask_dark], y_pred[mask_dark])\n            if mask_dark.sum() > 0\n            else np.nan\n        )\n        gap = abs(auc_light - auc_dark)\n        print(\n            f\"  Fold {fold+1} AUROC={auc:.4f} light={auc_light:.4f} dark={auc_dark:.4f} gap={gap:.4f}\"\n        )\n        fold_aucs.append(auc)\n        fold_gaps.append(gap)\n\n    print(f\"Mean CV AUROC: {np.mean(fold_aucs):.4f} \u00b1 {np.std(fold_aucs):.4f}\")\n    print(f\"Mean AUROC gap (light vs orm:\n            img = self.transform(img)\n        label = torch.tensor(row[\"label_binary\"], dtype=torch.float32)\n        return img, label\n\n\n# Prediction function\ndef predict(folder_path: str):\n    \"\"\"\n    Load the trained model and return malignancy probabilities for each image in folder_path.\n    Returns a dict {filename: probability}.\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Define model architecture\n    model = models.resnet34(pretrained=False)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model.to(device).eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in sorted(os.listdir(folder_path)):\n            if fname.lower().endswith((\".jpg\", \".png\", \".jpeg\")):\n                img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n                x = transform(img).unsqueeze(0).to(device)\n                logit = model(x)\n                prob = torch.sigmoid(logit).item()\n                results[fname] = prob\n    return results\n\n\nif __name__ == \"__main__\":\n    # Load and prepare data\n    df = pd.read_csv(\"input/mydataset.csv\")\n    df[\"label_binary\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_binary\"], random_state=42\n    )\n    train_transforms = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomRotation(15),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n .read_csv(\"./input/mydataset.csv\")\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n    )\n    train_tf = T.Compose(\n        [\n            T.Resize(256),\n            T.RandomResizedCrop(224),\n            T.RandomHorizontalFlip(),\n            T.RandomRotation(15),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    val_tf = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\n    num_tones = len(train_ds.tone2idx)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    model = EfficientNetSkinTone(num_tones).to(device)\n    criterion = FocalLoss(alpha=0.25, gamma=2.0)\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4)\n    epochs = 10\n    scheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=epochs)\n\n    for epoch in range(1, epochs + 1):\n        model.train()\n        running_loss = 0.0\n        for imgs, tones, labels in train_loader:\n            imgs, tones, labels = imgs.to(device), tones.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs, tones)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        scheduler.step()\n        print(f\"Epoch {epoch} train loss: {running_loss/len(train_ds):.4f}\")\n\n    model.eval()\n       T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, \"./input/MyImages\", transform=train_tf)\n    val_ds = SkinLesionDataset(val_df, \"./input/MyImages\", transform=val_tf)\n    num_tones = len(train_ds.tone2idx)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    model = EfficientNetSkinTone(num_tones).to(device)\n    pos = train_df[\"label_bin\"].sum()\n    neg = len(train_df) - pos\n    pos_weight = torch.tensor(neg / pos, device=device)\n    criterion = nn.BCEWithLogitsLoss(pos_weight=pos_weight)\n    optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4)\n\n    epochs = 10\n    scheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=epochs)\n\n    for epoch in range(1, epochs + 1):\n        model.train()\n        running_loss = 0.0\n        for imgs, tones, labels in train_loader:\n            imgs, tones, labels = imgs.to(device), tones.to(device), labels.to(device)\n            optimizer.zero_grad()\n            logits = model(imgs, tones)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        scheduler.step()\n        print(f\"Epoch {epoch} train loss: {running_loss/len(train_ds):.4f}\")\n\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, tones, labels in val_loader:\n            imgs, tones = imgs.to(device), tones.to(device)\n            logits = model(imgs, tones)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    val_auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {val_auc:.4f}\")\n\n    os.makedirs(\"./working\", exist_ok=True)\n    ckpt = {\"model_state_dict\": model.state_dict(), \"num_tones\": num_tones}\n    model_path = \"./working/efficientnet_skintone.pth\"\n    torch.save(ckpt, model_path)\n\n    # generate submission if a test folder is present\n    for folder_name in (\"test\", \"test_images\", \"test_imgs\"):\n        test_folder = f\"./input/{folder_name}\"\n        if os.path.isdir(test_folder):\n            preds = predict(model_path, test_folder, device=device)\n            df_sub = pd.DataFrame(\n                list(preds.items()), columns=[\"image_name\", \"probability\"]\n            )\n            df_sub.to_csv(\"./working/submission.csv\", index=False)\n            print(f\"Saved submission.csv with {len(df_sub)} entries.\")\n            break\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport timm\nimport torchvision.transforms as T\nfrom torch.distributions import Beta\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n        tones = sorted(self.df[\"skin_tone\"].unique())\n        self.tone2idx = {v: i for i, v in enumerate(tones)}\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        tone = torch.tensor(self.tone2idx[row[\"skin_tone\"]], dtype=torch.long)\n        label = torch.tensor(row[\"label_bin\"], dtype=torch.float32)\n        return img, tone, label\n\n\nclass EfficientNetSkinTone(nn.Module):\n    def __init__(self, num_tones):\n        super().__init__()\n        self.backbone = timm.create_model(\n            \"efficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n        )\n        feat_dim = self.backbone.num_features\n        self.tone_emb = nn.Embedding(num_tones, 16)\n        self.classifier = nn.Sequential(\n            nn.Linear(feat_dim + 16, 128),\n            nn.ReLU(inplace=True),\n            nn.Dropout(0.3),\n            nn.Linear(128, 1),\n        )\n\n    def forward(self, x, tone):\n        x_feat = self.backbone(x)\n        t = self.tone_emb(tone)\n        return self.classifier(torch.cat([x_feat, t], dim=1)).squeeze(1)\n\n\ndef predict(model_path: str, folder_path: str, device: str = None):\n    \"\"\"\n    Load a trained model checkpoint and return malignancy probabilities for all images\n    in folder_path. Returns a dict mapping filenames to probability [0-1].\n    \"\"\"\n    device = device or (\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    checkpoint = torch.load(model_path, map_location=device)\n    num_tones = checkpoint[\"num_tones\"]\n    model = EfficientNetSkinTone(num_tones).to(device)\n    model.load_state_dict(checkpoint[\"model_state_dict\"])\n    model.eval()\n    transform = T.Compose(\n        [\n            T.Resize(224),\n            T.CenterCrop(224),\n            T.ToTensor(),\n            T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith((\".jpg\", \".png\")):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            x = transform(img).unsqueeze(0).to(device)\n            tone = torch.tensor([0], device=device, dtype=torch.long)\n            prob = torch.sigmoid(model(x, tone)).item()\n            results[fname] to(device), labels.to(device)\n            optimizer.zero_grad()\n            if mixup_alpha > 0:\n                lam = beta_dist.sample().item()\n                batch_size = imgs.size(0)\n                perm = torch.randperm(batch_size, device=device)\n                imgs2 = imgs[perm]\n                tones2 = tones[perm]\n                labels2 = labels[perm]\n                # backbone features\n                feats1 = model.backbone(imgs)\n                feats2 = model.backbone(imgs2)\n                mixed_feats = lam * feats1 + (1 - lam) * feats2\n                # tone embeddings\n                emb1 = model.tone_emb(tones)\n                emb2 = model.tone_emb(tones2)\n                mixed_emb = lam * emb1 + (1 - lam) * emb2\n                inp = torch.cat([mixed_feats, mixed_emb], dim=1)\n                logits = model.classifier(inp).squeeze(1)\n                loss = lam * criterion(logits, labels) + (1 - lam) * criterion(\n                    logits, labels2\n                )\n            else:\n                logits = model(imgs, tones)\n                loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        scheduler.step()\n        print(f\"Epoch {epoch} train loss: {running_loss/len(train_ds):.4f}\")\n\n    model.eval()\n    all_labels, all_probs = [], []\n    with torch.no_grad():\n        for imgs, tones, labels in val_loader:\n            imgs, tones = imgs.to(device), tones.to(device)\n            logits = model(imgs, tones)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_probs.extend(probs.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    val_auc = roc_auc_score(all_labels, all_probs)\n    print(f\"Validation AUROC: {val_auc:.4f}\")\n\n    os.makedirs(\"./working\", exist_ok=True)\n    ckpt = {\"model_state_dict\": model.state_dict(), \"num_tones\": num_tones}\n    model_path = \"./work ficientnet_b0\", pretrained=True, num_classes=0, global_pool=\"avg\"\n        )\n        feat_dim = self.backbone.num_features\n        self.tone_emb = nn.Embedding(num_tones, 16)\n        self.classifier = nn.Sequential(\n            nn.Linear(feat_dim + 16, 128),\n            nn.ReLU(inplace=True),\n            nn.Dropout(0.3),\n            nn.Linear(128, 1),\n        )\n\n    def forward(self, x, tone):\n        x_feat = self.backbone(x)\n        t = self.tone_emb(tone)\n        return self.classifier(torch.cat([x_feat, t], dim=1)).squeeze(1)\n\n\ndef predict(model_path: str, folder_path: str, device: str = None):\n    \"\"\"\n    Load a trained model checkpoint and return malignancy probabilities for all images\n    in folder_path. Returns a dict mapping filenames to probability [0-1].\n    \"\"\"\n    device = device or (\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    checkpoint = torch.load(model_path, map_location=device)\n    num_tones = checkpoint[\"num_tones\"]\n    model = EfficientNetSkinTone(num_tones).to(device)\n    model.load_state_dict(checkpoint[\"model_state_dict\"])\n    model.eval()\n    # ten-crop TTA: five crops + their horizontal flips\n    normalize = T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225))\n    tta_transform = T.Compose(\n        [\n            T.Resize(256),\n            T.TenCrop(224),\n            T.Lambda(\n                lambda crops: torch.stack(\n                    [normalize(T.ToTensor()(crop)) for crop in crops]\n                )\n            ),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if not fname.lower().endswith((\".jpg\", \".png\")):\n                continue\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            crops = tta_transform(img).to(device)  # shape [10,3,224,224]\n            tone_idx = torch.tensor(\n                [0] * crops.size(0), device=device, dtype=t     this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
