let treeStructData = {"edges": [[1, 8], [1, 9], [1, 6], [2, 10], [3, 7], [4, 5], [9, 11], [11, 13], [11, 12], [13, 15], [13, 16], [13, 17], [13, 18], [13, 19], [13, 14]], "layout": [[0.0, 0.0], [0.2, 0.0], [0.6, 0.0], [0.8, 0.0], [1.0, 0.0], [1.0, 0.25], [0.0, 0.25], [0.8, 0.25], [0.2, 0.25], [0.4, 0.25], [0.6, 0.25], [0.4, 0.5], [0.3, 0.75], [0.5, 0.75], [0.0, 1.0], [0.2, 1.0], [0.4, 1.0], [0.6, 1.0], [0.8, 1.0], [1.0, 1.0]], "plan": ["We use a pretrained ResNet18 to extract image embeddings and train a logistic\nregression on these features to predict malignancy, including skin tone as a\nfeature for fairness. We perform 5-fold cross-validation to compute the overall\nAUROC and the AUROC gap across skin tone groups. After cross-validation, we\nretrain on all data and provide a `predict()` function that takes a folder of\nimages and returns malignancy probabilities. This balances simplicity,\nperformance, and fairness without extensive tuning.", "We extract EfficientNet-B0 embeddings for each image using a pretrained model,\nthen train a LightGBM classifier on these 1280-dim features to predict\nmalignancy in a 5-fold stratified cross-validation, reporting the overall AUROC.\nWe also measure the AUROC gap between light (skin_tone\u22643) and dark (skin_tone\u22655)\ngroups to assess fairness. Finally, we retrain the classifier on the full\ndataset and provide a predict() function that takes a folder of new images and\nreturns malignancy probabilities.", "We extract penultimate-layer features from a pretrained DenseNet121 for all\nlesions, compute sample weights to balance light (skin_tone \u22643) and dark\n(skin_tone \u22655) groups, and train an XGBoost classifier on these embeddings. We\nperform 5-fold stratified cross-validation, reporting the overall AUROC and the\naverage AUROC gap between light and dark skin tones. After cross-validation, we\nretrain on the full dataset with the same weighting and save the model,\nproviding a predict() function that processes a folder of new images and returns\nmalignancy probabilities.", "We extract 2048-dim features from each image using a pretrained ResNet50\n(without its final layer) and combine them with the skin_tone feature, then\ntrain an XGBoost classifier on these features. We perform 5-fold stratified\ncross-validation to compute the overall AUROC and the average AUROC gap between\nlight (skin_tone\u22643) and dark (skin_tone\u22655) groups. After cross-validation, we\nretrain on the full dataset, save the model, and provide a `predict()` function\nthat processes a folder of new images and outputs malignancy probabilities as\n`submission.csv`.", "We extract pretrained ResNet50 embeddings for each image and train an XGBoost\nclassifier on these features to predict malignancy. We perform 5-fold stratified\ncross-validation, computing the overall AUROC and the AUROC gap between light\nand dark skin groups to assess fairness. After evaluation, we retrain on the\nfull dataset and implement a `predict(folder_path)` function that returns\nmalignancy probabilities for new images.", "We replace XGBoost with a scikit-learn RandomForestClassifier to eliminate the\nmissing dependency, and we add simple sample weighting inversely proportional to\nthe counts of light and dark skin tone groups during training to reduce AUROC\ndisparity.  We then run 5-fold CV to report overall AUROC and light-vs-dark gap,\nretrain on the full data, and provide a predict() function that saves a\nsubmission.csv.", "We will weight samples by inverse skin tone frequency so that underrepresented\ntones are upweighted during LightGBM training. Specifically, we compute per-\nsample weights = number_of_training_samples /\ncount_of_that_skin_tone_in_training, and pass these weights to clf.fit both in\ncross-validation and final training. This should reduce the AUROC disparity\nbetween tones while potentially boosting overall performance with minimal code\nchanges.", "I replaced the XGBoost model with a RandomForestClassifier to avoid dependency\nissues, and updated the dataset to return skin tone as a tensor so that feature\nextraction works correctly. The script reads and preprocesses the data, extracts\nResNet50 features, and performs 5-fold stratified CV to compute both overall\nAUROC and the fairness gap between light and dark skin. After printing the mean\nmetrics, it retrains on the full dataset and saves the RandomForest model and\nmedian skin tone for later use. A `predict(image_folder)` function is also\nprovided to output malignancy probabilities and write `submission.csv`.", "I propose to weight training samples inversely proportional to their skin tone\ngroup frequency so that underrepresented tones are upweighted. Specifically, for\neach CV fold and for final training we compute sample weights =\ncompute_sample_weight('balanced', tones) on the skin tone array, then pass these\nweights to LightGBM\u2019s fit method. This addresses fairness without changing\ninference. The rest of the pipeline (EfficientNet-B0 feature extraction, CV,\nevaluation, final model saving, prediction function) remains unchanged.", "I propose to improve the previous pipeline by adding simple test\u2010time\naugmentation (horizontal flip TTA) to average features from original and flipped\nimages, which often yields more robust embeddings and boosts AUROC without\nchanging training. Specifically, after extracting base embeddings on the full\ndataset, we re\u2010run extraction with a deterministic horizontal flip to get\nflipped embeddings, then during cross\u2010validation we predict on the average of\noriginal and flipped embeddings for each validation sample. We similarly update\nthe final predict() function to average original and flipped features before\nclassification.", "We replace the missing XGBoost dependency with scikit-learn\u2019s\nRandomForestClassifier (which supports sample weights) to train on the DenseNet\nfeatures, preserving our fairness adjustment across skin tones. We perform\n5-fold stratified CV, computing overall AUROC and the light vs dark skin AUROC\ngap, then retrain on the full dataset and save both the feature extractor and\nclassifier. The predict() function loads these objects and returns malignancy\nprobabilities for any folder of JPEGs, and if a test folder exists it will write\na `submission.csv` in `./working`.", "I propose improving the current TTA pipeline by adding vertical flips alongside\nhorizontal flips, averaging embeddings from the original image, its horizontal\nflip, and its vertical flip. This simple extension of TTA often yields more\nrobust representations and can boost AUROC without retraining the feature\nextractor. We will extract three sets of embeddings (original, horizontal flip,\nvertical flip), average them during cross\u2010validation and inference, and report\nthe new CV AUROC and light/dark gap. Finally, we retrain on the original\nembeddings and update the predict function to include both flips in its TTA.", "I propose to integrate sample weighting based on skin tone frequency into the\nLightGBM training to further reduce fairness gaps. During each CV fold and the\nfinal training, we compute per-sample weights using\n`compute_sample_weight('balanced', skin_tones)` so that underrepresented tones\nare upweighted. All other parts of the pipeline (efficientnet feature\nextraction, triple TTA, evaluation) remain unchanged. This should help balance\nperformance across skin tones without sacrificing overall AUROC.", "I propose to extend the TTA scheme by adding a deterministic 90\u00b0 rotation\nalongside the existing horizontal and vertical flips, and to train the LightGBM\nclassifier directly on the average of all four embeddings (orig, h-flip, v-flip,\nrot-90) rather than only the original features. This way the model learns on the\nricher, augmented feature space, which should boost robustness and AUROC. We\nwill extract embeddings under the four transforms, average them, run 5-fold CV\non these averaged features (printing overall AUROC and light/dark gap), retrain\non the full averaged embeddings, and update the `predict()` function to include\nthe rotation in its TTA.", "I propose to adjust the test\u2010time augmentation averaging to weight the original\nembedding more heavily\u2014using 0.5 for the original and 0.1667 for each of\nhorizontal flip, vertical flip, and 90\u00b0 rotation.  This weighted TTA may reduce\nnoise from augmentations and boost AUROC.  We update the embedding averaging in\nboth training and inference, retrain the LightGBM classifier on these weighted\nfeatures, and report the new CV AUROC and light/dark gap.", "I propose to train the LightGBM classifier on concatenated 4\u2010way TTA embeddings\ninstead of their average, giving the model full flexibility to weight features\nfrom each transform. We will horizontally stack the original, horizontal flip,\nvertical flip, and 90\u00b0 rotation embeddings into a 4\u00d71280\u2010dimensional vector and\nrun 5\u2010fold CV on this concatenated feature set, reporting overall AUROC and the\nlight/dark gap. The final model is then retrained on all concatenated\nembeddings, and the predict() function is updated to concatenate 4\u2010way\nembeddings before inference. This small change can boost performance by letting\nthe classifier learn optimal combinations of TTA features.", "I propose to ensemble three LightGBM classifiers with different random seeds,\naveraging their probability outputs to reduce variance and improve robustness.\nDuring 5-fold CV we train three models per fold and average their predictions to\ncompute a more stable CV AUROC and fairness gap. Then we retrain the three\nmodels on the full dataset embeddings and save them as an ensemble. The\n`predict()` function loads all ensemble models and returns the average\nmalignancy probability for each image. This simple ensembling often yields a\nmeasurable boost in AUROC with minimal added complexity.", "We can ensemble several LightGBM classifiers with different random seeds,\naveraging their probability outputs to reduce variance and boost AUROC. During\ncross\u2010validation, we train an ensemble of three models per fold and average\ntheir predictions to compute the CV AUROC and fairness gap. For the final model,\nwe fit three LightGBM classifiers on the full 4\u2010way TTA averaged embeddings and\nsave them together. The predict() function is updated to load all ensemble\nmembers and average their outputs for new data.", "We will ensemble three LightGBM classifiers with different random seeds to\nreduce variance and improve AUROC. During 5\u2010fold CV, we train three models per\nfold and average their predictions to compute CV AUROC and the fairness gap\nbetween light and dark skin tones. For final training, we fit three models on\nthe full dataset averaged TTA embeddings and save them as an ensemble. The\n`predict()` function loads the ensemble and averages their outputs per image,\ngenerating `submission.csv` if test images exist.", "I propose adding a 180\u00b0 rotation transform to our test\u2010time augmentation (TTA)\npipeline, making it a 5\u2010way TTA. We will extract embeddings under this new\nrotation, average across all five transforms, and retrain our LightGBM\nclassifier on these enriched features. The predict() function is also updated to\ninclude the 180\u00b0 rotation, providing more robust malignancy probability\nestimates. This atomic change often boosts AUROC with minimal extra complexity."], "code": ["import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n# Device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load metadata\ndf = pd.read_csv(\"input/mydataset.csv\")\n# Binary labels: malignant=1, others=0\ndf[\"y\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Paths\ndf[\"path\"] = df[\"image_name\"].apply(\n    lambda x: os.path.join(\"input\", \"MyImages\", f\"{x}.jpg\")\n)\n\n\n# Dataset for feature extraction\nclass SkinDataset(Dataset):\n    def __init__(self, df, transform):\n        self.df = df.reset_index(drop=True)\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img = Image.open(row[\"path\"]).convert(\"RGB\")\n        img = self.transform(img)\n        return img, row[\"y\"], row[\"skin_tone\"], row[\"image_name\"]\n\n\n# Transforms\ntransform = T.Compose(\n    [\n        T.Resize(256),\n        T.CenterCrop(224),\n        T.ToTensor(),\n        T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n    ]\n)\n\n# Load pretrained model for feature extraction\nfeat_model = timm.create_model(\n    \"resnet18\", pretrained=True, num_classes=0, global_pool=\"avg\"\n)\nfeat_model.to(device).eval()\n\n# Extract features\ndataset = SkinDataset(df, transform)\nloader = DataLoader(dataset, batch_size=64, shuffle=False, num_workers=4)\nall_feats = []\nall_labels = []\nall_tones = []\nall_names = []\n\nwith torch.no_grad():\n    for imgs, labels, tones, names in loader:\n        imgs = imgs.to(device)\n        feats = feat_model(imgs).cpu().numpy()\n        all_feats.append(feats)\n        all_labels.extend(labels.numpy())\n        all_tones.extend(tones.numpy())\n        all_names.extend(names)\nall_feats = np.vstack(all_feats)\nall_labels = np.array(all_labels)\nall_tones = np.array(all_tones)\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naucs = []\ngaps = []\nfor train_idx, test_idx in skf.split(all_feats, all_labels):\n    X_train, X_test = all_feats[train_idx], all_feats[test_idx]\n    y_train, y_test = all_labels[train_idx], all_labels[test_idx]\n    tones_test = all_tones[test_idx]\n    # Scale\n    scaler = StandardScaler().fit(X_train)\n    X_train_s = scaler.transform(X_train)\n    X_test_s = scaler.transform(X_test)\n    # Logistic regression\n    model = LogisticRegression(max_iter=1000)\n    model.fit(X_train_s, y_train)\n    probs = model.predict_proba(X_test_s)[:, 1]\n    # Overall AUROC\n    auc = roc_auc_score(y_test, probs)\n    aucs.append(auc)\n    # Per-skin-tone AUROC\n    group_aucs = []\n    for tone in np.unique(tones_test):\n        mask = tones_test == tone\n        if np.unique(y_test[mask]).size == 2:\n            group_aucs.append(roc_auc_score(y_test[mask], probs[mask]))\n    if group_aucs:\n        gaps.append(max(group_aucs) - min(group_aucs))\n\n# Print results\nprint(f\"CV AUROC: {np.mean(aucs):.4f} \u00b1 {np.std(aucs):.4f}\")\nprint(f\"Average AUROC gap between skin tones: {np.mean(gaps):.4f}\")\n\n# Retrain on full data for final model\nscaler_full = StandardScaler().fit(all_feats)\nX_full_s = scaler_full.transform(all_feats)\nfinal_model = LogisticRegression(max_iter=1000)\nfinal_model.fit(X_full_s, all_labels)\n\n\n# Prediction function\ndef predict(image_folder):\n    \"\"\"Predict malignancy probability for all images in a folder.\n    Args:\n        image_folder (str): Path to directory containing .jpg images.\n    Returns:\n        pandas.DataFrame: image_name and malignancy_prob columns.\n    \"\"\"\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    paths = [os.path.join(image_folder, f) for f in files]\n    imgs = []\n    for p in paths:\n        img = Image.open(p).convert(\"RGB\")\n        imgs.append(transform(img))\n    imgs = torch.stack(imgs).to(device)\n    with torch.no_grad():\n        feats = feat_model(imgs).cpu().numpy()\n    feats_s = scaler_full.transform(feats)\n    probs = final_model.predict_proba(feats_s)[:, 1]\n    return pd.DataFrame({\"image_name\": files, \"malignancy_prob\": probs})\n\n\n# Example usage (uncomment to run):\n# preds = predict('input/MyImages')\n# preds.to_csv('working/submission.csv', index=False)", "import os\nimport pickle\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport lightgbm as lgb\n\n# Configuration\nIMG_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nMODEL_PATH = \"./working/lgbm_model.pkl\"\nBATCH_SIZE = 32\nSEED = 42\n\n\n# Dataset for embedding extraction\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row.image_name + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        return self.transform(img), row.skin_tone, row.label, row.image_name\n\n\n# Load data\ndf = pd.read_csv(CSV_PATH)\n# Binary label: malignant=1, else=0\ndf[\"label\"] = (df[\"label\"] == \"malignant\").astype(int)\n# Prepare transforms\ntransform = transforms.Compose(\n    [\n        transforms.Resize(256),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n# Device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load pretrained EfficientNet-B0 and remove head\nfeature_model = timm.create_model(\"efficientnet_b0\", pretrained=True)\n# Replace classifier with identity to get features\nif hasattr(feature_model, \"fc\"):\n    feature_model.fc = torch.nn.Identity()\nelif hasattr(feature_model, \"classifier\"):\n    feature_model.classifier = torch.nn.Identity()\nfeature_model.to(device).eval()\n\n# Extract embeddings\ndataset = SkinLesionDataset(df, IMG_DIR, transform)\nloader = DataLoader(dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\nall_feats = []\nall_tones = []\nall_labels = []\nfor imgs, tones, labels, names in loader:\n    imgs = imgs.to(device)\n    with torch.no_grad():\n        feats = feature_model(imgs)\n    all_feats.append(feats.cpu().numpy())\n    all_tones.append(tones.numpy())\n    all_labels.append(labels.numpy())\nfeats = np.vstack(all_feats)\ntones = np.concatenate(all_tones)\nlabels = np.concatenate(all_labels)\n\n# 5-fold stratified CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)\naucs, gaps = [], []\nfor train_idx, val_idx in skf.split(feats, labels):\n    X_tr, X_val = feats[train_idx], feats[val_idx]\n    y_tr, y_val = labels[train_idx], labels[val_idx]\n    tones_val = tones[val_idx]\n    # Train LightGBM\n    clf = lgb.LGBMClassifier(n_estimators=100, random_state=SEED)\n    clf.fit(X_tr, y_tr)\n    # Predict\n    y_pred = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, y_pred)\n    aucs.append(auc)\n    # Fairness: define light vs dark\n    mask_light = (tones_val > 0) & (tones_val <= 3)\n    mask_dark = tones_val >= 5\n    # Compute subgroup AUROCs if possible\n    if mask_light.sum() > 0 and mask_dark.sum() > 0:\n        auc_light = roc_auc_score(y_val[mask_light], y_pred[mask_light])\n        auc_dark = roc_auc_score(y_val[mask_dark], y_pred[mask_dark])\n        gaps.append(abs(auc_light - auc_dark))\n    else:\n        gaps.append(0.0)\n\nmean_auc = np.mean(aucs)\nmean_gap = np.mean(gaps)\nprint(f\"CV AUROC: {mean_auc:.4f}\")\nprint(f\"Avg AUROC gap (light vs dark): {mean_gap:.4f}\")\n\n# Retrain on full data\nfinal_clf = lgb.LGBMClassifier(n_estimators=100, random_state=SEED)\nfinal_clf.fit(feats, labels)\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\nwith open(MODEL_PATH, \"wb\") as f:\n    pickle.dump(final_clf, f)\n\n\n# Predict function\ndef predict(folder_path):\n    \"\"\"\n    Predict malignancy probability for images in folder_path.\n    Args:\n      folder_path (str): path to directory containing .jpg images.\n    Returns:\n      pd.DataFrame with columns ['image_name', 'malignancy_probability'].\n    \"\"\"\n    # Load model\n    with open(MODEL_PATH, \"rb\") as f:\n        model = pickle.load(f)\n    # Prepare list of images\n    img_files = [f for f in os.listdir(folder_path) if f.lower().endswith(\".jpg\")]\n    preds = []\n    # Process in batches\n    for i in range(0, len(img_files), BATCH_SIZE):\n        batch_files = img_files[i : i + BATCH_SIZE]\n        imgs = []\n        for fname in batch_files:\n            img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n            imgs.append(transform(img))\n        batch = torch.stack(imgs).to(device)\n        with torch.no_grad():\n            feats_batch = feature_model(batch).cpu().numpy()\n        probs = model.predict_proba(feats_batch)[:, 1]\n        for fname, p in zip(batch_files, probs):\n            preds.append((fname, p))\n    return pd.DataFrame(preds, columns=[\"image_name\", \"malignancy_probability\"])", "import os\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nfrom torchvision import models, transforms\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport xgboost as xgb\nimport joblib\n\n# 1. Load metadata and prepare labels\ndf = pd.read_csv(\"./input/mydataset.csv\")\n# binary label: malignant=1, others=0\ndf[\"y\"] = (df[\"label\"] == \"malignant\").astype(int)\nimage_names = df[\"image_name\"].values\nskin_tones = df[\"skin_tone\"].values\nlabels = df[\"y\"].values\nN = len(df)\n\n# 2. Feature extraction using DenseNet121\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nmodel = models.densenet121(pretrained=True)\n# build feature extractor\nfeature_extractor = (\n    nn.Sequential(model.features, nn.ReLU(inplace=True), nn.AdaptiveAvgPool2d((1, 1)))\n    .to(device)\n    .eval()\n)\n\ntfms = transforms.Compose(\n    [\n        transforms.Resize(224),\n        transforms.CenterCrop(224),\n        transforms.ToTensor(),\n        transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n    ]\n)\n\n\nclass ImgDataset(Dataset):\n    def __init__(self, paths, transform):\n        self.paths = paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, i):\n        img = Image.open(self.paths[i]).convert(\"RGB\")\n        return self.transform(img)\n\n\n# prepare all image paths\nimg_dir = \"./input/MyImages\"\npaths = [os.path.join(img_dir, f\"{n}.jpg\") for n in image_names]\n\n# extract features in batches\nbatch_size = 32\nds = ImgDataset(paths, tfms)\ndl = DataLoader(ds, batch_size=batch_size, num_workers=4, pin_memory=True)\nfeats = []\nwith torch.no_grad():\n    for batch in dl:\n        b = batch.to(device)\n        out = feature_extractor(b).view(b.size(0), -1)\n        feats.append(out.cpu().numpy())\nX = np.vstack(feats)\n\n# 3. compute sample weights to balance light and dark skin-tone groups\nmask_light = skin_tones <= 3\nmask_dark = skin_tones >= 5\nn_light = mask_light.sum()\nn_dark = mask_dark.sum()\nw_light = N / (2 * n_light) if n_light > 0 else 1.0\nw_dark = N / (2 * n_dark) if n_dark > 0 else 1.0\nsample_weights = np.ones(N, dtype=float)\nsample_weights[mask_light] = w_light\nsample_weights[mask_dark] = w_dark\n\n# 4. 5-fold stratified CV with XGBoost\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nall_preds = np.zeros(N)\ngaps = []\nfor train_idx, val_idx in skf.split(X, labels):\n    clf = xgb.XGBClassifier(\n        n_estimators=100,\n        use_label_encoder=False,\n        eval_metric=\"logloss\ ined=True)\nif hasattr(feature_model, \"fc\"):\n    feature_model.fc = torch.nn.Identity()\nelif hasattr(feature_model, \"classifier\"):\n    feature_model.classifier = torch.nn.Identity()\nfeature_model.to(device).eval()\n\n\n# Function to extract embeddings given a transform\ndef extract_embeddings(transform):\n    ds = SkinLesionDataset(df, IMG_DIR, transform)\n    loader = DataLoader(\n        ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=NUM_WORKERS\n    )\n    feats, tones, labels = [], [], []\n    with torch.no_grad():\n        for imgs, tns, lbs in loader:\n            imgs = imgs.to(device)\n            emb = feature_model(imgs).cpu().numpy()\n            feats.append(emb)\n            tones.append(tns.numpy())\n            labels.append(lbs.numpy())\n    return np.vstack(feats), np.concatenate(tones), np.concatenate(labels)\n\n\n# Extract original and flipped embeddings\nprint(\"Extracting base embeddings...\")\nfeats_orig, tones, labels = extract_embeddings(base_transform)\nprint(\"Extracting flipped embeddings...\")\nfeats_flip, _, _ = extract_embeddings(flip_transform)\n\n# 5-fold stratified CV with TTA\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)\naucs, gaps = [], []\nfor train_idx, val_idx in skf.split(feats_orig, labels):\n    X_tr, X_val_orig = feats_orig[train_idx], feats_orig[val_idx]\n    X_val_flip = feats_flip[val_idx]\n    X_val = (X_val_orig + X_val_flip) / 2.0\n    y_tr, y_val = labels[train_idx], labels[val_idx]\n    tones_val = tones[val_idx]\n    clf = lgb.LGBMClassifier(n_estimators=100, random_state=SEED)\n    clf.fit(X_tr, y_tr)\n    y_pred = clf.predict_proba(X_val)[:, 1]\n    auc = roc_auc_score(y_val, y_pred)\n    aucs.append(auc)\n    mask_light = (tones_val > 0) & (tones_val <= 3)\n    mask_dark = tones_val >= 5\n    if mask_light.sum() > 0 and mask_dark.sum() > 0:\n        auc_l = roc_auc_score(y_val[mask_light], y_pred[mask_light])\n        auc_d = roc_auc_score(y_val[mask_dark], y_pred[mask_dark]) let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
