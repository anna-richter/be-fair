let treeStructData = {"edges": [[4, 6], [4, 7], [4, 5], [7, 9], [7, 10], [7, 14], [7, 8], [7, 13], [7, 12], [7, 11], [14, 15], [15, 16], [15, 17], [17, 19], [17, 18]], "layout": [[0.0, 0.0], [0.1111111111111111, 0.0], [0.2222222222222222, 0.0], [0.3333333333333333, 0.0], [0.4444444444444444, 0.0], [0.3333333333333333, 0.19999999999999996], [0.4444444444444444, 0.19999999999999996], [0.5555555555555556, 0.19999999999999996], [0.2222222222222222, 0.4], [0.3333333333333333, 0.4], [0.4444444444444444, 0.4], [0.5555555555555556, 0.4], [0.6666666666666666, 0.4], [0.7777777777777778, 0.4], [0.8888888888888888, 0.4], [0.8888888888888888, 0.6], [0.8333333333333334, 0.8], [0.9444444444444444, 0.8], [0.8888888888888888, 1.0], [1.0, 1.0]], "plan": ["I propose fine-tuning a pretrained ResNet18 on the binary malignant vs non-\nmalignant (benign+non-neoplastic) task using PyTorch. Images and labels are\nloaded via a custom Dataset from the provided CSV and image folder, with\nstandard augmentations for training and normalization. We perform an 80/20\ntrain/validation split and train for several epochs with cross-entropy loss and\nAdam optimizer. Evaluation is done via ROC AUC on the hold-out set, and we\nprovide a predict() function that returns malignancy probabilities for new\nimages in a folder. The trained model weights are saved to `working/model.pth`.", "I propose fine-tuning a pretrained EfficientNet-B0 from the timm library to\nclassify malignant versus non-malignant lesions by replacing its head with a\nsingle output for malignancy probability. We\u2019ll use standard augmentations\nincluding random resized crop and horizontal flips, normalize images, and\nperform an 80/20 stratified split for training and validation. Training will use\nBCEWithLogitsLoss and the Adam optimizer for 5 epochs, evaluating performance\nvia ROC AUC on the validation set. A reusable predict() function will load the\nsaved model and output malignancy probabilities for any folder of images.", "We fine-tune a pretrained MobileNetV2 with a custom binary head to predict\nmalignancy, applying data augmentation and normalization. We perform stratified\n5-fold cross\u2010validation, training each fold for 3 epochs using BCEWithLogitsLoss\nand Adam, and compute ROC AUC on each validation split, reporting the mean AUC.\nThe last\u2010fold model weights are saved to `working/model.pth`. A\n`predict(image_folder: str) -> Dict[str, float]` function is provided to load\nthis saved model and output malignancy probabilities for new images.", "I\u2019ll fine-tune a pretrained DenseNet121 by replacing its classifier with a\nsingle logit output for malignancy, training on an 80/20 stratified split of the\nprovided dataset. Images will be augmented with random resized crops, flips, and\nnormalized using ImageNet statistics. I\u2019ll train for five epochs using\nBCEWithLogitsLoss and the Adam optimizer, then evaluate the model on the hold-\nout set using ROC AUC. The trained weights are saved to working/model.pth, and a\npredict(image_folder: str) function loads this model to return malignancy\nprobabilities for new images.", "We fine-tune a pretrained Swin Transformer (tiny) from timm by replacing its\nhead with a single logit for malignancy. We apply random resized crop and\nhorizontal flips during training and normalize using ImageNet statistics. We\nsplit the data 80/20 in a stratified manner on malignant vs non\u2010malignant\nlabels, train for 5 epochs with BCEWithLogitsLoss and Adam, and step down the LR\nevery 2 epochs. We evaluate on the hold\u2010out set using ROC AUC and save the model\nweights. A `predict(image_folder: str)` function is provided to load the saved\nmodel and return malignancy probabilities for new images.", "I propose adding simple Test-Time Augmentation (TTA) by averaging model outputs\non each image and its horizontal flip during validation (and in the `predict`\nfunction). This requires minimal code changes\u2014only extending the validation loop\nand inference to run on both original and flipped inputs\u2014yet often yields a\nsmall boost in AUROC. The rest of the training pipeline remains unchanged.", "I will add simple test\u2010time augmentation (TTA) by averaging model outputs on\neach image and its horizontal flip both during validation and in the `predict`\nfunction. This requires minimal changes\u2014after obtaining logits for the original\nbatch, I also compute logits on the horizontally flipped batch, average the two,\nthen apply sigmoid to get probabilities. I\u2019ll keep the rest of the training\npipeline unchanged and print the validation ROC AUC with TTA. This often yields\na small but consistent improvement in AUROC.", "I propose to integrate MixUp augmentation into the training loop, which linearly\ninterpolates pairs of images and their labels using a Beta distribution. This\nsimple change often improves generalization and robustness, leading to higher\nvalidation AUROC. We will implement a `mixup_data` function, apply it to each\ntraining batch, and compute the loss as a weighted combination of the pairwise\nlosses. The rest of the pipeline, including model, transforms, and evaluation,\nremains unchanged.", "I propose adding more aggressive data augmentations\u2014specifically random rotation\nand ColorJitter\u2014to the training pipeline to improve model robustness to lesion\norientation and lighting variations. This is an atomic change that should boost\ngeneralization and ROC AUC without altering other training settings. We keep\nmixup, Swin\u2010Tiny, and the rest unchanged, then retrain and evaluate.", "I propose adding simple test\u2010time augmentation (TTA) by averaging model outputs\non each image and its horizontal flip during validation and in the `predict`\nfunction. This only requires computing logits on the original and flipped\nimages, averaging them, then applying the sigmoid to get probabilities, and will\nlikely yield a small boost in AUROC. The rest of the training pipeline,\nincluding MixUp and aggressive augmentations, remains unchanged.", "I propose adding five\u2010crop test\u2010time augmentation (TTA) during validation and\ninference by resizing each image to 256\u00d7256, extracting the center and four\ncorner 224\u00d7224 crops, running the model on all five crops, averaging the logits,\nand then applying sigmoid to compute the malignancy probability. This will give\nmore robust predictions and should boost ROC AUC without changing the training\npipeline. The rest of the code\u2014including training with mixup\u2014remains unchanged,\nensuring the improvement is atomic.", "I propose replacing the standard BCEWithLogitsLoss with a Focal Loss (gamma=2,\nalpha=0.25) to focus training on hard\u2010to\u2010classify examples and mitigate class\nimbalance, which is an atomic change likely to boost ROC AUC without altering\nthe rest of the pipeline. I\u2019ll implement a FocalLoss class and plug it into the\ntraining loop in place of BCEWithLogitsLoss, then print out the validation ROC\nAUC.", "I suggest replacing the standard BCEWithLogitsLoss with a Focal Loss (gamma=2,\nalpha=0.25) to focus training on hard\u2010to\u2010classify and minority samples, which\noften leads to improved AUC on imbalanced data. This change is atomic\u2014only the\nloss function is altered\u2014so we can directly measure its impact. The rest of the\npipeline (model, mixup, scheduler, etc.) remains unchanged.", "I propose replacing the standard `BCEWithLogitsLoss` with a binary focal loss\n(gamma=2, alpha=0.25) to focus training on hard\u2010to\u2010classify and minority\nsamples, which often leads to improved ROC AUC on imbalanced datasets. This\nchange is atomic\u2014only the loss function is altered\u2014so we can directly measure\nits impact. All other components (model, mixup augmentation, scheduler, etc.)\nremain unchanged. We will implement a `FocalLoss` class, plug it into the\ntraining loop, and print the validation ROC AUC.", "I propose to mitigate the class imbalance by using a WeightedRandomSampler in\nthe training DataLoader. By weighting malignant and benign samples inversely to\ntheir frequencies, each batch will have balanced representation, encouraging the\nmodel to learn from the minority class more effectively. This is an atomic\nchange that should boost ROC AUC without altering other parts of the pipeline.", "I propose to improve robustness and generalization by ensembling five models\ntrained on different stratified folds. We\u2019ll perform 5-fold cross-validation,\ntraining a Swin Transformer model on each fold, saving each checkpoint, and\ncomputing out\u2010of\u2010fold ROC AUC across the full dataset. At inference, our\n`predict` function will load all five models and average their malignancy\nprobabilities. This ensemble approach typically yields a substantial boost in\ntest\u2010time AUROC with only modest code changes.", "I propose adding RandomErasing augmentation to the training pipeline to improve\nrobustness to occlusions and color variations. This atomic change only modifies\nthe train_transform, inserting a RandomErasing step after normalization. The\nrest of the 5\u2010fold CV ensembling pipeline remains unchanged to isolate the\neffect of this augmentation. We retrain the models and report updated fold and\noverall ROC AUC.", "I propose incorporating simple horizontal\u2010flip test\u2010time augmentation (TTA)\nduring both validation and inference. For each batch of validation images, we\nwill compute model outputs on the original and horizontally flipped versions,\naverage the logits, then apply the sigmoid to get probabilities. The same TTA\nlogic is added to the `predict()` function so that ensemble predictions leverage\nboth views for improved robustness. This atomic change requires minimal code\nadjustments yet often yields a consistent boost in ROC AUC.", "I propose replacing the Adam optimizer and step\u2010based scheduler with AdamW (with\nweight decay=1e-2) and a cosine annealing LR scheduler over the 5 training\nepochs. This adds better regularization and smoother learning rate decay, often\nimproving generalization and AUROC without changing any other part of the\npipeline. The rest of the code\u20145-fold CV, mixup, data transforms, TTA, and\nensembling\u2014remains unchanged.", "I propose integrating an exponential moving average (EMA) of model weights\nduring training with a decay of 0.999, and then using the EMA model for\nvalidation and inference. This only requires wrapping the model parameters in an\nEMA helper and updating after each optimizer step, yielding a smoother, more\nrobust model for TTA and ensemble predictions. All other parts of the training\npipeline remain unchanged, allowing a direct measure of EMA\u2019s impact on ROC AUC."], "code": ["import os\nimport random\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import models, transforms\n\n# Reproducibility\nSEED = 42\nrandom.seed(SEED)\nnp.random.seed(SEED)\ntorch.manual_seed(SEED)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed_all(SEED)\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        img = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            img = self.transform(img)\n        label = 1 if row[\"label\"] == \"malignant\" else 0\n        return img, label\n\n\ndef predict(model, image_folder, transform, device=\"cpu\"):\n    \"\"\"\n    Predict malignancy probability for all images in a folder.\n    Args:\n        model: trained PyTorch model\n        image_folder: path to folder containing .jpg images\n        transform: torchvision.transforms to apply\n        device: 'cpu' or 'cuda'\n    Returns:\n        pandas DataFrame with columns ['image_name', 'malignancy_probability']\n    \"\"\"\n    model.eval()\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    results = []\n    with torch.no_grad():\n        for fname in files:\n            path = os.path.join(image_folder, fname)\n            img = Image.open(path).convert(\"RGB\")\n            img_t = transform(img).unsqueeze(0).to(device)\n            prob = torch.sigmoid(model(img_t)).item()\n            results.append({\"image_name\": fname, \"malignancy_probability\": prob})\n    return pd.DataFrame(results)\n\n\ndef main():\n    # Paths\n    csv_path = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    working_dir = \"./working\"\n    os.makedirs(working_dir, exist_ok=True)\n\n    # Load data\n    df = pd.read_csv(csv_path)\n    # Keep only rows with valid labels\n    df = df[df[\"label\"].isin([\"malignant\", \"benign\", \"non-neoplastic\"])].copy()\n\n    # Split into train/val\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, random_state=SEED, stratify=(df[\"label\"] == \"malignant\")\n    )\n\n    # Transforms\n    train_transform = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinLesionDataset(train_df, img_dir, transform=train_transform)\n    val_ds = SkinLesionDataset(val_df, img_dir, transform=val_transform)\n    train_loader = DataLoader(\n        train_ds, batch_size=32, shuffle=True, num_workers=4, pin_memory=True\n    )\n    val_loader = DataLoader(\n        val_ds, batch_size=32, shuffle=False, num_workers=4, pin_memory=True\n    )\n\n    # Model\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = models.resnet18(pretrained=True)\n    num_ftrs = model.fc.in_features\n    model.fc = nn.Sequential(nn.Linear(num_ftrs, 1))\n    model = model.to(device)\n\n    # Loss and optimizer\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs = imgs.to(device)\n            labels = labels.float().unsqueeze(1).to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        epoch_loss = running_loss / len(train_ds)\n        print(f\"Epoch {epoch+1}/{epochs} - Loss: {epoch_loss:.4f}\")\n\n    # Validation\n    model.eval()\n    y_true = []\n    y_pred = []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs)\n            probs = torch.sigmoid(outputs).cpu().numpy().reshape(-1)\n            y_pred.extend(probs.tolist())\n            y_true.extend(labels.numpy().tolist())\n    roc_auc = roc_auc_score(y_true, y_pred)\n    print(f\"Validation ROC AUC: {roc_auc:.4f}\")\n\n    # Save model\n    torch.save(model.state_dict(), os.path.join(working_dir, \"model.pth\"))\n\n    # Optionally, generate submission if test folder exists\n    test_folder = \"./input/test_images\"\n    if os.path.isdir(test_folder):\n        sub = predict(model, test_folder, val_transform, device)\n        sub.to_csv(os.path.join(working_dir, \"submission.csv\"), index=False)\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport timm\n\n\n# Dataset for skin lesion images\nclass SkinDataset(Dataset):\n    def __init__(self, df, image_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.image_dir = image_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.image_dir, row.image_name + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row.label_bin, dtype=torch.float32)\n        return image, label\n\n\ndef predict(image_folder: str):\n    \"\"\"\n    Load saved model and predict malignancy probabilities for all images in a folder.\n    Args:\n        image_folder (str): Path to folder containing images.\n    Returns:\n        dict: {image_filename: malignancy_probability}\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # model definition\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(torch.load(\"working/model.pth\", map_location=device))\n    model.to(device).eval()\n\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    probs = {}\n    with torch.no_grad():\n        for fname in os.listdir(image_folder):\n            if fname.lower().endswith((\".jpg\", \".png\")):\n                img = Image.open(os.path.join(image_folder, fname)).convert(\"RGB\")\n                x = transform(img).unsqueeze(0).to(device)\n                logits = model(x)\n                p = torch.sigmoid(logits).item()\n                probs[fname] = p\n    return probs\n\n\ndef main():\n    # Load metadata\n    df = pd.read_csv(\"input/mydataset.csv\")\n    # Binary label: malignant=1, else=0\n    df[\"label_bin\"] = (df[\"label\"] == \"malignant\").astype(int)\n    # Train/validation split\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"label_bin\"], random_state=42\n    )\n\n    # Transforms\n    train_tf = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    val_tf = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets and loaders\n    train_ds = SkinDataset(train_df, \"input/MyImages\", transform=train_tf)\n    val_ds = SkinDataset(val_df, \"input/MyImages\", transform=val_tf)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Model, loss, optimizer\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device).unsqueeze(1)\n            optimizer.zero_grad()\n            logits = model(imgs)\n            loss = criterion(logits, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        avg_loss = running_loss / len(train_loader.dataset)\n        print(f\"Epoch {epoch+1}/{epochs} - Training loss: {avg_loss:.4f}\")\n\n    # Validation\n    model.eval()\n    all_logits, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).cpu().numpy().flatten()\n            all_logits.extend(logits.tolist())\n            all_labels.extend(labels.numpy().tolist())\n    probs = 1 / (1 + np.exp(-np.array(all_logits)))\n    roc_auc = roc_auc_score(all_labels, probs)\n    print(f\"Validation ROC AUC: {roc_auc:.4f}\")\n\n    # Save model\n    os.makedirs(\"working\", exist_ok=True)\n    torch.save(model.state_dict(), \"working/model.pth\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms, models\n\n\n# Dataset for skin lesions\nclass SkinDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
