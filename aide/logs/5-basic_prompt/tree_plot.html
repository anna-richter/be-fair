let treeStructData = {"edges": [[1, 5], [3, 6], [6, 7], [7, 8], [7, 10], [7, 9], [7, 12], [7, 14], [7, 13], [7, 15], [9, 11], [15, 19], [15, 18], [15, 17], [15, 16]], "layout": [[0.0, 0.0], [0.13333333333333333, 0.0], [0.26666666666666666, 0.0], [0.4, 0.0], [0.5333333333333333, 0.0], [0.13333333333333333, 0.25], [0.4, 0.25], [0.4, 0.5], [0.0, 0.75], [0.13333333333333333, 0.75], [0.26666666666666666, 0.75], [0.13333333333333333, 1.0], [0.4, 0.75], [0.5333333333333333, 0.75], [0.6666666666666666, 0.75], [0.8, 0.75], [0.6, 1.0], [0.7333333333333333, 1.0], [0.8666666666666667, 1.0], [1.0, 1.0]], "plan": ["I propose fine-tuning a pretrained ResNet18 model on the skin lesion images,\nmapping malignant labels to positive and all other labels to negative. We use an\n80/20 train-validation split, apply standard image transforms (resize to\n224\u00d7224, normalize), and train with binary cross-entropy loss for a few epochs.\nAfter training, we evaluate the hold-out set by computing the AUROC score to\nquantify discriminative performance. A `predict()` function is provided to\noutput malignancy probabilities for new image folders.", "We extract deep embeddings from a pretrained EfficientNet-B0 for each lesion\nimage and train an XGBoost model to predict malignancy from these features. We\nevaluate performance with stratified 5-fold cross-validation using AUROC and\nreport the average score. After that, we retrain on the full dataset and\nserialize the model. A `predict()` function is provided to load the model,\nextract features from a new image folder, and return malignancy probabilities.", "We fine-tune a pretrained EfficientNet-B0 from timm by replacing its head with a\nsingle\u2010unit binary output and training it on malignant vs benign/non\u2010neoplastic\nlabels. We split the CSV 80/20 stratified, apply standard augmentations during\ntraining and normalization during validation, and optimize with Adam and\nBCEWithLogitsLoss for 5 epochs. After training, we compute the AUROC on the\nhold\u2010out set, save the model, and provide a documented predict() function that\nloads the model and returns malignancy probabilities for all images in a given\nfolder.", "We fine-tune a pretrained DenseNet121 on the skin lesion data, mapping malignant\nto 1 and all other labels to 0, using an 80/20 stratified split. We apply\nstandard image augmentations during training and normalize inputs, then train\nwith binary cross\u2010entropy loss for 5 epochs on a GPU if available. After\ntraining, we compute and print the AUROC on the validation set, save the model\nto `./working`, and provide a `predict()` function that loads the saved model\nand returns malignancy probabilities for new images.", "We fine-tune a pretrained MobileNetV2 by replacing its classifier with a\nsingle\u2010unit head for binary malignancy prediction. We map \u2018malignant\u2019 to 1 and\nall other labels to 0, split the data 80/20 stratified, and apply random\nhorizontal flips and normalization. We train for 5 epochs with Adam and\nBCEWithLogitsLoss, then compute AUROC on the hold-out set. A `predict()`\nfunction loads the saved model and returns malignancy probabilities for any new\nimage folder.", "We can replace the unavailable XGBoost dependency with scikit-learn\u2019s\nLogisticRegression, which is readily available. We\u2019ll extract features with the\ntimm model as before, perform 5-fold stratified CV using LogisticRegression to\ncompute AUROC, then retrain on the full dataset and save the final model. The\n`predict` function will load this saved model to score new images, and at the\nend we\u2019ll generate `submission.csv` for all images in the input folder.", "We can apply Test-Time Augmentation by averaging predictions on the original and\nhorizontally\u2010flipped versions of each image at validation and inference. This\nsimple modification acts like a two\u2010member ensemble without retraining and often\nboosts AUROC by making predictions more robust. We'll update the validation loop\nto average probabilities from the original and flipped inputs, and incorporate\nthe same logic into the `predict()` function, leaving training unchanged.", "We introduce mixup data augmentation during training with alpha=0.2, mixing both\nimages and their labels in each batch to improve model generalization. The\ntraining loop is updated to perform mixup and compute the combined loss\naccordingly, while validation, test-time augmentation, and the prediction\nfunction remain unchanged. This atomic change often yields an AUROC uplift.", "We add the RandomErasing augmentation to the training pipeline, applying it\nafter normalization to improve model robustness and generalization. The rest of\nthe training loop remains unchanged, including mixup and test\u2010time augmentation.\nWe replace the initial Resize+RandomRotation with RandomResizedCrop for\nadditional scale invariance. We then retrain DenseNet121 for 5 epochs and report\nthe validation TTA AUROC.", "I propose replacing mixup with CutMix augmentation during training. CutMix cuts\na random patch from one image and pastes it into another, mixing labels\naccording to the patch area, which often yields stronger performance on image\ntasks. We'll implement a `cutmix_data` function and apply it in place of\n`mixup_data`, keeping all other training settings and TTA-based validation\nunchanged. This single change can improve the model\u2019s robustness and push the\nAUROC higher.", "We add RandomErasing augmentation after normalization in the training pipeline\nto regularize the model and improve robustness by simulating occlusions during\ntraining. This change is atomic and works alongside the existing mixup and\ntest\u2010time augmentation strategies without altering the model or training loop.\nWe then retrain DenseNet121 for five epochs and report the hold\u2010out AUROC as\nbefore.", "I replaced the deprecated `np.int` calls with the built-in `int` in `rand_bbox`\nso that `cut_w` and `cut_h` are computed without numpy aliases. This fixes the\nAttributeError and preserves the CutMix functionality unchanged. The rest of the\ntraining, validation (including TTA AUROC reporting), model saving, and the\n`predict()` function remain as before. After training for 5 epochs we print the\nvalidation AUROC and, if test images are present, write out `submission.csv`.", "We add a OneCycleLR scheduler so that the learning rate ramps up quickly at the\nstart and anneals to zero by the end of training, which often yields better\nconvergence and generalization. We keep the Adam optimizer\u2019s max_lr at 1e-3,\nstep the scheduler after every batch, and leave all other settings\u2014including\nmixup, TTA, epochs, and transforms\u2014unchanged. This atomic change requires\nminimal code edits but can produce a noticeable AUROC uplift. The validation\nloop and predict() function remain as before.", "We replace the standard BCE loss with a Focal Loss (\u03b3=2, \u03b1=0.25) to focus\nlearning on hard examples while retaining our mixup and TTA pipeline unchanged.\nThis single change often boosts AUROC by reducing easy\u2010example domination in the\nloss. We then train for 5 epochs, compute the validation TTA AUROC, and generate\na `submission.csv` if test images exist.", "I propose adding RandomErasing augmentation with probability 0.5 after\nnormalization in the training pipeline to simulate occlusions and improve model\nrobustness. This atomic change does not affect the training loop, mixup, or\ntest\u2010time augmentation, and should yield a modest AUROC uplift. All other\nsettings, including model architecture, optimizer, and TTA inference, remain the\nsame.", "I propose adding the RandomErasing augmentation after normalization in the\ntraining transform pipeline to simulate occlusions and improve model robustness.\nThis atomic change requires only inserting `T.RandomErasing(p=0.5)` after\nnormalization; all other aspects\u2014including mixup, TTA, model architecture, and\ntraining loop\u2014remain unchanged. We retrain the DenseNet121 for 5 epochs and\nprint the validation AUROC to measure the impact of RandomErasing. The\n`predict()` function is left intact for inference and submission generation.", "I propose replacing the Adam optimizer with AdamW and adding a modest weight\ndecay (1e-4) to regularize the model and improve generalization. This is an\natomic change requiring minimal edits but often yields better performance. We\nwill keep mixup, random erasing, and test\u2010time augmentation unchanged, retrain\nfor 5 epochs, and report the validation TTA AUROC to measure the effect.\nEverything else remains the same.", "I propose replacing the DenseNet121 backbone with an EfficientNet-B0 from the\ntimm library, which often yields stronger representations while keeping all\nother pipeline components (mixup, random erasing, transforms, TTA) unchanged.\nThis atomic swap allows us to measure the impact of the backbone on AUROC\nwithout altering the rest of the training regime. We\u2019ll fine-tune\nEfficientNet-B0 for the same number of epochs, compute the validation TTA-\naugmented AUROC, and update the predict() function to load the EfficientNet\nmodel for inference.", "We extend test-time augmentation to include vertical flips in addition to\nhorizontal flips, yielding four augmentations per image (original, h\u2010flip,\nv\u2010flip, h+v flip). We average predictions over these four views during\nvalidation and inference without changing the training regime. This 4\u2010way TTA\nensemble often boosts AUROC by making predictions more robust.", "I propose oversampling the minority (malignant) class during training via a\nWeightedRandomSampler so that each batch is more balanced, which can help the\nmodel learn better representations for the rare class and boost AUROC. We\ncompute sample weights inversely proportional to class frequencies in the\ntraining set, use these in the sampler for the training DataLoader, and keep the\nrest of the pipeline\u2014including mixup, random erasing, model, and two\u2010way\nTTA\u2014invariant. This atomic change requires minimal edits but can improve\nperformance on the positive class."], "code": ["import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.model_selection import train_test_split\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport torchvision.models as models\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = torch.tensor(row[\"target\"], dtype=torch.float32)\n        return image, label\n\n\ndef predict(model, folder_path, device):\n    \"\"\"\n    Predict malignancy probabilities for all images in folder_path.\n    Args:\n        model (torch.nn.Module): Trained PyTorch model.\n        folder_path (str): Directory containing images.\n    Returns:\n        dict: {image_filename: probability of malignancy}\n    \"\"\"\n    model.eval()\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    with torch.no_grad():\n        for fname in os.listdir(folder_path):\n            if fname.lower().endswith((\".jpg\", \".png\", \"jpeg\")):\n                img = Image.open(os.path.join(folder_path, fname)).convert(\"RGB\")\n                img_t = transform(img).unsqueeze(0).to(device)\n                logits = model(img_t).squeeze(1)\n                prob = torch.sigmoid(logits).cpu().item()\n                results[fname] = prob\n    return results\n\n\ndef main():\n    # config\n    data_csv = \"./input/mydataset.csv\"\n    img_dir = \"./input/MyImages\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # load and preprocess\n    df = pd.read_csv(data_csv)\n    df[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, stratify=df[\"target\"], random_state=42\n    )\n    transform = transforms.Compose(\n        [\n            transforms.Resize((224, 224)),\n            transforms.ToTensor(),\n            transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n        ]\n    )\n    train_ds = SkinLesionDataset(train_df, img_dir, transform)\n    val_ds = SkinLesionDataset(val_df, img_dir, transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n    # model\n    model = models.resnet18(pretrained=True)\n    model.fc = nn.Linear(model.fc.in_features, 1)\n    model = model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n    # train\n    epochs = 5\n    for epoch in range(epochs):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs, labels = imgs.to(device), labels.to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs).squeeze(1)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        print(f\"Epoch {epoch+1}/{epochs}, Loss: {running_loss/len(train_ds):.4f}\")\n    # evaluate\n    model.eval()\n    all_preds, all_labels = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            logits = model(imgs).squeeze(1)\n            probs = torch.sigmoid(logits).cpu().numpy()\n            all_preds.extend(probs)\n            all_labels.extend(labels.numpy())\n    auroc = roc_auc_score(all_labels, all_preds)\n    print(f\"Validation AUROC: {auroc:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nimport xgboost as xgb\nimport joblib\n\n# Constants\nIMAGE_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nMODEL_PATH = \"./working/xgb_model.pkl\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nSEED = 42\n\n\n# Dataset for feature extraction\nclass LesionDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        path = self.paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        return self.transform(img), os.path.basename(path)\n\n\n# Transform\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# Load metadata\ndf = pd.read_csv(CSV_PATH)\ndf[\"image_path\"] = df[\"image_name\"].apply(lambda x: os.path.join(IMAGE_DIR, f\"{x}.jpg\"))\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\npaths = df[\"image_path\"].tolist()\nlabels = df[\"target\"].values\n\n# Build feature extractor\nfeature_extractor = timm.create_model(\n    \"efficientnet_b0\", pretrained=True, num_classes=0\n).to(DEVICE)\nfeature_extractor.eval()\n\n\ndef extract_features(image_paths):\n    dataset = LesionDataset(image_paths, transform)\n    loader = DataLoader(dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    feats = []\n    with torch.no_grad():\n        for imgs, _ in loader:\n            imgs = imgs.to(DEVICE)\n            out = feature_extractor(imgs)\n            feats.append(out.cpu().numpy())\n    return np.vstack(feats)\n\n\n# Extract features for all data\nfeatures = extract_features(paths)\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)\naucs = []\nfor train_idx, val_idx in skf.split(features, labels):\n    X_train, X_val = features[train_idx], features[val_idx]\n    y_train, y_val = labels[train_idx], labels[val_idx]\n    model = xgb.XGBClassifier(\n        n_estimators=100, use_label_encoder=False, eval_metric=\"auc\", random_state=SEED\n    )\n    model.fit(X_train, y_train)\n    preds = model.predict_proba(X_val)[:, 1]\n    aucs.append(roc_auc_score(y_val, preds))\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data and save model\nfinal_model = xgb.XGBClassifier(\n    n_estimators=100, use_label_encoder=False, eval_metric=\"auc\", random_state=SEED\n)\nfinal_model.fit(features, labels)\njoblib.dump(final_model, MODEL_PATH)\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n      image_folder (str): path to a directory of .jpg images\n    Returns:\n      pandas.DataFrame: columns ['image_name','malignancy_score']\n    \"\"\"\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    paths = [os.path.join(image_folder, f) for f in files]\n    feats = extract_features(paths)\n    model = joblib.load(MODEL_PATH)\n    probs = model.predict_proba(feats)[:, 1]\n    return pd.DataFrame({\"image_name\": files, \"malignancy_score\": probs})\n\n\n# Example usage:\n# df_preds = predict(\"./input/MyImages\")\n# df_preds.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nfrom PIL import Image\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as transforms\nimport timm\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\n\n\nclass SkinLesionDataset(Dataset):\n    def __init__(self, df, img_dir, transform=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"image_name\"] + \".jpg\")\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transform:\n            image = self.transform(image)\n        label = 1 if row[\"label\"] == \"malignant\" else 0\n        return image, label\n\n\ndef main():\n    # Paths\n    CSV_PATH = \"./input/mydataset.csv\"\n    IMG_DIR = \"./input/MyImages\"\n    SAVE_DIR = \"./working\"\n    os.makedirs(SAVE_DIR, exist_ok=True)\n\n    # Load and split data\n    df = pd.read_csv(CSV_PATH)[[\"image_name\", \"label\"]]\n    df[\"binary\"] = df[\"label\"].apply(lambda x: 1 if x == \"malignant\" else 0)\n    train_df, val_df = train_test_split(\n        df, test_size=0.2, random_state=42, stratify=df[\"binary\"]\n    )\n\n    # Transforms\n    train_transform = transforms.Compose(\n        [\n            transforms.RandomResizedCrop(224),\n            transforms.RandomHorizontalFlip(),\n            transforms.RandomVerticalFlip(),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    val_transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n\n    # Datasets & Loaders\n    train_ds = SkinLesionDataset(train_df, IMG_DIR, transform=train_transform)\n    val_ds = SkinLesionDataset(val_df, IMG_DIR, transform=val_transform)\n    train_loader = DataLoader(train_ds, batch_size=32, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_ds, batch_size=32, shuffle=False, num_workers=4)\n\n    # Device\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    # Model, loss, optimizer\n    model = timm.create_model(\"efficientnet_b0\", pretrained=True, num_classes=1)\n    model.to(device)\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = optim.Adam(model.parameters(), lr=1e-4)\n\n    # Training loop\n    for epoch in range(5):\n        model.train()\n        running_loss = 0.0\n        for imgs, labels in train_loader:\n            imgs = imgs.to(device)\n            labels = labels.float().to(device)\n            optimizer.zero_grad()\n            outputs = model(imgs).squeeze(1)\n            loss = criterion(outputs, labels)\n            loss.backward()\n            optimizer.step()\n            running_loss += loss.item() * imgs.size(0)\n        epoch_loss = running_loss / len(train_loader.dataset)\n        print(f\"Epoch {epoch+1}/5, Train Loss: {epoch_loss:.4f}\")\n\n    # Validation\n    model.eval()\n    all_preds, all_targets = [], []\n    with torch.no_grad():\n        for imgs, labels in val_loader:\n            imgs = imgs.to(device)\n            outputs = model(imgs).squeeze(1)\n            probs = torch.sigmoid(outputs).cpu().numpy()\n            all_preds.extend(probs.tolist())\n            all_targets.extend(labels.numpy().tolist())\n    auc = roc_auc_score(all_targets, all_preds)\n    print(f\"Validation AUROC: {auc:.4f}\")\n\n    # Save model\n    torch.save(\n        model.state_dict(), os.path.join(SAVE_DIR, \"efficientnet_b0_skin_lesion.pth\")\n    )\n\n\ndef predict(image_folder):\n    \"\"\"\n    Load the trained EfficientNet-B0 model and return malignancy probabilities\n    for each image in image_folder.\n    Args:\n        image_folder (str): path to folder with image files (.jpg, .png, etc.).\n    Returns:\n        dict: mapping filename -> probability of malignancy (0-1).\n    \"\"\"\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    # Load model architecture and weights\n    model = timm.create_model(\"efficientnet_b0\", pretrained=False, num_classes=1)\n    model.load_state_dict(\n        torch.load(\"./working/efficientnet_b0_skin_lesion.pth\", map_location=device)\n    )\n    model.to(device)\n    model.eval()\n    # Use same val transforms\n    transform = transforms.Compose(\n        [\n            transforms.Resize(256),\n            transforms.CenterCrop(224),\n            transforms.ToTensor(),\n            transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),\n        ]\n    )\n    results = {}\n    for fname in os.listdir(image_folder):\n        if fname.lower().endswith((\".jpg\", \".jpeg\", \".png\", \"bmp\")):\n            path = os.path.join(image_folder, fname)\n            img = Image.open(path).convert(\"RGB\")\n            inp = transform(img).unsqueeze(0).to(device)\n            with torch.no_grad():\n                out = model(inp).squeeze(1)\n                prob = torch.sigmoid(out).item()\n            results[fname] = prob\n    return results\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.trans om PIL import Image\nimport torch\nfrom torch.utils.data import Dataset, DataLoader\nfrom torchvision import transforms\nimport timm\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import roc_auc_score\nfrom sklearn.linear_model import LogisticRegression\nimport joblib\n\n# Constants\nIMAGE_DIR = \"./input/MyImages\"\nCSV_PATH = \"./input/mydataset.csv\"\nMODEL_PATH = \"./working/lr_model.pkl\"\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nBATCH_SIZE = 32\nSEED = 42\n\n\n# Dataset for feature extraction\nclass LesionDataset(Dataset):\n    def __init__(self, image_paths, transform):\n        self.paths = image_paths\n        self.transform = transform\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        path = self.paths[idx]\n        img = Image.open(path).convert(\"RGB\")\n        return self.transform(img), os.path.basename(path)\n\n\n# Image transform\ntransform = transforms.Compose(\n    [\n        transforms.Resize((224, 224)),\n        transforms.ToTensor(),\n        transforms.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n# Load metadata\ndf = pd.read_csv(CSV_PATH)\ndf[\"image_path\"] = df[\"image_name\"].apply(lambda x: os.path.join(IMAGE_DIR, f\"{x}.jpg\"))\ndf[\"target\"] = (df[\"label\"] == \"malignant\").astype(int)\npaths = df[\"image_path\"].tolist()\nlabels = df[\"target\"].values\n\n# Build feature extractor\nfeature_extractor = timm.create_model(\n    \"efficientnet_b0\", pretrained=True, num_classes=0\n).to(DEVICE)\nfeature_extractor.eval()\n\n\ndef extract_features(image_paths):\n    dataset = LesionDataset(image_paths, transform)\n    loader = DataLoader(dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=4)\n    feats = []\n    with torch.no_grad():\n        for imgs, _ in loader:\n            imgs = imgs.to(DEVICE)\n            out = feature_extractor(imgs)\n            feats.append(out.cpu().numpy())\n    return np.vstack(feats)\n\n\n# Extract features once\nfeatures = extract_features(paths)\n\n# 5-fold stratified CV with Logistic Regression\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=SEED)\naucs = []\nfor train_idx, val_idx in skf.split(features, labels):\n    X_train, X_val = features[train_idx], features[val_idx]\n    y_train, y_val = labels[train_idx], labels[val_idx]\n    model = LogisticRegression(max_iter=1000, random_state=SEED)\n    model.fit(X_train, y_train)\n    preds = model.predict_proba(X_val)[:, 1]\n    aucs.append(roc_auc_score(y_val, preds))\n\nmean_auc = np.mean(aucs)\nprint(f\"Mean CV AUROC: {mean_auc:.4f}\")\n\n# Retrain on full data and save final model\nfinal_model = LogisticRegression(max_iter=1000, random_state=SEED)\nfinal_model.fit(features, labels)\nos.makedirs(os.path.dirname(MODEL_PATH), exist_ok=True)\njoblib.dump(final_model, MODEL_PATH)\n\n\ndef predict(image_folder):\n    \"\"\"\n    Predict malignancy probabilities for images in a folder.\n    Args:\n      image_folder (str): path to a directory of .jpg images\n    Returns:\n      pandas.DataFrame: columns ['image_name','malignancy_score']\n    \"\"\"\n    files = [f for f in os.listdir(image_folder) if f.lower().endswith(\".jpg\")]\n    paths = [os.path.join(image_folder, f) for f in files]\n    feats = extract_features(paths)\n    model = joblib.load(MODEL_PATH)\n    probs = model.predict_proba(feats)[:, 1]\n    return pd.DataFrame({\"image_name\": files, \"malignancy_score\": probs})\n\n\n# Generate submission for all images in input folder\nsubmission = predict(IMAGE_DIR)\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(\"Saved submission.csv to ./working\")", "import os\nimport pandas as pd\nimport numpy as np\nfrom PIL import Image\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import roc_auc_score\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
